// the country news' sources for country cc (name: its Arabic name, lang: its language): Saudi Arabia's list
// (NEWS_SOURCES.news), an Arab country's outlets then Google News and Bing (off), or only those two (on)
function countryNews(cc, name, lang, en){
  if(cc === 'SA') return NEWS_SOURCES.news;
  const own = (COUNTRY_NEWS[cc] || []).map(x => Object.assign({cc}, x));   // cc: Bing's market (loadNewsFeed)
  return own.concat([
    {id: 'google', name: null, url: googleNews(cc, name, lang), on: !own.length},
    {id: 'bing', name: null, bing: bingNews(cc, name, lang, en), on: !own.length},
  ]);
}
// the sources page P reads: the ones picked in the settings, else its defaults
function newsSources(P){
  const all = P === 'news' ? countryNews(CONFIG.newsCC, CONFIG.newsName, CONFIG.newsLang, CONFIG.newsEn) : NEWS_SOURCES[P] || [];
  const want = (CONFIG.sources && CONFIG.sources[P]) || [];
  const picked = all.filter(x => want.includes(x.id));
  return picked.length ? picked : all.filter(x => x.on);
}
const NEWS = {news: [], tech: [], local: [], world: []};   // [{headline, source, t}] newest first
// the panels drawn as news items: Saudi news, the city's news (loadLocalNews), the world's news and tech
const isNewsPanel = P => P === 'news' || P === 'local' || P === 'tech' || P === 'world';

// "headline - Source": the source is after the last " - ", unless the item's <source> (which can itself
// contain " - ", e.g. "ارقام : ... - تاسي") is what the title ends with
function splitNewsTitle(title, fallbackSource){
  const s = String(title || '').trim(), src = String(fallbackSource || '').trim();
  if(src && s.endsWith(' - ' + src) && s.length > src.length + 3)
    return {headline: s.slice(0, s.length - src.length - 3).trim(), source: src};
  const i = s.lastIndexOf(' - ');
  return i > 0 ? {headline: s.slice(0, i).trim(), source: s.slice(i + 3).trim()}
               : {headline: s, source: String(fallbackSource || '').trim()};
}

function agoAr(ms){
  if(!Number.isFinite(ms) || ms < 60000) return 'الآن';
  const m = Math.floor(ms / 60000);
  if(m < 60) return `قبل ${ar(m)} د`;
  const h = Math.floor(m / 60);
  if(h < 24) return `قبل ${ar(h)} س`;
  const d = Math.floor(h / 24);
  return d === 1 ? 'أمس' : d === 2 ? 'قبل يومين' : d <= 10 ? `قبل ${ar(d)} أيام` : `قبل ${ar(d)} يوماً`;
}

// a title may carry HTML tags / entities (e.g. "&lt;b&gt;" or "&amp;quot;" in the XML)
function plainText(s){
  s = String(s || '');
  if(/[<&]/.test(s)) s = new DOMParser().parseFromString(s, 'text/html').body.textContent || '';
  return s.replace(/\s+/g, ' ').trim();
}

// items: [{title, pubDate, source}] as read from the feed
// feed.name: the publisher label (titles are bare headlines), or null for Google style. A Google search standing in
// for a site (feed.site) writes "headline - Site" too: split like Google's, then labelled with the site's name.
function newsFrom(items, feed){
  const label = feed.name, google = !label || feed.site;
  return items.map(it => {
    const x = google ? splitNewsTitle(plainText(it.title), plainText(it.source)) : {headline: plainText(it.title), source: label};
    if(label) x.source = label;
    return Object.assign(x, {t: Date.parse(it.pubDate || ''), link: String(it.link || '').trim(), desc: it.description || ''});
  })
    .filter(x => x.headline)
    .sort((a, b) => (Number.isFinite(b.t) ? b.t : -Infinity) - (Number.isFinite(a.t) ? a.t : -Infinity))
    // the newest NEWS_POOL (the card shows NEWS_KEEP of them, NEWS_ROWS at a time: newsCardPages); the detail page keeps
    // NEWS_DETAIL_KEEP, each with its summary
    .slice(0, CONFIG.detail ? NEWS_DETAIL_KEEP : NEWS_POOL)
    .map(x => { const desc = x.desc; delete x.desc; if(CONFIG.detail) x.summary = newsSummary(x, desc); return x; });
}
// the item's <description> as plain text. Google's repeats the headline and the source only: no summary.
function newsSummary(x, desc){
  let s = plainText(desc);
  if(s && s.startsWith(x.headline)){
    const rest = s.slice(x.headline.length).trim();
    s = !rest || rest === x.source || rest.length < 40 ? '' : rest;
  }
  return s;
}

// a news panel shows NEWS_ROWS items per page (three two-line items stay within the height of the six
// prayer rows on the screensaver and on the home card) and up to NEWS_KEEP in all. In a rotation it shows page 1,
// then page 2 halfway through its slot (newsFlipArm); a single news card turns its page every NEWS_PAGE_MS.
// A card page holds at most NEWS_PER_SOURCE items of one source (newsCardPages), so one busy source can't fill
// the card: the newest of the others take the other rows (the list keeps NEWS_POOL to find them). The detail page's
// list is not held to it.
const NEWS_ROWS = 3, NEWS_KEEP = 6, NEWS_PAGE_MS = 15000, NEWS_PER_SOURCE = 2, NEWS_POOL = 12;
const NEWS_DETAIL_KEEP = 15;   // the detail page's list
let NEWS_VISIT = 0;   // counts the rotation's switches: a flip armed for one visit never runs in another
// the card's pages of a news list (newest first): NEWS_ROWS items each, at most NEWS_PER_SOURCE of a source on a page;
// an item left out of a page waits for the next one
function newsCardPages(list){
  const rest = (list || []).slice(), pages = [];
  for(let p = 0; p < Math.ceil(NEWS_KEEP / NEWS_ROWS) && rest.length; p++){
    const page = [], per = {};
    for(let i = 0; i < rest.length && page.length < NEWS_ROWS; ){
      const s = String(rest[i].source || '').trim();
      if((per[s] || 0) < NEWS_PER_SOURCE){ per[s] = (per[s] || 0) + 1; page.push(rest.splice(i, 1)[0]); }
      else i++;
    }
    if(!page.length) break;
    pages.push(page);
  }
  return pages;
}
function newsPaged(P){ return isNewsPanel(P) && newsCardPages(NEWS[P]).length > 1; }
function newsFlipArm(){
  const P = CONFIG.panel, visit = ++NEWS_VISIT;
  if(!isNewsPanel(P)) return;   // paged or not is decided at the flip: the list may arrive meanwhile
  setTimeout(() => {
    if(visit !== NEWS_VISIT || CONFIG.panel !== P || !newsPaged(P) || LIST_PAGE !== 0) return;
    LIST_PAGE = 1;
    renderPanel(true);   // waits in paintCard while a slide-in still runs (CARD_BUSY_UNTIL)
  }, CONFIG.rotateMs / 2);
}

function newsRow(x, now, kind){
  const ago = Number.isFinite(x.t) ? agoAr(now - x.t) : '';
  const dt = [newsSource(kind, x.source), ago].filter(Boolean).join(' · ');
  return `<li class="news-item"><span class="nw"${bidiAttr(kind, x.headline)}>${esc(x.headline)}</span><span class="dt">${dt}</span></li>`;   // class
}

// the card's page `page` (wrapping) of a news list (newsCardPages)
function newsRows(kind, page){
  const now = Date.now(), pages = newsCardPages(NEWS[kind]);
  return pages.length ? pages[(page || 0) % pages.length].map(x => newsRow(x, now, kind)) : [];
}

// one feed -> its items as read ([{title, pubDate, source, link, description}]), null when the answer is not an RSS
// document with items (e.g. an HTML consent or block page). site: only Google's items from that host (<source url>).
async function readFeed(feed, withDesc){
  try{
    const r = await fetchT(feed.url, 15000);
    if(!r.ok) return null;
    const text = await r.text();
    if(!/<item[\s>]/.test(text)) return null;
    const doc = new DOMParser().parseFromString(text, 'text/xml');
    if(doc.getElementsByTagName('parsererror').length) return null;
    const txt = (el, tag) => { const n = el.getElementsByTagName(tag)[0]; return n ? n.textContent : ''; };
    const host = u => { try{ return new URL(u).hostname; }catch(e){ return ''; } };
    const items = [];
    for(const it of Array.from(doc.getElementsByTagName('item'))){
      const src = it.getElementsByTagName('source')[0];
      if(feed.site){ const h = host(src && src.getAttribute('url')); if(h !== feed.site && !h.endsWith('.' + feed.site)) continue; }
      items.push({title: txt(it, 'title'), pubDate: txt(it, 'pubDate'), source: src ? src.textContent : '',
                  link: txt(it, 'link'), description: CONFIG.detail || withDesc ? txt(it, 'description') : ''});
    }
    return items;
  }catch(e){ return null; }
}
// Bing's news ([{headline, source, t, link, desc}], localFeed) as a news page's items: newest first, its summaries
function bingItems(list){
  return list.filter(x => x.headline)
    .sort((a, b) => (Number.isFinite(b.t) ? b.t : -Infinity) - (Number.isFinite(a.t) ? a.t : -Infinity))
    .slice(0, CONFIG.detail ? NEWS_DETAIL_KEEP : NEWS_POOL)
    .map(x => { const desc = x.desc; delete x.desc; if(CONFIG.detail) x.summary = desc ? newsSummary(x, desc) : ''; return x; });
}
// one source of a news page -> its newest stories ([] when it did not answer, or too few matched its filter).
// fallback (the country news): an outlet whose own feed or Google search gave nothing (Google News answers the TVs'
// VPN with HTTP 403) is searched on Bing News instead (site:<its domain>, the country's market), kept to its own links
async function loadNewsFeed(feed, fallback){
  if(feed.bing){   // Bing's news: its RSS, or its page of cards (what it gives the TV's WebView: localFeed)
    try{ return bingItems(await localFeed('bing', feed.bing)); }catch(e){ return []; }
  }
  const all = await readFeed(feed);
  // with a filter, only the matching items are read further (a 300-item feed keeps a few dozen)
  const items = !all ? [] : feed.filter ? all.filter(it => feed.filter.test(plainText(it.title))) : all;
  if(items.length >= (feed.min || 1)){ feed.via = 'feed'; return newsFrom(items, feed); }
  const site = feed.bingSite || feed.site;
  if(!fallback || !site || /\//.test(site)) return [];
  const gl = /[?&]gl=([A-Z]{2})\b/.exec(feed.url || ''), mkt = feed.cc || (gl ? gl[1] : 'SA');
  const host = u => { try{ return new URL(u).hostname; }catch(e){ return ''; } };
  try{
    const got = (await localFeed('bing', `https://www.bing.com/news/search?q=${encodeURIComponent('site:' + site)}&format=rss&mkt=ar-${mkt}`))
      // its own links, its Arabic stories (a site's English edition, e.g. english.ahram.org.eg, is left out)
      .filter(x => { const h = host(x.link); return (h === site || h.endsWith('.' + site)) && AR_RE.test(x.headline)
        && (!feed.filter || feed.filter.test(x.headline)); });
    if(got.length) feed.via = 'bing';   // (#feedtest)
    return bingItems(got.map(x => Object.assign(x, {source: feed.name || x.source})));
  }catch(e){ return []; }
}

// #feedtest=1 (tests only, the preview from ADB): every source of every Arab country's news, once, four at a time,
// each in the TV's log: «SaudiTV feedtest EG ahram 12 items, newest 2 h» or «… none»; then «SaudiTV feedtest done»
const FEEDTEST_NAMES = {SA: 'السعودية', EG: 'مصر', AE: 'الإمارات', KW: 'الكويت', QA: 'قطر', BH: 'البحرين', OM: 'عمان',
  JO: 'الأردن', IQ: 'العراق', LB: 'لبنان', SY: 'سوريا', PS: 'فلسطين', YE: 'اليمن', SD: 'السودان', LY: 'ليبيا', TN: 'تونس',
  DZ: 'الجزائر', MA: 'المغرب'};
async function feedTest(){
  const jobs = [];
  Object.keys(FEEDTEST_NAMES).forEach(cc => countryNews(cc, FEEDTEST_NAMES[cc], 'ar', '').forEach(f => jobs.push([cc, f])));
  // what a source that gave nothing answered: its HTTP status, where it ended up, its title (a block or consent page)
  const why = async f => {
    try{
      const r = await fetchT(f.url || f.bing, 15000), text = await r.text();
      let at = ''; try{ const u = new URL(r.url); at = u.host + u.pathname.slice(0, 30); }catch(e){}
      const t = /<title[^>]*>([^<]{0,50})/i.exec(text);
      return ` (HTTP ${r.status} ${at}${t ? ' "' + t[1].trim() + '"' : ''}, ${(text.match(/<item[\s>]/g) || []).length} items)`;
    }catch(e){ return ' (' + (e && e.message || e) + ')'; }
  };
  const run = async ([cc, f]) => {
    f.via = '';
    const items = await loadNewsFeed(f, true).catch(() => []);
    const newest = items.reduce((m, x) => Number.isFinite(x.t) ? Math.max(m, x.t) : m, -Infinity);
    console.warn(`SaudiTV feedtest ${cc} ${f.id} ` + (items.length ? items.length + ' items' + (f.via ? ' (' + f.via + ')' : '') + ', newest '
      + (Number.isFinite(newest) ? Math.round((Date.now() - newest) / 36e5) + ' h' : '?') : 'none' + await why(f)));
  };
  // Google News one at a time, 3 s apart (a burst of searches is answered «unusual traffic»); the others four at a time
  const google = jobs.filter(([, f]) => /news\.google\.com/.test(f.url || '')), rest = jobs.filter(j => !google.includes(j));
  let k = 0;
  await Promise.all(Array.from({length: 4}, async () => { while(k < rest.length) await run(rest[k++]); }).concat([(async () => {
    for(const j of google){ await run(j); await new Promise(r => setTimeout(r, 3000)); }
  })()]));
  console.warn('SaudiTV feedtest done ' + jobs.length);
}

// a news page: every picked source at once (newsSources), each story once (the same headline or link), newest first
let NEWS_LOG = {};
async function loadNews(kind){
  const feeds = newsSources(kind);
  const got = await Promise.all(feeds.map(f => loadNewsFeed(f, kind === 'news')));   // the country news: Bing stands in
  const list = got.reduce((a, b) => newsMerge(a, b), []).slice(0, CONFIG.detail ? NEWS_DETAIL_KEEP : NEWS_POOL);
  // which sources answered, in the TV's log when that changes (a VPN exit can block one)
  const how = feeds.map((f, i) => f.id + (got[i].length ? '' : ' (none)')).join(', ');
  if(how !== NEWS_LOG[kind]){ NEWS_LOG[kind] = how; console.warn('SaudiTV: ' + kind + ' news from ' + how); }
  if(!list.length) return false;                      // keep the last good list on a failed refresh
  NEWS[kind] = list;
  if(CONFIG.panel === kind) renderPanel(false);
  return true;   // answered (see firstLoad)
}

// ---- local news: the city the TV is set to (#city, #lat, #lon)
// The place's English name, county and region come from a reverse geocoder (no key: BigDataCloud, then Nominatim,
// then Photon), asked once per lat/lon and kept in localStorage. A Saudi or other Arab city is searched in Arabic by
// the name the settings hold (#city), anywhere else in English. Each search, through the picked sources (localSearch):
// Google News RSS (the country's edition, the last 3 days) and Bing News RSS (Google answers some VPN exits with HTTP
// 403 or a consent page; Bing gives the TV's WebView its news page, read as cards: bingCards), and for an Arabic search
// the local sections of Okaz and Al-Watan, kept to the items that name the place. Still fewer
// for the city: the county (US) or the region too, e.g. «منطقة القصيم» for الرس. Kept: items that name the city (or
// that area), at most LOCAL_DAYS old, each story once, newest first. Titles stay in their language; one without
// Arabic letters gets dir="auto" (bidiAttr).
const AR_RE = /[\u0600-\u06FF]/;
const ARAB_CC = ['SA','AE','KW','QA','BH','OM','YE','IQ','JO','SY','LB','PS','EG','SD','LY','TN','DZ','MA','MR'];
const GN_EN = ['GB','CA','AU','IN','IE','NZ','ZA','SG','PH','PK','NG','KE','MY'];   // Google News editions in English
const LOCAL_FEW = 3, LOCAL_DAYS = 3;
// listings, not news: school sports schedules, obituaries, property, weather and directory pages
const LOCAL_JUNK = /^(MaxPreps|NFHS Network|Dignity Memorial|Legacy\.com|Realtor\.com|Zillow|Redfin|Trulia|Apartments\.com|IQAir|AccuWeather|Weather Underground|Psychology Today|Yelp|Tripadvisor)\b/i;
const localTitle = () => 'أخبار ' + CONFIG.city;
// an English title, source or summary of the city's news reads left to right; the other panels are unchanged
const bidiAttr = (P, s) => P === 'local' && s && !AR_RE.test(s) ? ' dir="auto"' : '';
const newsSource = (P, s) => !s ? '' : P === 'local' ? `<bdi>${esc(s)}</bdi>` : esc(s);   // bdi: not a span (.week li span rules)

async function fetchJson(url){
  const r = await fetchT(url, 12000);
  if(!r.ok) throw 'HTTP ' + r.status;
  return r.json();
}
// each -> {name, county, region, cc} in English; county: the area between the region and the city, if any
const GEO_AT = () => `lat=${CONFIG.latitude}&lon=${CONFIG.longitude}`;
const BDC = lang => `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}&localityLanguage=${lang}`;
const GEOCODERS = [
  ['bigdatacloud', async () => {
    const j = await fetchJson(BDC('en'));
    const adm = (j.localityInfo && j.localityInfo.administrative) || [];
    // "city" can be a bigger neighbour (a town comes back as its neighbour in city, itself in locality): the
    // locality, when it is a place of its own in the administrative list
    const name = j.locality && adm.some(a => a.name === j.locality) ? j.locality : (j.city || j.locality || '');
    const county = adm.filter(a => a.adminLevel >= 5 && a.adminLevel <= 7 && a.name !== name && a.name !== j.principalSubdivision).pop();
    return {name, county: county ? county.name : '', region: j.principalSubdivision || '', cc: j.countryCode || ''};
  }],
  // the WebView's own User-Agent (a page cannot set one); asked only when BigDataCloud failed, once per place
  ['nominatim', async () => {
    const j = await fetchJson(`https://nominatim.openstreetmap.org/reverse?${GEO_AT()}&format=jsonv2&zoom=10&accept-language=en`);
    const a = j.address || {};
    return {name: a.city || a.town || a.village || a.municipality || a.hamlet || '', county: a.county || a.state_district || '',
            region: a.state || a.region || '', cc: String(a.country_code || '').toUpperCase()};
  }],
  ['photon', async () => {
    const f = ((await fetchJson(`https://photon.komoot.io/reverse?${GEO_AT()}&lang=en`)).features || [])[0];
    const q = (f && f.properties) || {};
    return {name: q.city || q.town || q.village || '', county: q.county || '', region: q.state || '', cc: String(q.countrycode || '').toUpperCase()};
  }],
];
let LOCAL_PLACE = null;
async function localPlace(){
  if(LOCAL_PLACE) return LOCAL_PLACE;
  const key = 'sauditv-place:' + CONFIG.latitude + ',' + CONFIG.longitude;
  try{ const c = JSON.parse(localStorage.getItem(key) || 'null'); if(c && c.name) return LOCAL_PLACE = c; }catch(e){}
  for(const [label, ask] of GEOCODERS){
    let p = null;
    try{ p = await ask(); }catch(e){ console.warn('SaudiTV: local news: no place from ' + label + ' (' + e + ')'); }
    if(!p || !p.name) continue;
    // an Arab country: the region's Arabic name too, for the wider search (kept only once it is known)
    if(ARAB_CC.includes(p.cc)){
      try{ p.regionAr = (await fetchJson(BDC('ar'))).principalSubdivision || ''; }
      catch(e){
        try{ p.regionAr = ((await fetchJson(`https://nominatim.openstreetmap.org/reverse?${GEO_AT()}&format=jsonv2&zoom=10&accept-language=ar`)).address || {}).state || ''; }
        catch(e2){ console.warn('SaudiTV: local news: no Arabic region name (' + e + '; ' + e2 + ')'); return p; }
      }
    }
    try{ localStorage.setItem(key, JSON.stringify(p)); }catch(e){}
    return LOCAL_PLACE = p;
  }
  return null;
}

// the searches for place p (null: the geocoders did not answer): the city, then the wider area.
// [{what, q, ed, mkt, terms}]: q the search, ed Google's edition, mkt Bing's market (else the VPN exit's, e.g.
// en-GB, which matched «جريدة الرياض» rather than Riyadh), terms the names an item must contain one of
function localSearches(p){
  const cc = (p && p.cc) || CONFIG.country;
  const arabic = AR_RE.test(CONFIG.city) && (!cc || ARAB_CC.includes(cc));
  if(!arabic && !(p && p.name)) return [];
  // an Arabic search in the city's own country's edition and market (Saudi Arabia's when it is unknown)
  const acc = arabic && ARAB_CC.includes(cc) ? cc : 'SA';
  const ed = arabic ? `hl=ar&gl=${acc}&ceid=${acc}:ar` : GN_EN.includes(cc) ? `hl=en-${cc}&gl=${cc}&ceid=${cc}:en` : 'hl=en-US&gl=US&ceid=US:en';
  const mkt = arabic ? 'ar-' + acc : GN_EN.includes(cc) ? 'en-' + cc : 'en-US';
  const name = arabic ? CONFIG.city : p.name;
  // saudi: the local sections of the Saudi papers are read for a Saudi city only
  const saudi = arabic && acc === 'SA';
  const out = [{what: 'city', q: arabic ? `"${name}"` : `"${name}" ${p.region || ''}`.trim(), ed, mkt, terms: [name], arabic, saudi}];
  const area = arabic ? (p && p.regionAr) : (p.county || p.region);
  // the area's own name without its kind, as headlines write it ("Orange County" -> "Orange", «أمطار القصيم»)
  const core = String(area || '').replace(/\s+(County|Parish|Borough|District|Governorate|Province|Region)$/i, '')
    .replace(/^(منطقة|محافظة|إمارة|ولاية)\s+/, '').trim();
  if(core && core !== name)
    out.push({what: 'area', q: `"${area}"` + (cc === 'US' && p.county && p.region ? ' ' + p.region : ''), ed, mkt, terms: [name, core], arabic, saudi});
  return out;
}

// does the text name the place? English: the whole word, as written ("Reading", not "reading");
// Arabic: also joined to a prefix (بالرياض، والرياض) and after لـ, which drops the alif (للرياض)
function namesPlace(text, term){
  if(!term || !text) return false;
  if(AR_RE.test(term)) return text.includes(term) || (term.startsWith('ال') && text.includes('لل' + term.slice(2)));
  return new RegExp('(^|[^A-Za-z])' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![A-Za-z])').test(text);
}

// Bing's link to an item goes through its redirect (apiclick.aspx?...&url=<the article>): the article itself
function unBing(link){
  try{ const u = new URL(link); if(/(^|\.)bing\.com$/.test(u.hostname) && /^https?:/.test(u.searchParams.get('url') || '')) return u.searchParams.get('url'); }catch(e){}
  return link;
}
// Bing answers a phone's browser (the TV's WebView says "Mobile") with its news page instead of RSS: the first
// results as cards, each with url, data-title, data-author and an age (en "45m" "3h" "2d", ar «12 من الساعات»)
function bingAge(s, now){
  s = String(s || '').trim().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  const n = parseInt(s, 10);
  if(!(n >= 0)) return NaN;
  const ms = /^\d+\s*m(in)?$/i.test(s) || /دقي|دقائق/.test(s) ? 6e4 : /^\d+\s*h$/i.test(s) || /ساع/.test(s) ? 36e5
           : /^\d+\s*d$/i.test(s) || /يوم|أيام/.test(s) ? 864e5 : NaN;   // months, years: left out
  return now - n * ms;
}
function bingCards(text){
  const doc = new DOMParser().parseFromString(text, 'text/html'), now = Date.now();
  return Array.from(doc.querySelectorAll('[data-title][url]')).map(c => ({
    headline: plainText(c.getAttribute('data-title')), source: plainText(c.getAttribute('data-author')),
    t: bingAge((c.querySelector('.timestamp') || {}).textContent, now), link: unBing(String(c.getAttribute('url') || '').trim()), desc: ''}));
}
// what came back instead of RSS, for the log: where it ended up and its title (a consent page, a block page)
function notRss(r, text){
  let at = '';
  try{ const u = new URL(r.url); at = u.host + u.pathname; }catch(e){}
  const t = /<title[^>]*>([^<]{0,60})/i.exec(text);
  return 'not RSS: ' + at + (t ? ' "' + t[1].trim() + '"' : '');
}

// one RSS search -> [{headline, source, t, link, desc}]; throws when nothing usable answered (e.g. a consent page)
async function localFeed(kind, url){
  const r = await fetchT(url, 15000);
  if(!r.ok) throw 'HTTP ' + r.status;
  const text = await r.text();
  if(!/<item[\s>]/.test(text)){
    if(/<rss[\s>]/.test(text)) return [];   // no results
    const cards = kind === 'bing' ? bingCards(text) : [];
    if(cards.length) return cards;
    throw notRss(r, text);   // e.g. a consent page
  }
  const doc = new DOMParser().parseFromString(text, 'text/xml');
  if(doc.getElementsByTagName('parsererror').length) throw 'bad XML';
  const txt = (el, tag) => { const n = el.getElementsByTagName(tag)[0]; return n ? n.textContent : ''; };
  return Array.from(doc.getElementsByTagName('item')).map(it => {
    const title = plainText(txt(it, 'title')), t = Date.parse(txt(it, 'pubDate') || '');
    let link = txt(it, 'link').trim();
    if(kind === 'google'){   // "headline - Source"; the description is only links to the same story: no summary
      const s = splitNewsTitle(title, plainText(txt(it, 'source')));
      return {headline: s.headline, source: s.source, t, link, desc: ''};
    }
    // Bing: the publisher in <News:Source>, a summary in <description>, the link through Bing's redirect
    const src = plainText(txt(it, 'News:Source'));
    link = unBing(link);
    return {headline: src && title.endsWith(' - ' + src) ? title.slice(0, -src.length - 3).trim() : title, source: src, t, link,
            desc: plainText(txt(it, 'description'))};
  });
}

const newsKey = x => x.headline.toLowerCase().replace(/[\s"'“”‘’«».,:;!?()|\-–—]+/g, '');
// a and b together: newest first (an item without a date last), each story once (same headline, or same link: the
// newest copy stays)
function newsMerge(a, b){
  const seen = new Set(), t = x => Number.isFinite(x.t) ? x.t : -Infinity;
  return a.concat(b).sort((x, y) => t(y) - t(x)).filter(x => {
    const k = newsKey(x);
    if(seen.has(k) || (x.link && seen.has(x.link))) return false;
    seen.add(k); if(x.link) seen.add(x.link);
    return true;
  });
}

// a search s through the picked sources of the city's news (newsSources('local')), all at once: Google and Bing search
// for it; a Saudi paper's local section (an Arabic search only) is read once per refresh (papers) and kept to the
// items that name the place. Resolves to {items, answered, used}
async function localSearch(s, papers){
  const since = Date.now() - LOCAL_DAYS * 86400000;
  const keep = x => x.headline && Number.isFinite(x.t) && x.t >= since && x.t <= Date.now() + 3600000
    && !LOCAL_JUNK.test(x.source || '') && !/\bobituary\b/i.test(x.headline)
    && s.terms.some(n => namesPlace(x.headline, n) || namesPlace(x.desc, n));
  const URLS = {
    google: `https://news.google.com/rss/search?q=${encodeURIComponent(s.q + ' when:' + LOCAL_DAYS + 'd')}&${s.ed}`,
    bing: `https://www.bing.com/news/search?q=${encodeURIComponent(s.q)}&format=rss&qft=${encodeURIComponent('interval="8"')}&mkt=${s.mkt}`,   // the past week
  };
  const feeds = newsSources('local').filter(f => f.search ? URLS[f.search] : s.saudi);
  let items = [], answered = false;
  const used = [];
  await Promise.all(feeds.map(async f => {
    try{
      const all = f.search ? await localFeed(f.search, URLS[f.search]) : await paperItems(f, papers);
      const got = all.filter(keep);
      answered = true;
      if(got.length){ used.push(f.id + ' (' + s.what + ')'); items = newsMerge(items, got); }
    }catch(e){ console.warn('SaudiTV: local news: ' + f.id + ' failed for the ' + s.what + ' (' + e + ')'); }
  }));
  return {items, answered, used};
}
// a paper's feed, read once per refresh (papers: id -> promise), as [{headline, source, t, link, desc}]
function paperItems(f, papers){
  if(!papers[f.id]) papers[f.id] = readFeed(f, true).then(all => {
    if(!all) throw 'not RSS';
    return all.map(it => ({headline: plainText(it.title), source: f.name, t: Date.parse(it.pubDate || ''),
                           link: String(it.link || '').trim(), desc: plainText(it.description)}));
  });
  return papers[f.id];
}

// resolves to false when nothing answered (see firstLoad), or nothing was found while the place is still unknown
// (the geocoders are asked again); an answer with no recent item empties the card (cardHasData then passes over it)
let LOCAL_LOG = '';
async function loadLocalNews(){
  const place = await localPlace(), searches = localSearches(place), papers = {};
  let items = [], answered = false;
  const used = [];
  for(const s of searches){   // the city; the wider area only while there are fewer than LOCAL_FEW
    const r = await localSearch(s, papers);
    answered = answered || r.answered;
    items = newsMerge(items, r.items);
    used.push(...r.used);
    if(items.length >= LOCAL_FEW) break;
  }
  if(!answered || (!place && !items.length)) return false;   // keep the last good list
  // which sources served it, in the TV's log when that changes (a VPN exit can block one)
  const how = used.join(', ') || 'none';
  if(how !== LOCAL_LOG){ LOCAL_LOG = how; console.warn('SaudiTV: local news from ' + how + ': ' + items.length + ' items'); }
  NEWS.local = items.slice(0, CONFIG.detail ? NEWS_DETAIL_KEEP : NEWS_POOL).map(x => {
    const desc = x.desc; delete x.desc;
    if(CONFIG.detail) x.summary = desc ? newsSummary(x, desc) : '';
    return x;
  });
  if(CONFIG.panel === 'local') renderPanel(false);
  return true;
}

// a loader's first run that got no answer tries again soon, instead of leaving the panel empty until
// its regular refresh (30 min; standings 3 h, prayers 6 h). The page often starts with no network: the launcher
// started while the TV sleeps (Low Power Standby blocks the app: every request ends in ERR_NAME_NOT_RESOLVED),
// or right after power-on, before Wi-Fi and the VPN are up. Every 60 s for 10 tries, then every 5 min, until one
// answer arrives; the regular refresh carries on as before. `load` resolves to false when nothing answered.
function firstLoad(load, name){
  let tries = 0;
  const run = () => Promise.resolve().then(load).catch(() => false).then(ok => {
    if(ok !== false) return;
    const ms = ++tries < 10 ? 60*1000 : 5*60*1000;
    console.warn('SaudiTV: no answer for ' + name + ', trying again in ' + ms/1000 + ' s');
    setTimeout(run, ms);
  });
  run();
}

// Start the loaders the panels in `list` need (the others are started by boot / bootWidget).
// matchesLoaded: the caller already loads the match data that standings uses to mark followed teams.
function startPanelData(list, matchesLoaded){
  if(list.includes('standings')){
    firstLoad(loadStandings, 'standings'); setInterval(loadStandings, 3*3600*1000);
    if(!matchesLoaded){ firstLoad(loadMatches, 'matches'); setInterval(loadMatches, 30*60*1000); }
  }
  ['news', 'tech', 'world'].forEach(k => { if(list.includes(k)){ firstLoad(() => loadNews(k), k); setInterval(() => loadNews(k), 30*60*1000); } });
  if(list.includes('hadith')) firstLoad(loadHadith, 'hadith');   // a new day's: hadithRows
  if(list.includes('local')){ firstLoad(loadLocalNews, 'local'); setInterval(loadLocalNews, 30*60*1000); }   // the city's news
  // the shows in a rotation (a single shows card is loaded by boot / cardStart)
  if(list.length > 1 && list.includes('shows')){ firstLoad(loadWeek, 'shows'); setInterval(loadWeek, 6*3600*1000); }
  // a single news card is only redrawn by its 30-min refresh: keep its "minutes ago" current
  if(CONFIG.panels.length <= 1 && list.some(isNewsPanel)){
    setInterval(() => { if(isNewsPanel(CONFIG.panel)) renderPanel(false); }, 5*60*1000);
    // and turn its page (three items each) every NEWS_PAGE_MS
    setInterval(() => { if(newsPaged(CONFIG.panel)){ LIST_PAGE++; renderPanel(true); } }, NEWS_PAGE_MS);
  }
}

 "surah": "سورة الإسراء", "ayah": 24}, {"text": "وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِلْمُؤْمِنِينَ وَلَا يَزِيدُ الظَّالِمِينَ إِلَّا خَسَارًا", "surah": "سورة الإسراء", "ayah": 82}, {"text": "إِذْ أَوَى الْفِتْيَةُ إِلَى الْكَهْفِ فَقَالُوا رَبَّنَا آتِنَا مِنْ لَدُنْكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا", "surah": "سورة الكهف", "ayah": 10}, {"text": "قَالَ لَا تَخَافَا إِنَّنِي مَعَكُمَا أَسْمَعُ وَأَرَىٰ", "surah": "سورة طه", "ayah": 46}, {"text": "فَتَعَالَى اللَّهُ الْمَلِكُ الْحَقُّ وَلَا تَعْجَلْ بِالْقُرْآنِ مِنْ قَبْلِ أَنْ يُقْضَىٰ إِلَيْكَ وَحْيُهُ وَقُلْ رَبِّ زِدْنِي عِلْمًا", "surah": "سورة طه", "ayah": 114}, {"text": "وَأْمُرْ أَهْلَكَ بِالصَّلَاةِ وَاصْطَبِرْ عَلَيْهَا لَا نَسْأَلُكَ رِزْقًا نَحْنُ نَرْزُقُكَ وَالْعَاقِبَةُ لِلتَّقْوَىٰ", "surah": "سورة طه", "ayah": 132}, {"text": "وَأَيُّوبَ إِذْ نَادَىٰ رَبَّهُ أَنِّي مَسَّنِيَ الضُّرُّ وَأَنْتَ أَرْحَمُ الرَّاحِمِينَ", "surah": "سورة الأنبياء", "ayah": 83}, {"text": "وَذَا النُّونِ إِذْ ذَهَبَ مُغَاضِبًا فَظَنَّ أَنْ لَنْ نَقْدِرَ عَلَيْهِ فَنَادَىٰ فِي الظُّلُمَاتِ أَنْ لَا إِلَٰهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ", "surah": "سورة الأنبياء", "ayah": 87}, {"text": "وَقُلْ رَبِّ اغْفِرْ وَارْحَمْ وَأَنْتَ خَيْرُ الرَّاحِمِينَ", "surah": "سورة المؤمنون", "ayah": 118}, {"text": "وَتَوَكَّلْ عَلَى الْحَيِّ الَّذِي لَا يَمُوتُ وَسَبِّحْ بِحَمْدِهِ وَكَفَىٰ بِهِ بِذُنُوبِ عِبَادِهِ خَبِيرًا", "surah": "سورة الفرقان", "ayah": 58}, {"text": "وَعِبَادُ الرَّحْمَٰنِ الَّذِينَ يَمْشُونَ عَلَى الْأَرْضِ هَوْنًا وَإِذَا خَاطَبَهُمُ الْجَاهِلُونَ قَالُوا سَلَامًا", "surah": "سورة الفرقان", "ayah": 63}, {"text": "وَإِذَا مَرِضْتُ فَهُوَ يَشْفِينِ", "surah": "سورة الشعراء", "ayah": 80}, {"text": "رَبِّ هَبْ لِي حُكْمًا وَأَلْحِقْنِي بِالصَّالِحِينَ", "surah": "سورة الشعراء", "ayah": 83}, {"text": "أَمَّنْ يُجِيبُ الْمُضْطَرَّ إِذَا دَعَاهُ وَيَكْشِفُ السُّوءَ وَيَجْعَلُكُمْ خُلَفَاءَ الْأَرْضِ أَإِلَٰهٌ مَعَ اللَّهِ قَلِيلًا مَا تَذَكَّرُونَ", "surah": h": 155}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ كَمَا كُتِبَ عَلَى الَّذِينَ مِنْ قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ", "surah": "سورة البقرة", "ayah": 183}, {"text": "حَافِظُوا عَلَى الصَّلَوَاتِ وَالصَّلَاةِ الْوُسْطَىٰ وَقُومُوا لِلَّهِ قَانِتِينَ", "surah": "سورة البقرة", "ayah": 238}, {"text": "مَنْ ذَا الَّذِي يُقْرِضُ اللَّهَ قَرْضًا حَسَنًا فَيُضَاعِفَهُ لَهُ أَضْعَافًا كَثِيرَةً وَاللَّهُ يَقْبِضُ وَيَبْسُطُ وَإِلَيْهِ تُرْجَعُونَ", "surah": "سورة البقرة", "ayah": 245}, {"text": "قَوْلٌ مَعْرُوفٌ وَمَغْفِرَةٌ خَيْرٌ مِنْ صَدَقَةٍ يَتْبَعُهَا أَذًى وَاللَّهُ غَنِيٌّ حَلِيمٌ", "surah": "سورة البقرة", "ayah": 263}, {"text": "الَّذِينَ يُنْفِقُونَ أَمْوَالَهُمْ بِاللَّيْلِ وَالنَّهَارِ سِرًّا وَعَلَانِيَةً فَلَهُمْ أَجْرُهُمْ عِنْدَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ", "surah": "سورة البقرة", "ayah": 274}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَأَقَامُوا الصَّلَاةَ وَآتَوُا الزَّكَاةَ لَهُمْ أَجْرُهُمْ عِنْدَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ", "surah": "سورة البقرة", "ayah": 277}, {"text": "وَإِنْ كَانَ ذُو عُسْرَةٍ فَنَظِرَةٌ إِلَىٰ مَيْسَرَةٍ وَأَنْ تَصَدَّقُوا خَيْرٌ لَكُمْ إِنْ كُنْتُمْ تَعْلَمُونَ", "surah": "سورة البقرة", "ayah": 280}, {"text": "رَبَّنَا إِنَّكَ جَامِعُ النَّاسِ لِيَوْمٍ لَا رَيْبَ فِيهِ إِنَّ اللَّهَ لَا يُخْلِفُ الْمِيعَادَ", "surah": "سورة آل عمران", "ayah": 9}, {"text": "الَّذِينَ يَقُولُونَ رَبَّنَا إِنَّنَا آمَنَّا فَاغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ النَّارِ", "surah": "سورة آل عمران", "ayah": 16}, {"text": "قُلِ اللَّهُمَّ مَالِكَ الْمُلْكِ تُؤْتِي الْمُلْكَ مَنْ تَشَاءُ وَتَنْزِعُ الْمُلْكَ مِمَّنْ تَشَاءُ وَتُعِزُّ مَنْ تَشَاءُ وَتُذِلُّ مَنْ تَشَاءُ بِيَدِكَ الْخَيْرُ إِنَّكَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", "surah": "سورة آل عمران", "ayah": 26}, {"text": "هُنَالِكَ دَعَا زَكَرِيَّا رَبَّهُ قَالَ رَبِّ هَبْ لِي مِنْ لَدُنْكَ ذُرِّيَّةً طَيِّبَةً إِنَّكَ سَمِيعُ الدُّعَاءِ", "surah": "سورة آل عمران", "ayah": 38}, {"text": "رَبَّنَا آمَنَّا بِمَا أَنْزَلْتَ وَاتَّبَعْنَا الرَّسُولَ فَاكْتُبْنَا مَعَ الشَّاهِدِينَ", "surah": "سورة آل عمران", "ayah": 53}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ حَقَّ تُقَاتِهِ وَلَا تَمُوتُنَّ إِلَّا وَأَنْتُمْ مُسْلِمُونَ", "surah": "سورة آل عمران", "ayah": 102}, {"text": "وَلْتَكُنْ مِنْكُمْ أُمَّةٌ يَدْعُونَ إِلَى الْخَيْرِ وَيَأْمُرُونَ بِالْمَعْرُوفِ وَيَنْهَوْنَ عَنِ الْمُنْكَرِ وَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ", "surah": "سورة آل عمران", "ayah": 104}, {"text": "وَسَارِعُوا إِلَىٰ مَغْفِرَةٍ مِنْ رَبِّكُمْ وَجَنَّةٍ عَرْضُهَا السَّمَاوَاتُ وَالْأَرْضُ أُعِدَّتْ لِلْمُتَّقِينَ", "surah": "سورة آل عمران", "ayah": 133}, {"text": "وَالَّذِينَ إِذَا فَعَلُوا فَاحِشَةً أَوْ ظَلَمُوا أَنْفُسَهُمْ ذَكَرُوا اللَّهَ فَاسْتَغْفَرُوا لِذُنُوبِهِمْ وَمَنْ يَغْفِرُ الذُّنُوبَ إِلَّا اللَّهُ وَلَمْ يُصِرُّوا عَلَىٰ مَا فَعَلُوا وَهُمْ يَعْلَمُونَ", "surah": "سورة آل عمران", "ayah": 135}, {"text": "وَمَا كَانَ قَوْلَهُمْ إِلَّا أَنْ قَالُوا رَبَّنَا اغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِي أَمْرِنَا وَثَبِّتْ أَقْدَامَنَا وَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ", "surah": "سورة آل عمران", "ayah": 147}, {"text": "إِنْ يَنْصُرْكُمُ اللَّهُ فَلَا غَالِبَ لَكُمْ وَإِنْ يَخْذُلْكُمْ فَمَنْ ذَا الَّذِي يَنْصُرُكُمْ مِنْ بَعْدِهِ وَعَلَى اللَّهِ فَلْيَتَوَكَّلِ الْمُؤْمِنُونَ", "surah": "سورة آل عمران", "ayah": 160}, {"text": "رَبَّنَا وَآتِنَا مَا وَعَدْتَنَا عَلَىٰ رُسُلِكَ وَلَا تُخْزِنَا يَوْمَ الْقِيَامَةِ إِنَّكَ لَا تُخْلِفُ الْمِيعَادَ", "surah": "سورة آل عمران", "ayah": 194}, {"text": "إِنْ تَجْتَنِبُوا كَبَائِرَ مَا تُنْهَوْنَ عَنْهُ نُكَفِّرْ عَنْكُمْ سَيِّئَاتِكُمْ وَنُدْخِلْكُمْ مُدْخَلًا كَرِيمًا", "surah": "سورة النساء", "ayah": 31}, {"text": "إِنَّ اللَّهَ لَا يَظْلِمُ مِثْقَالَ ذَرَّةٍ وَإِنْ تَكُ حَسَنَةً يُضَاعِفْهَا وَيُؤْتِ مِنْ لَدُنْهُ أَجْرًا عَظِيمًا", "surah": "سورة النساء", "ayah": 40}, {"text": "مَا يَفْعَلُ اللَّهُ بِعَذَابِكُمْ إِنْ شَكَرْتُمْ وَآمَنْتُمْ وَكَانَ اللَّهُ شَاكِرًا عَلِيمًا", "surah": "سورة النساء", "ayah": 147}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَابْتَغُوا إِلَيْهِ الْوَسِيلَةَ وَجَاهِدُوا فِي سَبِيلِهِ لَعَلَّكُمْ تُفْلِحُونَ", "surah": "سورة المائـدة", "ayah": 35}, {"text": "وَإِنْ يَمْسَسْكَ اللَّهُ بِضُرٍّ فَلَا كَاشِفَ لَهُ إِلَّا هُوَ وَإِنْ يَمْسَسْكَ بِخَيْرٍ فَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", "surah": "سورة الأنعام", "ayah": 17}, {"text": "وَمَا الْحَيَاةُ الدُّنْيَا إِلَّا لَعِبٌ وَلَهْوٌ وَلَلدَّارُ الْآخِرَةُ خَيْرٌ لِلَّذِينَ يَتَّقُونَ أَفَلَا تَعْقِلُونَ", "surah": "سورة الأنعام", "ayah": 32}, {"text": "لَا تُدْرِكُهُ الْأَبْصَارُ وَهُوَ يُدْرِكُ الْأَبْصَارَ وَهُوَ اللَّطِيفُ الْخَبِيرُ", "surah": "سورة الأنعام", "ayah": 103}, {"text": "مَنْ جَاءَ بِالْحَسَنَةِ فَلَهُ عَشْرُ أَمْثَالِهَا وَمَنْ جَاءَ بِالسَّيِّئَةِ فَلَا يُجْزَىٰ إِلَّا مِثْلَهَا وَهُمْ لَا يُظْلَمُونَ", "surah": "سورة الأنعام", "ayah": 160}, {"text": "يَا بَنِي آدَمَ خُذُوا زِينَتَكُمْ عِنْدَ كُلِّ مَسْجِدٍ وَكُلُوا وَاشْرَبُوا وَلَا تُسْرِفُوا إِنَّهُ لَا يُحِبُّ الْمُسْرِفِينَ", "surah": "سورة الأعراف", "ayah": 31}, {"text": "ادْعُوا رَبَّكُمْ تَضَرُّعًا وَخُفْيَةً إِنَّهُ لَا يُحِبُّ الْمُعْتَدِينَ", "surah": "سورة الأعراف", "ayah": 55}, {"text": "وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا وَذَرُوا الَّذِينَ يُلْحِدُونَ فِي أَسْمَائِهِ سَيُجْزَوْنَ مَا كَانُوا يَعْمَلُونَ", "surah": "سورة الأعراف", "ayah": 180}, {"text": "إِنَّ الَّذِينَ اتَّقَوْا إِذَا مَسَّهُمْ طَائِفٌ مِنَ الشَّيْطَانِ تَذَكَّرُوا فَإِذَا هُمْ مُبْصِرُونَ", "surah": "سورة الأعراف", "ayah": 201}, {"text": "وَإِذَا قُرِئَ الْقُرْآنُ فَاسْتَمِعُوا لَهُ وَأَنْصِتُوا لَعَلَّكُمْ تُرْحَمُونَ", "surah": "سورة الأعراف", "ayah": 204}, {"text": "إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ إِذَا ذُكِرَ اللَّهُ وَجِلَتْ قُلُوبُهُمْ وَإِذَا تُلِيَتْ عَلَيْهِمْ آيَاتُهُ زَادَتْهُمْ إِيمَانًا وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ", "surah": "سورة الأنفال", "ayah": 2}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا إِنْ تَتَّقُوا اللَّهَ يَجْعَلْ لَكُمْ فُرْقَانًا وَيُكَفِّرْ عَنْكُمْ سَيِّئَاتِكُمْ وَيَغْفِرْ لَكُمْ وَاللَّهُ ذُو الْفَضْلِ الْعَظِيمِ", "surah": "سورة الأنفال", "ayah": 29}, {"text": "وَقُلِ اعْمَلُوا فَسَيَرَى اللَّهُ عَمَلَكُمْ وَرَسُولُهُ وَالْمُؤْمِنُونَ وَسَتُرَدُّونَ إِلَىٰ عَالِمِ الْغَيْبِ وَالشَّهَادَةِ فَيُنَبِّئُكُمْ بِمَا كُنْتُمْ تَعْمَلُونَ", "surah": "سورة التوبة", "ayah": 105}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَكُونُوا مَعَ الصَّادِقِينَ", "surah": "سورة التوبة", "ayah": 119}, {"text": "لَقَدْ جَاءَكُمْ رَسُولٌ مِنْ أَنْفُسِكُمْ عَزِيزٌ عَلَيْهِ مَا عَنِتُّمْ حَرِيصٌ عَلَيْكُمْ بِالْمُؤْمِنِينَ رَءُوفٌ رَحِيمٌ", "surah": "سورة التوبة", "ayah": 128}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ يَهْدِيهِمْ رَبُّهُمْ بِإِيمَانِهِمْ تَجْرِي مِنْ تَحْتِهِمُ الْأَنْهَارُ فِي جَنَّاتِ النَّعِيمِ", "surah": "سورة يونس", "ayah": 9}, {"text": "إِنَّ اللَّهَ لَا يَظْلِمُ النَّاسَ شَيْئًا وَلَٰكِنَّ النَّاسَ أَنْفُسَهُمْ يَظْلِمُونَ", "surah": "سورة يونس", "ayah": 44}, {"text": "يَا أَيُّهَا النَّاسُ قَدْ جَاءَتْكُمْ مَوْعِظَةٌ مِنْ رَبِّكُمْ وَشِفَاءٌ لِمَا فِي الصُّدُورِ وَهُدًى وَرَحْمَةٌ لِلْمُؤْمِنِينَ", "surah": "سورة يونس", "ayah": 57}, {"text": "قُلْ بِفَضْلِ اللَّهِ وَبِرَحْمَتِهِ فَبِذَٰلِكَ فَلْيَفْرَحُوا هُوَ خَيْرٌ مِمَّا يَجْمَعُونَ", "surah": "سورة يونس", "ayah": 58}, {"text": "وَاسْتَغْفِرُوا رَبَّكُمْ ثُمَّ تُوبُوا إِلَيْهِ إِنَّ رَبِّي رَحِيمٌ وَدُودٌ", "surah": "سورة هود", "ayah": 90}, {"text": "وَمَا أُبَرِّئُ نَفْسِي إِنَّ النَّفْسَ لَأَمَّارَةٌ بِالسُّوءِ إِلَّا مَا رَحِمَ رَبِّي إِنَّ رَبِّي غَفُورٌ رَحِيمٌ", "surah": "سورة يوسف", "ayah": 53}, {"text": "قَالَ لَا تَثْرِيبَ عَلَيْكُمُ الْيَوْمَ يَغْفِرُ اللَّهُ لَكُمْ وَهُوَ أَرْحَمُ الرَّاحِمِينَ", "surah": "سورة يوسف", "ayah": 92}, {"text": "الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ طُوبَىٰ لَهُمْ وَحُسْنُ مَآبٍ", "surah": "سورة الرعد", "ayah": 29}, {"text": "يَمْحُو اللَّهُ مَا يَشَاءُ وَيُثْبِتُ وَعِنْدَهُ أُمُّ الْكِتَابِ", "surah": "سورة الرعد", "ayah": 39}, {"text": "أَلَمْ تَرَ كَيْفَ ضَرَبَ اللَّهُ مَثَلًا كَلِمَةً طَيِّبَةً كَشَجَرَةٍ طَيِّبَةٍ أَصْلُهَا ثَابِتٌ وَفَرْعُهَا فِي السَّمَاءِ", "surah": "سورة إبراهيم", "ayah": 24}, {"text": "وَآتَاكُمْ مِنْ كُلِّ مَا سَأَلْتُمُوهُ وَإِنْ تَعُدُّوا نِعْمَتَ اللَّهِ لَا تُحْصُوهَا إِنَّ الْإِنْسَانَ لَظَلُومٌ كَفَّارٌ", "surah": "سورة إبراهيم", "ayah": 34}, {"text": "هَٰذَا بَلَاغٌ لِلنَّاسِ وَلِيُنْذَرُوا بِهِ وَلِيَعْلَمُوا أَنَّمَا هُوَ إِلَٰهٌ وَاحِدٌ وَلِيَذَّكَّرَ أُولُو الْأَلْبَابِ", "surah": "سورة إبراهيم", "ayah": 52}, {"text": "إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ", "surah": "سورة الحجر", "ayah": 9}, {"text": "وَاعْبُدْ رَبَّكَ حَتَّىٰ يَأْتِيَكَ الْيَقِينُ", "surah": "سورة الحجر", "ayah": 99}, {"text": "وَمَا بِكُمْ مِنْ نِعْمَةٍ فَمِنَ اللَّهِ ثُمَّ إِذَا مَسَّكُمُ الضُّرُّ فَإِلَيْهِ تَجْأَرُونَ", "surah": "سورة النحل", "ayah": 53}, {"text": "مَا عِنْدَكُمْ يَنْفَدُ وَمَا عِنْدَ اللَّهِ بَاقٍ وَلَنَجْزِيَنَّ الَّذِينَ صَبَرُوا أَجْرَهُمْ بِأَحْسَنِ مَا كَانُوا يَعْمَلُونَ", "surah": "سورة النحل", "ayah": 96}, {"text": "فَكُلُوا مِمَّا رَزَقَكُمُ اللَّهُ حَلَالًا طَيِّبًا وَاشْكُرُوا نِعْمَتَ اللَّهِ إِنْ كُنْتُمْ إِيَّاهُ تَعْبُدُونَ", "surah": "سورة النحل", "ayah": 114}, {"text": "ادْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ وَجَادِلْهُمْ بِالَّتِي هِيَ أَحْسَنُ إِنَّ رَبَّكَ هُوَ أَعْلَمُ بِمَنْ ضَلَّ عَنْ سَبِيلِهِ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَ", "surah": "سورة النحل", "ayah": 125}, {"text": "وَاصْبِرْ وَمَا صَبْرُكَ إِلَّا بِاللَّهِ وَلَا تَحْزَنْ عَلَيْهِمْ وَلَا تَكُ فِي ضَيْقٍ مِمَّا يَمْكُرُونَ", "surah": "سورة النحل", "ayah": 127}, {"text": "إِنَّ هَٰذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ وَيُبَشِّرُ الْمُؤْمِنِينَ الَّذِينَ يَعْمَلُونَ الصَّالِحَاتِ أَنَّ لَهُمْ أَجْرًا كَبِيرًا", "surah": "سورة الإسراء", "ayah": 9}, {"text": "وَمَنْ أَرَادَ الْآخِرَةَ وَسَعَىٰ لَهَا سَعْيَهَا وَهُوَ مُؤْمِنٌ فَأُولَٰئِكَ كَانَ سَعْيُهُمْ مَشْكُورًا", "surah": "سورة الإسراء", "ayah": 19}, {"text": "وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ إِنَّ السَّمْعَ وَالْبَصَرَ وَالْفُؤَادَ كُلُّ أُولَٰئِكَ كَانَ عَنْهُ مَسْئُولًا", "surah": "سورة الإسراء", "ayah": 36}, {"text": "وَلَا تَمْشِ فِي الْأَرْضِ مَرَحًا إِنَّكَ لَنْ تَخْرِقَ الْأَرْضَ وَلَنْ تَبْلُغَ الْجِبَالَ طُولًا", "surah": "سورة الإسراء", "ayah": 37}, {"text": "وَقُلْ لِعِبَادِي يَقُولُوا الَّتِي هِيَ أَحْسَنُ إِنَّ الشَّيْطَانَ يَنْزَغُ بَيْنَهُمْ إِنَّ الشَّيْطَانَ كَانَ لِلْإِنْسَانِ عَدُوًّا مُبِينًا", "surah": "سورة الإسراء", "ayah": 53}, {"text": "وَلَقَدْ كَرَّمْنَا بَنِي آدَمَ وَحَمَلْنَاهُمْ فِي الْبَرِّ وَالْبَحْرِ وَرَزَقْنَاهُمْ مِنَ الطَّيِّبَاتِ وَفَضَّلْنَاهُمْ عَلَىٰ كَثِيرٍ مِمَّنْ خَلَقْنَا تَفْضِيلًا", "surah": "سورة الإسراء", "ayah": 70}, {"text": "قُلْ كُلٌّ يَعْمَلُ عَلَىٰ شَاكِلَتِهِ فَرَبُّكُمْ أَعْلَمُ بِمَنْ هُوَ أَهْدَىٰ سَبِيلًا", "surah": "سورة الإسراء", "ayah": 84}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ إِنَّا لَا نُضِيعُ أَجْرَ مَنْ أَحْسَنَ عَمَلًا", "surah": "سورة الكهف", "ayah": 30}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ كَانَتْ لَهُمْ جَنَّاتُ الْفِرْدَوْسِ نُزُلًا", "surah": "سورة الكهف", "ayah": 107}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ سَيَجْعَلُ لَهُمُ الرَّحْمَٰنُ وُدًّا", "surah": "سورة مريم", "ayah": 96}, {"text": "مَا أَنْزَلْنَا عَلَيْكَ الْقُرْآنَ لِتَشْقَىٰ", "surah": "سورة طه", "ayah": 2}, {"text": "إِنَّنِي أَنَا اللَّهُ لَا إِلَٰهَ إِلَّا أَنَا فَاعْبُدْنِي وَأَقِمِ الصَّلَاةَ لِذِكْرِي", "surah": "سورة طه", "ayah": 14}, {"text": "وَإِنِّي لَغَفَّارٌ لِمَنْ تَابَ وَآمَنَ وَعَمِلَ صَالِحًا ثُمَّ اهْتَدَىٰ", "surah": "سورة طه", "ayah": 82}, {"text": "كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ وَنَبْلُوكُمْ بِالشَّرِّ وَالْخَيْرِ فِتْنَةً وَإِلَيْنَا تُرْجَعُونَ", "surah": "سورة الأنبياء", "ayah": 35}, {"text": "وَمَا أَرْسَلْنَاكَ إِلَّا رَحْمَةً لِلْعَالَمِينَ", "surah": "سورة الأنبياء", "ayah": 107}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا ارْكَعُوا وَاسْجُدُوا وَاعْبُدُوا رَبَّكُمْ وَافْعَلُوا الْخَيْرَ لَعَلَّكُمْ تُفْلِحُونَ", "surah": "سورة الحج", "ayah": 77}, {"text": "قَدْ أَفْلَحَ الْمُؤْمِنُونَ", "surah": "سورة المؤمنون", "ayah": 1}, {"text": "الَّذِينَ هُمْ فِي صَلَاتِهِمْ خَاشِعُونَ", "surah": "سورة المؤمنون", "ayah": 2}, {"text": "وَالَّذِينَ هُمْ عَنِ اللَّغْوِ مُعْرِضُونَ", "surah": "سورة المؤمنون", "ayah": 3}, {"text": "أَفَحَسِبْتُمْ أَنَّمَا خَلَقْنَاكُمْ عَبَثًا وَأَنَّكُمْ إِلَيْنَا لَا تُرْجَعُونَ", "surah": "سورة المؤمنون", "ayah": 115}, {"text": "وَمَنْ يُطِعِ اللَّهَ وَرَسُولَهُ وَيَخْشَ اللَّهَ وَيَتَّقْهِ فَأُولَٰئِكَ هُمُ الْفَائِزُونَ", "surah": "سورة النور", "ayah": 52}, {"text": "وَالَّذِينَ لَا يَشْهَدُونَ الزُّورَ وَإِذَا مَرُّوا بِاللَّغْوِ مَرُّوا كِرَامًا", "surah": "سورة الفرقان", "ayah": 72}, {"text": "أُولَٰئِكَ يُجْزَوْنَ الْغُرْفَةَ بِمَا صَبَرُوا وَيُلَقَّوْنَ فِيهَا تَحِيَّةً وَسَلَامًا", "surah": "سورة الفرقان", "ayah": 75}, {"text": "الَّذِي خَلَقَنِي فَهُوَ يَهْدِينِ", "surah": "سورة الشعراء", "ayah": 78}, {"text": "وَالَّذِي هُوَ يُطْعِمُنِي وَيَسْقِينِ", "surah": "سورة الشعراء", "ayah": 79}, {"text": "وَالَّذِي أَطْمَعُ أَنْ يَغْفِرَ لِي خَطِيئَتِي يَوْمَ الدِّينِ", "surah": "سورة الشعراء", "ayah": 82}, {"text": "يَوْمَ لَا يَنْفَعُ مَالٌ وَلَا بَنُونَ", "surah": "سورة الشعراء", "ayah": 88}, {"text": "وَتَوَكَّلْ عَلَى الْعَزِيزِ الرَّحِيمِ", "surah": "سورة الشعراء", "ayah": 217}, {"text": "إِنَّكَ لَا تَهْدِي مَنْ أَحْبَبْتَ وَلَٰكِنَّ اللَّهَ يَهْدِي مَنْ يَشَاءُ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَ", "surah": "سورة القصص", "ayah": 56}, {"text": "وَمَا أُوتِيتُمْ مِنْ شَيْءٍ فَمَتَاعُ الْحَيَاةِ الدُّنْيَا وَزِينَتُهَا وَمَا عِنْدَ اللَّهِ خَيْرٌ وَأَبْقَىٰ أَفَلَا تَعْقِلُونَ", "surah": "سورة القصص", "ayah": 60}, {"text": "تِلْكَ الدَّارُ الْآخِرَةُ نَجْعَلُهَا لِلَّذِينَ لَا يُرِيدُونَ عُلُوًّا فِي الْأَرْضِ وَلَا فَسَادًا وَالْعَاقِبَةُ لِلْمُتَّقِينَ", "surah": "سورة القصص", "ayah": 83}, {"text": "أَحَسِبَ النَّاسُ أَنْ يُتْرَكُوا أَنْ يَقُولُوا آمَنَّا وَهُمْ لَا يُفْتَنُونَ", "surah": "سورة العنكبوت", "ayah": 2}, {"text": "وَمَنْ جَاهَدَ فَإِنَّمَا يُجَاهِدُ لِنَفْسِهِ إِنَّ اللَّهَ لَغَنِيٌّ عَنِ الْعَالَمِينَ", "surah": "سورة العنكبوت", "ayah": 6}, {"text": "كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ ثُمَّ إِلَيْنَا تُرْجَعُونَ", "surah": "سورة العنكبوت", "ayah": 57}, {"text": "وَمَا هَٰذِهِ الْحَيَاةُ الدُّنْيَا إِلَّا لَهْوٌ وَلَعِبٌ وَإِنَّ الدَّارَ الْآخِرَةَ لَهِيَ الْحَيَوَانُ لَوْ كَانُوا يَعْلَمُونَ", "surah": "سورة العنكبوت", "ayah": 64}, {"text": "فَاصْبِرْ إِنَّ وَعْدَ اللَّهِ حَقٌّ وَلَا يَسْتَخِفَّنَّكَ الَّذِينَ لَا يُوقِنُونَ", "surah": "سورة الروم", "ayah": 60}, {"text": "وَإِذْ قَالَ لُقْمَانُ لِابْنِهِ وَهُوَ يَعِظُهُ يَا بُنَيَّ لَا تُشْرِكْ بِاللَّهِ إِنَّ الشِّرْكَ لَظُلْمٌ عَظِيمٌ", "surah": "سورة لقمان", "ayah": 13}, {"text": "وَلَا تُصَعِّرْ خَدَّكَ لِلنَّاسِ وَلَا تَمْشِ فِي الْأَرْضِ مَرَحًا إِنَّ اللَّهَ لَا يُحِبُّ كُلَّ مُخْتَالٍ فَخُورٍ", "surah": "سورة لقمان", "ayah": 18}, {"text": "وَاقْصِدْ فِي مَشْيِكَ وَاغْضُضْ مِنْ صَوْتِكَ إِنَّ أَنْكَرَ الْأَصْوَاتِ لَصَوْتُ الْحَمِيرِ", "surah": "سورة لقمان", "ayah": 19}, {"text": "وَمَنْ يُسْلِمْ وَجْهَهُ إِلَى اللَّهِ وَهُوَ مُحْسِنٌ فَقَدِ اسْتَمْسَكَ بِالْعُرْوَةِ الْوُثْقَىٰ وَإِلَى اللَّهِ عَاقِبَةُ الْأُمُورِ", "surah": "سورة لقمان", "ayah": 22}, {"text": "لَقَدْ كَانَ لَكُمْ فِي رَسُولِ اللَّهِ أُسْوَةٌ حَسَنَةٌ لِمَنْ كَانَ يَرْجُو اللَّهَ وَالْيَوْمَ الْآخِرَ وَذَكَرَ اللَّهَ كَثِيرًا", "surah": "سورة الأحزاب", "ayah": 21}, {"text": "يَا أَيُّهَا النَّاسُ إِنَّ وَعْدَ اللَّهِ حَقٌّ فَلَا تَغُرَّنَّكُمُ الْحَيَاةُ الدُّنْيَا وَلَا يَغُرَّنَّكُمْ بِاللَّهِ الْغَرُورُ", "surah": "سورة فاطر", "ayah": 5}, {"text": "يَا أَيُّهَا النَّاسُ أَنْتُمُ الْفُقَرَاءُ إِلَى اللَّهِ وَاللَّهُ هُوَ الْغَنِيُّ الْحَمِيدُ", "surah": "سورة فاطر", "ayah": 15}, {"text": "سَلَامٌ قَوْلًا مِنْ رَبٍّ رَحِيمٍ", "surah": "سورة يس", "ayah": 58}, {"text": "إِنَّمَا أَمْرُهُ إِذَا أَرَادَ شَيْئًا أَنْ يَقُولَ لَهُ كُنْ فَيَكُونُ", "surah": "سورة يس", "ayah": 82}, {"text": "سُبْحَانَ رَبِّكَ رَبِّ الْعِزَّةِ عَمَّا يَصِفُونَ", "surah": "سورة الصافات", "ayah": 180}, {"text": "وَسَلَامٌ عَلَى الْمُرْسَلِينَ", "surah
