function bootMouse(){
  const root = document.documentElement, key = k => detailKey({key: k, preventDefault(){}});
  let t = 0, x = -1, y = -1, acc = 0, at = 0;
  addEventListener('mousemove', e => {
    if(e.clientX === x && e.clientY === y) return;   // moved, not a page that moved under it
    x = e.clientX; y = e.clientY;
    root.classList.add('mouse');
    clearTimeout(t); t = setTimeout(() => root.classList.remove('mouse'), 3000);
    const it = CONFIG.detail && e.target.closest('#dv .dv-item');
    if(it && +it.dataset.i !== DV.focus) dvNewsFocus(+it.dataset.i);
  }, {passive: true});
  if(!CONFIG.detail) return;
  addEventListener('click', e => {
    const d = e.target.closest('.dv-dot'), it = e.target.closest('#dv .dv-item');
    if(d){ const k = [...d.parentNode.children].indexOf(d) - DV_LIST.indexOf(DV_TO || CONFIG.detail); if(k) dvGo(k); }
    else if(it){ dvNewsFocus(+it.dataset.i); key('Enter'); }
  });
  addEventListener('wheel', e => {
    e.preventDefault();
    const sc = document.querySelector('#dv .dv-scroll');
    if(sc){ sc.scrollTop += e.deltaY; return; }
    if(Date.now() - at > 400) acc = 0;   // a notch (or a trackpad's run) moves one row
    at = Date.now(); acc += e.deltaY;
    if(Math.abs(acc) >= 40){ key(acc > 0 ? 'ArrowDown' : 'ArrowUp'); acc = 0; }
  }, {passive: false});
}
function homeQrRect(){
  const N = window.SaudiTVNative, el = document.getElementById('qr');
  window.sauditvQrFocused = on => document.documentElement.classList.toggle('qr-focus', !!on);
  if(!N || typeof N.qrRect !== 'function' || !el) return;
  let last = '';
  QR_SEND = () => {
    let x = 0, y = 0;
    for(let e = el; e; e = e.offsetParent){ x += e.offsetLeft; y += e.offsetTop; }
    const v = (el.offsetParent ? [x, y, el.offsetWidth, el.offsetHeight] : [0, 0, 0, 0]).concat(innerWidth).map(Math.round);
    if(v.join() !== last){ last = v.join(); try{ N.qrRect(...v); }catch(e){} }
  };
  if(window.ResizeObserver) new ResizeObserver(() => QR_SEND()).observe(el);
  addEventListener('resize', () => QR_SEND());
  QR_SEND();
}

function boot(){
  if(CONFIG.home || CONFIG.detail || CONFIG.ticker || CONFIG.widget) bootMouse();
  if(CONFIG.feedTest) setTimeout(feedTest, 3000);   // tests only (#feedtest=1)
  if(CONFIG.tapeTest) setTimeout(tapeTest, 3000);   // tests only (#tapetest=1)

  if(CONFIG.widget){ bootWidget(); return; }
  if(NXS) nxBoot();   // «الجديد»: its layer over this screensaver (the card moves into it; no ticker tape)
  restoreSnap();
  setTimeout(saveSnap, 15*1000);   // the dream can be killed before pagehide
  setInterval(saveSnap, 60*1000);
  addEventListener('pagehide', saveSnap);
  const wxCity = document.getElementById('wx-city');
  if(wxCity) wxCity.textContent = CONFIG.city;
  const cs = document.getElementById('clock-sub');
  if(cs) cs.textContent = placeNote() ? 'التوقيت المحلي' : 'بتوقيت ' + CONFIG.city;
  document.title = 'سعودي TV';
  applyBackground(true);
  loadPhotoIndex().then(() => applyBackground(true));
  setInterval(() => applyBackground(false), 60*1000);
  tickClock(); tickDates(); tickRamadan();
  if(!NXS) tapeStart();   // the ticker tape at the bottom edge (was the three markets under the weather)
  const ROT = CONFIG.panels.length > 1 ? CONFIG.panels : null;   // rotating card on the screensaver too
  if(ROT) CONFIG.panel = ROT[0];
  if(CONFIG.panel === 'none') document.querySelector('.week').style.display = 'none';
  else renderPanel(false);   // its own data arrives with prayers, weather, matches
  firstLoad(loadPrayers, 'prayers'); firstLoad(loadMatches, 'matches'); firstLoad(loadWeather, 'weather');
  startPanelData(ROT || [CONFIG.panel], true);   // standings / news / tech (matches load above)
  if(ROT){
    newsFlipArm();   // the first panel, if it is news, pages like the later visits
    let ri = 0;
    rotInit(ROT); rotMark(0); rotRestart();   // rotation indicator
    setInterval(() => {
      const k = rotNext(ROT, ri, 1);   // past a panel with nothing to show
      if(k === ri){ rotRestart(); return; }
      ri = k;
      swapPanel(ROT[ri]);   // fade out, then slide the next panel in (sets CONFIG.panel, LIST_PAGE)
      rotMark(ri); rotRestart();
    }, CONFIG.rotateMs);
  }
  applyNight(); pixelShift();
  ssStart();   // the sides change places every hour, a photo-only minute twice an hour

  setInterval(tickClock, 1000);
  setInterval(()=>{ tickDates(); tickPrayer(); tickRamadan(); if(CONFIG.panel === 'prayers') renderPanel(false); }, 15000);
  setInterval(renderMatches, 60000);   // one match, no page turns (was every 15 s)
  setInterval(loadLive, 2*60000);
  setInterval(loadPrayers, 6*3600*1000);
  setInterval(loadMatches, 30*60*1000);
  setInterval(loadWeather, 30*60*1000);
  setInterval(()=>{
    if(CONFIG.panel === 'matches'){ LIST_PAGE++; renderPanel(matchRows().length > WEEK_ROWS); }
  }, 25*1000);
  setInterval(applyNight, 20*1000);     // was every minute (it writes only a change: see applyNight)
  setInterval(pixelShift, 2*60*1000);   // was every 4 min
  let lastDay = new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(new Date());
  setInterval(()=>{
    const d = new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(new Date());
    if(d !== lastDay){ lastDay = d; loadPhotoIndex().then(() => applyBackground(true)); tickDates(); tickRamadan(); loadPrayers(); loadMatches(); loadWeather(); renderPanel(false); }
  }, 60*1000);
}

function homeCardRect(){
  const N = window.SaudiTVNative, card = document.querySelector('.week'), stage = document.querySelector('.stage');
  if(!N || typeof N.cardRect !== 'function' || !card || !stage) return;
  let last = '';
  const send = () => {
    let x = 0, y = 0, w = 0, h = 0;
    if(card.offsetParent){   // offsets from the stage: a scaled (focused) card reports its own box
      const s = stage.getBoundingClientRect();
      for(let el = card; el && el !== stage; el = el.offsetParent){ x += el.offsetLeft; y += el.offsetTop; }
      x += s.left; y += s.top; w = card.offsetWidth; h = card.offsetHeight;
    }
    const v = [x, y, w, h, innerWidth].map(Math.round), key = v.join(',');
    if(key === last) return;
    last = key;
    try{ N.cardRect(...v); }catch(e){}
  };
  if(window.ResizeObserver) new ResizeObserver(send).observe(card);
  addEventListener('resize', send);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(send);
  send();
}

  const POS_KEY = 'sauditv-card-pos', POS_MAX_AGE = 30*60*1000;
  let i = 0;
  try{

    if(s && age >= 0 && age < POS_MAX_AGE && L.includes(s.panel)) i = L.indexOf(s.panel);
  }catch(e){}

  let lastDay = riyadhDayNumber();
  setInterval(() => {
    if(riyadhDayNumber() !== lastDay){ lastDay = riyadhDayNumber(); if(L.includes('prayers') && own) loadPrayers(); renderPanel(false); }
  }, 60*1000);
}

  window.sauditvPoint = (x, y) => {   // the mouse over the row (the launcher's view): the card under it
    const c = document.elementFromPoint(x, y), e = c && c.closest('.nx-c');
    if(e && e.dataset.k !== NX_K){ NX_K = e.dataset.k; nxFocus(); }
  };
  window.sauditvPillsEnd = px => { nxEl('nx').style.setProperty('--pe', Math.max(40, px / (devicePixelRatio || 1) / NX_Z + 14) + 'px'); nxSoon(); };
  document.title = 'سعودي TV';
  applyBackground(true);
  loadPhotoIndex().then(() => applyBackground(true));
  setInterval(() => applyBackground(false), 60*1000);
  try{ buildPrayers(computePrayers()); }catch(e){}   // at once, offline; Aladhan's when it answers
  tickClock(); tickDates(); tickRamadan(); tickPrayer();
  tapeStart();
  firstLoad(loadPrayers, 'prayers'); firstLoad(loadWeather, 'weather'); firstLoad(loadMatches, 'matches');
  startPanelData(cards, true);
  homeQrRect();
  setInterval(tickClock, 1000);
  setInterval(() => { tickDates(); tickPrayer(); tickRamadan(); }, 15000);
  setInterval(renderMatches, 60000);
  setInterval(loadLive, 2*60000);
  setInterval(loadMatches, 30*60*1000);
  setInterval(loadPrayers, 6*3600*1000);
  setInterval(loadWeather, 30*60*1000);
  let lastDay = riyadhDayNumber();
  setInterval(() => {
    if(riyadhDayNumber() === lastDay) return;
    lastDay = riyadhDayNumber();
    loadPhotoIndex().then(() => applyBackground(true)); tickDates(); tickRamadan(); loadPrayers(); loadWeather();
  }, 60*1000);
}

document.addEventListener('keydown', e=>{
  if(e.key === 'f' || e.key === 'F'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen().catch(()=>{});
  }
});

boot();
</script>
</body>
</html>
