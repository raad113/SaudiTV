let LOCAL_PLACE = null;
async function localPlace(){
  if(LOCAL_PLACE) return LOCAL_PLACE;
  const key = 'sauditv-place:' + CONFIG.latitude + ',' + CONFIG.longitude;
  try{ const c = JSON.parse(localStorage.getItem(key) || 'null'); if(c && c.name) return LOCAL_PLACE = c; }catch(e){}
  for(const [label, ask] of GEOCODERS){
    let p = null;
    try{ p = await ask(); }catch(e){ console.warn('SaudiTV: local news: no place from ' + label + ' (' + e + ')'); }
    if(!p || !p.name) continue;
    if(ARAB_CC.includes(p.cc)){
      try{ p.regionAr = (await fetchJson(BDC('ar'))).principalSubdivision || ''; }
      catch(e){
        try{ p.regionAr = ((await fetchJson(`https://nominatim.openstreetmap.org/reverse?${GEO_AT()}&format=jsonv2&zoom=10&accept-language=ar`)).address || {}).state || ''; }
        catch(e2){ console.warn('SaudiTV: local news: no Arabic region name (' + e + '; ' + e2 + ')'); return p; }
      }
    }
    try{ localStorage.setItem(key, JSON.stringify(p)); }catch(e){}
    return LOCAL_PLACE = p;
  }
  return null;
}

function localSearches(p){
  const cc = (p && p.cc) || CONFIG.country;
  const arabic = AR_RE.test(CONFIG.city) && (!cc || ARAB_CC.includes(cc));
  if(!arabic && !(p && p.name)) return [];
  const acc = arabic && ARAB_CC.includes(cc) ? cc : 'SA';
  const ed = arabic ? `hl=ar&gl=${acc}&ceid=${acc}:ar` : GN_EN.includes(cc) ? `hl=en-${cc}&gl=${cc}&ceid=${cc}:en` : 'hl=en-US&gl=US&ceid=US:en';
  const mkt = arabic ? 'ar-' + acc : GN_EN.includes(cc) ? 'en-' + cc : 'en-US';
  const name = arabic ? CONFIG.city : p.name;
  const saudi = arabic && acc === 'SA';
  const out = [{what: 'city', q: arabic ? `"${name}"` : `"${name}" ${p.region || ''}`.trim(), ed, mkt, terms: [name], arabic, saudi}];
  const area = arabic ? (p && p.regionAr) : (p.county || p.region);
  const core = String(area || '').replace(/\s+(County|Parish|Borough|District|Governorate|Province|Region)$/i, '')
    .replace(/^(منطقة|محافظة|إمارة|ولاية)\s+/, '').trim();
  if(core && core !== name)
    out.push({what: 'area', q: `"${area}"` + (cc === 'US' && p.county && p.region ? ' ' + p.region : ''), ed, mkt, terms: [name, core], arabic, saudi});
  return out;
}

function namesPlace(text, term){
  if(!term || !text) return false;
  if(AR_RE.test(term)) return text.includes(term) || (term.startsWith('ال') && text.includes('لل' + term.slice(2)));
  return new RegExp('(^|[^A-Za-z])' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![A-Za-z])').test(text);
}

function unBing(link){
  try{ const u = new URL(link); if(/(^|\.)bing\.com$/.test(u.hostname) && /^https?:/.test(u.searchParams.get('url') || '')) return u.searchParams.get('url'); }catch(e){}
  return link;
}
function bingAge(s, now){
  s = String(s || '').trim().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  const n = parseInt(s, 10);
  if(!(n >= 0)) return NaN;
  const ms = /^\d+\s*m(in)?$/i.test(s) || /دقي|دقائق/.test(s) ? 6e4 : /^\d+\s*h$/i.test(s) || /ساع/.test(s) ? 36e5
           : /^\d+\s*d$/i.test(s) || /يوم|أيام/.test(s) ? 864e5 : NaN;   // months, years: left out
  return now - n * ms;
}
function bingCards(text){
  const doc = new DOMParser().parseFromString(text, 'text/html'), now = Date.now();
  return Array.from(doc.querySelectorAll('[data-title][url]')).map(c => ({
    headline: plainText(c.getAttribute('data-title')), source: plainText(c.getAttribute('data-author')),
    t: bingAge((c.querySelector('.timestamp') || {}).textContent, now), link: unBing(String(c.getAttribute('url') || '').trim()), desc: ''}));
}
function notRss(r, text){
  let at = '';
  try{ const u = new URL(r.url); at = u.host + u.pathname; }catch(e){}
  const t = /<title[^>]*>([^<]{0,60})/i.exec(text);
  return 'not RSS: ' + at + (t ? ' "' + t[1].trim() + '"' : '');
}

async function localFeed(kind, url){
  const r = await fetchT(url, 15000);
  if(!r.ok) throw 'HTTP ' + r.status;
  const text = await r.text();
  if(!/<item[\s>]/.test(text)){
    if(/<rss[\s>]/.test(text)) return [];   // no results
    const cards = kind === 'bing' ? bingCards(text) : [];
    if(cards.length) return cards;
    throw notRss(r, text);   // e.g. a consent page
  }
  const doc = new DOMParser().parseFromString(text, 'text/xml');
  if(doc.getElementsByTagName('parsererror').length) throw 'bad XML';
  const txt = (el, tag) => { const n = el.getElementsByTagName(tag)[0]; return n ? n.textContent : ''; };
  return Array.from(doc.getElementsByTagName('item')).map(it => {
    const title = plainText(txt(it, 'title')), t = Date.parse(txt(it, 'pubDate') || '');
    let link = txt(it, 'link').trim();
    if(kind === 'google'){   // "headline - Source"; the description is only links to the same story: no summary
      const s = splitNewsTitle(title, plainText(txt(it, 'source')));
      return {headline: s.headline, source: s.source, t, link, desc: ''};
    }
    const src = plainText(txt(it, 'News:Source'));
    link = unBing(link);
    return {headline: src && title.endsWith(' - ' + src) ? title.slice(0, -src.length - 3).trim() : title, source: src, t, link,
            desc: plainText(txt(it, 'description'))};
  });
}

const newsKey = x => x.headline.toLowerCase().replace(/[\s"'“”‘’«».,:;!?()|\-–—]+/g, '');
function newsMerge(a, b){
  const seen = new Set(), t = x => Number.isFinite(x.t) ? x.t : -Infinity;
  return a.concat(b).sort((x, y) => t(y) - t(x)).filter(x => {
    const k = newsKey(x);
    if(seen.has(k) || (x.link && seen.has(x.link))) return false;
    seen.add(k); if(x.link) seen.add(x.link);
    return true;
  });
}

async function localSearch(s, papers){
  const since = Date.now() - LOCAL_DAYS * 86400000;
  const keep = x => x.headline && Number.isFinite(x.t) && x.t >= since && x.t <= Date.now() + 3600000
    && !LOCAL_JUNK.test(x.source || '') && !/\bobituary\b/i.test(x.headline)
    && s.terms.some(n => namesPlace(x.headline, n) || namesPlace(x.desc, n));
  const URLS = {
    google: `https://news.google.com/rss/search?q=${encodeURIComponent(s.q + ' when:' + LOCAL_DAYS + 'd')}&${s.ed}`,
    bing: `https://www.bing.com/news/search?q=${encodeURIComponent(s.q)}&format=rss&qft=${encodeURIComponent('interval="8"')}&mkt=${s.mkt}`,   // the past week
  };
  const feeds = newsSources('local').filter(f => f.search ? URLS[f.search] : s.saudi);
  let items = [], answered = false;
  const used = [];
  await Promise.all(feeds.map(async f => {
    try{
      const all = f.search ? await localFeed(f.search, URLS[f.search]) : await paperItems(f, papers);
      const got = all.filter(keep);
      answered = true;
      if(got.length){ used.push(f.id + ' (' + s.what + ')'); items = newsMerge(items, got); }
    }catch(e){ console.warn('SaudiTV: local news: ' + f.id + ' failed for the ' + s.what + ' (' + e + ')'); }
  }));
  return {items, answered, used};
}
function paperItems(f, papers){
  if(!papers[f.id]) papers[f.id] = readFeed(f, true).then(all => {
    if(!all) throw 'not RSS';
    return all.map(it => ({headline: plainText(it.title), source: f.name, t: Date.parse(it.pubDate || ''),
                           link: String(it.link || '').trim(), desc: plainText(it.description)}));
  });
  return papers[f.id];
}

let LOCAL_LOG = '';
async function loadLocalNews(){
  const place = await localPlace(), searches = localSearches(place), papers = {};
  let items = [], answered = false;
  const used = [];
  for(const s of searches){   // the city; the wider area only while there are fewer than LOCAL_FEW
    const r = await localSearch(s, papers);
    answered = answered || r.answered;
    items = newsMerge(items, r.items);
    used.push(...r.used);
    if(items.length >= LOCAL_FEW) break;
  }
  if(!answered || (!place && !items.length)) return false;   // keep the last good list
  const how = used.join(', ') || 'none';
  if(how !== LOCAL_LOG){ LOCAL_LOG = how; console.warn('SaudiTV: local news from ' + how + ': ' + items.length + ' items'); }
  NEWS.local = items.slice(0, CONFIG.detail ? NEWS_DETAIL_KEEP : NEWS_POOL).map(x => {
    const desc = x.desc; delete x.desc;
    if(CONFIG.detail || NXH) x.summary = desc ? newsSummary(x, desc) : '';
    return x;
  });
  if(CONFIG.panel === 'local') renderPanel(false);
  return true;
}

function firstLoad(load, name){
  let tries = 0;
  const run = () => Promise.resolve().then(load).catch(() => false).then(ok => {
    if(ok !== false) return;
    const ms = ++tries < 10 ? 60*1000 : 5*60*1000;
    console.warn('SaudiTV: no answer for ' + name + ', trying again in ' + ms/1000 + ' s');
    setTimeout(run, ms);
  });
  run();
}

function startPanelData(list, matchesLoaded){
  if(list.includes('standings')){
    firstLoad(loadStandings, 'standings'); setInterval(loadStandings, 3*3600*1000);
    if(!matchesLoaded){ firstLoad(loadMatches, 'matches'); setInterval(loadMatches, 30*60*1000); }
  }
  ['news', 'tech', 'world'].forEach(k => { if(list.includes(k)){ firstLoad(() => loadNews(k), k); setInterval(() => loadNews(k), 30*60*1000); } });
  if(list.includes('hadith')) firstLoad(loadHadith, 'hadith');   // a new day's: hadithRows
  if(list.includes('local')){ firstLoad(loadLocalNews, 'local'); setInterval(loadLocalNews, 30*60*1000); }   // the city's news
  if(CONFIG.panels.length <= 1 && list.some(isNewsPanel)){
    setInterval(() => { if(isNewsPanel(CONFIG.panel)) renderPanel(false); }, 5*60*1000);
    setInterval(() => { if(newsPaged(CONFIG.panel)){ LIST_PAGE++; renderPanel(true); } }, NEWS_PAGE_MS);
  }
}

"سورة يونس", "ayah": 62}, {"text": "وَمَا مِنْ دَابَّةٍ فِي الْأَرْضِ إِلَّا عَلَى اللَّهِ رِزْقُهَا وَيَعْلَمُ مُسْتَقَرَّهَا وَمُسْتَوْدَعَهَا كُلٌّ فِي كِتَابٍ مُبِينٍ", "surah": "سورة هود", "ayah": 6}, {"text": "وَأَقِمِ الصَّلَاةَ طَرَفَيِ النَّهَارِ وَزُلَفًا مِنَ اللَّيْلِ إِنَّ الْحَسَنَاتِ يُذْهِبْنَ السَّيِّئَاتِ ذَٰلِكَ ذِكْرَىٰ لِلذَّاكِرِينَ", "surah": "سورة هود", "ayah": 114}, {"text": "وَاصْبِرْ فَإِنَّ اللَّهَ لَا يُضِيعُ أَجْرَ الْمُحْسِنِينَ", "surah": "سورة هود", "ayah": 115}, {"text": "قَالَ إِنَّمَا أَشْكُو بَثِّي وَحُزْنِي إِلَى اللَّهِ وَأَعْلَمُ مِنَ اللَّهِ مَا لَا تَعْلَمُونَ", "surah": "سورة يوسف", "ayah": 86}, {"text": "يَا بَنِيَّ اذْهَبُوا فَتَحَسَّسُوا مِنْ يُوسُفَ وَأَخِيهِ وَلَا تَيْأَسُوا مِنْ رَوْحِ اللَّهِ إِنَّهُ لَا يَيْأَسُ مِنْ رَوْحِ اللَّهِ إِلَّا الْقَوْمُ الْكَافِرُونَ", "surah": "سورة يوسف", "ayah": 87}, {"text": "رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِنْ ذُرِّيَّتِي رَبَّنَا وَتَقَبَّلْ دُعَاءِ", "surah": "سورة إبراهيم", "ayah": 40}, {"text": "رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ", "surah": "سورة إبراهيم", "ayah": 41}, {"text": "نَبِّئْ عِبَادِي أَنِّي أَنَا الْغَفُورُ الرَّحِيمُ", "surah": "سورة الحجر", "ayah": 49}, {"text": "فَسَبِّحْ بِحَمْدِ رَبِّكَ وَكُنْ مِنَ السَّاجِدِينَ", "surah": "سورة الحجر", "ayah": 98}, {"text": "وَإِنْ تَعُدُّوا نِعْمَةَ اللَّهِ لَا تُحْصُوهَا إِنَّ اللَّهَ لَغَفُورٌ رَحِيمٌ", "surah": "سورة النحل", "ayah": 18}, {"text": "إِنَّ اللَّهَ يَأْمُرُ بِالْعَدْلِ وَالْإِحْسَانِ وَإِيتَاءِ ذِي الْقُرْبَىٰ وَيَنْهَىٰ عَنِ الْفَحْشَاءِ وَالْمُنْكَرِ وَالْبَغْيِ يَعِظُكُمْ لَعَلَّكُمْ تَذَكَّرُونَ", "surah": "سورة النحل", "ayah": 90}, {"text": "مَنْ عَمِلَ صَالِحًا مِنْ ذَكَرٍ أَوْ أُنْثَىٰ وَهُوَ مُؤْمِنٌ فَلَنُحْيِيَنَّهُ حَيَاةً طَيِّبَةً وَلَنَجْزِيَنَّهُمْ أَجْرَهُمْ بِأَحْسَنِ مَا كَانُوا يَعْمَلُونَ", "surah": "سورة النحل", "ayah": 97}, {"text": "وَاخْفِضْ لَهُمَا جَنَاحَ الذُّلِّ مِنَ الرَّحْمَةِ وَقُلْ رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا", "surah": "سورة الإسراء", "ayah": 24}, {"text": "وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِلْمُؤْمِنِينَ وَلَا يَزِيدُ الظَّالِمِينَ إِلَّا خَسَارًا", "surah": "سورة الإسراء", "ayah": 82}, {"text": "إِذْ أَوَى الْفِتْيَةُ إِلَى الْكَهْفِ فَقَالُوا رَبَّنَا آتِنَا مِنْ لَدُنْكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا", "surah": "سورة الكهف", "ayah": 10}, {"text": "قَالَ لَا تَخَافَا إِنَّنِي مَعَكُمَا أَسْمَعُ وَأَرَىٰ", "surah": "سورة طه", "ayah": 46}, {"text": "فَتَعَالَى اللَّهُ الْمَلِكُ الْحَقُّ وَلَا تَعْجَلْ بِالْقُرْآنِ مِنْ قَبْلِ أَنْ يُقْضَىٰ إِلَيْكَ وَحْيُهُ وَقُلْ رَبِّ زِدْنِي عِلْمًا", "surah": "سورة طه", "ayah": 114}, {"text": "وَأْمُرْ أَهْلَكَ بِالصَّلَاةِ وَاصْطَبِرْ عَلَيْهَا لَا نَسْأَلُكَ رِزْقًا نَحْنُ نَرْزُقُكَ وَالْعَاقِبَةُ لِلتَّقْوَىٰ", "surah": "سورة طه", "ayah": 132}, {"text": "وَأَيُّوبَ إِذْ نَادَىٰ رَبَّهُ أَنِّي مَسَّنِيَ الضُّرُّ وَأَنْتَ أَرْحَمُ الرَّاحِمِينَ", "surah": "سورة الأنبياء", "ayah": 83}, {"text": "وَذَا النُّونِ إِذْ ذَهَبَ مُغَاضِبًا فَظَنَّ أَنْ لَنْ نَقْدِرَ عَلَيْهِ فَنَادَىٰ فِي الظُّلُمَاتِ أَنْ لَا إِلَٰهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ", "surah": "سورة الأنبياء", "ayah": 87}, {"text": "وَقُلْ رَبِّ اغْفِرْ وَارْحَمْ وَأَنْتَ خَيْرُ الرَّاحِمِينَ", "surah": "سورة المؤمنون", "ayah": 118}, {"text": "وَتَوَكَّلْ عَلَى الْحَيِّ الَّذِي لَا يَمُوتُ وَسَبِّحْ بِحَمْدِهِ وَكَفَىٰ بِهِ بِذُنُوبِ عِبَادِهِ خَبِيرًا", "surah": "سورة الفرقان", "ayah": 58}, {"text": "وَعِبَادُ الرَّحْمَٰنِ الَّذِينَ يَمْشُونَ عَلَى الْأَرْضِ هَوْنًا وَإِذَا خَاطَبَهُمُ الْجَاهِلُونَ قَالُوا سَلَامًا", "surah": "سورة الفرقان", "ayah": 63}, {"text": "وَإِذَا مَرِضْتُ فَهُوَ يَشْفِينِ", "surah": "سورة الشعراء", "ayah": 80}, {"text": "رَبِّ هَبْ لِي حُكْمًا وَأَلْحِقْنِي بِالصَّالِحِينَ", "surah": "سورة الشعراء", "ayah": 83}, {"text": "أَمَّنْ يُجِيبُ الْمُضْطَرَّ إِذَا دَعَاهُ وَيَكْشِفُ السُّوءَ وَيَجْعَلُكُمْ خُلَفَاءَ الْأَرْضِ أَإِلَٰهٌ مَعَ اللَّهِ قَلِيلًا مَا تَذَكَّرُونَ", "surah": h": 155}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ كَمَا كُتِبَ عَلَى الَّذِينَ مِنْ قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ", "surah": "سورة البقرة", "ayah": 183}, {"text": "حَافِظُوا عَلَى الصَّلَوَاتِ وَالصَّلَاةِ الْوُسْطَىٰ وَقُومُوا لِلَّهِ قَانِتِينَ", "surah": "سورة البقرة", "ayah": 238}, {"text": "مَنْ ذَا الَّذِي يُقْرِضُ اللَّهَ قَرْضًا حَسَنًا فَيُضَاعِفَهُ لَهُ أَضْعَافًا كَثِيرَةً وَاللَّهُ يَقْبِضُ وَيَبْسُطُ وَإِلَيْهِ تُرْجَعُونَ", "surah": "سورة البقرة", "ayah": 245}, {"text": "قَوْلٌ مَعْرُوفٌ وَمَغْفِرَةٌ خَيْرٌ مِنْ صَدَقَةٍ يَتْبَعُهَا أَذًى وَاللَّهُ غَنِيٌّ حَلِيمٌ", "surah": "سورة البقرة", "ayah": 263}, {"text": "الَّذِينَ يُنْفِقُونَ أَمْوَالَهُمْ بِاللَّيْلِ وَالنَّهَارِ سِرًّا وَعَلَانِيَةً فَلَهُمْ أَجْرُهُمْ عِنْدَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ", "surah": "سورة البقرة", "ayah": 274}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَأَقَامُوا الصَّلَاةَ وَآتَوُا الزَّكَاةَ لَهُمْ أَجْرُهُمْ عِنْدَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ", "surah": "سورة البقرة", "ayah": 277}, {"text": "وَإِنْ كَانَ ذُو عُسْرَةٍ فَنَظِرَةٌ إِلَىٰ مَيْسَرَةٍ وَأَنْ تَصَدَّقُوا خَيْرٌ لَكُمْ إِنْ كُنْتُمْ تَعْلَمُونَ", "surah": "سورة البقرة", "ayah": 280}, {"text": "رَبَّنَا إِنَّكَ جَامِعُ النَّاسِ لِيَوْمٍ لَا رَيْبَ فِيهِ إِنَّ اللَّهَ لَا يُخْلِفُ الْمِيعَادَ", "surah": "سورة آل عمران", "ayah": 9}, {"text": "الَّذِينَ يَقُولُونَ رَبَّنَا إِنَّنَا آمَنَّا فَاغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ النَّارِ", "surah": "سورة آل عمران", "ayah": 16}, {"text": "قُلِ اللَّهُمَّ مَالِكَ الْمُلْكِ تُؤْتِي الْمُلْكَ مَنْ تَشَاءُ وَتَنْزِعُ الْمُلْكَ مِمَّنْ تَشَاءُ وَتُعِزُّ مَنْ تَشَاءُ وَتُذِلُّ مَنْ تَشَاءُ بِيَدِكَ الْخَيْرُ إِنَّكَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", "surah": "سورة آل عمران", "ayah": 26}, {"text": "هُنَالِكَ دَعَا زَكَرِيَّا رَبَّهُ قَالَ رَبِّ هَبْ لِي مِنْ لَدُنْكَ ذُرِّيَّةً طَيِّبَةً إِنَّكَ سَمِيعُ الدُّعَاءِ", "surah": "سورة آل عمران", "ayah": 38}, {"text": "رَبَّنَا آمَنَّا بِمَا أَنْزَلْتَ وَاتَّبَعْنَا الرَّسُولَ فَاكْتُبْنَا مَعَ الشَّاهِدِينَ", "surah": "سورة آل عمران", "ayah": 53}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ حَقَّ تُقَاتِهِ وَلَا تَمُوتُنَّ إِلَّا وَأَنْتُمْ مُسْلِمُونَ", "surah": "سورة آل عمران", "ayah": 102}, {"text": "وَلْتَكُنْ مِنْكُمْ أُمَّةٌ يَدْعُونَ إِلَى الْخَيْرِ وَيَأْمُرُونَ بِالْمَعْرُوفِ وَيَنْهَوْنَ عَنِ الْمُنْكَرِ وَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ", "surah": "سورة آل عمران", "ayah": 104}, {"text": "وَسَارِعُوا إِلَىٰ مَغْفِرَةٍ مِنْ رَبِّكُمْ وَجَنَّةٍ عَرْضُهَا السَّمَاوَاتُ وَالْأَرْضُ أُعِدَّتْ لِلْمُتَّقِينَ", "surah": "سورة آل عمران", "ayah": 133}, {"text": "وَالَّذِينَ إِذَا فَعَلُوا فَاحِشَةً أَوْ ظَلَمُوا أَنْفُسَهُمْ ذَكَرُوا اللَّهَ فَاسْتَغْفَرُوا لِذُنُوبِهِمْ وَمَنْ يَغْفِرُ الذُّنُوبَ إِلَّا اللَّهُ وَلَمْ يُصِرُّوا عَلَىٰ مَا فَعَلُوا وَهُمْ يَعْلَمُونَ", "surah": "سورة آل عمران", "ayah": 135}, {"text": "وَمَا كَانَ قَوْلَهُمْ إِلَّا أَنْ قَالُوا رَبَّنَا اغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِي أَمْرِنَا وَثَبِّتْ أَقْدَامَنَا وَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ", "surah": "سورة آل عمران", "ayah": 147}, {"text": "إِنْ يَنْصُرْكُمُ اللَّهُ فَلَا غَالِبَ لَكُمْ وَإِنْ يَخْذُلْكُمْ فَمَنْ ذَا الَّذِي يَنْصُرُكُمْ مِنْ بَعْدِهِ وَعَلَى اللَّهِ فَلْيَتَوَكَّلِ الْمُؤْمِنُونَ", "surah": "سورة آل عمران", "ayah": 160}, {"text": "رَبَّنَا وَآتِنَا مَا وَعَدْتَنَا عَلَىٰ رُسُلِكَ وَلَا تُخْزِنَا يَوْمَ الْقِيَامَةِ إِنَّكَ لَا تُخْلِفُ الْمِيعَادَ", "surah": "سورة آل عمران", "ayah": 194}, {"text": "إِنْ تَجْتَنِبُوا كَبَائِرَ مَا تُنْهَوْنَ عَنْهُ نُكَفِّرْ عَنْكُمْ سَيِّئَاتِكُمْ وَنُدْخِلْكُمْ مُدْخَلًا كَرِيمًا", "surah": "سورة النساء", "ayah": 31}, {"text": "إِنَّ اللَّهَ لَا يَظْلِمُ مِثْقَالَ ذَرَّةٍ وَإِنْ تَكُ حَسَنَةً يُضَاعِفْهَا وَيُؤْتِ مِنْ لَدُنْهُ أَجْرًا عَظِيمًا", "surah": "سورة النساء", "ayah": 40}, {"text": "مَا يَفْعَلُ اللَّهُ بِعَذَابِكُمْ إِنْ شَكَرْتُمْ وَآمَنْتُمْ وَكَانَ اللَّهُ شَاكِرًا عَلِيمًا", "surah": "سورة النساء", "ayah": 147}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَابْتَغُوا إِلَيْهِ الْوَسِيلَةَ وَجَاهِدُوا فِي سَبِيلِهِ لَعَلَّكُمْ تُفْلِحُونَ", "surah": "سورة المائـدة", "ayah": 35}, {"text": "وَإِنْ يَمْسَسْكَ اللَّهُ بِضُرٍّ فَلَا كَاشِفَ لَهُ إِلَّا هُوَ وَإِنْ يَمْسَسْكَ بِخَيْرٍ فَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", "surah": "سورة الأنعام", "ayah": 17}, {"text": "وَمَا الْحَيَاةُ الدُّنْيَا إِلَّا لَعِبٌ وَلَهْوٌ وَلَلدَّارُ الْآخِرَةُ خَيْرٌ لِلَّذِينَ يَتَّقُونَ أَفَلَا تَعْقِلُونَ", "surah": "سورة الأنعام", "ayah": 32}, {"text": "لَا تُدْرِكُهُ الْأَبْصَارُ وَهُوَ يُدْرِكُ الْأَبْصَارَ وَهُوَ اللَّطِيفُ الْخَبِيرُ", "surah": "سورة الأنعام", "ayah": 103}, {"text": "مَنْ جَاءَ بِالْحَسَنَةِ فَلَهُ عَشْرُ أَمْثَالِهَا وَمَنْ جَاءَ بِالسَّيِّئَةِ فَلَا يُجْزَىٰ إِلَّا مِثْلَهَا وَهُمْ لَا يُظْلَمُونَ", "surah": "سورة الأنعام", "ayah": 160}, {"text": "يَا بَنِي آدَمَ خُذُوا زِينَتَكُمْ عِنْدَ كُلِّ مَسْجِدٍ وَكُلُوا وَاشْرَبُوا وَلَا تُسْرِفُوا إِنَّهُ لَا يُحِبُّ الْمُسْرِفِينَ", "surah": "سورة الأعراف", "ayah": 31}, {"text": "ادْعُوا رَبَّكُمْ تَضَرُّعًا وَخُفْيَةً إِنَّهُ لَا يُحِبُّ الْمُعْتَدِينَ", "surah": "سورة الأعراف", "ayah": 55}, {"text": "وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا وَذَرُوا الَّذِينَ يُلْحِدُونَ فِي أَسْمَائِهِ سَيُجْزَوْنَ مَا كَانُوا يَعْمَلُونَ", "surah": "سورة الأعراف", "ayah": 180}, {"text": "إِنَّ الَّذِينَ اتَّقَوْا إِذَا مَسَّهُمْ طَائِفٌ مِنَ الشَّيْطَانِ تَذَكَّرُوا فَإِذَا هُمْ مُبْصِرُونَ", "surah": "سورة الأعراف", "ayah": 201}, {"text": "وَإِذَا قُرِئَ الْقُرْآنُ فَاسْتَمِعُوا لَهُ وَأَنْصِتُوا لَعَلَّكُمْ تُرْحَمُونَ", "surah": "سورة الأعراف", "ayah": 204}, {"text": "إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ إِذَا ذُكِرَ اللَّهُ وَجِلَتْ قُلُوبُهُمْ وَإِذَا تُلِيَتْ عَلَيْهِمْ آيَاتُهُ زَادَتْهُمْ إِيمَانًا وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ", "surah": "سورة الأنفال", "ayah": 2}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا إِنْ تَتَّقُوا اللَّهَ يَجْعَلْ لَكُمْ فُرْقَانًا وَيُكَفِّرْ عَنْكُمْ سَيِّئَاتِكُمْ وَيَغْفِرْ لَكُمْ وَاللَّهُ ذُو الْفَضْلِ الْعَظِيمِ", "surah": "سورة الأنفال", "ayah": 29}, {"text": "وَقُلِ اعْمَلُوا فَسَيَرَى اللَّهُ عَمَلَكُمْ وَرَسُولُهُ وَالْمُؤْمِنُونَ وَسَتُرَدُّونَ إِلَىٰ عَالِمِ الْغَيْبِ وَالشَّهَادَةِ فَيُنَبِّئُكُمْ بِمَا كُنْتُمْ تَعْمَلُونَ", "surah": "سورة التوبة", "ayah": 105}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَكُونُوا مَعَ الصَّادِقِينَ", "surah": "سورة التوبة", "ayah": 119}, {"text": "لَقَدْ جَاءَكُمْ رَسُولٌ مِنْ أَنْفُسِكُمْ عَزِيزٌ عَلَيْهِ مَا عَنِتُّمْ حَرِيصٌ عَلَيْكُمْ بِالْمُؤْمِنِينَ رَءُوفٌ رَحِيمٌ", "surah": "سورة التوبة", "ayah": 128}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ يَهْدِيهِمْ رَبُّهُمْ بِإِيمَانِهِمْ تَجْرِي مِنْ تَحْتِهِمُ الْأَنْهَارُ فِي جَنَّاتِ النَّعِيمِ", "surah": "سورة يونس", "ayah": 9}, {"text": "إِنَّ اللَّهَ لَا يَظْلِمُ النَّاسَ شَيْئًا وَلَٰكِنَّ النَّاسَ أَنْفُسَهُمْ يَظْلِمُونَ", "surah": "سورة يونس", "ayah": 44}, {"text": "يَا أَيُّهَا النَّاسُ قَدْ جَاءَتْكُمْ مَوْعِظَةٌ مِنْ رَبِّكُمْ وَشِفَاءٌ لِمَا فِي الصُّدُورِ وَهُدًى وَرَحْمَةٌ لِلْمُؤْمِنِينَ", "surah": "سورة يونس", "ayah": 57}, {"text": "قُلْ بِفَضْلِ اللَّهِ وَبِرَحْمَتِهِ فَبِذَٰلِكَ فَلْيَفْرَحُوا هُوَ خَيْرٌ مِمَّا يَجْمَعُونَ", "surah": "سورة يونس", "ayah": 58}, {"text": "وَاسْتَغْفِرُوا رَبَّكُمْ ثُمَّ تُوبُوا إِلَيْهِ إِنَّ رَبِّي رَحِيمٌ وَدُودٌ", "surah": "سورة هود", "ayah": 90}, {"text": "وَمَا أُبَرِّئُ نَفْسِي إِنَّ النَّفْسَ لَأَمَّارَةٌ بِالسُّوءِ إِلَّا مَا رَحِمَ رَبِّي إِنَّ رَبِّي غَفُورٌ رَحِيمٌ", "surah": "سورة يوسف", "ayah": 53}, {"text": "قَالَ لَا تَثْرِيبَ عَلَيْكُمُ الْيَوْمَ يَغْفِرُ اللَّهُ لَكُمْ وَهُوَ أَرْحَمُ الرَّاحِمِينَ", "surah": "سورة يوسف", "ayah": 92}, {"text": "الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ طُوبَىٰ لَهُمْ وَحُسْنُ مَآبٍ", "surah": "سورة الرعد", "ayah": 29}, {"text": "يَمْحُو اللَّهُ مَا يَشَاءُ وَيُثْبِتُ وَعِنْدَهُ أُمُّ الْكِتَابِ", "surah": "سورة الرعد", "ayah": 39}, {"text": "أَلَمْ تَرَ كَيْفَ ضَرَبَ اللَّهُ مَثَلًا كَلِمَةً طَيِّبَةً كَشَجَرَةٍ طَيِّبَةٍ أَصْلُهَا ثَابِتٌ وَفَرْعُهَا فِي السَّمَاءِ", "surah": "سورة إبراهيم", "ayah": 24}, {"text": "وَآتَاكُمْ مِنْ كُلِّ مَا سَأَلْتُمُوهُ وَإِنْ تَعُدُّوا نِعْمَتَ اللَّهِ لَا تُحْصُوهَا إِنَّ الْإِنْسَانَ لَظَلُومٌ كَفَّارٌ", "surah": "سورة إبراهيم", "ayah": 34}, {"text": "هَٰذَا بَلَاغٌ لِلنَّاسِ وَلِيُنْذَرُوا بِهِ وَلِيَعْلَمُوا أَنَّمَا هُوَ إِلَٰهٌ وَاحِدٌ وَلِيَذَّكَّرَ أُولُو الْأَلْبَابِ", "surah": "سورة إبراهيم", "ayah": 52}, {"text": "إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ", "surah": "سورة الحجر", "ayah": 9}, {"text": "وَاعْبُدْ رَبَّكَ حَتَّىٰ يَأْتِيَكَ الْيَقِينُ", "surah": "سورة الحجر", "ayah": 99}, {"text": "وَمَا بِكُمْ مِنْ نِعْمَةٍ فَمِنَ اللَّهِ ثُمَّ إِذَا مَسَّكُمُ الضُّرُّ فَإِلَيْهِ تَجْأَرُونَ", "surah": "سورة النحل", "ayah": 53}, {"text": "مَا عِنْدَكُمْ يَنْفَدُ وَمَا عِنْدَ اللَّهِ بَاقٍ وَلَنَجْزِيَنَّ الَّذِينَ صَبَرُوا أَجْرَهُمْ بِأَحْسَنِ مَا كَانُوا يَعْمَلُونَ", "surah": "سورة النحل", "ayah": 96}, {"text": "فَكُلُوا مِمَّا رَزَقَكُمُ اللَّهُ حَلَالًا طَيِّبًا وَاشْكُرُوا نِعْمَتَ اللَّهِ إِنْ كُنْتُمْ إِيَّاهُ تَعْبُدُونَ", "surah": "سورة النحل", "ayah": 114}, {"text": "ادْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ وَجَادِلْهُمْ بِالَّتِي هِيَ أَحْسَنُ إِنَّ رَبَّكَ هُوَ أَعْلَمُ بِمَنْ ضَلَّ عَنْ سَبِيلِهِ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَ", "surah": "سورة النحل", "ayah": 125}, {"text": "وَاصْبِرْ وَمَا صَبْرُكَ إِلَّا بِاللَّهِ وَلَا تَحْزَنْ عَلَيْهِمْ وَلَا تَكُ فِي ضَيْقٍ مِمَّا يَمْكُرُونَ", "surah": "سورة النحل", "ayah": 127}, {"text": "إِنَّ هَٰذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ وَيُبَشِّرُ الْمُؤْمِنِينَ الَّذِينَ يَعْمَلُونَ الصَّالِحَاتِ أَنَّ لَهُمْ أَجْرًا كَبِيرًا", "surah": "سورة الإسراء", "ayah": 9}, {"text": "وَمَنْ أَرَادَ الْآخِرَةَ وَسَعَىٰ لَهَا سَعْيَهَا وَهُوَ مُؤْمِنٌ فَأُولَٰئِكَ كَانَ سَعْيُهُمْ مَشْكُورًا", "surah": "سورة الإسراء", "ayah": 19}, {"text": "وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ إِنَّ السَّمْعَ وَالْبَصَرَ وَالْفُؤَادَ كُلُّ أُولَٰئِكَ كَانَ عَنْهُ مَسْئُولًا", "surah": "سورة الإسراء", "ayah": 36}, {"text": "وَلَا تَمْشِ فِي الْأَرْضِ مَرَحًا إِنَّكَ لَنْ تَخْرِقَ الْأَرْضَ وَلَنْ تَبْلُغَ الْجِبَالَ طُولًا", "surah": "سورة الإسراء", "ayah": 37}, {"text": "وَقُلْ لِعِبَادِي يَقُولُوا الَّتِي هِيَ أَحْسَنُ إِنَّ الشَّيْطَانَ يَنْزَغُ بَيْنَهُمْ إِنَّ الشَّيْطَانَ كَانَ لِلْإِنْسَانِ عَدُوًّا مُبِينًا", "surah": "سورة الإسراء", "ayah": 53}, {"text": "وَلَقَدْ كَرَّمْنَا بَنِي آدَمَ وَحَمَلْنَاهُمْ فِي الْبَرِّ وَالْبَحْرِ وَرَزَقْنَاهُمْ مِنَ الطَّيِّبَاتِ وَفَضَّلْنَاهُمْ عَلَىٰ كَثِيرٍ مِمَّنْ خَلَقْنَا تَفْضِيلًا", "surah": "سورة الإسراء", "ayah": 70}, {"text": "قُلْ كُلٌّ يَعْمَلُ عَلَىٰ شَاكِلَتِهِ فَرَبُّكُمْ أَعْلَمُ بِمَنْ هُوَ أَهْدَىٰ سَبِيلًا", "surah": "سورة الإسراء", "ayah": 84}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ إِنَّا لَا نُضِيعُ أَجْرَ مَنْ أَحْسَنَ عَمَلًا", "surah": "سورة الكهف", "ayah": 30}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ كَانَتْ لَهُمْ جَنَّاتُ الْفِرْدَوْسِ نُزُلًا", "surah": "سورة الكهف", "ayah": 107}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ سَيَجْعَلُ لَهُمُ الرَّحْمَٰنُ وُدًّا", "surah": "سورة مريم", "ayah": 96}, {"text": "مَا أَنْزَلْنَا عَلَيْكَ الْقُرْآنَ لِتَشْقَىٰ", "surah": "سورة طه", "ayah": 2}, {"text": "إِنَّنِي أَنَا اللَّهُ لَا إِلَٰهَ إِلَّا أَنَا فَاعْبُدْنِي وَأَقِمِ الصَّلَاةَ لِذِكْرِي", "surah": "سورة طه", "ayah": 14}, {"text": "وَإِنِّي لَغَفَّارٌ لِمَنْ تَابَ وَآمَنَ وَعَمِلَ صَالِحًا ثُمَّ اهْتَدَىٰ", "surah": "سورة طه", "ayah": 82}, {"text": "كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ وَنَبْلُوكُمْ بِالشَّرِّ وَالْخَيْرِ فِتْنَةً وَإِلَيْنَا تُرْجَعُونَ", "surah": "سورة الأنبياء", "ayah": 35}, {"text": "وَمَا أَرْسَلْنَاكَ إِلَّا رَحْمَةً لِلْعَالَمِينَ", "surah": "سورة الأنبياء", "ayah": 107}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا ارْكَعُوا وَاسْجُدُوا وَاعْبُدُوا رَبَّكُمْ وَافْعَلُوا الْخَيْرَ لَعَلَّكُمْ تُفْلِحُونَ", "surah": "سورة الحج", "ayah": 77}, {"text": "قَدْ أَفْلَحَ الْمُؤْمِنُونَ", "surah": "سورة المؤمنون", "ayah": 1}, {"text": "الَّذِينَ هُمْ فِي صَلَاتِهِمْ خَاشِعُونَ", "surah": "سورة المؤمنون", "ayah": 2}, {"text": "وَالَّذِينَ هُمْ عَنِ اللَّغْوِ مُعْرِضُونَ", "surah": "سورة المؤمنون", "ayah": 3}, {"text": "أَفَحَسِبْتُمْ أَنَّمَا خَلَقْنَاكُمْ عَبَثًا وَأَنَّكُمْ إِلَيْنَا لَا تُرْجَعُونَ", "surah": "سورة المؤمنون", "ayah": 115}, {"text": "وَمَنْ يُطِعِ اللَّهَ وَرَسُولَهُ وَيَخْشَ اللَّهَ وَيَتَّقْهِ فَأُولَٰئِكَ هُمُ الْفَائِزُونَ", "surah": "سورة النور", "ayah": 52}, {"text": "وَالَّذِينَ لَا يَشْهَدُونَ الزُّورَ وَإِذَا مَرُّوا بِاللَّغْوِ مَرُّوا كِرَامًا", "surah": "سورة الفرقان", "ayah": 72}, {"text": "أُولَٰئِكَ يُجْزَوْنَ الْغُرْفَةَ بِمَا صَبَرُوا وَيُلَقَّوْنَ فِيهَا تَحِيَّةً وَسَلَامًا", "surah": "سورة الفرقان", "ayah": 75}, {"text": "الَّذِي خَلَقَنِي فَهُوَ يَهْدِينِ", "surah": "سورة الشعراء", "ayah": 78}, {"text": "وَالَّذِي هُوَ يُطْعِمُنِي وَيَسْقِينِ", "surah": "سورة الشعراء", "ayah": 79}, {"text": "وَالَّذِي أَطْمَعُ أَنْ يَغْفِرَ لِي خَطِيئَتِي يَوْمَ الدِّينِ", "surah": "سورة الشعراء", "ayah": 82}, {"text": "يَوْمَ لَا يَنْفَعُ مَالٌ وَلَا بَنُونَ", "surah": "سورة الشعراء", "ayah": 88}, {"text": "وَتَوَكَّلْ عَلَى الْعَزِيزِ الرَّحِيمِ", "surah": "سورة الشعراء", "ayah": 217}, {"text": "إِنَّكَ لَا تَهْدِي مَنْ أَحْبَبْتَ وَلَٰكِنَّ اللَّهَ يَهْدِي مَنْ يَشَاءُ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَ", "surah": "سورة القصص", "ayah": 56}, {"text": "وَمَا أُوتِيتُمْ مِنْ شَيْءٍ فَمَتَاعُ الْحَيَاةِ الدُّنْيَا وَزِينَتُهَا وَمَا عِنْدَ اللَّهِ خَيْرٌ وَأَبْقَىٰ أَفَلَا تَعْقِلُونَ", "surah": "سورة القصص", "ayah": 60}, {"text": "تِلْكَ الدَّارُ الْآخِرَةُ نَجْعَلُهَا لِلَّذِينَ لَا يُرِيدُونَ عُلُوًّا فِي الْأَرْضِ وَلَا فَسَادًا وَالْعَاقِبَةُ لِلْمُتَّقِينَ", "surah": "سورة القصص", "ayah": 83}, {"text": "أَحَسِبَ النَّاسُ أَنْ يُتْرَكُوا أَنْ يَقُولُوا آمَنَّا وَهُمْ لَا يُفْتَنُونَ", "surah": "سورة العنكبوت", "ayah": 2}, {"text": "وَمَنْ جَاهَدَ فَإِنَّمَا يُجَاهِدُ لِنَفْسِهِ إِنَّ اللَّهَ لَغَنِيٌّ عَن ": "سورة الصافات", "ayah": 181}, {"text": "وَالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ", "surah": "سورة الصافات", "ayah": 182}, {"text": "الَّذِينَ يَسْتَمِعُونَ الْقَوْلَ فَيَتَّبِعُونَ أَحْسَنَهُ أُولَٰئِكَ الَّذِينَ هَدَاهُمُ اللَّهُ وَأُولَٰئِكَ هُمْ أُولُو الْأَلْبَابِ", "surah": "سورة الزمر", "ayah": 18}, {"text": "وَأَنِيبُوا إِلَىٰ رَبِّكُمْ وَأَسْلِمُوا لَهُ مِنْ قَبْلِ أَنْ يَأْتِيَكُمُ الْعَذَابُ ثُمَّ لَا تُنْصَرُونَ", "surah": "سورة الزمر", "ayah": 54}, {"text": "يَا قَوْمِ إِنَّمَا هَٰذِهِ الْحَيَاةُ الدُّنْيَا مَتَاعٌ وَإِنَّ الْآخِرَةَ هِيَ دَارُ الْقَرَارِ", "surah": "سورة غافر", "ayah": 39}, {"text": "هُوَ الْحَيُّ لَا إِلَٰهَ إِلَّا هُوَ فَادْعُوهُ مُخْلِصِينَ لَهُ الدِّينَ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ", "surah": "سورة غافر", "ayah": 65}, {"text": "إِنَّ الَّذِينَ قَالُوا رَبُّنَا اللَّهُ ثُمَّ اسْتَقَامُوا تَتَنَزَّلُ عَلَيْهِمُ الْمَلَائِكَةُ أَلَّا تَخَافُوا وَلَا تَحْزَنُوا وَأَبْشِرُوا بِالْجَنَّةِ الَّتِي كُنْتُمْ تُوعَدُونَ", "surah": "سورة فصلت", "ayah": 30}, {"text": "وَمَنْ أَحْسَنُ قَوْلًا مِمَّنْ دَعَا إِلَى اللَّهِ وَعَمِلَ صَالِحًا وَقَالَ إِنَّنِي مِنَ الْمُسْلِمِينَ", "surah": "سورة فصلت", "ayah": 33}, {"text": "مَنْ عَمِلَ صَالِحًا فَلِنَفْسِهِ وَمَنْ أَسَاءَ فَعَلَيْهَا وَمَا رَبُّكَ بِظَلَّامٍ لِلْعَبِيدِ", "surah": "سورة فصلت", "ayah": 46}, {"text": "فَاطِرُ السَّمَاوَاتِ وَالْأَرْضِ جَعَلَ لَكُمْ مِنْ أَنْفُسِكُمْ أَزْوَاجًا وَمِنَ الْأَنْعَامِ أَزْوَاجًا يَذْرَؤُكُمْ فِيهِ لَيْسَ كَمِثْلِهِ شَيْءٌ وَهُوَ السَّمِيعُ الْبَصِيرُ", "surah": "سورة الشورى", "ayah": 11}, {"text": "وَهُوَ الَّذِي يَقْبَلُ التَّوْبَةَ عَنْ عِبَادِهِ وَيَعْفُو عَنِ السَّيِّئَاتِ وَيَعْلَمُ مَا تَفْعَلُونَ", "surah": "سورة الشورى", "ayah": 25}, {"text": "وَمَا أَصَابَكُمْ مِنْ مُصِيبَةٍ فَبِمَا كَسَبَتْ أَيْدِيكُمْ وَيَعْفُو عَنْ كَثِيرٍ", "surah": "سورة الشورى", "ayah": 30}, {"text": "فَمَا أُوتِيتُمْ مِنْ شَيْءٍ فَمَتَاعُ الْحَيَاةِ الدُّنْيَا وَمَا عِنْدَ اللَّهِ خَيْرٌ وَأَبْقَىٰ لِلَّذِينَ آمَنُوا وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ", "surah": " "],[7505,"عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:"],[7553,"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:"],[7563,"عن أبي هريرة رضي الله عنه قال: قال النبي ﷺ:"]],"fallback":[{"n":9,"head":"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ، قَالَ حَدَّثَنَا أَبُو عَامِرٍ الْعَقَدِيُّ، قَالَ حَدَّثَنَا سُلَيْمَانُ بْنُ بِلاَلٍ، عَنْ عَبْدِ اللَّهِ بْنِ دِينَارٍ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ الإِيمَانُ بِضْعٌ وَسِتُّونَ شُعْبَةً، وَالْحَيَاءُ شُعْبَةٌ مِنَ الإِيمَانِ ‏\"‏‏.‏"},{"n":39,"head":"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا عَبْدُ السَّلاَمِ بْنُ مُطَهَّرٍ، قَالَ حَدَّثَنَا عُمَرُ بْنُ عَلِيٍّ، عَنْ مَعْنِ بْنِ مُحَمَّدٍ الْغِفَارِيِّ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ الْمَقْبُرِيِّ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ إِنَّ الدِّينَ يُسْرٌ، وَلَنْ يُشَادَّ الدِّينَ أَحَدٌ إِلاَّ غَلَبَهُ، فَسَدِّدُوا وَقَارِبُوا وَأَبْشِرُوا، وَاسْتَعِينُوا بِالْغَدْوَةِ وَالرَّوْحَةِ وَشَىْءٍ مِنَ الدُّلْجَةِ ‏\"‏‏.‏"},{"n":54,"head":"عن عمر رضي الله عنه أن رسول الله ﷺ قال:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، قَالَ أَخْبَرَنَا مَالِكٌ، عَنْ يَحْيَى بْنِ سَعِيدٍ، عَنْ مُحَمَّدِ بْنِ إِبْرَاهِيمَ، عَنْ عَلْقَمَةَ بْنِ وَقَّاصٍ، عَنْ عُمَرَ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ الأَعْمَالُ بِالنِّيَّةِ، وَلِكُلِّ امْرِئٍ مَا نَوَى، فَمَنْ كَانَتْ هِجْرَتُهُ إِلَى اللَّهِ وَرَسُولِهِ، فَهِجْرَتُهُ إِلَى اللَّهِ وَرَسُولِهِ، وَمَنْ كَانَتْ هِجْرَتُهُ لِدُنْيَا يُصِيبُهَا، أَوِ امْرَأَةٍ يَتَزَوَّجُهَا، فَهِجْرَتُهُ إِلَى مَا هَاجَرَ إِلَيْهِ ‏\"‏‏.‏"},{"n":212,"head":"عن عائشة رضي الله عنها أن رسول الله ﷺ قال:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، قَالَ أَخْبَرَنَا مَالِكٌ، عَنْ هِشَامٍ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ إِذَا نَعَسَ أَحَدُكُمْ وَهُوَ يُصَلِّي فَلْيَرْقُدْ حَتَّى يَذْهَبَ عَنْهُ النَّوْمُ، فَإِنَّ أَحَدَكُمْ إِذَا صَلَّى وَهُوَ نَاعِسٌ لاَ يَدْرِي لَعَلَّهُ يَسْتَغْفِرُ فَيَسُبَّ نَفْسَهُ ‏\"‏‏.‏"},{"n":392,"head":"عن أنس بن مالك رضي الله عنه قال: قال رسول الله ﷺ:","text":"حَدَّثَنَا نُعَيْمٌ، قَالَ حَدَّثَنَا ابْنُ الْمُبَارَكِ، عَنْ حُمَيْدٍ الطَّوِيلِ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ أُمِرْتُ أَنْ أُقَاتِلَ النَّاسَ حَتَّى يَقُولُوا لاَ إِلَهَ إِلاَّ اللَّهُ‏.‏ فَإِذَا قَالُوهَا وَصَلَّوْا صَلاَتَنَا، وَاسْتَقْبَلُوا قِبْلَتَنَا، وَذَبَحُوا ذَبِيحَتَنَا، فَقَدْ حَرُمَتْ عَلَيْنَا دِمَاؤُهُمْ وَأَمْوَالُهُمْ إِلاَّ بِحَقِّهَا، وَحِسَابُهُمْ عَلَى اللَّهِ ‏\"‏‏.‏"},{"n":415,"head":"عن أنس بن مالك رضي الله عنه قال: قال النبي ﷺ:","text":"حَدَّثَنَا آدَمُ، قَالَ حَدَّثَنَا شُعْبَةُ، قَالَ حَدَّثَنَا قَتَادَةُ، قَالَ سَمِعْتُ أَنَسَ بْنَ مَالِكٍ، قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ الْبُزَاقُ فِي الْمَسْجِدِ خَطِيئَةٌ، وَكَفَّارَتُهَا دَفْنُهَا ‏\"‏‏.‏"},{"n":585,"head":"عن ابن عمر رضي الله عنهما أن رسول الله ﷺ قال:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، قَالَ أَخْبَرَنَا مَالِكٌ، عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ لاَ يَتَحَرَّى أَحَدُكُمْ فَيُصَلِّي عِنْدَ طُلُوعِ الشَّمْسِ وَلاَ عِنْدَ غُرُوبِهَا ‏\"‏‏.‏"},{"n":691,"head":"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا حَجَّاجُ بْنُ مِنْهَالٍ، قَالَ حَدَّثَنَا شُعْبَةُ، عَنْ مُحَمَّدِ بْنِ زِيَادٍ، سَمِعْتُ أَبَا هُرَيْرَةَ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ أَمَا يَخْشَى أَحَدُكُمْ ـ أَوْ لاَ يَخْشَى أَحَدُكُمْ ـ إِذَا رَفَعَ رَأْسَهُ قَبْلَ الإِمَامِ أَنْ يَجْعَلَ اللَّهُ رَأْسَهُ رَأْسَ حِمَارٍ أَوْ يَجْعَلَ اللَّهُ صُورَتَهُ صُورَةَ حِمَارٍ ‏\"‏‏.‏"},{"n":734,"head":"عن أبي هريرة رضي الله عنه قال: قال النبي ﷺ:","text":"حَدَّثَنَا أَبُو الْيَمَانِ، قَالَ أَخْبَرَنَا شُعَيْبٌ، قَالَ حَدَّثَنِي أَبُو الزِّنَادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ إِنَّمَا جُعِلَ الإِمَامُ لِيُؤْتَمَّ بِهِ، فَإِذَا كَبَّرَ فَكَبِّرُوا، وَإِذَا رَكَعَ فَارْكَعُوا، وَإِذَا قَالَ سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ‏.‏ فَقُولُوا رَبَّنَا وَلَكَ الْحَمْدُ‏.‏ وَإِذَا سَجَدَ فَاسْجُدُوا، وَإِذَا صَلَّى جَالِسًا فَصَلُّوا جُلُوسًا أَجْمَعُونَ ‏\"‏‏.‏"},{"n":781,"head":"عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، أَخْبَرَنَا مَالِكٌ، عَنْ أَبِي الزِّنَادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ إِذَا قَالَ أَحَدُكُمْ آمِينَ‏.‏ وَقَالَتِ الْمَلاَئِكَةُ فِي السَّمَاءِ آمِينَ‏.‏ فَوَافَقَتْ إِحْدَاهُمَا الأُخْرَى، غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ ‏\"‏‏.‏"},{"n":1035,"head":"عن ابن عباس رضي الله عنهما أن النبي ﷺ قال:","text":"حَدَّثَنَا مُسْلِمٌ، قَالَ حَدَّثَنَا شُعْبَةُ، عَنِ الْحَكَمِ، عَنْ مُجَاهِدٍ، عَنِ ابْنِ عَبَّاسٍ، أَنَّ النَّبِيَّ صلى الله عليه وسلم قَالَ ‏ \"‏ نُصِرْتُ بِالصَّبَا، وَأُهْلِكَتْ عَادٌ بِالدَّبُورِ ‏\"‏‏.‏"},{"n":1214,"head":"عن أنس رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا مُحَمَّدٌ، حَدَّثَنَا غُنْدَرٌ، حَدَّثَنَا شُعْبَةُ، قَالَ سَمِعْتُ قَتَادَةَ، عَنْ أَنَسٍ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ إِذَا كَانَ فِي الصَّلاَةِ فَإِنَّهُ يُنَاجِي رَبَّهُ، فَلاَ يَبْزُقَنَّ بَيْنَ يَدَيْهِ وَلاَ عَنْ يَمِينِهِ، وَلَكِنْ عَنْ شِمَالِهِ تَحْتَ قَدَمِهِ الْيُسْرَى ‏\"‏‏.‏"},{"n":1412,"head":"عن أبي هريرة رضي الله عنه قال: قال النبي ﷺ:","text":"حَدَّثَنَا أَبُو الْيَمَانِ، أَخْبَرَنَا شُعَيْبٌ، حَدَّثَنَا أَبُو الزِّنَادِ، عَنْ عَبْدِ الرَّحْمَنِ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ لاَ تَقُومُ السَّاعَةُ حَتَّى يَكْثُرَ فِيكُمُ الْمَالُ فَيَفِيضَ، حَتَّى يُهِمَّ رَبَّ الْمَالِ مَنْ يَقْبَلُ صَدَقَتَهُ، وَحَتَّى يَعْرِضَهُ فَيَقُولَ الَّذِي يَعْرِضُهُ عَلَيْهِ لاَ أَرَبَ لِي ‏\"‏‏.‏"},{"n":1476,"head":"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا حَجَّاجُ بْنُ مِنْهَالٍ، حَدَّثَنَا شُعْبَةُ، أَخْبَرَنِي مُحَمَّدُ بْنُ زِيَادٍ، قَالَ سَمِعْتُ أَبَا هُرَيْرَةَ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ لَيْسَ الْمِسْكِينُ الَّذِي تَرُدُّهُ الأُكْلَةُ وَالأُكْلَتَانِ، وَلَكِنِ الْمِسْكِينُ الَّذِي لَيْسَ لَهُ غِنًى وَيَسْتَحْيِي أَوْ لاَ يَسْأَلُ النَّاسَ إِلْحَافًا ‏\"‏‏.‏"},{"n":1871,"head":"عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، أَخْبَرَنَا مَالِكٌ، عَنْ يَحْيَى بْنِ سَعِيدٍ، قَالَ سَمِعْتُ أَبَا الْحُبَابِ، سَعِيدَ بْنَ يَسَارٍ يَقُولُ سَمِعْتُ أَبَا هُرَيْرَةَ ـ رضى الله عنه ـ يَقُولُ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم‏.‏ ‏ \"‏ أُمِرْتُ بِقَرْيَةٍ تَأْكُلُ الْقُرَى يَقُولُونَ يَثْرِبُ‏.‏ وَهْىَ الْمَدِينَةُ، تَنْفِي النَّاسَ كَمَا يَنْفِي الْكِيرُ خَبَثَ الْحَدِيدِ ‏\"‏‏.‏"},{"n":1923,"head":"عن أنس بن مالك رضي الله عنه قال: قال النبي ﷺ:","text":"حَدَّثَنَا آدَمُ بْنُ أَبِي إِيَاسٍ، حَدَّثَنَا شُعْبَةُ، حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ صُهَيْبٍ، قَالَ سَمِعْتُ أَنَسَ بْنَ مَالِكٍ ـ رضى الله عنه ـ قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ تَسَحَّرُوا فَإِنَّ فِي السَّحُورِ بَرَكَةً ‏\"‏‏.‏"},{"n":2110,"head":"عن حكيم بن حزام رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنِي إِسْحَاقُ، أَخْبَرَنَا حَبَّانُ، حَدَّثَنَا شُعْبَةُ، قَالَ قَتَادَةُ أَخْبَرَنِي عَنْ صَالِحٍ أَبِي الْخَلِيلِ، عَنْ عَبْدِ اللَّهِ بْنِ الْحَارِثِ، قَالَ سَمِعْتُ حَكِيمَ بْنَ حِزَامٍ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ الْبَيِّعَانِ بِالْخِيَارِ مَا لَمْ يَتَفَرَّقَا، فَإِنْ صَدَقَا وَبَيَّنَا بُورِكَ لَهُمَا فِي بَيْعِهِمَا، وَإِنْ كَذَبَا وَكَتَمَا مُحِقَتْ بَرَكَةُ بَيْعِهِمَا ‏\"‏‏.‏"},{"n":2234,"head":"عن أبي هريرة رضي الله عنه قال: سمعت النبي ﷺ يقول:","text":"حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ عَبْدِ اللَّهِ، قَالَ أَخْبَرَنِي اللَّيْثُ، عَنْ سَعِيدٍ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ سَمِعْتُ النَّبِيَّ صلى الله عليه وسلم يَقُولُ ‏ \"‏ إِذَا زَنَتْ أَمَةُ أَحَدِكُمْ، فَتَبَيَّنَ زِنَاهَا فَلْيَجْلِدْهَا الْحَدَّ، وَلاَ يُثَرِّبْ عَلَيْهَا، ثُمَّ إِنْ زَنَتْ فَلْيَجْلِدْهَا الْحَدَّ وَلاَ يُثَرِّبْ، ثُمَّ إِنْ زَنَتِ الثَّالِثَةَ فَتَبَيَّنَ زِنَاهَا فَلْيَبِعْهَا وَلَوْ بِحَبْلٍ مِنْ شَعَرٍ ‏\"‏‏.‏"},{"n":2354,"head":"عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:","text":"حَدَّثَنَا يَحْيَى بْنُ بُكَيْرٍ، حَدَّثَنَا اللَّيْثُ، عَنْ عُقَيْلٍ، عَنِ ابْنِ شِهَابٍ، عَنِ ابْنِ الْمُسَيَّبِ، وَأَبِي، سَلَمَةَ عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ لاَ تَمْنَعُوا فَضْلَ الْمَاءِ لِتَمْنَعُوا بِهِ فَضْلَ الْكَلإِ ‏\"‏‏.‏"},{"n":2486,"head":"عن أبي موسى رضي الله عنه قال: قال النبي ﷺ:","text":"حَدَّثَنَا مُحَمَّدُ بْنُ الْعَلاَءِ، حَدَّثَنَا حَمَّادُ بْنُ أُسَامَةَ، عَنْ بُرَيْدٍ، عَنْ أَبِي بُرْدَةَ، عَنْ أَبِي مُوسَى، قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ إِنَّ الأَشْعَرِيِّينَ إِذَا أَرْمَلُوا فِي الْغَزْوِ، أَوْ قَلَّ طَعَامُ عِيَالِهِمْ بِالْمَدِينَةِ جَمَعُوا مَا كَانَ عِنْدَهُمْ فِي ثَوْبٍ وَاحِدٍ، ثُمَّ اقْتَسَمُوهُ بَيْنَهُمْ فِي إِنَاءٍ وَاحِدٍ بِالسَّوِيَّةِ، فَهُمْ مِنِّي وَأَنَا مِنْهُمْ ‏\"‏‏.‏"},{"n":2529,"head":"عن عمر بن الخطاب رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا مُحَمَّدُ بْنُ كَثِيرٍ، عَنْ سُفْيَانَ، حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، عَنْ مُحَمَّدِ بْنِ إِبْرَاهِيمَ التَّيْمِيِّ، عَنْ عَلْقَمَةَ بْنِ وَقَّاصٍ اللَّيْثِيِّ، قَالَ سَمِعْتُ عُمَرَ بْنَ الْخَطَّابِ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ الأَعْمَالُ بِالنِّيَّةِ، وَلاِمْرِئٍ مَا نَوَى، فَمَنْ كَانَتْ هِجْرَتُهُ إِلَى اللَّهِ وَرَسُولِهِ، فَهِجْرَتُهُ إِلَى اللَّهِ وَرَسُولِهِ، وَمَنْ كَانَتْ هِجْرَتُهُ لِدُنْيَا يُصِيبُهَا، أَوِ امْرَأَةٍ يَتَزَوَّجُهَا، فَهِجْرَتُهُ إِلَى مَا هَاجَرَ إِلَيْهِ ‏\"‏‏.‏"},{"n":2566,"head":"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا عَاصِمُ بْنُ عَلِيٍّ، حَدَّثَنَا ابْنُ أَبِي ذِئْبٍ، عَنِ الْمَقْبُرِيِّ، ‏{‏عَنْ أَبِيهِ،‏}‏ عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ يَا نِسَاءَ الْمُسْلِمَاتِ لاَ تَحْقِرَنَّ جَارَةٌ لِجَارَتِهَا، وَلَوْ فِرْسِنَ شَاةٍ ‏\"‏‏.‏"},{"n":2776,"head":"عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، أَخْبَرَنَا مَالِكٌ، عَنْ أَبِي الزِّنَادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ لاَ يَقْتَسِمْ وَرَثَتِي دِينَارًا، مَا تَرَكْتُ بَعْدَ نَفَقَةِ نِسَائِي وَمَئُونَةِ عَامِلِي فَهْوَ صَدَقَةٌ ‏\"‏‏.‏"},{"n":2859,"head":"عن سهل بن سعد الساعدي رضي الله عنه أن رسول الله ﷺ قال:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، عَنْ مَالِكٍ، عَنْ أَبِي حَازِمِ بْنِ دِينَارٍ، عَنْ سَهْلِ بْنِ سَعْدٍ السَّاعِدِيِّ ـ رضى الله عنه ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ إِنْ كَانَ فِي شَىْءٍ فَفِي الْمَرْأَةِ وَالْفَرَسِ وَالْمَسْكَنِ ‏\"‏‏.‏"},{"n":3117,"head":"عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:","text":"حَدَّثَنَا مُحَمَّدُ بْنُ سِنَانٍ، حَدَّثَنَا فُلَيْحٌ، حَدَّثَنَا هِلاَلٌ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبِي عَمْرَةَ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ مَا أُعْطِيكُمْ وَلاَ أَمْنَعُكُمْ، أَنَا قَاسِمٌ أَضَعُ حَيْثُ أُمِرْتُ ‏\"‏‏.‏"},{"n":3222,"head":"عن أبي ذر رضي الله عنه قال: قال النبي ﷺ:","text":"حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا ابْنُ أَبِي عَدِيٍّ، عَنْ شُعْبَةَ، عَنْ حَبِيبِ بْنِ أَبِي ثَابِتٍ، عَنْ زَيْدِ بْنِ وَهْبٍ، عَنْ أَبِي ذَرٍّ ـ رضى الله عنه ـ قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ قَالَ لِي جِبْرِيلُ مَنْ مَاتَ مِنْ أُمَّتِكَ لاَ يُشْرِكُ بِاللَّهِ شَيْئًا دَخَلَ الْجَنَّةَ، أَوْ لَمْ يَدْخُلِ النَّارَ، قَالَ وَإِنْ زَنَى وَإِنْ سَرَقَ قَالَ وَإِنْ ‏\"‏‏.‏"},{"n":3223,"head":"عن أبي هريرة رضي الله عنه قال: قال النبي ﷺ:","text":"حَدَّثَنَا أَبُو الْيَمَانِ، أَخْبَرَنَا شُعَيْبٌ، حَدَّثَنَا أَبُو الزِّنَادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ الْمَلاَئِكَةُ يَتَعَاقَبُونَ، مَلاَئِكَةٌ بِاللَّيْلِ وَمَلاَئِكَةٌ بِالنَّهَارِ، وَيَجْتَمِعُونَ فِي صَلاَةِ الْفَجْرِ وَالْعَصْرِ، ثُمَّ يَعْرُجُ إِلَيْهِ الَّذِينَ بَاتُوا فِيكُمْ، فَيَسْأَلُهُمْ وَهْوَ أَعْلَمُ، فَيَقُولُ كَيْفَ تَرَكْتُمْ ‏{‏عِبَادِي‏}‏ فَيَقُولُونَ تَرَكْنَاهُمْ يُصَلُّونَ، وَأَتَيْنَاهُمْ يُصَلُّونَ ‏\"‏‏.‏"},{"n":3286,"head":"عن أبي هريرة رضي الله عنه قال: قال النبي ﷺ:","text":"حَدَّثَنَا أَبُو الْيَمَانِ، أَخْبَرَنَا شُعَيْبٌ، عَنْ أَبِي الزِّنَادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ كُلُّ بَنِي آدَمَ يَطْعُنُ الشَّيْطَانُ فِي جَنْبَيْهِ بِإِصْبَعِهِ حِينَ يُولَدُ، غَيْرَ عِيسَى بْنِ مَرْيَمَ، ذَهَبَ يَطْعُنُ فَطَعَنَ فِي الْحِجَابِ ‏\"‏‏.‏"},{"n":3357,"head":"عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ:","text":"حَدَّثَنَا سَعِيدُ بْنُ تَلِيدٍ الرُّعَيْنِيُّ، أَخْبَرَنَا ابْنُ وَهْبٍ، قَالَ أَخْبَرَنِي جَرِيرُ بْنُ حَازِمٍ، عَنْ أَيُّوبَ، عَنْ مُحَمَّدٍ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ لَمْ يَكْذِبْ إِبْرَاهِيمُ إِلاَّ ثَلاَثًا ‏\"‏‏.‏"},{"n":3444,"head":"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:","text":"وَحَدَّثَنَا عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، أَخْبَرَنَا مَعْمَرٌ، عَنْ هَمَّامٍ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ رَأَى عِيسَى ابْنُ مَرْيَمَ رَجُلاً يَسْرِقُ، فَقَالَ لَهُ أَسَرَقْتَ قَالَ كَلاَّ وَاللَّهِ الَّذِي لاَ إِلَهَ إِلاَّ هُوَ‏.‏ فَقَالَ عِيسَى آمَنْتُ بِاللَّهِ وَكَذَّبْتُ عَيْنِي ‏\"‏‏.‏"},{"n":3538,"head":"عن جابر رضي الله عنهما عن النبي ﷺ قال:","text":"حَدَّثَنَا مُحَمَّدُ بْنُ كَثِيرٍ، أَخْبَرَنَا شُعْبَةُ، عَنْ مَنْصُورٍ، عَنْ سَالِمٍ، عَنْ جَابِرٍ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ تَسَمَّوْا بِاسْمِي، وَلاَ تَكْتَنُوا بِكُنْيَتِي ‏\"‏"},{"n":3898,"head":"عن عمر رضي الله عنه قال: سمعت النبي ﷺ يقول:","text":"حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا حَمَّادٌ ـ هُوَ ابْنُ زَيْدٍ ـ عَنْ يَحْيَى، عَنْ مُحَمَّدِ بْنِ إِبْرَاهِيمَ، عَنْ عَلْقَمَةَ بْنِ وَقَّاصٍ، قَالَ سَمِعْتُ عُمَرَ ـ رضى الله عنه ـ قَالَ سَمِعْتُ النَّبِيَّ صلى الله عليه وسلم يَقُولُ ‏ \"‏ الأَعْمَالُ بِالنِّيَّةِ، فَمَنْ كَانَتْ هِجْرَتُهُ إِلَى دُنْيَا يُصِيبُهَا أَوِ امْرَأَةٍ يَتَزَوَّجُهَا، فَهِجْرَتُهُ إِلَى مَا هَاجَرَ إِلَيْهِ، وَمَنْ كَانَتْ هِجْرَتُهُ إِلَى اللَّهِ وَرَسُولِهِ، فَهِجْرَتُهُ إِلَى اللَّهِ وَرَسُولِهِ صلى الله عليه وسلم ‏\"‏‏.‏"},{"n":4479,"head":"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنِي مُحَمَّدٌ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ، عَنِ ابْنِ الْمُبَارَكِ، عَنْ مَعْمَرٍ، عَنْ هَمَّامِ بْنِ مُنَبِّهٍ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏\"‏ قِيلَ لِبَنِي إِسْرَائِيلَ ‏{‏ادْخُلُوا الْبَابَ سُجَّدًا وَقُولُوا حِطَّةٌ‏}‏ فَدَخَلُوا يَزْحَفُونَ عَلَى أَسْتَاهِهِمْ، فَبَدَّلُوا وَقَالُوا حِطَّةٌ، حَبَّةٌ فِي شَعَرَةٍ ‏\"‏‏.‏"},{"n":4662,"head":"عن أبي بكرة رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ عَبْدِ الْوَهَّابِ، حَدَّثَنَا حَمَّادُ بْنُ زَيْدٍ، عَنْ أَيُّوبَ، عَنْ مُحَمَّدٍ، عَنِ ابْنِ أَبِي بَكْرَةَ، عَنْ أَبِي بَكْرَةَ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ إِنَّ الزَّمَانَ قَدِ اسْتَدَارَ كَهَيْئَتِهِ يَوْمَ خَلَقَ اللَّهُ السَّمَوَاتِ وَالأَرْضَ، السَّنَةُ اثْنَا عَشَرَ شَهْرًا مِنْهَا، أَرْبَعَةٌ حُرُمٌ، ثَلاَثٌ مُتَوَالِيَاتٌ، ذُو الْقَعْدَةِ وَذُو الْحِجَّةِ وَالْمُحَرَّمُ وَرَجَبُ مُضَرَ الَّذِي بَيْنَ جُمَادَى وَشَعْبَانَ ‏\"‏‏.‏"},{"n":4805,"head":"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنِي إِبْرَاهِيمُ بْنُ الْمُنْذِرِ، حَدَّثَنَا مُحَمَّدُ بْنُ فُلَيْحٍ، قَالَ حَدَّثَنِي أَبِي، عَنْ هِلاَلِ بْنِ عَلِيٍّ، مِنْ بَنِي عَامِرِ بْنِ لُؤَىٍّ عَنْ عَطَاءِ بْنِ يَسَارٍ، عَنْ أَبِي هُرَيْرَةَ، رضى الله عنه عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ مَنْ قَالَ أَنَا خَيْرٌ مِنْ يُونُسَ بْنِ مَتَّى فَقَدْ كَذَبَ ‏\"‏‏.‏"},{"n":5033,"head":"عن أبي موسى رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا مُحَمَّدُ بْنُ الْعَلاَءِ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ بُرَيْدٍ، عَنْ أَبِي بُرْدَةَ، عَنْ أَبِي مُوسَى، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ تَعَاهَدُوا الْقُرْآنَ فَوَالَّذِي نَفْسِي بِيَدِهِ لَهُوَ أَشَدُّ تَفَصِّيًا مِنَ الإِبِلِ فِي عُقُلِهَا ‏\"‏‏.‏"},{"n":5178,"head":"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا عَبْدَانُ، عَنْ أَبِي حَمْزَةَ، عَنِ الأَعْمَشِ، عَنْ أَبِي حَازِمٍ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ لَوْ دُعِيتُ إِلَى كُرَاعٍ لأَجَبْتُ، وَلَوْ أُهْدِيَ إِلَىَّ ذِرَاعٌ لَقَبِلْتُ ‏\"‏‏.‏"},{"n":5356,"head":"عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:","text":"حَدَّثَنَا سَعِيدُ بْنُ عُفَيْرٍ، قَالَ حَدَّثَنِي اللَّيْثُ، قَالَ حَدَّثَنِي عَبْدُ الرَّحْمَنِ بْنُ خَالِدِ بْنِ مُسَافِرٍ، عَنِ ابْنِ شِهَابٍ، عَنِ ابْنِ الْمُسَيَّبِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ خَيْرُ الصَّدَقَةِ مَا كَانَ عَنْ ظَهْرِ غِنًى، وَابْدَأْ بِمَنْ تَعُولُ ‏\"‏‏.‏"},{"n":5482,"head":"عن عبد الله بن عمر رضي الله عنهما قال: قال رسول الله ﷺ:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، أَخْبَرَنَا مَالِكٌ، عَنْ نَافِعٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ مَنِ اقْتَنَى كَلْبًا إِلاَّ كَلْبَ مَاشِيَةٍ أَوْ ضَارٍ، نَقَصَ مِنْ عَمَلِهِ كُلَّ يَوْمٍ قِيرَاطَانِ ‏\"‏‏.‏"},{"n":5678,"head":"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا مُحَمَّدُ بْنُ الْمُثَنَّى، حَدَّثَنَا أَبُو أَحْمَدَ الزُّبَيْرِيُّ، حَدَّثَنَا عُمَرُ بْنُ سَعِيدِ بْنِ أَبِي حُسَيْنٍ، قَالَ حَدَّثَنِي عَطَاءُ بْنُ أَبِي رَبَاحٍ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ مَا أَنْزَلَ اللَّهُ دَاءً إِلاَّ أَنْزَلَ لَهُ شِفَاءً ‏\"‏‏.‏"},{"n":5764,"head":"عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:","text":"حَدَّثَنِي عَبْدُ الْعَزِيزِ بْنُ عَبْدِ اللَّهِ، قَالَ حَدَّثَنِي سُلَيْمَانُ، عَنْ ثَوْرِ بْنِ زَيْدٍ، عَنْ أَبِي الْغَيْثِ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ اجْتَنِبُوا الْمُوبِقَاتِ الشِّرْكُ بِاللَّهِ، وَالسِّحْرُ ‏\"‏‏.‏"},{"n":5985,"head":"عن أبي هريرة رضي الله عنه قال: سمعت رسول الله ﷺ يقول:","text":"حَدَّثَنِي إِبْرَاهِيمُ بْنُ الْمُنْذِرِ، حَدَّثَنَا مُحَمَّدُ بْنُ مَعْنٍ، قَالَ حَدَّثَنِي أَبِي، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ ‏ \"‏ مَنْ سَرَّهُ أَنْ يُبْسَطَ لَهُ فِي رِزْقِهِ، وَأَنْ يُنْسَأَ لَهُ فِي أَثَرِهِ، فَلْيَصِلْ رَحِمَهُ ‏\"‏‏.‏"},{"n":6066,"head":"عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، أَخْبَرَنَا مَالِكٌ، عَنْ أَبِي الزِّنَادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ إِيَّاكُمْ وَالظَّنَّ، فَإِنَّ الظَّنَّ أَكْذَبُ الْحَدِيثِ، وَلاَ تَحَسَّسُوا، وَلاَ تَجَسَّسُوا، وَلاَ تَنَاجَشُوا، وَلاَ تَحَاسَدُوا، وَلاَ تَبَاغَضُوا، وَلاَ تَدَابَرُوا، وَكُونُوا عِبَادَ اللَّهِ إِخْوَانًا ‏\"‏‏.‏"},{"n":6138,"head":"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ، حَدَّثَنَا هِشَامٌ، أَخْبَرَنَا مَعْمَرٌ، عَنِ الزُّهْرِيِّ، عَنْ أَبِي سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيُكْرِمْ ضَيْفَهُ، وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيَصِلْ رَحِمَهُ، وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ ‏\"‏‏.‏"},{"n":6234,"head":"عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ:","text":"وَقَالَ إِبْرَاهِيمُ عَنْ مُوسَى بْنِ عُقْبَةَ، عَنْ صَفْوَانَ بْنِ سُلَيْمٍ، عَنْ عَطَاءِ بْنِ يَسَارٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ يُسَلِّمُ الصَّغِيرُ عَلَى الْكَبِيرِ، وَالْمَارُّ عَلَى الْقَاعِدِ، وَالْقَلِيلُ عَلَى الْكَثِيرِ ‏\"‏‏.‏"},{"n":6351,"head":"عن أنس رضي الله عنه قال: قال رسول الله ﷺ:","text":"حَدَّثَنَا ابْنُ سَلاَمٍ، أَخْبَرَنَا إِسْمَاعِيلُ ابْنُ عُلَيَّةَ، عَنْ عَبْدِ الْعَزِيزِ بْنِ صُهَيْبٍ، عَنْ أَنَسٍ ـ رضى الله عنه ـ قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ لاَ يَتَمَنَّيَنَّ أَحَدٌ مِنْكُمُ الْمَوْتَ لِضُرٍّ نَزَلَ بِهِ، فَإِنْ كَانَ لاَ بُدَّ مُتَمَنِّيًا لِلْمَوْتِ فَلْيَقُلِ اللَّهُمَّ أَحْيِنِي مَا كَانَتِ الْحَيَاةُ خَيْرًا لِي، وَتَوَفَّنِي إِذَا كَانَتِ الْوَفَاةُ خَيْرًا لِي ‏\"‏‏.‏"},{"n":6460,"head":"عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ، حَدَّثَنَا مُحَمَّدُ بْنُ فُضَيْلٍ، عَنْ أَبِيهِ، عَنْ عُمَارَةَ، عَنْ أَبِي زُرْعَةَ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ اللَّهُمَّ ارْزُقْ آلَ مُحَمَّدٍ قُوتًا ‏\"‏‏.‏"},{"n":6482,"head":"عن أبي موسى رضي الله عنه قال: قال رسول الله ﷺ:","text":"حَدَّثَنَا مُحَمَّدُ بْنُ الْعَلاَءِ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ بُرَيْدِ بْنِ عَبْدِ اللَّهِ بْنِ أَبِي بُرْدَةَ، عَنْ أَبِي بُرْدَةَ، عَنْ أَبِي مُوسَى، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ مَثَلِي وَمَثَلُ مَا بَعَثَنِي اللَّهُ كَمَثَلِ رَجُلٍ أَتَى قَوْمًا فَقَالَ رَأَيْتُ الْجَيْشَ بِعَيْنَىَّ، وَإِنِّي أَنَا النَّذِيرُ الْعُرْيَانُ فَالنَّجَا النَّجَاءَ‏.‏ فَأَطَاعَتْهُ طَائِفَةٌ فَأَدْلَجُوا عَلَى مَهْلِهِمْ فَنَجَوْا، وَكَذَّبَتْهُ طَائِفَةٌ فَصَبَّحَهُمُ الْجَيْشُ فَاجْتَاحَهُمْ ‏\"‏‏.‏"},{"n":6489,"head":"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنِي مُحَمَّدُ بْنُ الْمُثَنَّى، حَدَّثَنَا غُنْدَرٌ، حَدَّثَنَا شُعْبَةُ، عَنْ عَبْدِ الْمَلِكِ بْنِ عُمَيْرٍ، عَنْ أَبِي سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ أَصْدَقُ بَيْتٍ قَالَهُ الشَّاعِرُ أَلاَ كُلُّ شَىْءٍ مَا خَلاَ اللَّهَ بَاطِلُ ‏\"‏‏.‏"},{"n":6545,"head":"عن أبي هريرة رضي الله عنه قال: قال النبي ﷺ:","text":"حَدَّثَنَا أَبُو الْيَمَانِ، أَخْبَرَنَا شُعَيْبٌ، حَدَّثَنَا أَبُو الزِّنَادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ يُقَالُ لأَهْلِ الْجَنَّةِ خُلُودٌ لاَ مَوْتَ‏.‏ وَلأَهْلِ النَّارِ يَا أَهْلَ النَّارِ خُلُودٌ لاَ مَوْتَ ‏\"‏‏.‏"},{"n":6616,"head":"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا سُفْيَانُ، عَنْ سُمَىٍّ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ تَعَوَّذُوا بِاللَّهِ مِنْ جَهْدِ الْبَلاَءِ، وَدَرَكِ الشَّقَاءِ، وَسُوءِ الْقَضَاءِ، وَشَمَاتَةِ الأَعْدَاءِ ‏\"‏‏.‏"},{"n":6729,"head":"عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:","text":"حَدَّثَنَا إِسْمَاعِيلُ، قَالَ حَدَّثَنِي مَالِكٌ، عَنْ أَبِي الزِّنَادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ لاَ يَقْتَسِمُ وَرَثَتِي دِينَارًا، مَا تَرَكْتُ بَعْدَ نَفَقَةِ نِسَائِي وَمُؤْنَةِ عَامِلِي فَهْوَ صَدَقَةٌ ‏\"‏‏.‏"},{"n":6799,"head":"عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ:","text":"حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا عَبْدُ الْوَاحِدِ، حَدَّثَنَا الأَعْمَشُ، قَالَ سَمِعْتُ أَبَا صَالِحٍ، قَالَ سَمِعْتُ أَبَا هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ لَعَنَ اللَّهُ السَّارِقَ، يَسْرِقُ الْبَيْضَةَ فَتُقْطَعُ يَدُهُ، وَيَسْرِقُ الْحَبْلَ فَتُقْطَعُ يَدُهُ ‏\"‏‏.‏"},{"n":6983,"head":"عن أنس بن مالك رضي الله عنه أن رسول الله ﷺ قال:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، عَنْ مَالِكٍ، عَنْ إِسْحَاقَ بْنِ عَبْدِ اللَّهِ بْنِ أَبِي طَلْحَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ الرُّؤْيَا الْحَسَنَةُ مِنَ الرَّجُلِ الصَّالِحِ جُزْءٌ مِنْ سِتَّةٍ وَأَرْبَعِينَ جُزْءًا مِنَ النُّبُوَّةِ ‏\"‏‏.‏"},{"n":7071,"head":"عن أبي موسى رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا مُحَمَّدُ بْنُ الْعَلاَءِ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ بُرَيْدٍ، عَنْ أَبِي بُرْدَةَ، عَنْ أَبِي مُوسَى، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ مَنْ حَمَلَ عَلَيْنَا السِّلاَحَ فَلَيْسَ مِنَّا ‏\"‏‏.‏"},{"n":7142,"head":"عن أنس بن مالك رضي الله عنه قال: قال رسول الله ﷺ:","text":"حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا يَحْيَى، عَنْ شُعْبَةَ، عَنْ أَبِي التَّيَّاحِ، عَنْ أَنَسِ بْنِ مَالِكٍ ـ رضى الله عنه ـ قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ اسْمَعُوا وَأَطِيعُوا وَإِنِ اسْتُعْمِلَ عَلَيْكُمْ عَبْدٌ حَبَشِيٌّ كَأَنَّ رَأْسَهُ زَبِيبَةٌ ‏\"‏‏.‏"},{"n":7376,"head":"عن جرير بن عبد الله رضي الله عنه قال: قال رسول الله ﷺ:","text":"حَدَّثَنَا مُحَمَّدٌ، أَخْبَرَنَا أَبُو مُعَاوِيَةَ، عَنِ الأَعْمَشِ، عَنْ زَيْدِ بْنِ وَهْبٍ، وَأَبِي، ظَبْيَانَ عَنْ جَرِيرِ بْنِ عَبْدِ اللَّهِ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ لاَ يَرْحَمُ اللَّهُ مَنْ لاَ يَرْحَمُ النَّاسَ ‏\"‏‏.‏"},{"n":7464,"head":"عن أنس رضي الله عنه قال: قال رسول الله ﷺ:","text":"حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا عَبْدُ الْوَارِثِ، عَنْ عَبْدِ الْعَزِيزِ، عَنْ أَنَسٍ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ إِذَا دَعَوْتُمُ اللَّهَ فَاعْزِمُوا فِي الدُّعَاءِ، وَلاَ يَقُولَنَّ أَحَدُكُمْ إِنْ شِئْتَ فَأَعْطِنِي، فَإِنَّ اللَّهَ لاَ مُسْتَكْرِهَ لَهُ ‏\"‏‏.‏"},{"n":7466,"head":"عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:","text":"حَدَّثَنَا مُحَمَّدُ بْنُ سِنَانٍ، حَدَّثَنَا فُلَيْحٌ، حَدَّثَنَا هِلاَلُ بْنُ عَلِيٍّ، عَنْ عَطَاءِ بْنِ يَسَارٍ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ مَثَلُ الْمُؤْمِنِ كَمَثَلِ خَامَةِ الزَّرْعِ، يَفِيءُ وَرَقُهُ مِنْ حَيْثُ أَتَتْهَا الرِّيحُ تُكَفِّئُهَا، فَإِذَا سَكَنَتِ اعْتَدَلَتْ، وَكَذَلِكَ الْمُؤْمِنُ يُكَفَّأُ بِالْبَلاَءِ، وَمَثَلُ الْكَافِرِ كَمَثَلِ الأَرْزَةِ صَمَّاءَ مُعْتَدِلَةً حَتَّى يَقْصِمَهَا اللَّهُ إِذَا شَاءَ ‏\"‏‏.‏"},{"n":7486,"head":"عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:","text":"حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، عَنْ مَالِكٍ، عَنْ أَبِي الزِّنَادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ يَتَعَاقَبُونَ فِيكُمْ مَلاَئِكَةٌ بِاللَّيْلِ وَمَلاَئِكَةٌ بِالنَّهَارِ، وَيَجْتَمِعُونَ فِي صَلاَةِ الْعَصْرِ وَصَلاَةِ الْفَجْرِ، ثُمَّ يَعْرُجُ الَّذِينَ بَاتُوا فِيكُمْ فَيَسْأَلُهُمْ وَهْوَ أَعْلَمُ كَيْفَ تَرَكْتُمْ عِبَادِي فَيَقُولُونَ تَرَكْنَاهُمْ وَهُمْ يُصَلُّونَ، وَأَتَيْنَاهُمْ وَهُمْ يُصَلُّونَ ‏\"‏‏.‏"}]};
const BUKHARI_URL = 'https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ara-bukhari/';
const HADITH_KEY = 'sauditv-hadith2';   // 2: the short form (head and his words)
let HADITH_DAY = null;   // {day, n, head, matn, offline}: the day's hadith (loadHadith)
const hadithPick = day => { const L = BUKHARI.short; return L[((day * 7919) % L.length + L.length) % L.length]; };
function hadithMatn(text){
  const parts = String(text || '').split('"');
  if(parts.length !== 3 || parts[2].replace(/[\s.،,:\u200e\u200f]/g, '')) return '';
  const m = parts[1].replace(/[\u200e\u200f]/g, '').split(/\s+/).filter(Boolean).join(' ').replace(/^[ .]+|[ .]+$/g, '');
  return m && m.split(' ').length <= BUKHARI.maxWords ? m : '';
}
async function loadHadith(){
  const day = riyadhDayNumber();
  if(HADITH_DAY && HADITH_DAY.day === day && !HADITH_DAY.offline) return true;
  const [n, head] = hadithPick(day);
  try{
    const c = JSON.parse(localStorage.getItem(HADITH_KEY) || 'null');
    if(c && c.day === day && c.n === n && c.head === head && c.matn){ HADITH_DAY = c; hadithDrawn(); return true; }
  }catch(e){}
  const local = BUKHARI.fallback.find(h => h.n === n);
  let matn = local ? hadithMatn(local.text) : '';
  for(const ext of matn ? [] : ['.min.json', '.json']){   // the API's advice: the other form when one fails
    try{
      const r = await fetchT(BUKHARI_URL + n + ext, 15000);
      if(!r.ok) continue;
      const h = ((await r.json()).hadiths || [])[0];
      if(h && +h.hadithnumber === n && (matn = hadithMatn(h.text))) break;
    }catch(e){}
  }
  if(matn){
    HADITH_DAY = {day, n, head, matn};
    try{ localStorage.setItem(HADITH_KEY, JSON.stringify(HADITH_DAY)); }catch(e){}
  } else if(!HADITH_DAY || HADITH_DAY.day !== day){
    const f = BUKHARI.fallback[day % BUKHARI.fallback.length];
    HADITH_DAY = {day, n: f.n, head: f.head, matn: hadithMatn(f.text), offline: true};
  }
  hadithDrawn();
  return !HADITH_DAY.offline;
}
function hadithDrawn(){ if(CONFIG.panel === 'hadith') renderPanel(false); }
const HK = '[\u064B-\u0652\u0670]*';
const SAW_RE = new RegExp('صلى الله عليه وسلم'.split(' ').map(w => [...w].join(HK) + HK).join('\\s+'), 'g');
const hadithType = t => String(t || '').replace(SAW_RE, 'ﷺ').replace(/\{/g, '﴿').replace(/\}/g, '﴾').replace(/\s+([،,.:؛])/g, '$1');
const sawHtml = s => s.replace(/ﷺ/g, '<span class="saw">ﷺ</span>').replace(/[﴿﴾]/g, m => `<span class="orn">${m}</span>`);
function hadithRows(){
  if(HADITH_DAY && HADITH_DAY.day !== riyadhDayNumber()) loadHadith();   // a new day: its own (redrawn when known)
  const h = HADITH_DAY;
  if(!h || !h.matn) return [];
  return [`<li class="quote hadith"><span class="nar">${sawHtml(esc(h.head))}</span> «${sawHtml(esc(hadithType(h.matn)))}»</li>`,
          `<li class="src">صحيح البخاري، رقم ${ar(h.n)}</li>`];
}

async function loadWeather(){
  const q = `latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}&timezone=${encodeURIComponent(CONFIG.cityTz)}`;
  const DX = !!CONFIG.detail;   // the detail page also reads feels-like, humidity, wind, the hours, rain, sun
  const U = CONFIG.units === 'f' ? '&temperature_unit=fahrenheit&wind_speed_unit=mph' : '';
  try{
    const r = await fetchT(`https://api.open-meteo.com/v1/forecast?${q}${U}&current=temperature_2m,weather_code`
                         + (DX ? ',apparent_temperature,relative_humidity_2m,wind_speed_10m' : NXH ? ',relative_humidity_2m' : '')
                         + `&daily=temperature_2m_max,temperature_2m_min,weather_code`
                         + (DX ? ',precipitation_probability_max,sunrise,sunset&hourly=temperature_2m,precipitation_probability&forecast_days=7'
                               : '&forecast_days=5'), 12000);
    if(!r.ok) throw 0;
    const j = await r.json();
    document.getElementById('wx-temp').textContent = ar(Math.round(j.current.temperature_2m)) + '°';
    const d = document.getElementById('wx-desc');
    d.textContent = WX_CODES[j.current.weather_code] || '';
    d.classList.remove('dust');
    const hi = j.daily?.temperature_2m_max?.[0], lo = j.daily?.temperature_2m_min?.[0];
    document.getElementById('wx-range').textContent =
      (hi != null && lo != null) ? `${ar(Math.round(hi))}° / ${ar(Math.round(lo))}°` : '';
    if(NX) NX_WX = {t: j.current.temperature_2m, code: j.current.weather_code, hum: j.current.relative_humidity_2m, hi, lo};
    const dl = j.daily || {};
    FORECAST = (dl.time || []).map((t, i) => ({date:t, code:dl.weather_code?.[i],
      hi:dl.temperature_2m_max?.[i], lo:dl.temperature_2m_min?.[i],
      rain:dl.precipitation_probability_max?.[i], rise:dl.sunrise?.[i], set:dl.sunset?.[i]}))   // rain, rise, set
      .filter(x => x.hi != null && x.lo != null);
    if(DX){   // now, and the next 12 hours (hourly times are local, like current.time)
      const c = j.current || {}, hr = j.hourly || {}, nowT = String(c.time || '');
      WX_NOW = {temp:c.temperature_2m, feels:c.apparent_temperature, hum:c.relative_humidity_2m,
                wind:c.wind_speed_10m, code:c.weather_code, dust:''};
      WX_HOURS = (hr.time || []).map((t, i) => ({t, temp:hr.temperature_2m?.[i], rain:hr.precipitation_probability?.[i]}))
        .filter(x => x.t > nowT && x.temp != null).slice(0, 12);
    }
    if(CONFIG.panel === 'forecast') renderPanel(false);
  }catch(e){ return false; }   // keep the last reading; with none only the city shows (false = no answer)

  try{
    const r = await fetchT(`https://air-quality-api.open-meteo.com/v1/air-quality?${q}&current=pm10,dust`, 12000);
    if(!r.ok) throw 0;
    const c = (await r.json()).current || {};
    const pm = Math.max(c.pm10 || 0, c.dust || 0);
    if(pm >= 150){
      const d = document.getElementById('wx-desc');
      d.textContent = pm >= 400 ? 'غبار كثيف' : 'غبار';

const NIGHT = [[0, .6], [5.5, .6], [6, .23], [7, 0], [21, 0], [23, .46], [23.5, .6], [24, .6]];   // [hour, dimmer]
function applyNight(){
  const p = riyadhParts();
  const h = CONFIG.nightH >= 0 ? CONFIG.nightH % 24 : p.h + p.mi/60 + p.s/3600;   // #nighth (tests)
  let o = 0;
  for(let i = 1; i < NIGHT.length; i++){
    const [h0, o0] = NIGHT[i - 1], [h1, o1] = NIGHT[i];
    if(h < h1){ o = o0 + (o1 - o0) * (h - h0) / (h1 - h0); break; }
  }
  const v = Math.max(0, Math.min(.6, o)).toFixed(3);
  const el = document.getElementById('dimmer');
  if(el && v !== applyNight.last){ applyNight.last = v; el.style.opacity = v; }
}

const SHIFT_X = 12, SHIFT_Y = 10, SHIFT_MIN = 4;
let SHIFT_AT = [0, 0];
function pixelShift(){
  const r = m => Math.round((Math.random() * 2 - 1) * m);
  let dx = 0, dy = 0;
  for(let n = 0; n < 100; n++){
    dx = r(SHIFT_X); dy = r(SHIFT_Y);
    if(Math.abs(dx - SHIFT_AT[0]) >= SHIFT_MIN && Math.abs(dy - SHIFT_AT[1]) >= SHIFT_MIN) break;
  }
  SHIFT_AT = [dx, dy];
  ['.stage', '#tape'].forEach(q => { const el = document.querySelector(q); if(el) el.style.transform = `translate(${dx}px,${dy}px)`; });
}

const SS_BREAK_S = 60, SS_FADE_OUT = 600, SS_FADE_IN = 800, SS_BREAK_FADE = 2000;
let SS_SWAPPED = false, SS_QUEUE = Promise.resolve(), SS_T = 0;
function ssMinute(){ const p = riyadhParts(); return p.h*60 + p.mi + (p.s + Date.now() % 1000 / 1000)/60; }
function ssBreakStart(m){ const B = CONFIG.breakMin; return Math.floor((m - B/2) / B) * B + B/2; }
function ssWant(m){
  const S = CONFIG.swapMin, b = ssBreakStart(m), e = b + SS_BREAK_S/60, M = .2;
  const meets = Math.floor((e + M) / S) !== Math.floor((b - M) / S);   // a swap boundary within 12 s of it
  return {swap: Math.floor(m / S) % 2 === 1, pause: m >= b && m < e && !meets};
}
function ssFade(els, to, ms){
  return Promise.all(els.filter(Boolean).map(el => {
    const from = getComputedStyle(el).opacity;
    el.style.opacity = to ? '' : '0';
    if(CARD_STILL || !el.animate) return null;
    return el.animate([{opacity: from}, {opacity: to}], {duration: ms, easing: 'ease-in-out'}).finished.catch(() => {});
  }));
}
function ssApply(swap, pause, now){
  SS_QUEUE = SS_QUEUE.then(async () => {
    const root = document.documentElement, stage = document.querySelector('.stage'), all = [stage, document.getElementById('tape')];
    if(pause && !SS_BREAK){
      SS_BREAK = true;
      await (now ? ssFade(all, 0, 0) : ssFade(all, 0, SS_BREAK_FADE));
      root.classList.add('ss-break');
      if(TAPE_ANIM) TAPE_ANIM.pause();
    }
    if(swap !== SS_SWAPPED){
      SS_SWAPPED = swap;
      if(now || SS_BREAK) root.classList.toggle('ss-swap', swap);   // nothing on screen to fade
      else {
        await ssFade([stage], 0, SS_FADE_OUT);
        root.classList.toggle('ss-swap', swap);
        await ssFade([stage], 1, SS_FADE_IN);
      }
    }
    if(!pause && SS_BREAK){
      SS_BREAK = false;
      root.classList.remove('ss-break');
      if(TAPE_ANIM) TAPE_ANIM.play();   // carries on from where it was held
      await ssFade(all, 1, now ? 0 : SS_BREAK_FADE);
    }
  }).catch(e => console.error('SaudiTV: ssApply ' + e));
}
function ssTick(first){
  clearTimeout(SS_T);
  const m = ssMinute(), w = ssWant(m), S = CONFIG.swapMin, B = CONFIG.breakMin, b = ssBreakStart(m);
  ssApply(w.swap, w.pause, first);
  const next = Math.min(...[(Math.floor(m / S) + 1) * S, b + SS_BREAK_S/60, b + B, 1440].filter(x => x > m)) - m;
  SS_T = setTimeout(() => ssTick(false), Math.max(1000, next * 60000 + 250));
}
function ssStart(){
  ssTick(true);
  window.sauditvSaver = {
    swap: on => ssApply(!!on, SS_BREAK, false),
    pause: on => ssApply(SS_SWAPPED, !!on, false),
    night: h => { CONFIG.nightH = +h; applyNight(); },
  };
}

const PHOTO_SET = 12, PHOTO_PERIOD_DAYS = 4, PHOTO_SLOT_MIN = 5;
const PHOTO_SLOTS_PER_DAY = Math.floor(1440 / PHOTO_SLOT_MIN);
function riyadhDayNumber(){
  const p = riyadhParts();
  return Math.floor(Date.UTC(p.y, p.mo - 1, p.d) / 86400000);
}
function photoSet(n){
  const period = Math.floor(riyadhDayNumber() / PHOTO_PERIOD_DAYS);
  let seed = (period % 2147483646) + 1;
  const pick = [];
  for(let guard = 0; pick.length < Math.min(PHOTO_SET, n) && guard < 1000; guard++){
    seed = (seed * 48271) % 2147483647;
    const k = seed % n;
    if(!pick.includes(k)) pick.push(k);
  }
  return pick;
}
function photoPools(){
  const seed0 = Math.floor(riyadhDayNumber() / PHOTO_PERIOD_DAYS) % 2147483646 + 1;
  return CONFIG.photos.map(s => {
    if(s === 'ours') return REMOTE_BGS.length ? photoSet(REMOTE_BGS.length).map(k => ({u: PHOTO_BASE + REMOTE_BGS[k].f, c: REMOTE_BGS[k].c, d: REMOTE_BGS[k].d})) : [];
    const L = (Array.isArray(ONLINE[s]) ? ONLINE[s] : []).filter(x => x && /^https:\/\//.test(x.u))
      .map(x => Object.assign({}, x, {on: 1, d: 1 - photoDim(x.b)}));
    for(let i = L.length - 1, seed = seed0; i > 0; i--){ seed = seed * 48271 % 2147483647; const k = seed % (i + 1); [L[i], L[k]] = [L[k], L[i]]; }
    return L;
  }).filter(L => L.length);
}
function photoFor(slot, P){
  if(!P.length) return null;
  const L = P[slot % P.length];
  return L[Math.floor(slot / P.length) % L.length];
}
let BG_SLOT = -1, PREFETCHED = false;
function applyBackground(force){
  try {
    const p = riyadhParts();
    const slot = riyadhDayNumber() * PHOTO_SLOTS_PER_DAY + Math.floor((p.h * 60 + p.mi) / PHOTO_SLOT_MIN);
    if(slot === BG_SLOT && !force) return;
    BG_SLOT = slot;
    const set = REMOTE_BGS.length && CONFIG.photos.includes('ours') ? photoSet(REMOTE_BGS.length).map(k => REMOTE_BGS[k]) : [];
    const local = BGS[slot % BGS.length], P = photoPools(), b = photoFor(slot, P);
    if(!b){ showBackground(local.u, local); return; }
    const url = b.u;
    if(!CONFIG.detail) setTimeout(() => [1, 2, 3].forEach(i => { const x = photoFor(slot + i, P); if(x && x.on) new Image().src = x.u; }), 20000);
    let done = false;
    const fallback = () => { if(!done && !document.querySelector('.photo').style.backgroundImage) showBackground(local.u, local); };
    const t = setTimeout(fallback, 1200);
    const img = new Image();
    img.onload = () => { done = true; clearTimeout(t); showBackground(url, b); };
    img.onerror = () => { clearTimeout(t); fallback(); done = true; };
    img.src = url;
    if(!PREFETCHED && !CONFIG.detail){ PREFETCHED = true; setTimeout(() => set.forEach(x => { new Image().src = PHOTO_BASE + x.f; }), 20000); }
  } catch(e) {}
}

function dvPrayers(){

  const names = {Fajr:'الفجر', Sunrise:'الشروق', Dhuhr: fri ? 'الجمعة' : 'الظهر', Asr:'العصر', Maghrib:'المغرب', Isha:'العشاء'};
  const at = k => { const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number); return h*60 + mi; };
  const gap = k => (k === 'Sunrise' || (k === 'Dhuhr' && fri)) ? 0 : (CONFIG.iqama[k] || 0);   // as tickPrayer
  const keys = Object.keys(names).filter(k => DAY_TIMES[k] && Number.isFinite(at(k)));
  let hot = PRAYER_KEYS.find(k => keys.includes(k) && gap(k) && mins >= at(k) && mins < at(k) + gap(k)), note = '';
  if(hot) note = 'الإقامة بعد ' + humanRemaining(Math.max(60, Math.ceil(at(hot) + gap(hot) - mins)*60));
  else {
    hot = PRAYER_KEYS.find(k => keys.includes(k) && at(k) > mins) || 'Fajr';
    let left = at(hot) - mins; if(left <= 0) left += 1440;
    note = 'بعد ' + humanRemaining(Math.max(0, Math.round(left*60)));
  }
  const t12 = m => fmt12(Math.floor(m/60) % 24, m % 60);
  let today = '';
  try{   // the city's day (and «بتوقيت <city>» when its clock is not the TV's)
    today = new Intl.DateTimeFormat(HIJRI, {timeZone:CONFIG.cityTz, day:'numeric', month:'long'}).format(new Date())
      + ' · ' + new Intl.DateTimeFormat(GREG, {timeZone:CONFIG.cityTz, weekday:'long', day:'numeric', month:'long'}).format(new Date())

    + `<span>${gap(k) ? t12(at(k) + gap(k)) : '—'}</span><span>${k === hot ? note : ''}</span></div>`).join('');
  const off = Date.UTC(p.y, p.mo-1, p.d, p.h, p.mi, p.s) - Date.now();

  const now = Date.now(), seen = new Set(), evs = [];
  const add = ev => { if(ev && ev.idEvent && !seen.has(ev.idEvent)){ seen.add(ev.idEvent); evs.push(ev); } };
  CONFIG.teamIds.forEach(id => { add(MATCHES[id]); (NEXT_LIST[id] || []).forEach(add); resultsFor(id).forEach(add); });
  const done = [], ahead = [];
  evs.forEach(ev => {
    const t = toDate(ev).getTime();
    if(!Number.isFinite(t) || t < now - 7*86400000 || t > now + 14*86400000) return;   // 7 days back, 14 ahead
    const scored = ev.intHomeScore != null && ev.intAwayScore != null && ev.intHomeScore !== '' && ev.intAwayScore !== '';
    const over = FINAL.includes((ev.strStatus || '').toUpperCase()) ? now >= t : now >= t + 2.5*3600000;
    if(over){ if(scored) done.push({ev, t}); return; }   // a past game without a score has nothing to show
    ahead.push({ev, t, scored});

  const rows = [...done.map(x => Object.assign(x, {fin: true})), ...ahead];
  if(!rows.length) return '';
  const hm = d => new Intl.DateTimeFormat('en-GB', {timeZone:CONFIG.timezone, hour:'2-digit', minute:'2-digit', hour12:false})
    .formatToParts(d).reduce((a, x) => (a[x.type] = x.value, a), {});
  return '<div class="dv-scroll"><div class="dv-tbl dv-mt">' + rows.map(({ev, t, fin, scored}) => {
    const d = new Date(t), q = hm(d), t12 = fmt12(+q.hour % 24, +q.minute);
    const live = !fin && now >= t;
    const when = live ? `<span class="live">مباشر</span> · ${liveStatus(ev, t12)}`
      : new Intl.DateTimeFormat(GREG, {timeZone:CONFIG.timezone, weekday:'long', day:'numeric', month:'long'}).format(d) + ' · ' + t12;
    const mid = fin || (live && scored) ? ` <span class="dv-sc">${ar(+ev.intHomeScore)} - ${ar(+ev.intAwayScore)}</span> ` : ' × ';
    return `<div class="dv-tr"><span>${when}</span><span>${esc(teamAr(ev.strHomeTeam))}${mid}${esc(teamAr(ev.strAwayTeam))}</span>`
         + `<span class="dv-meta" dir="auto">${esc(dvComp(ev.strLeague))}</span>`   // English names keep their start
         + dvBcast(fin ? null : bcastOf(ev, now)) + '</div>';
  }).join('') + '</div></div>';
}

function dvStandings(){
  if(!STANDINGS.length) return '';
  const fol = standFollowed(), want = new Set(Object.values(TEAM_NAME_OF).map(arNorm));
  const isF = x => fol(x) || (CONFIG.league === 'ksa.1' && want.has(arNorm(STAND_AR[standKey(x.name)])));
  const n = v => Number.isFinite(v) ? ar(Math.round(v)) : '—';
  const gd = v => Number.isFinite(v) ? `<span dir="ltr">${v > 0 ? '+' : v < 0 ? '−' : ''}${ar(Math.abs(Math.round(v)))}</span>` : '—';
  return '<div class="dv-scroll"><div class="dv-tbl dv-st"><div class="dv-tr dv-th"><span>#</span><span>النادي</span><span>لعب</span>'
    + '<span>فاز</span><span>تعادل</span><span>خسر</span><span>له</span><span>عليه</span><span>الفارق</span><span>النقاط</span></div>'
    + STANDINGS.map(x => `<div class="dv-tr${isF(x) ? ' fol' : ''}"><span>${n(x.rank)}</span><span>${esc(standAr(x.name))}</span>`
      + `<span>${n(x.gp)}</span><span>${n(x.w)}</span><span>${n(x.d)}</span><span>${n(x.l)}</span><span>${n(x.gf)}</span><span>${n(x.ga)}</span>`
      + `<span>${gd(x.gd)}</span><span><b>${n(x.pts)}</b></span></div>`).join('')
    + '</div></div>';
}

function dvVerse(){

function dvNews(P){
  DV.items = (NEWS[P] || []).slice(0, NEWS_DETAIL_KEEP);
  if(!DV.items.length) return '';
  const now = Date.now();
  return '<div class="dv-news"><div class="dv-list">' + DV.items.map((x, i) => {
    const meta = [newsSource(P, x.source), Number.isFinite(x.t) ? agoAr(now - x.t) : ''].filter(Boolean).join(' · ');
    return `<div class="dv-item" data-i="${i}"><div class="h"${bidiAttr(P, x.headline)}>${esc(x.headline)}</div><div class="dv-meta">${meta}</div></div>`;
  }).join('') + '</div><div class="dv-side"></div></div>';
}
function dvNewsFocus(i){
  const list = document.querySelector('#dv .dv-list'), side = document.querySelector('#dv .dv-side');
  if(!list || !side || !DV.items.length) return;
  i = Math.max(0, Math.min(DV.items.length - 1, i));
  DV.focus = i;
  Array.from(list.children).forEach((el, k) => el.classList.toggle('focus', k === i));
  const row = list.children[i];
  if(row){
    const top = row.offsetTop, bot = top + row.offsetHeight;
    if(top < list.scrollTop) list.scrollTop = top;
    else if(bot > list.scrollTop + list.clientHeight) list.scrollTop = bot - list.clientHeight;
  }
  const x = DV.items[i];
  const P = CONFIG.detail;
  const meta = [newsSource(P, x.source), Number.isFinite(x.t) ? agoAr(Date.now() - x.t) : ''].filter(Boolean).join(' · ');
  side.innerHTML = `<div class="h"${bidiAttr(P, x.headline)}>${esc(x.headline)}</div><div class="dv-meta">${meta}</div>`
    + (x.summary ? `<div class="dv-sum"${bidiAttr(P, x.summary)}>${esc(x.summary)}</div>` : '<div class="dv-sum none">لا يوجد ملخص</div>')
    + (x.link ? '<div class="dv-ok">OK لقراءة الخبر كاملاً</div>' : '');
  dvSideFit(side);
  if(document.fonts && document.fonts.status !== 'loaded') document.fonts.ready.then(() => dvSideFit(side));
}
function dvSideFit(side){
  const sum = side && side.querySelector('.dv-sum:not(.none)');
  if(!sum) return;
  sum.style.webkitLineClamp = '';
  const over = side.scrollHeight - side.clientHeight;
  if(over <= 0) return;
  const lh = parseFloat(getComputedStyle(sum).lineHeight) || 32;
  sum.style.webkitLineClamp = String(Math.max(1, Math.floor((sum.clientHeight - over) / lh)));
}

function renderDetail(){
  const body = document.querySelector('#dv .dv-body');
  if(!body) return;
  const P = CONFIG.detail, news = isNewsPanel(P);   // news, local, world, tech
  const was = news ? DV.items[DV.focus] : null;   // keep the focused item across a refresh
  let html = '';
  try{
    html = P === 'prayers' ? dvPrayers() : P === 'forecast' ? dvForecast() : P === 'matches' ? dvMatches()
         : P === 'standings' ? dvStandings() : news ? dvNews(P)
         : P === 'verse' || P === 'hadith' ? dvVerse() : '';
  }catch(e){ console.error('SaudiTV: detail ' + (e && e.message)); }
  if(!html) html = `<div class="dv-empty">${DV.answered[P] ? (P === 'matches' ? 'لا مباريات في هذه الفترة' : 'لا تتوفر بيانات الآن')
                                          : DV.failed[P] ? 'لا تتوفر بيانات الآن' : 'جارٍ التحميل…'}</div>`;
  if(html === DV.html) return;   // nothing changed: focus and scroll stay as they are
  DV.html = html;
  const sc = body.querySelector('.dv-scroll'), top = sc ? sc.scrollTop : 0;
  body.innerHTML = html;
  const sc2 = body.querySelector('.dv-scroll');
  if(sc2) sc2.scrollTop = top;
  if(news && DV.items.length){
    let i = was ? DV.items.findIndex(x => (x.link && x.link === was.link) || x.headline === was.headline) : 0;
    dvNewsFocus(i < 0 ? Math.min(DV.focus, DV.items.length - 1) : i);
  }
}

function detailKey(e){
  const k = e.key;
  if(!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(k)) return;
  e.preventDefault();   // no native scrolling: the page moves only as below
  if(k === 'ArrowLeft' || k === 'ArrowRight'){ dvGo(k === 'ArrowLeft' ? 1 : -1); return; }
  const P = CONFIG.detail;
  if(isNewsPanel(P)){   // local too
    if(!DV.items.length) return;
    if(k === 'ArrowDown') dvNewsFocus(DV.focus + 1);
    else if(k === 'ArrowUp') dvNewsFocus(DV.focus - 1);
    else if(k === 'Enter'){
      const x = DV.items[DV.focus], N = window.SaudiTVNative;
      if(x && x.link && N && typeof N.openUrl === 'function'){ try{ N.openUrl(x.link); }catch(err){} }
    }
    return;
  }
  const sc = document.querySelector('#dv .dv-scroll');
  if(sc && (k === 'ArrowDown' || k === 'ArrowUp')) sc.scrollTop += (k === 'ArrowDown' ? 1 : -1) * Math.round(sc.clientHeight * 0.4);
}

const DV_STARTED = new Set();
function dvStart(P){
  if(DV_STARTED.has(P)) return;
  DV_STARTED.add(P);
  const watch = (load, name) => firstLoad(() => Promise.resolve().then(load).catch(() => false).then(ok => {
    if(ok === false) DV.failed[P] = true; else DV.answered[P] = true;
    renderDetail();
    return ok;
  }), name);
  if(P === 'prayers'){ watch(loadPrayers, 'prayers'); setInterval(loadPrayers, 6*3600*1000); setInterval(renderDetail, 15000); }
  if(P === 'forecast'){ watch(loadWeather, 'weather'); setInterval(loadWeather, 30*60*1000); }
  if(P === 'matches'){ watch(loadMatches, 'matches'); setInterval(loadMatches, 30*60*1000); setInterval(loadLive, 2*60000); setInterval(renderDetail, 60000); }
  if(P === 'standings'){   // the match data marks the followed clubs; the matches page, once seen, refreshes it
    watch(loadStandings, 'standings'); setInterval(loadStandings, 3*3600*1000);
    if(!DV_STARTED.has('matches')) firstLoad(loadMatches, 'matches');
  }
  if(P === 'news' || P === 'tech' || P === 'world'){ watch(() => loadNews(P), P); setInterval(() => loadNews(P), 30*60*1000); setInterval(renderDetail, 5*60*1000); }
  if(P === 'hadith') watch(loadHadith, 'hadith');
  if(P === 'local'){ watch(loadLocalNews, P); setInterval(loadLocalNews, 30*60*1000); setInterval(renderDetail, 5*60*1000); }
}

let DV_LAST_GO = 0, DV_OUT_T = 0, DV_TO = '';
function dvGo(d){
  const now = Date.now();
  if(DV_LIST.length < 2 || now - DV_LAST_GO < 300) return;
  DV_LAST_GO = now;
  const cur = DV_LIST.indexOf(DV_TO || CONFIG.detail);   // a switch still fading out counts as made

function restoreSnap(){
