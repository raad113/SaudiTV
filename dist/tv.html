// ---- Saudi Pro League clubs from ESPN team schedules (TheSportsDB's free key blocks the
// TV's shared VPN address). #teamnames= carries the followed teams' Arabic names in #teams order; a name that is
// a club of the ESPN table (STAND_AR) is read from ESPN, every other team (e.g. the national team) from TheSportsDB.
// ESPN events are turned into TheSportsDB-shaped events, so matchRows / matchSlot / loadLive read them unchanged.
const TEAM_NAME_OF = (() => {      // TheSportsDB id -> Arabic name
  const ids = (_Q.get('teams') || '').split(','), names = (_Q.get('teamnames') || '').split(','), o = {};
  ids.forEach((id, i) => { id = (id || '').trim(); const n = (names[i] || '').trim(); if(/^\d+$/.test(id) && n) o[id] = n; });
  return o;
})();
const arNorm = s => String(s || '').replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا')
  .replace(/ى/g, 'ي').replace(/ة/g, 'ه').trim().replace(/^(نادي|فريق)\s+/, '').replace(/\s+/g, '');
const ESPN_SCHED = 'https://site.api.espn.com/apis/site/v2/sports/soccer/ksa.1/teams/';
let ESPN_TEAMS = {};       // followed TheSportsDB id -> {espn: ESPN team id, name: ESPN English name}
const ESPN_EVENTS = {};    // 'espn:<event id>' -> converted event, one object shared by both followed sides

// followed teams whose Arabic name is a club of the loaded ESPN table (kept as is while the table is missing)
function mapEspnTeams(){
  if(!STANDINGS.length) return;
  const m = {}, used = new Set();
  CONFIG.teamIds.forEach(id => {
    const want = arNorm(TEAM_NAME_OF[id]);
    if(!want) return;
    const hit = STANDINGS.find(x => x.espnId && !used.has(x.espnId) && arNorm(STAND_AR[standKey(x.name)]) === want);
    if(hit){ used.add(hit.espnId); m[id] = {espn: hit.espnId, name: hit.name}; }
  });
  ESPN_TEAMS = m;
}

const espnTeamAr = en => STAND_AR[standKey(en)] || TEAM_KEYS[teamKey(en)] || en;
function espnScore(c){
  const s = c && c.score, v = s && typeof s === 'object' ? (s.displayValue != null ? s.displayValue : s.value) : s;
  return v == null || v === '' ? null : String(v);
}
// one ESPN schedule event -> the TheSportsDB fields the page reads; byEspn: ESPN team id -> followed id
function espnEvent(e, byEspn){
  const c = e && e.competitions && e.competitions[0];
  if(!c || !e.id || !Array.isArray(c.competitors)) return null;
  const t = new Date(c.date || e.date);
  if(isNaN(t)) return null;
  const st = c.status || e.status || {}, ty = st.type || {}, name = String(ty.name || '').toUpperCase(), state = ty.state || 'pre';
  if(/POSTPONED|CANCEL|ABANDON|SUSPEND|FORFEIT/.test(name) || (state === 'post' && !ty.completed)) return null;
  const home = c.competitors.find(x => x.homeAway === 'home'), away = c.competitors.find(x => x.homeAway === 'away');
  if(!home || !away || !home.team || !away.team) return null;
  const side = x => {
    const id = String(x.team.id != null ? x.team.id : x.id);
    return {id: byEspn[id] || 'espn:' + id, name: espnTeamAr(x.team.displayName || x.team.name || '')};
  };
  const H = side(home), A = side(away), iso = t.toISOString();
  let status = 'NS', prog = NaN;
  if(state === 'post') status = /PEN|SHOOTOUT/.test(name) ? 'PEN' : /AET|EXTRA|OVERTIME/.test(name) ? 'AET' : 'FT';
  else if(state === 'in'){ status = /HALF/.test(name) ? 'HT' : (+st.period >= 2 ? '2H' : '1H'); prog = parseInt(st.displayClock, 10); }
  const scored = state !== 'pre';
  return {idEvent: 'espn:' + e.id, strHomeTeam: H.name, strAwayTeam: A.name, idHomeTeam: H.id, idAwayTeam: A.id,
    dateEvent: iso.slice(0, 10), strTime: iso.slice(11, 19), strTimestamp: iso.slice(0, 19),
    intHomeScore: scored ? espnScore(home) : null, intAwayScore: scored ? espnScore(away) : null,
    strStatus: status, strProgress: Number.isFinite(prog) ? String(prog) : null,
    strLeague: (e.league && e.league.name) || ''};
}

async function espnEvents(url){
  const r = await fetchT(url, 15000);
  if(!r.ok) throw 0;
  const j = await r.json();
  if(!j || !Array.isArray(j.events)) throw 0;
  return j.events;
}
// a team's recent results and upcoming fixtures; 1 = ESPN answered, 0 = failed (what is shown stays)
async function loadEspnTeam(id){
  const t = ESPN_TEAMS[id];
  if(!t) return 0;
  const byEspn = {};
  Object.entries(ESPN_TEAMS).forEach(([fid, x]) => { byEspn[x.espn] = fid; });
  const base = ESPN_SCHED + encodeURIComponent(t.espn) + '/schedule';
  const [past, next] = await Promise.all([espnEvents(base).catch(() => null), espnEvents(base + '?fixture=true').catch(() => null)]);
  if(!past && !next) return 0;
  const evs = [];
  [].concat(past || [], next || []).forEach(e => {
    const x = espnEvent(e, byEspn);
    if(!x) return;
    const ev = ESPN_EVENTS[x.idEvent] ? Object.assign(ESPN_EVENTS[x.idEvent], x) : (ESPN_EVENTS[x.idEvent] = x);
    if(!evs.includes(ev)) evs.push(ev);
  });
  const done = evs.filter(x => FINAL.includes(x.strStatus)).sort((a, b) => toDate(b) - toDate(a)).slice(0, 5);
  const ahead = evs.filter(x => !FINAL.includes(x.strStatus)).sort((a, b) => toDate(a) - toDate(b)).slice(0, 5);
  if(past || done.length) RESULTS[id] = done;
  if(next || ahead.length) NEXT_LIST[id] = ahead;
  const ev = ahead[0];
  if(ev){ if(MATCHES[id] && MATCHES[id].idEvent !== ev.idEvent) keepResult(id, MATCHES[id]); MATCHES[id] = ev; }
  return 1;
}
// drop converted events no list refers to any more
function pruneEspn(){
  const keep = new Set();
  [MATCHES, RESULTS, NEXT_LIST].forEach(o => Object.values(o).forEach(v => (Array.isArray(v) ? v : [v]).forEach(ev => { if(ev) keep.add(ev.idEvent); })));
  Object.keys(ESPN_EVENTS).forEach(k => { if(!keep.has(k)) delete ESPN_EVENTS[k]; });
}
// ---- end

async function loadMatches(){
  // Saudi clubs from ESPN (their ESPN ids come from the table), the other teams from TheSportsDB
  if(Object.keys(TEAM_NAME_OF).length){ if(!STANDINGS.length) await loadStandings(); mapEspnTeams(); }
  // never throw away a good fixture or result on a failed refresh
  let answered = 0;
  await Promise.all(CONFIG.teamIds.map(async id=>{
    if(ESPN_TEAMS[id]){ const n = await loadEspnTeam(id); answered += n; return; }
    try{
      const ev = await fetchNext(id); answered++;
      if(ev){ if(MATCHES[id] && MATCHES[id].idEvent !== ev.idEvent) keepResult(id, MATCHES[id]); MATCHES[id] = ev; }
    }catch(e){}
    try{ const l = await fetchLast(id); answered++; if(l.length) RESULTS[id] = l; }catch(e){}
  }));
  pruneEspn();
  if(!answered && CONFIG.teamIds.length) return false;   // offline: keep what is shown (the saved panels)
  renderMatches();
  if(CONFIG.panel === 'matches' || CONFIG.panel === 'standings') renderPanel(false);   // standings marks followed teams
  // answered (see firstLoad); without the ESPN table the Saudi clubs are not read from ESPN yet
  return !Object.keys(TEAM_NAME_OF).length || STANDINGS.length > 0;
}

// the ticker tape's markets, in this order: Yahoo symbol or CoinGecko id, and how its value is written
// (index: whole points; usd: dollars, whole from 1,000 up; fx: four decimals)
const TAPE = [
  {name:'تاسي',           sym:'^TASI.SR', fmt:'index'},
  {name:'S&P 500',        sym:'^GSPC',    fmt:'index'},
  {name:'ناسداك',         sym:'^IXIC',    fmt:'index'},
  {name:'داو جونز',       sym:'^DJI',     fmt:'index'},
  {name:'الذهب',          sym:'GC=F',     fmt:'usd'},
  {name:'برنت',           sym:'BZ=F',     fmt:'usd'},
  {name:'الدولار/الريال', sym:'SAR=X',    fmt:'fx'},
  {name:'بيتكوين',        cg:'bitcoin',   fmt:'usd'},
  {name:'إيثريوم',        cg:'ethereum',  fmt:'usd'},
];

// ---- market formatting (value and daily change), pure: no DOM, no network
// Arabic-Indic digits and separators; every number group is its own left-to-right isolate, so the sign,
// ٪, $ and the brackets keep their places inside the right-to-left page.
const MK_NF = {};
function mkNum(x, d){
  const f = MK_NF[d] || (MK_NF[d] = new Intl.NumberFormat('ar-SA', {minimumFractionDigits:d, maximumFractionDigits:d, numberingSystem:'arab'}));
  return f.format(x);
}
const mkIso = s => `<span dir="ltr">${s}</span>`;
const mkSigned = (x, up, d, unit) => mkIso((up ? '+' : '−') + mkNum(Math.abs(x), d) + (unit || ''));
// a trading day as the exchange counts it
function mkDay(t, tz, off){
  try{ if(tz) return new Intl.DateTimeFormat('en-CA', {timeZone:tz}).format(new Date(t * 1000)); }catch(e){}
  return new Date((t + (off || 0)) * 1000).toISOString().slice(0, 10);
}
// Yahoo v8 chart (interval=1d) -> {price, prev, ...}; prev is the previous trading day's close or null.
// When the last daily bar is the same trading day as regularMarketPrice, the close before it; with a single bar,
// chartPreviousClose (the close just before the first bar). When the last bar is an earlier day, its close.
function mkIndexQuote(res){
  const m = (res && res.meta) || {}, price = m.regularMarketPrice;
  if(typeof price !== 'number' || !(price > 0)) return null;
  const ts = res.timestamp || [], cl = ((res.indicators && res.indicators.quote && res.indicators.quote[0]) || {}).close || [];
  const bars = ts.map((t, i) => [t, cl[i]]).filter(b => typeof b[1] === 'number' && b[1] > 0);
  const day = t => mkDay(t, m.exchangeTimezoneName, m.gmtoffset);
  const q = {price, prev:null, priceDay: m.regularMarketTime ? day(m.regularMarketTime) : null, prevDay:null};
  const last = bars[bars.length - 1];
  if(!last || !q.priceDay) return q;
  if(day(last[0]) === q.priceDay){
    if(bars.length >= 2){ q.prev = bars[bars.length - 2][1]; q.prevDay = day(bars[bars.length - 2][0]); }
    else if(m.chartPreviousClose > 0){ q.prev = m.chartPreviousClose; q.prevDay = 'before ' + day(last[0]); }
  } else { q.prev = last[1]; q.prevDay = day(last[0]); }
  return q;
}
// the daily change in percent: against the previous trading day's close (null when unknown)
const mkIndexPct = q => q && q.prev > 0 ? (q.price - q.prev) / q.prev * 100 : null;
// -> {value, change, dir}: HTML for the value and the change in percent ('' when unknown); dir 1 up, -1 down,
// 0 unchanged (as shown: under 0.005 % is ٠٫٠٠٪, grey, no arrow). fmt: see TAPE.
function mkTapeHtml(price, pct, fmt){
  if(typeof price !== 'number' || !(price > 0)) return {value:'', change:'', dir:0};
  const d = fmt === 'fx' ? 4 : fmt === 'usd' && price < 1000 ? 2 : 0;
  const value = mkIso(mkNum(price, d) + (fmt === 'usd' ? ' $' : ''));
  if(typeof pct !== 'number' || !isFinite(pct) || pct <= -100) return {value, change:'', dir:0};
  const r = Math.round(pct * 100) / 100, dir = r > 0 ? 1 : r < 0 ? -1 : 0;
  return {value, dir, change: dir ? `${dir > 0 ? '▲' : '▼'} ${mkSigned(r, dir > 0, 2, '٪')}` : mkIso(mkNum(0, 2) + '٪')};
}
// ---- end: market formatting

async function fetchT(url, ms){
  const c = new AbortController(); const id = setTimeout(()=>c.abort(), ms||12000);
  try{ return await fetch(url,{cache:'no-store', signal:c.signal}); }
  finally{ clearTimeout(id); }
}

// Yahoo has no CORS headers: try it directly (works inside the app), then through public CORS gateways
async function yahooChart(sym){
  const direct = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?interval=1d&range=5d`;
  const routes = [
    [direct, 7000, j => j],
    ['https://api.allorigins.win/get?url=' + encodeURIComponent(direct), 15000, w => JSON.parse(w.contents)],
    ['https://corsproxy.io/?url=' + encodeURIComponent(direct), 12000, j => j],
  ];
  for(const [url, ms, unwrap] of routes){
    try{
      const r = await fetchT(url, ms);
      if(!r.ok) continue;
      const j = unwrap(await r.json());
      if(j && j.chart && j.chart.result) return j;
    }catch(e){}
  }
  throw 0;
}

// ---- the market ticker tape
// One refresh asks for every market at once (Yahoo one request each, CoinGecko one for both coins). Each answer is
// kept; a failed one keeps the market's last good value, or leaves it out until it has one. Resolves to false when
// nothing answered (see firstLoad).
const TAPE_Q = [];   // TAPE index -> {value, change, dir} (mkTapeHtml)
async function loadTape(){
  const ids = TAPE.filter(t => t.cg).map(t => t.cg).join(',');
  const coins = ids ? fetchT(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`, 10000)
    .then(r => r.ok ? r.json() : null).catch(() => null) : null;
  const got = await Promise.all(TAPE.map(async (t, i) => {
    let h;
    try{
      if(t.cg){                                  // crypto: CoinGecko, CORS friendly; the change is over 24 h
        const c = ((await coins) || {})[t.cg] || {};
        h = mkTapeHtml(c.usd, c.usd_24h_change ?? c.usd_24hr_change, t.fmt);
      } else {
        const q = mkIndexQuote((await yahooChart(t.sym)).chart.result[0]);
        h = mkTapeHtml(q && q.price, mkIndexPct(q), t.fmt);
      }
    }catch(e){ return false; }
    if(!h.value) return false;                   // an answer without a price is no better than none
    TAPE_Q[i] = h;
    tapeSoon();
    return true;
  }));
  tapeRender();
  return got.some(Boolean);
}

// the answers arrive one by one: the tape is redrawn once they stop for 2 s, or when the refresh ends
let TAPE_T = 0;
function tapeSoon(){ clearTimeout(TAPE_T); TAPE_T = setTimeout(tapeRender, 2000); }

// the markets that have a value, in TAPE order, each followed by a dot (so is the last: the loop's seam)
let TAPE_HTML = '';
function tapeRender(){
  clearTimeout(TAPE_T); TAPE_T = 0;
  const html = TAPE.map((t, i) => {
    const h = TAPE_Q[i];
    if(!h) return '';
    const cls = h.dir > 0 ? ' up' : h.dir < 0 ? ' down' : '';
    return `<span class="tape-i"><span class="tape-n">${esc(t.name)}</span><span class="tape-v">${h.value}</span>`
      + (h.change ? `<span class="tape-c${cls}" dir="ltr">${h.change}</span>` : '') + '</span><i class="tape-dot"></i>';
  }).join('');
  if(!html || html === TAPE_HTML) return;   // nothing yet (the strip stays hidden), or the same: no restart
  TAPE_HTML = html;
  tapeLay();
}

// Lays the run out and (re)starts it: the list repeated until one copy is at least as wide as the strip, that copy
// twice, and an endless linear move to the right by exactly one copy's width (whole px), TAPE_SPEED px a second.
// Only when the list or the page's size changes; a restart carries on from where the run was. Reduced motion: one
// copy, still.
const TAPE_SPEED = 55;   // CSS px per second
let TAPE_ANIM = null;
function tapeLay(){
  const tape = document.getElementById('tape'), run = document.getElementById('tape-run');
  if(!tape || !run || !TAPE_HTML) return;
  const fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  fonts.then(() => {   // measured in the page's own fonts
    const html = TAPE_HTML;
    tape.hidden = false;
    run.innerHTML = `<span class="tape-set">${html}</span>`;
    const one = run.firstChild.getBoundingClientRect().width;
    const k = CARD_STILL ? 1 : Math.max(1, Math.ceil(tape.clientWidth / Math.max(1, one)));
    const set = `<span class="tape-set">${html.repeat(k)}</span>`;
    run.innerHTML = CARD_STILL ? set : set + set.replace('class="tape-set"', 'class="tape-set" aria-hidden="true"');
    const w = Math.ceil(run.firstChild.getBoundingClientRect().width);
    for(const s of run.children) s.style.width = w + 'px';
    const at = TAPE_ANIM ? (Number(TAPE_ANIM.currentTime) || 0) / 1000 * TAPE_SPEED : 0;   // px moved so far
    if(TAPE_ANIM){ TAPE_ANIM.cancel(); TAPE_ANIM = null; }
    if(CARD_STILL || !run.animate) return;
    TAPE_ANIM = run.animate([{transform:'translate3d(0,0,0)'}, {transform:`translate3d(${w}px,0,0)`}],
      {duration: w / TAPE_SPEED * 1000, iterations: Infinity, easing: 'linear'});
    TAPE_ANIM.currentTime = (at % w) / TAPE_SPEED * 1000;
    if(APPS_OPEN || SS_BREAK) TAPE_ANIM.pause();   // held where it is while the launcher's apps grid is open (or the screensaver's photo-only minute runs)
  });
}

// true while the launcher's apps grid is open (sauditvAppsOpen): the tape and the card hold still. The home
// screen's tape moves as the screensaver's (was stepping: tapeStep, a 4 s hold then a 0.6 s slide)
let APPS_OPEN = false;
// true during the screensaver's photo-only minute (ssTick): the tape is hidden and held there too
let SS_BREAK = false;

// a first load retried until it answers (firstLoad), then every 15 minutes; laid out again when the size changes
function tapeStart(){
  firstLoad(loadTape, 'markets');
  setInterval(loadTape, 15*60*1000);
  let t = 0;
  addEventListener('resize', () => { clearTimeout(t); t = setTimeout(tapeLay, 300); });
}
// ---- end: the market ticker tape

const SKIP_TYPES = ['News','Talk Show','Sports','Game Show'];
let NET_OK = 0;   // answers received; a refresh that got none must not replace what is on screen
async function getJSON(url, fallback){
  try{ const r = await fetchT(url, 12000); if(!r.ok) return fallback; const j = await r.json(); NET_OK++; return j; }
  catch(e){ return fallback; }
}
// the week's list, kept an hour or two in this app's storage: the home card and the detail page it opens
// share one download (14 large requests) instead of each fetching it again
const WEEK_CACHE_KEY = 'sauditv-week2:' + JSON.stringify(CONFIG.shows) + ':' + CONFIG.timezone, WEEK_CACHE_MS = 2*3600*1000;
// TVMaze's summaries are HTML (<p>, <b>, entities): their text only
function plainText(h){
  if(!h) return '';
  try{ return (new DOMParser().parseFromString(String(h), 'text/html').body.textContent || '').replace(/\s+/g, ' ').trim(); }
  catch(e){ return String(h).replace(/<[^>]*>/g, '').trim(); }
}
// TVMaze's schedule a few requests at a time, each tried twice: all 14 at once often left half of them
// timed out (the TV's network, the VPN), and the card then had one or two series
async function getJSONAll(urls, n){
  const res = new Array(urls.length);
  let k = 0;
  await Promise.all(Array.from({length: n}, async () => {
    while(k < urls.length){ const i = k++; res[i] = (await getJSON(urls[i], null)) || (await getJSON(urls[i], null)); }   // null: no answer
  }));
  return res;
}
async function loadWeek(){
  const F = CONFIG.shows, seen = new Set(), out = [], answered = NET_OK;
  let missed = 0;   // schedule requests with no answer
  // a fresh enough list saved by the other page of this app (see WEEK_CACHE_KEY)
  if(!WEEK_POOL.length){
    try{
      const c = JSON.parse(localStorage.getItem(WEEK_CACHE_KEY) || 'null'), age = c ? Date.now() - Number(c.at) : NaN;
      if(c && age >= 0 && age < WEEK_CACHE_MS && Array.isArray(c.pool) && c.pool.length){
        WEEK_POOL = c.pool; WEEK_PAGE = 0; renderWeekPage(false); return true;
      }
    }catch(e){}
  }
  const days = [];
  for(let i=0;i<7;i++) days.push(new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(new Date(Date.now()+i*86400000)));
  const inWeek = d => d && d >= days[0] && d <= days[6];
  const add = (s, e, picked) => {
    if(!s || !s.name || seen.has(s.name)) return;
    seen.add(s.name);
    const prem = e.number === 1;
    out.push({
      name: s.name,
      ep: e.season ? (prem ? `الموسم ${ar(e.season)}` : `الموسم ${ar(e.season)} · ح ${ar(e.number)}`) : '',
      date: e.airdate || '',
      rating: (s.rating && s.rating.average) || 0,
      prem, picked,
      // for the detail page (dvShows) and the default order: poster, channel or streaming service,
      // air time (only when TVMaze has one: web releases often have none), popularity
      img: (s.image && (s.image.medium || s.image.original)) || '',
      net: (s.webChannel && s.webChannel.name) || (s.network && s.network.name) || '',
      at: e.airtime && e.airstamp ? e.airstamp : '',
      weight: s.weight || 0, web: !!s.webChannel,
      // season and episode (SxxExx on the detail page), the summary without its HTML (detail page)
      s: e.season || 0, n: e.number || 0, sum: plainText(s.summary).slice(0, 700)
    });
  };

  // shows picked one by one: their next episode, if it airs this week
  const picked = await Promise.all(F.ids.map(id => getJSON(`https://api.tvmaze.com/shows/${id}?embed=nextepisode`, null)));
  picked.forEach(s => {
    const e = s && s._embedded && s._embedded.nextepisode;
    if(e && inWeek(e.airdate)) add(s, e, true);
  });

  // the schedule, narrowed by genre and language; skipped when only picked shows were chosen
  if(!F.ids.length || F.genres.length || F.langs.length){
    const got = await getJSONAll(days.flatMap(dt => [   // was all at once (getJSONAll)
      `https://api.tvmaze.com/schedule/web?date=${dt}`,
      ...F.countries.map(c => `https://api.tvmaze.com/schedule?country=${encodeURIComponent(c)}&date=${dt}`)
    ]), 3);
    missed = got.filter(x => !Array.isArray(x)).length;
    const lists = got.map(x => Array.isArray(x) ? x : []);
    // the series that pass everything but the rating and the genre / language picks
    const cands = lists.flat().map(e => ({e, s: e.show || (e._embedded && e._embedded.show) || {}})).filter(({e, s}) => {
      if(s.type && SKIP_TYPES.includes(s.type)) return false;
      if(s.genres && s.genres.includes('Soap')) return false;   // no daytime soaps
      if(!e.number || e.number < 1) return false;
      if(e.season && e.season > 15) return false;               // keep it to real series
      return true;
    });
    const rt = s => (s.rating && s.rating.average) || 0;
    const picks = s => (!F.genres.length || (s.genres || []).some(g => F.genres.includes(g)))
                    && (!F.langs.length || F.langs.includes(s.language));
    // when nothing passes, relax the filter instead of an empty card: a lower rating, then any rating,
    // then without the genre / language picks
    const passes = [s => rt(s) >= F.minRating && picks(s), s => rt(s) >= F.minRating - 1 && picks(s),
                    s => picks(s), s => rt(s) >= F.minRating];
    const before = out.length;
    for(const ok of passes){
      cands.forEach(({e, s}) => { if(ok(s)) add(s, e, false); });
      if(out.length > before) break;
    }
  }

  // nothing answered (offline): keep the saved list if one is shown
  // ... the shows' own list (in a rotation #week-list may hold another panel)
  if(NET_OK === answered && (WEEK_POOL.length
     || (CONFIG.panels.length < 2 && document.querySelector('#week-list li:not(.empty)')))) return false;
  if(out.length){                                   // keep the last good list on a failed refresh
    // with no genres, languages or picked shows, the most popular first (TVMaze's weight; a streaming
    // release a little ahead), premieres before them; with picks, as before: premieres, then by date
    const deflt = !F.ids.length && !F.genres.length && !F.langs.length;
    const pop = o => o.weight + (o.web ? 10 : 0);
    WEEK_POOL = out.sort((a,b)=> (b.picked - a.picked) || (b.prem - a.prem)
      || (deflt ? pop(b) - pop(a) : 0) || a.date.localeCompare(b.date)).slice(0, 50);
    WEEK_PAGE = 0;
    // a complete list is shared (WEEK_CACHE_KEY); a partial one is shown and fetched again in 2 minutes
    if(!missed){ try{ localStorage.setItem(WEEK_CACHE_KEY, JSON.stringify({at: Date.now(), pool: WEEK_POOL})); }catch(e){} }
  }
  if(missed && WEEK_RETRY < 3){ WEEK_RETRY++; setTimeout(loadWeek, 2*60*1000); }
  else if(!missed) WEEK_RETRY = 0;
  renderWeekPage(false);
  return NET_OK > answered;   // answered (see firstLoad)
}

const WEEK_ROWS = 5;
const WEEK_POSTERS = 4;   // the shows card's posters per page
let WEEK_POOL = [];
let WEEK_PAGE = 0;
let SHOWS_VISITED = false;   // swapPanel
let WEEK_RETRY = 0;          // loadWeek's quick retries of a partial list

function renderWeekPage(animate, own){
  if(CONFIG.detail){ if(CONFIG.detail === 'shows') renderDetail(); return; }   // as renderPanel
  if(CONFIG.panel !== 'shows') return;   // a late loadWeek must not paint over another panel of the rotation
  if(!WEEK_POOL.length){
    paintCard('<li class="empty">لا جديد هذا الأسبوع</li>', PANEL_TITLE.shows, animate, own);
    return;
  }
  // a row of WEEK_POSTERS posters (was a list of WEEK_ROWS names), each with its name and its episode
  // and day under it; a series without a poster gets a glass tile with its initial
  const start = (WEEK_PAGE * WEEK_POSTERS) % WEEK_POOL.length;
  const rows = [];
  for(let i = 0; i < Math.min(WEEK_POSTERS, WEEK_POOL.length); i++){
    rows.push(WEEK_POOL[(start + i) % WEEK_POOL.length]);
  }
  paintCard('<li class="posters">' + rows.map(o => {   // through paintCard
    const sub = [o.n ? 'الحلقة ' + ar(o.n) : '', showDay(o, true)].filter(Boolean).join(' · ') || esc(o.net || '');
    return `<div class="pt"><div class="pp">${posterImg(o)}</div><div class="pn" dir="auto">${esc(o.name)}</div>`
         + `<div class="ps">${sub}</div></div>`;
  }).join('') + '</li>', PANEL_TITLE.shows, animate, own);
}
// a series' poster (TVMaze image.medium) or, without one, its initial on the glass. The box keeps its
// 2:3 size before the image arrives (no layout jump); a poster that fails to load leaves the initial showing.
function posterImg(o){
  const ini = `<b class="pi" dir="auto">${esc(String(o.name || '').trim().charAt(0).toUpperCase())}</b>`;
  return ini + (o.img ? `<img src="${esc(o.img)}" alt="" decoding="async" onerror="this.remove()">` : '');
}
// the day an episode airs: الليلة / غداً / the weekday (short on the card); '' without a date
function showDay(o, short){
  const tz = CONFIG.timezone, ymd = d => new Intl.DateTimeFormat('en-CA', {timeZone: tz}).format(d);
  const at = o.at ? new Date(o.at) : null, ok = at && Number.isFinite(at.getTime());
  const day = ok ? ymd(at) : o.date;
  if(!day) return '';
  if(day === ymd(new Date())) return 'الليلة';
  if(day === ymd(new Date(Date.now() + 86400000))) return 'غداً';
  return new Intl.DateTimeFormat(GREG, {timeZone: ok ? tz : 'UTC', weekday: short ? 'short' : 'long'})
    .format(ok ? at : new Date(day + 'T12:00:00Z'));
}

// ---- the card beside the clock: one of several contents, picked in the app
let FORECAST = [];
let WX_NOW = null, WX_HOURS = [];   // current conditions and the next 12 hours (detail page only)
let LIST_PAGE = 0;
const PANEL_TITLE = {shows:'هذا الأسبوع', prayers:'مواقيت اليوم', forecast:'الأيام القادمة', matches:'مباريات فرقك',
  standings:'ترتيب دوري روشن', news:'أخبار السعودية', tech:'أخبار التقنية والذكاء الاصطناعي'};   // last three

// the card's paint, shared by every panel. A rotation (swapPanel) fades the list and the title out,
// then paints the next panel and slides it in; while that runs, any other redraw waits (one is kept) and runs
// when it ends. A redraw that would show exactly what is shown does nothing, so it never cuts a slide-in short.
const CARD_OUT_MS = 600;      // .week.out: the fade-out
const CARD_IN_MS = 1700;      // weekIn 1.1 s + .6 s delay of the sixth row
const CARD_STILL = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
let CARD_BUSY_UNTIL = 0, CARD_TIMER = 0, CARD_PENDING = null, CARD_HTML = null;
function cardBusy(ms, then){
  CARD_BUSY_UNTIL = Date.now() + ms;
  clearTimeout(CARD_TIMER);
  CARD_TIMER = setTimeout(then, ms);
}
function cardIdle(){
  CARD_BUSY_UNTIL = 0;
  if(CARD_PENDING === null) return;
  const a = CARD_PENDING; CARD_PENDING = null;
  renderPanel(a);
}
function paintCard(html, title, animate, own){
  const ul = document.getElementById('week-list'), hd = document.getElementById('week-hd');
  if(!own && Date.now() < CARD_BUSY_UNTIL){ CARD_PENDING = !!(CARD_PENDING || animate); return; }
  if(!animate && html === CARD_HTML && (title == null || hd.textContent === title)) return;
  if(title != null) hd.textContent = title;
  ul.innerHTML = html;
  CARD_HTML = html;
  ul.classList.remove('flip');
  if(animate && !CARD_STILL){ void ul.offsetWidth; ul.classList.add('flip'); cardBusy(CARD_IN_MS, cardIdle); }
}
// a rotation passes over a panel with nothing to show (its list empty: not loaded yet, failed, or no
// series this week) instead of showing it blank; prayers, matches and verse always have rows or their own message
function cardHasData(P){
  if(P === 'shows') return WEEK_POOL.length > 0;
  if(P === 'forecast') return FORECAST.length > 0;
  if(P === 'standings') return STANDINGS.length > 0;
  if(isNewsPanel(P)) return (NEWS[P] || []).length > 0;   // news, local, tech
  return true;
}
// the index of the panel d steps on from i in list L (wrapping) that has data; i when none has
function rotNext(L, i, d){
  for(let n = 1; n < L.length; n++){
    const k = ((i + d*n) % L.length + L.length) % L.length;
    if(cardHasData(L[k])) return k;
  }
  return i;
}
// a rotation's switch to panel P
function swapPanel(P){
  const card = document.querySelector('.week');
  const show = () => {
    // the shows turn a page at each visit of a rotation (the later visits show the next five)
    if(P === 'shows' && CONFIG.panel !== 'shows' && WEEK_POOL.length > WEEK_POSTERS && SHOWS_VISITED) WEEK_PAGE++;
    if(P === 'shows') SHOWS_VISITED = true;
    CONFIG.panel = P;
    LIST_PAGE = 0;
    CARD_PENDING = null;   // this paint is fresh: what waited during the fade-out is in it
    renderPanel(true, true);
    newsFlipArm();   // a news panel turns to its second page halfway through the slot
    if(card) card.classList.remove('out');
    if(CARD_BUSY_UNTIL && Date.now() >= CARD_BUSY_UNTIL) cardIdle();   // nothing to slide (reduced motion)
  };
  if(CARD_STILL || !card){ show(); return; }
  card.classList.add('out');
  cardBusy(CARD_OUT_MS, show);
}

// the rotation indicator under a rotating card: one dot per panel (RTL: the first on the right), the
// current one gold (rotMark), and a 2px line that fills from the right over CONFIG.rotateMs, started again at every
// switch (rotRestart) and stopped where it is while the launcher holds the rotation (rotFreeze). A CSS transition on
// transform: no script runs per frame. Hidden on a card with a single panel (rotInit is not called).
function rotInit(list){
  const el = document.getElementById('rot'), dots = document.getElementById('rot-dots');
  if(!el || !dots || list.length < 2) return;
  dots.innerHTML = list.map(() => '<b></b>').join('');
  el.hidden = false;
}
function rotMark(k){
  const dots = document.getElementById('rot-dots');
  if(dots) Array.from(dots.children).forEach((b, j) => b.classList.toggle('on', j === k));
}
function rotRestart(){
  const el = document.getElementById('rot'), f = document.getElementById('rot-fill');
  if(!el || !f || el.hidden) return;
  f.style.transition = 'none';
  f.style.transform = 'scaleX(0)';
  void f.offsetWidth;   // the empty line is applied before the new fill starts
  f.style.transition = 'transform ' + CONFIG.rotateMs + 'ms steps(' + Math.max(1, Math.round(CONFIG.rotateMs/1000)) + ', end)';   // one step per second
  f.style.transform = 'scaleX(1)';
}
function rotFreeze(){
  const f = document.getElementById('rot-fill');
  if(!f) return;
  const m = getComputedStyle(f).transform;   // where the running transition is now
  f.style.transition = 'none';
  f.style.transform = m && m !== 'none' ? m : 'scaleX(0)';
}

function renderPanel(animate, own){   // own = the rotation's own paint (paintCard)
  if(CONFIG.detail){ renderDetail(); return; }   // the full-screen page instead of the card
  const P = CONFIG.panel;
  if(P === 'shows'){ renderWeekPage(animate, own); return; }
  let rows = [], title = null;
  if(P === 'prayers') rows = prayerRows();
  else if(P === 'forecast') rows = forecastRows();
  else if(P === 'matches') rows = matchRows();
  else if(P === 'standings') rows = standingRows();
  else if(isNewsPanel(P)) rows = newsRows(P);
  else if(P === 'verse'){ const q = quoteOfDay(); title = q.title; rows = q.rows; }
  if(PANEL_TITLE[P]) title = PANEL_TITLE[P];
  if(P === 'local') title = localTitle();   // «أخبار <city>»
  if(P === 'forecast' && CONFIG.city) title += ' · ' + CONFIG.city;   // whose weather it is
  if(!rows.length){
    paintCard(`<li class="empty">${P === 'matches' ? 'لا مباريات هذا الأسبوع' : 'لا تتوفر بيانات الآن'}</li>`, title, animate, own);
    return;
  }
  if(P === 'matches' && rows.length > WEEK_ROWS){        // page through, like the shows
    const start = (LIST_PAGE * WEEK_ROWS) % rows.length;
    rows = Array.from({length: WEEK_ROWS}, (_, i) => rows[(start + i) % rows.length]);
  }
  if(isNewsPanel(P) && rows.length > NEWS_ROWS){   // one page of news
    const start = (LIST_PAGE % Math.ceil(rows.length / NEWS_ROWS)) * NEWS_ROWS;
    rows = rows.slice(start, start + NEWS_ROWS);
  }
  paintCard(rows.join(''), title, animate, own);
}

function prayerRows(){
  if(!DAY_TIMES) return [];
  const p = riyadhParts(), now = p.h * 60 + p.mi;
  const names = {Fajr:'الفجر', Sunrise:'الشروق', Dhuhr:isFriday() ? 'الجمعة' : 'الظهر', Asr:'العصر', Maghrib:'المغرب', Isha:'العشاء'};
  let next = null;
  return Object.keys(names).filter(k => DAY_TIMES[k]).map(k => {
    const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number);
    const at = h * 60 + mi;
    let cls = at < now ? 'past' : '';
    if(at >= now && !next){ next = k; cls = 'next'; }
    return `<li class="${cls}"><span>${names[k]}</span><span class="dt">${fmt12(h, mi)}</span></li>`;
  });
}

function forecastRows(){
  return FORECAST.slice(0, 5).map((d, i) => {
    const day = i === 0 ? 'اليوم' : i === 1 ? 'غداً'
      : new Intl.DateTimeFormat(GREG, {timeZone:'UTC', weekday:'long'}).format(new Date(d.date + 'T12:00:00Z'));
    return `<li><span>${day}</span><span class="ep">${WX_CODES[d.code] || ''}</span>`
         + `<span class="dt">${ar(Math.round(d.hi))}° / ${ar(Math.round(d.lo))}°</span></li>`;
  });
}

// every followed team's games this week, plus results from the last day, in time order
function matchRows(){
  const now = Date.now(), seen = new Set(), evs = [];
  CONFIG.teamIds.forEach(id => {
    const next = NEXT_LIST[id] || (MATCHES[id] ? [MATCHES[id]] : []);
    next.forEach(ev => { if(ev && ev.idEvent && !seen.has(ev.idEvent)){ seen.add(ev.idEvent); evs.push(MATCHES[id] && MATCHES[id].idEvent === ev.idEvent ? MATCHES[id] : ev); } });
    resultsFor(id).forEach(ev => { if(!seen.has(ev.idEvent)){ seen.add(ev.idEvent); evs.push(ev); } });
  });
  const day = d => new Intl.DateTimeFormat(GREG, {timeZone:CONFIG.timezone, weekday:'long'}).format(d);
  const today = new Intl.DateTimeFormat('en-CA', {timeZone:CONFIG.timezone}).format(new Date());
  return evs.map(ev => ({ev, t: toDate(ev).getTime()}))
    .filter(x => finishedRecently(x.ev, now)
      || (now < x.t + 2.5*3600000 && !FINAL.includes((x.ev.strStatus || '').toUpperCase())
          && x.t - now <= CONFIG.weekWindowDays * 86400000))
    .sort((a, b) => a.t - b.t)
    .map(({ev, t}) => {
      const d = new Date(t), scored = ev.intHomeScore != null && ev.intAwayScore != null;
      const mid = scored && now >= t ? ` <span class="sc">${ar(+ev.intHomeScore)} - ${ar(+ev.intAwayScore)}</span> ` : ' × ';
      const p = new Intl.DateTimeFormat('en-GB', {timeZone:CONFIG.timezone, hour:'2-digit', minute:'2-digit', hour12:false})
        .formatToParts(d).reduce((a, x) => (a[x.type] = x.value, a), {});
      const when = finishedRecently(ev, now) ? 'انتهت'
        : now >= t ? '<span class="live">مباشر</span>'
        : (new Intl.DateTimeFormat('en-CA', {timeZone:CONFIG.timezone}).format(d) === today ? 'اليوم' : day(d))
          + ' ' + fmt12(+p.hour % 24, +p.minute);
      return `<li><span>${esc(teamAr(ev.strHomeTeam))}${mid}${esc(teamAr(ev.strAwayTeam))}</span><span class="dt">${when}</span></li>`;
    });
}

// ---- standings, news, local news and tech panels
// Saudi Pro League table from ESPN (no key). Names: "Al Hilal", "Al Qadsiah", "Neom SC"; TheSportsDB says "Al-Hilal".
const STANDINGS_URL = 'https://site.api.espn.com/apis/v2/sports/soccer/ksa.1/standings';
const standKey = s => String(s || '').toLowerCase().normalize('NFD')   /* accents fall to the next step */
  .replace(/[^a-z0-9]+/g, '').replace(/^al/, '').replace(/(sc|fc|club)$/, '');
const STAND_AR = {};
for(const [en, a] of Object.entries(TEAM_AR)){ const k = standKey(en); if(k && !(k in STAND_AR)) STAND_AR[k] = a; }   // first entry wins
let STANDINGS = [];   // [{rank, name, gp, pts}] in table order

function standingsFrom(j){
  const es = (j && j.children && j.children[0] && j.children[0].standings && j.children[0].standings.entries) || [];
  return es.map(e => {
    const st = {};
    (e.stats || []).forEach(s => { if(s && s.name) st[s.name] = s; });
    const num = k => { const s = st[k]; if(!s) return NaN; return s.value != null ? +s.value : parseFloat(s.displayValue); };
    return {rank: num('rank'), name: (e.team && (e.team.displayName || e.team.name)) || '', gp: num('gamesPlayed'), pts: num('points'),
            espnId: e.team && e.team.id != null ? String(e.team.id) : '',   // espnId, for the team schedules
            // the detail page's full table
            w: num('wins'), d: num('ties'), l: num('losses'), gf: num('pointsFor'), ga: num('pointsAgainst'), gd: num('pointDifferential')};
  }).filter(x => x.name && Number.isFinite(x.rank)).sort((a, b) => a.rank - b.rank);
}

// one request at a time; loadMatches waits for it too (the ESPN ids of the followed clubs)
let STAND_P = null;
function loadStandings(){
  // resolves to true when ESPN answered with a table (see firstLoad)
  if(!STAND_P){ STAND_P = loadStandingsNow().then(ok => { STAND_P = null; return ok; }, () => { STAND_P = null; return false; }); }
  return STAND_P;
}
async function loadStandingsNow(){
  let rows;
  try{
    const r = await fetchT(STANDINGS_URL, 15000);
    if(!r.ok) throw 0;
    rows = standingsFrom(await r.json());
    if(rows.length) STANDINGS = rows;               // keep the last good table on a failed refresh
  }catch(e){ return false; }
  if(CONFIG.panel === 'standings') renderPanel(false);
  return rows.length > 0;
}

// English names of the followed teams, from whatever match data is loaded
function followedKeys(){
  const ids = new Set(CONFIG.teamIds.map(String)), out = new Set();
  const add = ev => {
    if(!ev) return;
    if(ids.has(String(ev.idHomeTeam)) && ev.strHomeTeam) out.add(standKey(ev.strHomeTeam));
    if(ids.has(String(ev.idAwayTeam)) && ev.strAwayTeam) out.add(standKey(ev.strAwayTeam));
  };
  [MATCHES, KEPT].forEach(o => Object.values(o).forEach(v => (Array.isArray(v) ? v : [v]).forEach(add)));
  [NEXT_LIST, RESULTS].forEach(o => Object.values(o).forEach(l => (l || []).forEach(add)));
  Object.values(ESPN_TEAMS).forEach(t => out.add(standKey(t.name)));   // ESPN clubs by their table name
  return out;
}

// the top of the table, but every followed team stays visible: they replace the lowest other rows
function pickStandings(list, isFollowed, n){
  const fol = list.filter(isFollowed).slice(0, n);
  const others = list.filter(x => !isFollowed(x)).slice(0, n - fol.length);
  return list.filter(x => fol.includes(x) || others.includes(x));
}

function standingRows(){
  const keys = followedKeys(), isF = x => keys.has(standKey(x.name));
  const n0 = v => ar(Number.isFinite(v) ? Math.round(v) : 0);
  return pickStandings(STANDINGS, isF, WEEK_ROWS).map(x =>
    `<li class="${isF(x) ? 'next' : ''}"><span>${n0(x.rank)}. ${esc(STAND_AR[standKey(x.name)] || x.name)}</span>`
    + `<span class="ep">${n0(x.gp)} مباراة</span><span class="dt">${n0(x.pts)} نقطة</span></li>`);
}

// feeds per panel, tried in order until one yields items. A publisher feed first
// (Google News can answer with a consent page instead of RSS from some regions, e.g. through a UK VPN),
// then Google News RSS, Saudi Arabic edition: top stories, and AI / technology from the last two days.
// source: the label shown for every item of that feed; null = Google style ("headline - Source").
// a general feed (Asharq Al-Awsat, ~300 items; BBC Arabic) keeps only Saudi headlines (filter)
// and counts only when at least `min` of them pass.
const SAUDI_RE = /السعودي|السعودية|الرياض|جدة|المملكة|ولي العهد|خادم الحرمين|نيوم|الرؤية|رؤية 2030|سعودي/;
// technology / AI headlines in a general feed ("آبل" only: "أبل" also matches "أبلغ")
const TECH_RE = /الذكاء الاصطناعي|ذكاء اصطناعي|تقني|تكنولوج|رقمي|آبل|غوغل|جوجل|مايكروسوفت|ميتا|سامسونغ|إنفيديا|أوبن إيه آي|شات جي بي تي|ChatGPT|OpenAI|روبوت|رقائق|أشباه الموصلات|سيبراني|آيفون/;
const NEWS_FEEDS = {
  news: [
    {url: 'https://aawsat.com/feed', source: 'الشرق الأوسط', filter: SAUDI_RE, min: 3},
    {url: 'https://www.alarabiya.net/feed/rss2/ar/saudi-today.xml', source: 'العربية'},
    {url: 'https://news.google.com/rss?hl=ar&gl=SA&ceid=SA:ar', source: null},
    {url: 'https://feeds.bbci.co.uk/arabic/middleeast/rss.xml', source: 'بي بي سي عربي', filter: SAUDI_RE, min: 1},
  ],
  tech: [
    {url: 'https://aitnews.com/feed/', source: 'عالم التقنية'},
    // fallbacks that answer through the TV's VPN (aitnews and Google may block or redirect it)
    {url: 'https://aawsat.com/feed', source: 'الشرق الأوسط', filter: TECH_RE, min: 3},
    {url: 'https://feeds.bbci.co.uk/arabic/scienceandtech/rss.xml', source: 'بي بي سي عربي', filter: TECH_RE, min: 2},
    {url: 'https://news.google.com/rss/search?q=%D8%A7%D9%84%D8%B0%D9%83%D8%A7%D8%A1+%D8%A7%D9%84%D8%A7%D8%B5%D8%B7%D9%86%D8%A7%D8%B9%D9%8A+OR+%D8%A7%D9%84%D8%AA%D9%82%D9%86%D9%8A%D8%A9+when:2d&hl=ar&gl=SA&ceid=SA:ar', source: null},
  ],
};
const NEWS = {news: [], tech: [], local: []};   // [{headline, source, t}] newest first
// the panels drawn as news items: Saudi news, the city's news (loadLocalNews) and tech
const isNewsPanel = P => P === 'news' || P === 'local' || P === 'tech';

// "headline - Source": the source is after the last " - ", unless the item's <source> (which can itself
// contain " - ", e.g. "ارقام : ... - تاسي") is what the title ends with
function splitNewsTitle(title, fallbackSource){
  const s = String(title || '').trim(), src = String(fallbackSource || '').trim();
  if(src && s.endsWith(' - ' + src) && s.length > src.length + 3)
    return {headline: s.slice(0, s.length - src.length - 3).trim(), source: src};
  const i = s.lastIndexOf(' - ');
  return i > 0 ? {headline: s.slice(0, i).trim(), source: s.slice(i + 3).trim()}
               : {headline: s, source: String(fallbackSource || '').trim()};
}

function agoAr(ms){
  if(!Number.isFinite(ms) || ms < 60000) return 'الآن';
  const m = Math.floor(ms / 60000);
  if(m < 60) return `قبل ${ar(m)} د`;
  const h = Math.floor(m / 60);
  if(h < 24) return `قبل ${ar(h)} س`;
  const d = Math.floor(h / 24);
  return d === 1 ? 'أمس' : d === 2 ? 'قبل يومين' : d <= 10 ? `قبل ${ar(d)} أيام` : `قبل ${ar(d)} يوماً`;
}

// a title may carry HTML tags / entities (e.g. "&lt;b&gt;" or "&amp;quot;" in the XML)
function plainText(s){
  s = String(s || '');
  if(/[<&]/.test(s)) s = new DOMParser().parseFromString(s, 'text/html').body.textContent || '';
  return s.replace(/\s+/g, ' ').trim();
}

// items: [{title, pubDate, source}] as read from the feed
// feedSource : the publisher label (titles are bare headlines), or null for Google style
function newsFrom(items, feedSource){
  return items.map(it => Object.assign(feedSource ? {headline: plainText(it.title), source: feedSource}
                                                  : splitNewsTitle(plainText(it.title), plainText(it.source)),
                                       {t: Date.parse(it.pubDate || ''), link: String(it.link || '').trim(), // link
                                        desc: it.description || ''}))
    .filter(x => x.headline)
    .sort((a, b) => (Number.isFinite(b.t) ? b.t : -Infinity) - (Number.isFinite(a.t) ? a.t : -Infinity))
    // six newest, shown NEWS_ROWS at a time; the detail page keeps NEWS_DETAIL_KEEP, each with its summary
    .slice(0, CONFIG.detail ? NEWS_DETAIL_KEEP : NEWS_KEEP)
    .map(x => { const desc = x.desc; delete x.desc; if(CONFIG.detail) x.summary = newsSummary(x, desc); return x; });
}
// the item's <description> as plain text. Google's repeats the headline and the source only: no summary.
function newsSummary(x, desc){
  let s = plainText(desc);
  if(s && s.startsWith(x.headline)){
    const rest = s.slice(x.headline.length).trim();
    s = !rest || rest === x.source || rest.length < 40 ? '' : rest;
  }
  return s;
}

// a news panel shows NEWS_ROWS items per page (three two-line items stay within the height of the six
// prayer rows on the screensaver and on the home card) and keeps up to NEWS_KEEP. In a rotation it shows page 1,
// then page 2 halfway through its slot (newsFlipArm); a single news card turns its page every NEWS_PAGE_MS.
const NEWS_ROWS = 3, NEWS_KEEP = 6, NEWS_PAGE_MS = 15000;
const NEWS_DETAIL_KEEP = 15;   // the detail page's list
let NEWS_VISIT = 0;   // counts the rotation's switches: a flip armed for one visit never runs in another
function newsPaged(P){ return isNewsPanel(P) && (NEWS[P] || []).length > NEWS_ROWS; }
function newsFlipArm(){
  const P = CONFIG.panel, visit = ++NEWS_VISIT;
  if(!isNewsPanel(P)) return;   // paged or not is decided at the flip: the list may arrive meanwhile
  setTimeout(() => {
    if(visit !== NEWS_VISIT || CONFIG.panel !== P || !newsPaged(P) || LIST_PAGE !== 0) return;
    LIST_PAGE = 1;
    renderPanel(true);   // waits in paintCard while a slide-in still runs (CARD_BUSY_UNTIL)
  }, CONFIG.rotateMs / 2);
}

function newsRow(x, now, kind){
  const ago = Number.isFinite(x.t) ? agoAr(now - x.t) : '';
  const dt = [newsSource(kind, x.source), ago].filter(Boolean).join(' · ');
  return `<li class="news-item"><span class="nw"${bidiAttr(kind, x.headline)}>${esc(x.headline)}</span><span class="dt">${dt}</span></li>`;   // class
}

function newsRows(kind){
  const now = Date.now();
  return (NEWS[kind] || []).map(x => newsRow(x, now, kind));
}

// one feed -> list ([] when the response is not an RSS document with items)
async function loadNewsFeed(feed){
  try{
    const r = await fetchT(feed.url, 15000);
    if(!r.ok) return [];
    const text = await r.text();
    if(!/<item[\s>]/.test(text)) return [];            // e.g. an HTML consent page
    const doc = new DOMParser().parseFromString(text, 'text/xml');
    if(doc.getElementsByTagName('parsererror').length) return [];
    const txt = (el, tag) => { const n = el.getElementsByTagName(tag)[0]; return n ? n.textContent : ''; };
    // with a filter, only the matching items are read further (a 300-item feed keeps a few dozen)
    const items = [];
    for(const it of Array.from(doc.getElementsByTagName('item'))){
      const title = txt(it, 'title');
      if(feed.filter && !feed.filter.test(plainText(title))) continue;
      items.push({title, pubDate: txt(it, 'pubDate'), source: feed.source ? '' : txt(it, 'source'),
                  link: txt(it, 'link'), description: CONFIG.detail ? txt(it, 'description') : ''});
    }
    if(items.length < (feed.min || 1)) return [];
    return newsFrom(items, feed.source);
  }catch(e){ return []; }
}

async function loadNews(kind){
  let list = [];
  for(const feed of NEWS_FEEDS[kind] || []){          // in order, the first with items wins
    list = await loadNewsFeed(feed);
    if(list.length) break;
  }
  if(!list.length) return false;                      // keep the last good list on a failed refresh
  NEWS[kind] = list;
  if(CONFIG.panel === kind) renderPanel(false);
  return true;   // answered (see firstLoad)
}

// ---- local news: the city the TV is set to (#city, #lat, #lon)
// The place's English name, county and region come from a reverse geocoder (no key: BigDataCloud, then Nominatim,
// then Photon), asked once per lat/lon and kept in localStorage. A Saudi or other Arab city is searched in Arabic by
// the name the settings hold (#city), anywhere else in English. Each search: Google News RSS (the country's edition,
// the last 3 days), then Bing News RSS when Google gave fewer than LOCAL_FEW items (Google answers some VPN exits
// with HTTP 403 or a consent page; Bing gives the TV's WebView its news page, read as cards: bingCards). Still fewer
// for the city: the county (US) or the region too, e.g. «منطقة القصيم» for الرس. Kept: items that name the city (or
// that area), at most LOCAL_DAYS old, each story once, newest first. Titles stay in their language; one without
// Arabic letters gets dir="auto" (bidiAttr).
const AR_RE = /[\u0600-\u06FF]/;
const ARAB_CC = ['SA','AE','KW','QA','BH','OM','YE','IQ','JO','SY','LB','PS','EG','SD','LY','TN','DZ','MA','MR'];
const GN_EN = ['GB','CA','AU','IN','IE','NZ','ZA','SG','PH','PK','NG','KE','MY'];   // Google News editions in English
const LOCAL_FEW = 3, LOCAL_DAYS = 3;
// listings, not news: school sports schedules, obituaries, property, weather and directory pages
const LOCAL_JUNK = /^(MaxPreps|NFHS Network|Dignity Memorial|Legacy\.com|Realtor\.com|Zillow|Redfin|Trulia|Apartments\.com|IQAir|AccuWeather|Weather Underground|Psychology Today|Yelp|Tripadvisor)\b/i;
const localTitle = () => 'أخبار ' + CONFIG.city;
// an English title, source or summary of the city's news reads left to right; the other panels are unchanged
const bidiAttr = (P, s) => P === 'local' && s && !AR_RE.test(s) ? ' dir="auto"' : '';
const newsSource = (P, s) => !s ? '' : P === 'local' ? `<bdi>${esc(s)}</bdi>` : esc(s);   // bdi: not a span (.week li span rules)

async function fetchJson(url){
  const r = await fetchT(url, 12000);
  if(!r.ok) throw 'HTTP ' + r.status;
  return r.json();
}
// each -> {name, county, region, cc} in English; county: the area between the region and the city, if any
const GEO_AT = () => `lat=${CONFIG.latitude}&lon=${CONFIG.longitude}`;
const BDC = lang => `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}&localityLanguage=${lang}`;
const GEOCODERS = [
  ['bigdatacloud', async () => {
    const j = await fetchJson(BDC('en'));
    const adm = (j.localityInfo && j.localityInfo.administrative) || [];
    // "city" can be a bigger neighbour (a town comes back as its neighbour in city, itself in locality): the
    // locality, when it is a place of its own in the administrative list
    const name = j.locality && adm.some(a => a.name === j.locality) ? j.locality : (j.city || j.locality || '');
    const county = adm.filter(a => a.adminLevel >= 5 && a.adminLevel <= 7 && a.name !== name && a.name !== j.principalSubdivision).pop();
    return {name, county: county ? county.name : '', region: j.principalSubdivision || '', cc: j.countryCode || ''};
  }],
  // the WebView's own User-Agent (a page cannot set one); asked only when BigDataCloud failed, once per place
  ['nominatim', async () => {
    const j = await fetchJson(`https://nominatim.openstreetmap.org/reverse?${GEO_AT()}&format=jsonv2&zoom=10&accept-language=en`);
    const a = j.address || {};
    return {name: a.city || a.town || a.village || a.municipality || a.hamlet || '', county: a.county || a.state_district || '',
            region: a.state || a.region || '', cc: String(a.country_code || '').toUpperCase()};
  }],
  ['photon', async () => {
    const f = ((await fetchJson(`https://photon.komoot.io/reverse?${GEO_AT()}&lang=en`)).features || [])[0];
    const q = (f && f.properties) || {};
    return {name: q.city || q.town || q.village || '', county: q.county || '', region: q.state || '', cc: String(q.countrycode || '').toUpperCase()};
  }],
];
let LOCAL_PLACE = null;
async function localPlace(){
  if(LOCAL_PLACE) return LOCAL_PLACE;
  const key = 'sauditv-place:' + CONFIG.latitude + ',' + CONFIG.longitude;
  try{ const c = JSON.parse(localStorage.getItem(key) || 'null'); if(c && c.name) return LOCAL_PLACE = c; }catch(e){}
  for(const [label, ask] of GEOCODERS){
    let p = null;
    try{ p = await ask(); }catch(e){ console.warn('SaudiTV: local news: no place from ' + label + ' (' + e + ')'); }
    if(!p || !p.name) continue;
    // an Arab country: the region's Arabic name too, for the wider search (kept only once it is known)
    if(ARAB_CC.includes(p.cc)){
      try{ p.regionAr = (await fetchJson(BDC('ar'))).principalSubdivision || ''; }
      catch(e){
        try{ p.regionAr = ((await fetchJson(`https://nominatim.openstreetmap.org/reverse?${GEO_AT()}&format=jsonv2&zoom=10&accept-language=ar`)).address || {}).state || ''; }
        catch(e2){ console.warn('SaudiTV: local news: no Arabic region name (' + e + '; ' + e2 + ')'); return p; }
      }
    }
    try{ localStorage.setItem(key, JSON.stringify(p)); }catch(e){}
    return LOCAL_PLACE = p;
  }
  return null;
}

// the searches for place p (null: the geocoders did not answer): the city, then the wider area.
// [{what, q, ed, mkt, terms}]: q the search, ed Google's edition, mkt Bing's market (else the VPN exit's, e.g.
// en-GB, which matched «جريدة الرياض» rather than Riyadh), terms the names an item must contain one of
function localSearches(p){
  const cc = p ? p.cc : '';
  const arabic = AR_RE.test(CONFIG.city) && (!cc || ARAB_CC.includes(cc));
  if(!arabic && !(p && p.name)) return [];
  const ed = arabic ? 'hl=ar&gl=SA&ceid=SA:ar' : GN_EN.includes(cc) ? `hl=en-${cc}&gl=${cc}&ceid=${cc}:en` : 'hl=en-US&gl=US&ceid=US:en';
  const mkt = arabic ? 'ar-SA' : GN_EN.includes(cc) ? 'en-' + cc : 'en-US';
  const name = arabic ? CONFIG.city : p.name;
  const out = [{what: 'city', q: arabic ? `"${name}"` : `"${name}" ${p.region || ''}`.trim(), ed, mkt, terms: [name]}];
  const area = arabic ? (p && p.regionAr) : (p.county || p.region);
  // the area's own name without its kind, as headlines write it ("Orange County" -> "Orange", «أمطار القصيم»)
  const core = String(area || '').replace(/\s+(County|Parish|Borough|District|Governorate|Province|Region)$/i, '')
    .replace(/^(منطقة|محافظة|إمارة|ولاية)\s+/, '').trim();
  if(core && core !== name)
    out.push({what: 'area', q: `"${area}"` + (cc === 'US' && p.county && p.region ? ' ' + p.region : ''), ed, mkt, terms: [name, core]});
  return out;
}

// does the text name the place? English: the whole word, as written ("Reading", not "reading");
// Arabic: also joined to a prefix (بالرياض، والرياض) and after لـ, which drops the alif (للرياض)
function namesPlace(text, term){
  if(!term || !text) return false;
  if(AR_RE.test(term)) return text.includes(term) || (term.startsWith('ال') && text.includes('لل' + term.slice(2)));
  return new RegExp('(^|[^A-Za-z])' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![A-Za-z])').test(text);
}

// Bing's link to an item goes through its redirect (apiclick.aspx?...&url=<the article>): the article itself
function unBing(link){
  try{ const u = new URL(link); if(/(^|\.)bing\.com$/.test(u.hostname) && /^https?:/.test(u.searchParams.get('url') || '')) return u.searchParams.get('url'); }catch(e){}
  return link;
}
// Bing answers a phone's browser (the TV's WebView says "Mobile") with its news page instead of RSS: the first
// results as cards, each with url, data-title, data-author and an age (en "45m" "3h" "2d", ar «12 من الساعات»)
function bingAge(s, now){
  s = String(s || '').trim().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  const n = parseInt(s, 10);
  if(!(n >= 0)) return NaN;
  const ms = /^\d+\s*m(in)?$/i.test(s) || /دقي|دقائق/.test(s) ? 6e4 : /^\d+\s*h$/i.test(s) || /ساع/.test(s) ? 36e5
           : /^\d+\s*d$/i.test(s) || /يوم|أيام/.test(s) ? 864e5 : NaN;   // months, years: left out
  return now - n * ms;
}
function bingCards(text){
  const doc = new DOMParser().parseFromString(text, 'text/html'), now = Date.now();
  return Array.from(doc.querySelectorAll('[data-title][url]')).map(c => ({
    headline: plainText(c.getAttribute('data-title')), source: plainText(c.getAttribute('data-author')),
    t: bingAge((c.querySelector('.timestamp') || {}).textContent, now), link: unBing(String(c.getAttribute('url') || '').trim()), desc: ''}));
}
// what came back instead of RSS, for the log: where it ended up and its title (a consent page, a block page)
function notRss(r, text){
  let at = '';
  try{ const u = new URL(r.url); at = u.host + u.pathname; }catch(e){}
  const t = /<title[^>]*>([^<]{0,60})/i.exec(text);
  return 'not RSS: ' + at + (t ? ' "' + t[1].trim() + '"' : '');
}

// one RSS search -> [{headline, source, t, link, desc}]; throws when nothing usable answered (e.g. a consent page)
async function localFeed(kind, url){
  const r = await fetchT(url, 15000);
  if(!r.ok) throw 'HTTP ' + r.status;
  const text = await r.text();
  if(!/<item[\s>]/.test(text)){
    if(/<rss[\s>]/.test(text)) return [];   // no results
    const cards = kind === 'bing' ? bingCards(text) : [];
    if(cards.length) return cards;
    throw notRss(r, text);   // e.g. a consent page
  }
  const doc = new DOMParser().parseFromString(text, 'text/xml');
  if(doc.getElementsByTagName('parsererror').length) throw 'bad XML';
  const txt = (el, tag) => { const n = el.getElementsByTagName(tag)[0]; return n ? n.textContent : ''; };
  return Array.from(doc.getElementsByTagName('item')).map(it => {
    const title = plainText(txt(it, 'title')), t = Date.parse(txt(it, 'pubDate') || '');
    let link = txt(it, 'link').trim();
    if(kind === 'google'){   // "headline - Source"; the description is only links to the same story: no summary
      const s = splitNewsTitle(title, plainText(txt(it, 'source')));
      return {headline: s.headline, source: s.source, t, link, desc: ''};
    }
    // Bing: the publisher in <News:Source>, a summary in <description>, the link through Bing's redirect
    const src = plainText(txt(it, 'News:Source'));
    link = unBing(link);
    return {headline: src && title.endsWith(' - ' + src) ? title.slice(0, -src.length - 3).trim() : title, source: src, t, link,
            desc: plainText(txt(it, 'description'))};
  });
}

const localKey = x => x.headline.toLowerCase().replace(/[\s"'“”‘’«».,:;!?()|\-–—]+/g, '');
// a and b together: each story once (same headline, or same link), newest first
function localMerge(a, b){
  const seen = new Set();
  return a.concat(b).filter(x => {
    const k = localKey(x);
    if(seen.has(k) || (x.link && seen.has(x.link))) return false;
    seen.add(k); if(x.link) seen.add(x.link);
    return true;
  }).sort((x, y) => y.t - x.t);
}

// a search s: Google, then Bing while fewer than LOCAL_FEW. Resolves to {items, answered, used}
async function localSearch(s){
  const since = Date.now() - LOCAL_DAYS * 86400000;
  const keep = x => x.headline && Number.isFinite(x.t) && x.t >= since && x.t <= Date.now() + 3600000
    && !LOCAL_JUNK.test(x.source || '') && !/\bobituary\b/i.test(x.headline)
    && s.terms.some(n => namesPlace(x.headline, n) || namesPlace(x.desc, n));
  const feeds = [
    ['google', `https://news.google.com/rss/search?q=${encodeURIComponent(s.q + ' when:' + LOCAL_DAYS + 'd')}&${s.ed}`],
    ['bing', `https://www.bing.com/news/search?q=${encodeURIComponent(s.q)}&format=rss&qft=${encodeURIComponent('interval="8"')}&mkt=${s.mkt}`],   // the past week
  ];
  let items = [], answered = false;
  const used = [];
  for(const [kind, url] of feeds){
    try{
      const got = (await localFeed(kind, url)).filter(keep);
      answered = true;
      if(got.length){ used.push(kind + ' (' + s.what + ')'); items = localMerge(items, got); }
    }catch(e){ console.warn('SaudiTV: local news: ' + kind + ' failed for the ' + s.what + ' (' + e + ')'); }
    if(items.length >= LOCAL_FEW) break;
  }
  return {items, answered, used};
}

// resolves to false when nothing answered (see firstLoad), or nothing was found while the place is still unknown
// (the geocoders are asked again); an answer with no recent item empties the card (cardHasData then passes over it)
let LOCAL_LOG = '';
async function loadLocalNews(){
  const place = await localPlace(), searches = localSearches(place);
  let items = [], answered = false;
  const used = [];
  for(const s of searches){   // the city; the wider area only while there are fewer than LOCAL_FEW
    const r = await localSearch(s);
    answered = answered || r.answered;
    items = localMerge(items, r.items);
    used.push(...r.used);
    if(items.length >= LOCAL_FEW) break;
  }
  if(!answered || (!place && !items.length)) return false;   // keep the last good list
  // which sources served it, in the TV's log when that changes (a VPN exit can block one)
  const how = used.join(', ') || 'none';
  if(how !== LOCAL_LOG){ LOCAL_LOG = how; console.warn('SaudiTV: local news from ' + how + ': ' + items.length + ' items'); }
  NEWS.local = items.slice(0, CONFIG.detail ? NEWS_DETAIL_KEEP : NEWS_KEEP).map(x => {
    const desc = x.desc; delete x.desc;
    if(CONFIG.detail) x.summary = desc ? newsSummary(x, desc) : '';
    return x;
  });
  if(CONFIG.panel === 'local') renderPanel(false);
  return true;
}

// a loader's first run that got no answer tries again soon, instead of leaving the panel empty until
// its regular refresh (30 min; standings 3 h, prayers 6 h). The page often starts with no network: the launcher
// started while the TV sleeps (Low Power Standby blocks the app: every request ends in ERR_NAME_NOT_RESOLVED),
// or right after power-on, before Wi-Fi and the VPN are up. Every 60 s for 10 tries, then every 5 min, until one
// answer arrives; the regular refresh carries on as before. `load` resolves to false when nothing answered.
function firstLoad(load, name){
  let tries = 0;
  const run = () => Promise.resolve().then(load).catch(() => false).then(ok => {
    if(ok !== false) return;
    const ms = ++tries < 10 ? 60*1000 : 5*60*1000;
    console.warn('SaudiTV: no answer for ' + name + ', trying again in ' + ms/1000 + ' s');
    setTimeout(run, ms);
  });
  run();
}

// Start the loaders the panels in `list` need (the others are started by boot / bootWidget).
// matchesLoaded: the caller already loads the match data that standings uses to mark followed teams.
function startPanelData(list, matchesLoaded){
  if(list.includes('standings')){
    firstLoad(loadStandings, 'standings'); setInterval(loadStandings, 3*3600*1000);
    if(!matchesLoaded){ firstLoad(loadMatches, 'matches'); setInterval(loadMatches, 30*60*1000); }
  }
  ['news', 'tech'].forEach(k => { if(list.includes(k)){ firstLoad(() => loadNews(k), k); setInterval(() => loadNews(k), 30*60*1000); } });
  if(list.includes('local')){ firstLoad(loadLocalNews, 'local'); setInterval(loadLocalNews, 30*60*1000); }   // the city's news
  // the shows in a rotation (a single shows card is loaded by boot / cardStart)
  if(list.length > 1 && list.includes('shows')){ firstLoad(loadWeek, 'shows'); setInterval(loadWeek, 6*3600*1000); }
  // a single news card is only redrawn by its 30-min refresh: keep its "minutes ago" current
  if(CONFIG.panels.length <= 1 && list.some(isNewsPanel)){
    setInterval(() => { if(isNewsPanel(CONFIG.panel)) renderPanel(false); }, 5*60*1000);
    // and turn its page (three items each) every NEWS_PAGE_MS
    setInterval(() => { if(newsPaged(CONFIG.panel)){ LIST_PAGE++; renderPanel(true); } }, NEWS_PAGE_MS);
  }
}

"سورة يونس", "ayah": 62}, {"text": "وَمَا مِنْ دَابَّةٍ فِي الْأَرْضِ إِلَّا عَلَى اللَّهِ رِزْقُهَا وَيَعْلَمُ مُسْتَقَرَّهَا وَمُسْتَوْدَعَهَا كُلٌّ فِي كِتَابٍ مُبِينٍ", "surah": "سورة هود", "ayah": 6}, {"text": "وَأَقِمِ الصَّلَاةَ طَرَفَيِ النَّهَارِ وَزُلَفًا مِنَ اللَّيْلِ إِنَّ الْحَسَنَاتِ يُذْهِبْنَ السَّيِّئَاتِ ذَٰلِكَ ذِكْرَىٰ لِلذَّاكِرِينَ", "surah": "سورة هود", "ayah": 114}, {"text": "وَاصْبِرْ فَإِنَّ اللَّهَ لَا يُضِيعُ أَجْرَ الْمُحْسِنِينَ", "surah": "سورة هود", "ayah": 115}, {"text": "قَالَ إِنَّمَا أَشْكُو بَثِّي وَحُزْنِي إِلَى اللَّهِ وَأَعْلَمُ مِنَ اللَّهِ مَا لَا تَعْلَمُونَ", "surah": "سورة يوسف", "ayah": 86}, {"text": "يَا بَنِيَّ اذْهَبُوا فَتَحَسَّسُوا مِنْ يُوسُفَ وَأَخِيهِ وَلَا تَيْأَسُوا مِنْ رَوْحِ اللَّهِ إِنَّهُ لَا يَيْأَسُ مِنْ رَوْحِ اللَّهِ إِلَّا الْقَوْمُ الْكَافِرُونَ", "surah": "سورة يوسف", "ayah": 87}, {"text": "رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِنْ ذُرِّيَّتِي رَبَّنَا وَتَقَبَّلْ دُعَاءِ", "surah": "سورة إبراهيم", "ayah": 40}, {"text": "رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ", "surah": "سورة إبراهيم", "ayah": 41}, {"text": "نَبِّئْ عِبَادِي أَنِّي أَنَا الْغَفُورُ الرَّحِيمُ", "surah": "سورة الحجر", "ayah": 49}, {"text": "فَسَبِّحْ بِحَمْدِ رَبِّكَ وَكُنْ مِنَ السَّاجِدِينَ", "surah": "سورة الحجر", "ayah": 98}, {"text": "وَإِنْ تَعُدُّوا نِعْمَةَ اللَّهِ لَا تُحْصُوهَا إِنَّ اللَّهَ لَغَفُورٌ رَحِيمٌ", "surah": "سورة النحل", "ayah": 18}, {"text": "إِنَّ اللَّهَ يَأْمُرُ بِالْعَدْلِ وَالْإِحْسَانِ وَإِيتَاءِ ذِي الْقُرْبَىٰ وَيَنْهَىٰ عَنِ الْفَحْشَاءِ وَالْمُنْكَرِ وَالْبَغْيِ يَعِظُكُمْ لَعَلَّكُمْ تَذَكَّرُونَ", "surah": "سورة النحل", "ayah": 90}, {"text": "مَنْ عَمِلَ صَالِحًا مِنْ ذَكَرٍ أَوْ أُنْثَىٰ وَهُوَ مُؤْمِنٌ فَلَنُحْيِيَنَّهُ حَيَاةً طَيِّبَةً وَلَنَجْزِيَنَّهُمْ أَجْرَهُمْ بِأَحْسَنِ مَا كَانُوا يَعْمَلُونَ", "surah": "سورة النحل", "ayah": 97}, {"text": "وَاخْفِضْ لَهُمَا جَنَاحَ الذُّلِّ مِنَ الرَّحْمَةِ وَقُلْ رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا", "surah": "سورة الإسراء", "ayah": 24}, {"text": "وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِلْمُؤْمِنِينَ وَلَا يَزِيدُ الظَّالِمِينَ إِلَّا خَسَارًا", "surah": "سورة الإسراء", "ayah": 82}, {"text": "إِذْ أَوَى الْفِتْيَةُ إِلَى الْكَهْفِ فَقَالُوا رَبَّنَا آتِنَا مِنْ لَدُنْكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا", "surah": "سورة الكهف", "ayah": 10}, {"text": "قَالَ لَا تَخَافَا إِنَّنِي مَعَكُمَا أَسْمَعُ وَأَرَىٰ", "surah": "سورة طه", "ayah": 46}, {"text": "فَتَعَالَى اللَّهُ الْمَلِكُ الْحَقُّ وَلَا تَعْجَلْ بِالْقُرْآنِ مِنْ قَبْلِ أَنْ يُقْضَىٰ إِلَيْكَ وَحْيُهُ وَقُلْ رَبِّ زِدْنِي عِلْمًا", "surah": "سورة طه", "ayah": 114}, {"text": "وَأْمُرْ أَهْلَكَ بِالصَّلَاةِ وَاصْطَبِرْ عَلَيْهَا لَا نَسْأَلُكَ رِزْقًا نَحْنُ نَرْزُقُكَ وَالْعَاقِبَةُ لِلتَّقْوَىٰ", "surah": "سورة طه", "ayah": 132}, {"text": "وَأَيُّوبَ إِذْ نَادَىٰ رَبَّهُ أَنِّي مَسَّنِيَ الضُّرُّ وَأَنْتَ أَرْحَمُ الرَّاحِمِينَ", "surah": "سورة الأنبياء", "ayah": 83}, {"text": "وَذَا النُّونِ إِذْ ذَهَبَ مُغَاضِبًا فَظَنَّ أَنْ لَنْ نَقْدِرَ عَلَيْهِ فَنَادَىٰ فِي الظُّلُمَاتِ أَنْ لَا إِلَٰهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ", "surah": "سورة الأنبياء", "ayah": 87}, {"text": "وَقُلْ رَبِّ اغْفِرْ وَارْحَمْ وَأَنْتَ خَيْرُ الرَّاحِمِينَ", "surah": "سورة المؤمنون", "ayah": 118}, {"text": "وَتَوَكَّلْ عَلَى الْحَيِّ الَّذِي لَا يَمُوتُ وَسَبِّحْ بِحَمْدِهِ وَكَفَىٰ بِهِ بِذُنُوبِ عِبَادِهِ خَبِيرًا", "surah": "سورة الفرقان", "ayah": 58}, {"text": "وَعِبَادُ الرَّحْمَٰنِ الَّذِينَ يَمْشُونَ عَلَى الْأَرْضِ هَوْنًا وَإِذَا خَاطَبَهُمُ الْجَاهِلُونَ قَالُوا سَلَامًا", "surah": "سورة الفرقان", "ayah": 63}, {"text": "وَإِذَا مَرِضْتُ فَهُوَ يَشْفِينِ", "surah": "سورة الشعراء", "ayah": 80}, {"text": "رَبِّ هَبْ لِي حُكْمًا وَأَلْحِقْنِي بِالصَّالِحِينَ", "surah": "سورة الشعراء", "ayah": 83}, {"text": "أَمَّنْ يُجِيبُ الْمُضْطَرَّ إِذَا دَعَاهُ وَيَكْشِفُ السُّوءَ وَيَجْعَلُكُمْ خُلَفَاءَ الْأَرْضِ أَإِلَٰهٌ مَعَ اللَّهِ قَلِيلًا مَا تَذَكَّرُونَ", "surah":
