h": 155}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ كَمَا كُتِبَ عَلَى الَّذِينَ مِنْ قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ", "surah": "سورة البقرة", "ayah": 183}, {"text": "حَافِظُوا عَلَى الصَّلَوَاتِ وَالصَّلَاةِ الْوُسْطَىٰ وَقُومُوا لِلَّهِ قَانِتِينَ", "surah": "سورة البقرة", "ayah": 238}, {"text": "مَنْ ذَا الَّذِي يُقْرِضُ اللَّهَ قَرْضًا حَسَنًا فَيُضَاعِفَهُ لَهُ أَضْعَافًا كَثِيرَةً وَاللَّهُ يَقْبِضُ وَيَبْسُطُ وَإِلَيْهِ تُرْجَعُونَ", "surah": "سورة البقرة", "ayah": 245}, {"text": "قَوْلٌ مَعْرُوفٌ وَمَغْفِرَةٌ خَيْرٌ مِنْ صَدَقَةٍ يَتْبَعُهَا أَذًى وَاللَّهُ غَنِيٌّ حَلِيمٌ", "surah": "سورة البقرة", "ayah": 263}, {"text": "الَّذِينَ يُنْفِقُونَ أَمْوَالَهُمْ بِاللَّيْلِ وَالنَّهَارِ سِرًّا وَعَلَانِيَةً فَلَهُمْ أَجْرُهُمْ عِنْدَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ", "surah": "سورة البقرة", "ayah": 274}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَأَقَامُوا الصَّلَاةَ وَآتَوُا الزَّكَاةَ لَهُمْ أَجْرُهُمْ عِنْدَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ", "surah": "سورة البقرة", "ayah": 277}, {"text": "وَإِنْ كَانَ ذُو عُسْرَةٍ فَنَظِرَةٌ إِلَىٰ مَيْسَرَةٍ وَأَنْ تَصَدَّقُوا خَيْرٌ لَكُمْ إِنْ كُنْتُمْ تَعْلَمُونَ", "surah": "سورة البقرة", "ayah": 280}, {"text": "رَبَّنَا إِنَّكَ جَامِعُ النَّاسِ لِيَوْمٍ لَا رَيْبَ فِيهِ إِنَّ اللَّهَ لَا يُخْلِفُ الْمِيعَادَ", "surah": "سورة آل عمران", "ayah": 9}, {"text": "الَّذِينَ يَقُولُونَ رَبَّنَا إِنَّنَا آمَنَّا فَاغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ النَّارِ", "surah": "سورة آل عمران", "ayah": 16}, {"text": "قُلِ اللَّهُمَّ مَالِكَ الْمُلْكِ تُؤْتِي الْمُلْكَ مَنْ تَشَاءُ وَتَنْزِعُ الْمُلْكَ مِمَّنْ تَشَاءُ وَتُعِزُّ مَنْ تَشَاءُ وَتُذِلُّ مَنْ تَشَاءُ بِيَدِكَ الْخَيْرُ إِنَّكَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", "surah": "سورة آل عمران", "ayah": 26}, {"text": "هُنَالِكَ دَعَا زَكَرِيَّا رَبَّهُ قَالَ رَبِّ هَبْ لِي مِنْ لَدُنْكَ ذُرِّيَّةً طَيِّبَةً إِنَّكَ سَمِيعُ الدُّعَاءِ", "surah": "سورة آل عمران", "ayah": 38}, {"text": "رَبَّنَا آمَنَّا بِمَا أَنْزَلْتَ وَاتَّبَعْنَا الرَّسُولَ فَاكْتُبْنَا مَعَ الشَّاهِدِينَ", "surah": "سورة آل عمران", "ayah": 53}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ حَقَّ تُقَاتِهِ وَلَا تَمُوتُنَّ إِلَّا وَأَنْتُمْ مُسْلِمُونَ", "surah": "سورة آل عمران", "ayah": 102}, {"text": "وَلْتَكُنْ مِنْكُمْ أُمَّةٌ يَدْعُونَ إِلَى الْخَيْرِ وَيَأْمُرُونَ بِالْمَعْرُوفِ وَيَنْهَوْنَ عَنِ الْمُنْكَرِ وَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ", "surah": "سورة آل عمران", "ayah": 104}, {"text": "وَسَارِعُوا إِلَىٰ مَغْفِرَةٍ مِنْ رَبِّكُمْ وَجَنَّةٍ عَرْضُهَا السَّمَاوَاتُ وَالْأَرْضُ أُعِدَّتْ لِلْمُتَّقِينَ", "surah": "سورة آل عمران", "ayah": 133}, {"text": "وَالَّذِينَ إِذَا فَعَلُوا فَاحِشَةً أَوْ ظَلَمُوا أَنْفُسَهُمْ ذَكَرُوا اللَّهَ فَاسْتَغْفَرُوا لِذُنُوبِهِمْ وَمَنْ يَغْفِرُ الذُّنُوبَ إِلَّا اللَّهُ وَلَمْ يُصِرُّوا عَلَىٰ مَا فَعَلُوا وَهُمْ يَعْلَمُونَ", "surah": "سورة آل عمران", "ayah": 135}, {"text": "وَمَا كَانَ قَوْلَهُمْ إِلَّا أَنْ قَالُوا رَبَّنَا اغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِي أَمْرِنَا وَثَبِّتْ أَقْدَامَنَا وَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ", "surah": "سورة آل عمران", "ayah": 147}, {"text": "إِنْ يَنْصُرْكُمُ اللَّهُ فَلَا غَالِبَ لَكُمْ وَإِنْ يَخْذُلْكُمْ فَمَنْ ذَا الَّذِي يَنْصُرُكُمْ مِنْ بَعْدِهِ وَعَلَى اللَّهِ فَلْيَتَوَكَّلِ الْمُؤْمِنُونَ", "surah": "سورة آل عمران", "ayah": 160}, {"text": "رَبَّنَا وَآتِنَا مَا وَعَدْتَنَا عَلَىٰ رُسُلِكَ وَلَا تُخْزِنَا يَوْمَ الْقِيَامَةِ إِنَّكَ لَا تُخْلِفُ الْمِيعَادَ", "surah": "سورة آل عمران", "ayah": 194}, {"text": "إِنْ تَجْتَنِبُوا كَبَائِرَ مَا تُنْهَوْنَ عَنْهُ نُكَفِّرْ عَنْكُمْ سَيِّئَاتِكُمْ وَنُدْخِلْكُمْ مُدْخَلًا كَرِيمًا", "surah": "سورة النساء", "ayah": 31}, {"text": "إِنَّ اللَّهَ لَا يَظْلِمُ مِثْقَالَ ذَرَّةٍ وَإِنْ تَكُ حَسَنَةً يُضَاعِفْهَا وَيُؤْتِ مِنْ لَدُنْهُ أَجْرًا عَظِيمًا", "surah": "سورة النساء", "ayah": 40}, {"text": "مَا يَفْعَلُ اللَّهُ بِعَذَابِكُمْ إِنْ شَكَرْتُمْ وَآمَنْتُمْ وَكَانَ اللَّهُ شَاكِرًا عَلِيمًا", "surah": "سورة النساء", "ayah": 147}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَابْتَغُوا إِلَيْهِ الْوَسِيلَةَ وَجَاهِدُوا فِي سَبِيلِهِ لَعَلَّكُمْ تُفْلِحُونَ", "surah": "سورة المائـدة", "ayah": 35}, {"text": "وَإِنْ يَمْسَسْكَ اللَّهُ بِضُرٍّ فَلَا كَاشِفَ لَهُ إِلَّا هُوَ وَإِنْ يَمْسَسْكَ بِخَيْرٍ فَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", "surah": "سورة الأنعام", "ayah": 17}, {"text": "وَمَا الْحَيَاةُ الدُّنْيَا إِلَّا لَعِبٌ وَلَهْوٌ وَلَلدَّارُ الْآخِرَةُ خَيْرٌ لِلَّذِينَ يَتَّقُونَ أَفَلَا تَعْقِلُونَ", "surah": "سورة الأنعام", "ayah": 32}, {"text": "لَا تُدْرِكُهُ الْأَبْصَارُ وَهُوَ يُدْرِكُ الْأَبْصَارَ وَهُوَ اللَّطِيفُ الْخَبِيرُ", "surah": "سورة الأنعام", "ayah": 103}, {"text": "مَنْ جَاءَ بِالْحَسَنَةِ فَلَهُ عَشْرُ أَمْثَالِهَا وَمَنْ جَاءَ بِالسَّيِّئَةِ فَلَا يُجْزَىٰ إِلَّا مِثْلَهَا وَهُمْ لَا يُظْلَمُونَ", "surah": "سورة الأنعام", "ayah": 160}, {"text": "يَا بَنِي آدَمَ خُذُوا زِينَتَكُمْ عِنْدَ كُلِّ مَسْجِدٍ وَكُلُوا وَاشْرَبُوا وَلَا تُسْرِفُوا إِنَّهُ لَا يُحِبُّ الْمُسْرِفِينَ", "surah": "سورة الأعراف", "ayah": 31}, {"text": "ادْعُوا رَبَّكُمْ تَضَرُّعًا وَخُفْيَةً إِنَّهُ لَا يُحِبُّ الْمُعْتَدِينَ", "surah": "سورة الأعراف", "ayah": 55}, {"text": "وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا وَذَرُوا الَّذِينَ يُلْحِدُونَ فِي أَسْمَائِهِ سَيُجْزَوْنَ مَا كَانُوا يَعْمَلُونَ", "surah": "سورة الأعراف", "ayah": 180}, {"text": "إِنَّ الَّذِينَ اتَّقَوْا إِذَا مَسَّهُمْ طَائِفٌ مِنَ الشَّيْطَانِ تَذَكَّرُوا فَإِذَا هُمْ مُبْصِرُونَ", "surah": "سورة الأعراف", "ayah": 201}, {"text": "وَإِذَا قُرِئَ الْقُرْآنُ فَاسْتَمِعُوا لَهُ وَأَنْصِتُوا لَعَلَّكُمْ تُرْحَمُونَ", "surah": "سورة الأعراف", "ayah": 204}, {"text": "إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ إِذَا ذُكِرَ اللَّهُ وَجِلَتْ قُلُوبُهُمْ وَإِذَا تُلِيَتْ عَلَيْهِمْ آيَاتُهُ زَادَتْهُمْ إِيمَانًا وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ", "surah": "سورة الأنفال", "ayah": 2}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا إِنْ تَتَّقُوا اللَّهَ يَجْعَلْ لَكُمْ فُرْقَانًا وَيُكَفِّرْ عَنْكُمْ سَيِّئَاتِكُمْ وَيَغْفِرْ لَكُمْ وَاللَّهُ ذُو الْفَضْلِ الْعَظِيمِ", "surah": "سورة الأنفال", "ayah": 29}, {"text": "وَقُلِ اعْمَلُوا فَسَيَرَى اللَّهُ عَمَلَكُمْ وَرَسُولُهُ وَالْمُؤْمِنُونَ وَسَتُرَدُّونَ إِلَىٰ عَالِمِ الْغَيْبِ وَالشَّهَادَةِ فَيُنَبِّئُكُمْ بِمَا كُنْتُمْ تَعْمَلُونَ", "surah": "سورة التوبة", "ayah": 105}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَكُونُوا مَعَ الصَّادِقِينَ", "surah": "سورة التوبة", "ayah": 119}, {"text": "لَقَدْ جَاءَكُمْ رَسُولٌ مِنْ أَنْفُسِكُمْ عَزِيزٌ عَلَيْهِ مَا عَنِتُّمْ حَرِيصٌ عَلَيْكُمْ بِالْمُؤْمِنِينَ رَءُوفٌ رَحِيمٌ", "surah": "سورة التوبة", "ayah": 128}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ يَهْدِيهِمْ رَبُّهُمْ بِإِيمَانِهِمْ تَجْرِي مِنْ تَحْتِهِمُ الْأَنْهَارُ فِي جَنَّاتِ النَّعِيمِ", "surah": "سورة يونس", "ayah": 9}, {"text": "إِنَّ اللَّهَ لَا يَظْلِمُ النَّاسَ شَيْئًا وَلَٰكِنَّ النَّاسَ أَنْفُسَهُمْ يَظْلِمُونَ", "surah": "سورة يونس", "ayah": 44}, {"text": "يَا أَيُّهَا النَّاسُ قَدْ جَاءَتْكُمْ مَوْعِظَةٌ مِنْ رَبِّكُمْ وَشِفَاءٌ لِمَا فِي الصُّدُورِ وَهُدًى وَرَحْمَةٌ لِلْمُؤْمِنِينَ", "surah": "سورة يونس", "ayah": 57}, {"text": "قُلْ بِفَضْلِ اللَّهِ وَبِرَحْمَتِهِ فَبِذَٰلِكَ فَلْيَفْرَحُوا هُوَ خَيْرٌ مِمَّا يَجْمَعُونَ", "surah": "سورة يونس", "ayah": 58}, {"text": "وَاسْتَغْفِرُوا رَبَّكُمْ ثُمَّ تُوبُوا إِلَيْهِ إِنَّ رَبِّي رَحِيمٌ وَدُودٌ", "surah": "سورة هود", "ayah": 90}, {"text": "وَمَا أُبَرِّئُ نَفْسِي إِنَّ النَّفْسَ لَأَمَّارَةٌ بِالسُّوءِ إِلَّا مَا رَحِمَ رَبِّي إِنَّ رَبِّي غَفُورٌ رَحِيمٌ", "surah": "سورة يوسف", "ayah": 53}, {"text": "قَالَ لَا تَثْرِيبَ عَلَيْكُمُ الْيَوْمَ يَغْفِرُ اللَّهُ لَكُمْ وَهُوَ أَرْحَمُ الرَّاحِمِينَ", "surah": "سورة يوسف", "ayah": 92}, {"text": "الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ طُوبَىٰ لَهُمْ وَحُسْنُ مَآبٍ", "surah": "سورة الرعد", "ayah": 29}, {"text": "يَمْحُو اللَّهُ مَا يَشَاءُ وَيُثْبِتُ وَعِنْدَهُ أُمُّ الْكِتَابِ", "surah": "سورة الرعد", "ayah": 39}, {"text": "أَلَمْ تَرَ كَيْفَ ضَرَبَ اللَّهُ مَثَلًا كَلِمَةً طَيِّبَةً كَشَجَرَةٍ طَيِّبَةٍ أَصْلُهَا ثَابِتٌ وَفَرْعُهَا فِي السَّمَاءِ", "surah": "سورة إبراهيم", "ayah": 24}, {"text": "وَآتَاكُمْ مِنْ كُلِّ مَا سَأَلْتُمُوهُ وَإِنْ تَعُدُّوا نِعْمَتَ اللَّهِ لَا تُحْصُوهَا إِنَّ الْإِنْسَانَ لَظَلُومٌ كَفَّارٌ", "surah": "سورة إبراهيم", "ayah": 34}, {"text": "هَٰذَا بَلَاغٌ لِلنَّاسِ وَلِيُنْذَرُوا بِهِ وَلِيَعْلَمُوا أَنَّمَا هُوَ إِلَٰهٌ وَاحِدٌ وَلِيَذَّكَّرَ أُولُو الْأَلْبَابِ", "surah": "سورة إبراهيم", "ayah": 52}, {"text": "إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ", "surah": "سورة الحجر", "ayah": 9}, {"text": "وَاعْبُدْ رَبَّكَ حَتَّىٰ يَأْتِيَكَ الْيَقِينُ", "surah": "سورة الحجر", "ayah": 99}, {"text": "وَمَا بِكُمْ مِنْ نِعْمَةٍ فَمِنَ اللَّهِ ثُمَّ إِذَا مَسَّكُمُ الضُّرُّ فَإِلَيْهِ تَجْأَرُونَ", "surah": "سورة النحل", "ayah": 53}, {"text": "مَا عِنْدَكُمْ يَنْفَدُ وَمَا عِنْدَ اللَّهِ بَاقٍ وَلَنَجْزِيَنَّ الَّذِينَ صَبَرُوا أَجْرَهُمْ بِأَحْسَنِ مَا كَانُوا يَعْمَلُونَ", "surah": "سورة النحل", "ayah": 96}, {"text": "فَكُلُوا مِمَّا رَزَقَكُمُ اللَّهُ حَلَالًا طَيِّبًا وَاشْكُرُوا نِعْمَتَ اللَّهِ إِنْ كُنْتُمْ إِيَّاهُ تَعْبُدُونَ", "surah": "سورة النحل", "ayah": 114}, {"text": "ادْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ وَجَادِلْهُمْ بِالَّتِي هِيَ أَحْسَنُ إِنَّ رَبَّكَ هُوَ أَعْلَمُ بِمَنْ ضَلَّ عَنْ سَبِيلِهِ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَ", "surah": "سورة النحل", "ayah": 125}, {"text": "وَاصْبِرْ وَمَا صَبْرُكَ إِلَّا بِاللَّهِ وَلَا تَحْزَنْ عَلَيْهِمْ وَلَا تَكُ فِي ضَيْقٍ مِمَّا يَمْكُرُونَ", "surah": "سورة النحل", "ayah": 127}, {"text": "إِنَّ هَٰذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ وَيُبَشِّرُ الْمُؤْمِنِينَ الَّذِينَ يَعْمَلُونَ الصَّالِحَاتِ أَنَّ لَهُمْ أَجْرًا كَبِيرًا", "surah": "سورة الإسراء", "ayah": 9}, {"text": "وَمَنْ أَرَادَ الْآخِرَةَ وَسَعَىٰ لَهَا سَعْيَهَا وَهُوَ مُؤْمِنٌ فَأُولَٰئِكَ كَانَ سَعْيُهُمْ مَشْكُورًا", "surah": "سورة الإسراء", "ayah": 19}, {"text": "وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ إِنَّ السَّمْعَ وَالْبَصَرَ وَالْفُؤَادَ كُلُّ أُولَٰئِكَ كَانَ عَنْهُ مَسْئُولًا", "surah": "سورة الإسراء", "ayah": 36}, {"text": "وَلَا تَمْشِ فِي الْأَرْضِ مَرَحًا إِنَّكَ لَنْ تَخْرِقَ الْأَرْضَ وَلَنْ تَبْلُغَ الْجِبَالَ طُولًا", "surah": "سورة الإسراء", "ayah": 37}, {"text": "وَقُلْ لِعِبَادِي يَقُولُوا الَّتِي هِيَ أَحْسَنُ إِنَّ الشَّيْطَانَ يَنْزَغُ بَيْنَهُمْ إِنَّ الشَّيْطَانَ كَانَ لِلْإِنْسَانِ عَدُوًّا مُبِينًا", "surah": "سورة الإسراء", "ayah": 53}, {"text": "وَلَقَدْ كَرَّمْنَا بَنِي آدَمَ وَحَمَلْنَاهُمْ فِي الْبَرِّ وَالْبَحْرِ وَرَزَقْنَاهُمْ مِنَ الطَّيِّبَاتِ وَفَضَّلْنَاهُمْ عَلَىٰ كَثِيرٍ مِمَّنْ خَلَقْنَا تَفْضِيلًا", "surah": "سورة الإسراء", "ayah": 70}, {"text": "قُلْ كُلٌّ يَعْمَلُ عَلَىٰ شَاكِلَتِهِ فَرَبُّكُمْ أَعْلَمُ بِمَنْ هُوَ أَهْدَىٰ سَبِيلًا", "surah": "سورة الإسراء", "ayah": 84}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ إِنَّا لَا نُضِيعُ أَجْرَ مَنْ أَحْسَنَ عَمَلًا", "surah": "سورة الكهف", "ayah": 30}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ كَانَتْ لَهُمْ جَنَّاتُ الْفِرْدَوْسِ نُزُلًا", "surah": "سورة الكهف", "ayah": 107}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ سَيَجْعَلُ لَهُمُ الرَّحْمَٰنُ وُدًّا", "surah": "سورة مريم", "ayah": 96}, {"text": "مَا أَنْزَلْنَا عَلَيْكَ الْقُرْآنَ لِتَشْقَىٰ", "surah": "سورة طه", "ayah": 2}, {"text": "إِنَّنِي أَنَا اللَّهُ لَا إِلَٰهَ إِلَّا أَنَا فَاعْبُدْنِي وَأَقِمِ الصَّلَاةَ لِذِكْرِي", "surah": "سورة طه", "ayah": 14}, {"text": "وَإِنِّي لَغَفَّارٌ لِمَنْ تَابَ وَآمَنَ وَعَمِلَ صَالِحًا ثُمَّ اهْتَدَىٰ", "surah": "سورة طه", "ayah": 82}, {"text": "كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ وَنَبْلُوكُمْ بِالشَّرِّ وَالْخَيْرِ فِتْنَةً وَإِلَيْنَا تُرْجَعُونَ", "surah": "سورة الأنبياء", "ayah": 35}, {"text": "وَمَا أَرْسَلْنَاكَ إِلَّا رَحْمَةً لِلْعَالَمِينَ", "surah": "سورة الأنبياء", "ayah": 107}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا ارْكَعُوا وَاسْجُدُوا وَاعْبُدُوا رَبَّكُمْ وَافْعَلُوا الْخَيْرَ لَعَلَّكُمْ تُفْلِحُونَ", "surah": "سورة الحج", "ayah": 77}, {"text": "قَدْ أَفْلَحَ الْمُؤْمِنُونَ", "surah": "سورة المؤمنون", "ayah": 1}, {"text": "الَّذِينَ هُمْ فِي صَلَاتِهِمْ خَاشِعُونَ", "surah": "سورة المؤمنون", "ayah": 2}, {"text": "وَالَّذِينَ هُمْ عَنِ اللَّغْوِ مُعْرِضُونَ", "surah": "سورة المؤمنون", "ayah": 3}, {"text": "أَفَحَسِبْتُمْ أَنَّمَا خَلَقْنَاكُمْ عَبَثًا وَأَنَّكُمْ إِلَيْنَا لَا تُرْجَعُونَ", "surah": "سورة المؤمنون", "ayah": 115}, {"text": "وَمَنْ يُطِعِ اللَّهَ وَرَسُولَهُ وَيَخْشَ اللَّهَ وَيَتَّقْهِ فَأُولَٰئِكَ هُمُ الْفَائِزُونَ", "surah": "سورة النور", "ayah": 52}, {"text": "وَالَّذِينَ لَا يَشْهَدُونَ الزُّورَ وَإِذَا مَرُّوا بِاللَّغْوِ مَرُّوا كِرَامًا", "surah": "سورة الفرقان", "ayah": 72}, {"text": "أُولَٰئِكَ يُجْزَوْنَ الْغُرْفَةَ بِمَا صَبَرُوا وَيُلَقَّوْنَ فِيهَا تَحِيَّةً وَسَلَامًا", "surah": "سورة الفرقان", "ayah": 75}, {"text": "الَّذِي خَلَقَنِي فَهُوَ يَهْدِينِ", "surah": "سورة الشعراء", "ayah": 78}, {"text": "وَالَّذِي هُوَ يُطْعِمُنِي وَيَسْقِينِ", "surah": "سورة الشعراء", "ayah": 79}, {"text": "وَالَّذِي أَطْمَعُ أَنْ يَغْفِرَ لِي خَطِيئَتِي يَوْمَ الدِّينِ", "surah": "سورة الشعراء", "ayah": 82}, {"text": "يَوْمَ لَا يَنْفَعُ مَالٌ وَلَا بَنُونَ", "surah": "سورة الشعراء", "ayah": 88}, {"text": "وَتَوَكَّلْ عَلَى الْعَزِيزِ الرَّحِيمِ", "surah": "سورة الشعراء", "ayah": 217}, {"text": "إِنَّكَ لَا تَهْدِي مَنْ أَحْبَبْتَ وَلَٰكِنَّ اللَّهَ يَهْدِي مَنْ يَشَاءُ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَ", "surah": "سورة القصص", "ayah": 56}, {"text": "وَمَا أُوتِيتُمْ مِنْ شَيْءٍ فَمَتَاعُ الْحَيَاةِ الدُّنْيَا وَزِينَتُهَا وَمَا عِنْدَ اللَّهِ خَيْرٌ وَأَبْقَىٰ أَفَلَا تَعْقِلُونَ", "surah": "سورة القصص", "ayah": 60}, {"text": "تِلْكَ الدَّارُ الْآخِرَةُ نَجْعَلُهَا لِلَّذِينَ لَا يُرِيدُونَ عُلُوًّا فِي الْأَرْضِ وَلَا فَسَادًا وَالْعَاقِبَةُ لِلْمُتَّقِينَ", "surah": "سورة القصص", "ayah": 83}, {"text": "أَحَسِبَ النَّاسُ أَنْ يُتْرَكُوا أَنْ يَقُولُوا آمَنَّا وَهُمْ لَا يُفْتَنُونَ", "surah": "سورة العنكبوت", "ayah": 2}, {"text": "وَمَنْ جَاهَدَ فَإِنَّمَا يُجَاهِدُ لِنَفْسِهِ إِنَّ اللَّهَ لَغَنِيٌّ عَن ": "سورة الصافات", "ayah": 181}, {"text": "وَالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ", "surah": "سورة الصافات", "ayah": 182}, {"text": "الَّذِينَ يَسْتَمِعُونَ الْقَوْلَ فَيَتَّبِعُونَ أَحْسَنَهُ أُولَٰئِكَ الَّذِينَ هَدَاهُمُ اللَّهُ وَأُولَٰئِكَ هُمْ أُولُو الْأَلْبَابِ", "surah": "سورة الزمر", "ayah": 18}, {"text": "وَأَنِيبُوا إِلَىٰ رَبِّكُمْ وَأَسْلِمُوا لَهُ مِنْ قَبْلِ أَنْ يَأْتِيَكُمُ الْعَذَابُ ثُمَّ لَا تُنْصَرُونَ", "surah": "سورة الزمر", "ayah": 54}, {"text": "يَا قَوْمِ إِنَّمَا هَٰذِهِ الْحَيَاةُ الدُّنْيَا مَتَاعٌ وَإِنَّ الْآخِرَةَ هِيَ دَارُ الْقَرَارِ", "surah": "سورة غافر", "ayah": 39}, {"text": "هُوَ الْحَيُّ لَا إِلَٰهَ إِلَّا هُوَ فَادْعُوهُ مُخْلِصِينَ لَهُ الدِّينَ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ", "surah": "سورة غافر", "ayah": 65}, {"text": "إِنَّ الَّذِينَ قَالُوا رَبُّنَا اللَّهُ ثُمَّ اسْتَقَامُوا تَتَنَزَّلُ عَلَيْهِمُ الْمَلَائِكَةُ أَلَّا تَخَافُوا وَلَا تَحْزَنُوا وَأَبْشِرُوا بِالْجَنَّةِ الَّتِي كُنْتُمْ تُوعَدُونَ", "surah": "سورة فصلت", "ayah": 30}, {"text": "وَمَنْ أَحْسَنُ قَوْلًا مِمَّنْ دَعَا إِلَى اللَّهِ وَعَمِلَ صَالِحًا وَقَالَ إِنَّنِي مِنَ الْمُسْلِمِينَ", "surah": "سورة فصلت", "ayah": 33}, {"text": "مَنْ عَمِلَ صَالِحًا فَلِنَفْسِهِ وَمَنْ أَسَاءَ فَعَلَيْهَا وَمَا رَبُّكَ بِظَلَّامٍ لِلْعَبِيدِ", "surah": "سورة فصلت", "ayah": 46}, {"text": "فَاطِرُ السَّمَاوَاتِ وَالْأَرْضِ جَعَلَ لَكُمْ مِنْ أَنْفُسِكُمْ أَزْوَاجًا وَمِنَ الْأَنْعَامِ أَزْوَاجًا يَذْرَؤُكُمْ فِيهِ لَيْسَ كَمِثْلِهِ شَيْءٌ وَهُوَ السَّمِيعُ الْبَصِيرُ", "surah": "سورة الشورى", "ayah": 11}, {"text": "وَهُوَ الَّذِي يَقْبَلُ التَّوْبَةَ عَنْ عِبَادِهِ وَيَعْفُو عَنِ السَّيِّئَاتِ وَيَعْلَمُ مَا تَفْعَلُونَ", "surah": "سورة الشورى", "ayah": 25}, {"text": "وَمَا أَصَابَكُمْ مِنْ مُصِيبَةٍ فَبِمَا كَسَبَتْ أَيْدِيكُمْ وَيَعْفُو عَنْ كَثِيرٍ", "surah": "سورة الشورى", "ayah": 30}, {"text": "فَمَا أُوتِيتُمْ مِنْ شَيْءٍ فَمَتَاعُ الْحَيَاةِ الدُّنْيَا وَمَا عِنْدَ اللَّهِ خَيْرٌ وَأَبْقَىٰ لِلَّذِينَ آمَنُوا وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ", "surah": " function quoteOfDay(){
  const n = riyadhDayNumber(), half = Math.floor(n / 2);
  if(VERSES.length && n % 2 === 0){
    const v = VERSES[half % VERSES.length];
    return {title:'آية اليوم', rows:[`<li class="quote"><span class="orn">﴿</span>${esc(v.text)}<span class="orn">﴾</span></li>`, `<li class="src">${esc(v.surah)} · ${ar(v.ayah)}</li>`]};
  }
  const h = HADITH[half % HADITH.length];
  const saw = s => s.replace(/ﷺ/g, '<span class="saw">ﷺ</span>').replace(/[﴿﴾]/g, m => `<span class="orn">${m}</span>`);
  const body = h.parts.map(([k, t]) => k === 'q' ? `«${saw(esc(t))}»` : `<span class="nar">${saw(esc(t))}</span>`).join(' ');
  return {title:'حديث اليوم', rows:[`<li class="quote hadith">${body}</li>`, `<li class="src">${esc(h.source)}</li>`]};
}

const WX_CODES = {
  0:'صافي',1:'صافي غالباً',2:'غائم جزئياً',3:'غائم',45:'ضباب',48:'ضباب متجمد',
  51:'رذاذ',53:'رذاذ',55:'رذاذ كثيف',56:'رذاذ متجمد',57:'رذاذ متجمد',
  61:'مطر خفيف',63:'مطر',65:'مطر غزير',66:'مطر متجمد',67:'مطر متجمد',
  71:'ثلج خفيف',73:'ثلج',75:'ثلج كثيف',77:'حبيبات ثلج',
  80:'زخات خفيفة',81:'زخات مطر',82:'زخات غزيرة',85:'زخات ثلج',86:'زخات ثلج',
  95:'عواصف رعدية',96:'عواصف مصحوبة ببرد',99:'عواصف قوية'
};
async function loadWeather(){
  const q = `latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}&timezone=${encodeURIComponent(CONFIG.timezone)}`;
  const DX = !!CONFIG.detail;   // the detail page also reads feels-like, humidity, wind, the hours, rain, sun
  try{
    const r = await fetchT(`https://api.open-meteo.com/v1/forecast?${q}&current=temperature_2m,weather_code`
                         + (DX ? ',apparent_temperature,relative_humidity_2m,wind_speed_10m' : '')
                         + `&daily=temperature_2m_max,temperature_2m_min,weather_code`
                         + (DX ? ',precipitation_probability_max,sunrise,sunset&hourly=temperature_2m,precipitation_probability&forecast_days=7'
                               : '&forecast_days=5'), 12000);
    if(!r.ok) throw 0;
    const j = await r.json();
    document.getElementById('wx-temp').textContent = ar(Math.round(j.current.temperature_2m)) + '°';
    const d = document.getElementById('wx-desc');
    d.textContent = WX_CODES[j.current.weather_code] || '';
    d.classList.remove('dust');
    const hi = j.daily?.temperature_2m_max?.[0], lo = j.daily?.temperature_2m_min?.[0];
    document.getElementById('wx-range').textContent =
      (hi != null && lo != null) ? `${ar(Math.round(hi))}° / ${ar(Math.round(lo))}°` : '';
    const dl = j.daily || {};
    FORECAST = (dl.time || []).map((t, i) => ({date:t, code:dl.weather_code?.[i],
      hi:dl.temperature_2m_max?.[i], lo:dl.temperature_2m_min?.[i],
      rain:dl.precipitation_probability_max?.[i], rise:dl.sunrise?.[i], set:dl.sunset?.[i]}))   // rain, rise, set
      .filter(x => x.hi != null && x.lo != null);
    if(DX){   // now, and the next 12 hours (hourly times are local, like current.time)
      const c = j.current || {}, hr = j.hourly || {}, nowT = String(c.time || '');
      WX_NOW = {temp:c.temperature_2m, feels:c.apparent_temperature, hum:c.relative_humidity_2m,
                wind:c.wind_speed_10m, code:c.weather_code, dust:''};
      WX_HOURS = (hr.time || []).map((t, i) => ({t, temp:hr.temperature_2m?.[i], rain:hr.precipitation_probability?.[i]}))
        .filter(x => x.t > nowT && x.temp != null).slice(0, 12);
    }
    if(CONFIG.panel === 'forecast') renderPanel(false);
  }catch(e){ return false; }   // keep the last reading; with none only the city shows (false = no answer)

  // dust overrides the condition word: PM10 in µg/m³
  try{
    const r = await fetchT(`https://air-quality-api.open-meteo.com/v1/air-quality?${q}&current=pm10,dust`, 12000);
    if(!r.ok) throw 0;
    const c = (await r.json()).current || {};
    const pm = Math.max(c.pm10 || 0, c.dust || 0);
    if(pm >= 150){
      const d = document.getElementById('wx-desc');
      d.textContent = pm >= 400 ? 'غبار كثيف' : 'غبار';
      d.classList.add('dust');
      if(DX && WX_NOW){ WX_NOW.dust = d.textContent; renderDetail(); }
    }
  }catch(e){}
  return true;   // answered (see firstLoad)
}

// night dimming: transparent by day, dark after 21:00 and before 07:00
// and darker from 23:00 to 06:00: .60 (about 40% of the brightness left; was .46 all night), reached by
// 23:30 and held to 05:30, then back to the old curve (.23) by 06:00. The evening (21:00-23:00, up to .46) and the
// morning after 06:00 are as before. Straight lines between these hours, in the page's time zone. Set every 20 s
// (boot) and only when it changes: a step is at most .004, invisible, with no transition.
const NIGHT = [[0, .6], [5.5, .6], [6, .23], [7, 0], [21, 0], [23, .46], [23.5, .6], [24, .6]];   // [hour, dimmer]
function applyNight(){
  const p = riyadhParts();
  const h = CONFIG.nightH >= 0 ? CONFIG.nightH % 24 : p.h + p.mi/60 + p.s/3600;   // #nighth (tests)
  let o = 0;
  for(let i = 1; i < NIGHT.length; i++){
    const [h0, o0] = NIGHT[i - 1], [h1, o1] = NIGHT[i];
    if(h < h1){ o = o0 + (o1 - o0) * (h - h0) / (h1 - h0); break; }
  }
  const v = Math.max(0, Math.min(.6, o)).toFixed(3);
  const el = document.getElementById('dimmer');
  if(el && v !== applyNight.last){ applyNight.last = v; el.style.opacity = v; }
}

// gentle pixel shift so static text never burns into the panel
// a larger orbit that never repeats (was 7 fixed spots, ±3-4 px, every 4 min): every 2 min (boot) a
// random offset within ±SHIFT_X px across and ±SHIFT_Y px up and down, at least SHIFT_MIN px away from the last one
// on each axis, so every edge moves. One transform for the stage (clock, VPN badge, card, its dots and line, the
// bottom bar) and the ticker tape outside it, set at once (no transition: one repaint per move). Both keep room for
// it: the stage's padding, the tape's glass reaching past the screen's sides and bottom.
const SHIFT_X = 12, SHIFT_Y = 10, SHIFT_MIN = 4;
let SHIFT_AT = [0, 0];
function pixelShift(){
  const r = m => Math.round((Math.random() * 2 - 1) * m);
  let dx = 0, dy = 0;
  for(let n = 0; n < 100; n++){
    dx = r(SHIFT_X); dy = r(SHIFT_Y);
    if(Math.abs(dx - SHIFT_AT[0]) >= SHIFT_MIN && Math.abs(dy - SHIFT_AT[1]) >= SHIFT_MIN) break;
  }
  SHIFT_AT = [dx, dy];
  ['.stage', '#tape'].forEach(q => { const el = document.querySelector(q); if(el) el.style.transform = `translate(${dx}px,${dy}px)`; });
}

// ---- the screensaver against image retention, besides pixelShift and the dimming
// - Every CONFIG.swapMin minutes of the local day (60: on the hour) the sides change (html.ss-swap): odd hours swapped,
//   even hours not, so a short run of the screensaver changes too. The stage fades out (.6 s), changes, and fades back
//   in (.8 s); the tape stays.
// - Every CONFIG.breakMin minutes, half a period after the swaps (30: at :15 and :45), a photo-only minute: the stage
//   and the tape fade out (2 s), are hidden (html.ss-break) with the tape's run paused where it is, and fade back in
//   SS_BREAK_S after the start. A break that would come within 12 s of a swap is skipped.
// Nothing runs in between: one timeout to the next change (ssTick). Only the fades animate, on opacity.
const SS_BREAK_S = 60, SS_FADE_OUT = 600, SS_FADE_IN = 800, SS_BREAK_FADE = 2000;
let SS_SWAPPED = false, SS_QUEUE = Promise.resolve(), SS_T = 0;
// minutes into the local day (page's time zone), with the seconds
function ssMinute(){ const p = riyadhParts(); return p.h*60 + p.mi + (p.s + Date.now() % 1000 / 1000)/60; }
// the start of the photo-only minute at or before minute m (it may be negative: the day before)
function ssBreakStart(m){ const B = CONFIG.breakMin; return Math.floor((m - B/2) / B) * B + B/2; }
function ssWant(m){
  const S = CONFIG.swapMin, b = ssBreakStart(m), e = b + SS_BREAK_S/60, M = .2;
  const meets = Math.floor((e + M) / S) !== Math.floor((b - M) / S);   // a swap boundary within 12 s of it
  return {swap: Math.floor(m / S) % 2 === 1, pause: m >= b && m < e && !meets};
}
// opacity from where it is to `to` (0 or 1), ms long; resolves at the end. 1 is the stylesheet's own (no inline style
// left behind). Reduced motion: at once.
function ssFade(els, to, ms){
  return Promise.all(els.filter(Boolean).map(el => {
    const from = getComputedStyle(el).opacity;
    el.style.opacity = to ? '' : '0';
    if(CARD_STILL || !el.animate) return null;
    return el.animate([{opacity: from}, {opacity: to}], {duration: ms, easing: 'ease-in-out'}).finished.catch(() => {});
  }));
}
// brings the page to `swap` / `pause`, one change after the other; `now`: no fades (the first paint)
function ssApply(swap, pause, now){
  SS_QUEUE = SS_QUEUE.then(async () => {
    const root = document.documentElement, stage = document.querySelector('.stage'), all = [stage, document.getElementById('tape')];
    if(pause && !SS_BREAK){
      SS_BREAK = true;
      await (now ? ssFade(all, 0, 0) : ssFade(all, 0, SS_BREAK_FADE));
      root.classList.add('ss-break');
      if(TAPE_ANIM) TAPE_ANIM.pause();
    }
    if(swap !== SS_SWAPPED){
      SS_SWAPPED = swap;
      if(now || SS_BREAK) root.classList.toggle('ss-swap', swap);   // nothing on screen to fade
      else {
        await ssFade([stage], 0, SS_FADE_OUT);
        root.classList.toggle('ss-swap', swap);
        await ssFade([stage], 1, SS_FADE_IN);
      }
    }
    if(!pause && SS_BREAK){
      SS_BREAK = false;
      root.classList.remove('ss-break');
      if(TAPE_ANIM) TAPE_ANIM.play();   // carries on from where it was held
      await ssFade(all, 1, now ? 0 : SS_BREAK_FADE);
    }
  }).catch(e => console.error('SaudiTV: ssApply ' + e));
}
// applies what the clock wants now, then sleeps until the next change: a swap, a break's end or the next break, or
// midnight (the day's minutes start again)
function ssTick(first){
  clearTimeout(SS_T);
  const m = ssMinute(), w = ssWant(m), S = CONFIG.swapMin, B = CONFIG.breakMin, b = ssBreakStart(m);
  ssApply(w.swap, w.pause, first);
  const next = Math.min(...[(Math.floor(m / S) + 1) * S, b + SS_BREAK_S/60, b + B, 1440].filter(x => x > m)) - m;
  SS_T = setTimeout(() => ssTick(false), Math.max(1000, next * 60000 + 250));
}
// the screensaver only (boot). Tests from a browser's console: sauditvSaver.swap(true|false), .pause(true|false),
// .night(23.5) (dims as at that hour; -1: the clock's); the next change of the clock's plan undoes the first two
function ssStart(){
  ssTick(true);
  window.sauditvSaver = {
    swap: on => ssApply(!!on, SS_BREAK, false),
    pause: on => ssApply(SS_SWAPPED, !!on, false),
    night: h => { CONFIG.nightH = +h; applyNight(); },
  };
}
// ---- end: the screensaver against image retention

// Background photos: the hosted set in photos/ (photos/index.json in the repo). A hosted photo is used only
// once it has loaded; offline, or if it fails, a bundled one is shown, so the screen is never empty.
const PHOTO_BASE = 'https://raw.githubusercontent.com/raad113/SaudiTV/main/photos/';
let REMOTE_BGS = (()=>{ try{ return JSON.parse(localStorage.getItem('photoIndex') || '[]'); }catch(e){ return []; } })();

async function loadPhotoIndex(){
  try{
    const r = await fetchT(PHOTO_BASE + 'index.json', 15000);
    if(!r.ok) return;
    const list = (await r.json()).filter(p => p && p.f);
    if(list.length){
      REMOTE_BGS = list;
      try{ localStorage.setItem('photoIndex', JSON.stringify(list)); }catch(e){}
    }
  }catch(e){}
}

let REVEALED = false;
function reveal(){
  if(REVEALED) return;
  REVEALED = true;
  // fonts may still be arriving (tv.html loads them as files): wait for them, briefly
  const fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.race([fonts, new Promise(r => setTimeout(r, 800))])
    .then(() => document.documentElement.classList.add('ready'));
}

function showBackground(url, b){
  const ph = document.querySelector('.photo');
  reveal();
  if(!ph) return;
  const next = "url('" + url + "')";
  if(ph.style.backgroundImage === next) return;   // same photo: no reload, no new movement
  ph.style.backgroundImage = next;
  ph.style.setProperty('--dim', (1 - (b.d || 0.95)).toFixed(2));
  ph.classList.remove('settle'); void ph.offsetWidth; ph.classList.add('settle');
  // once settled, the photo drops the finished animation (same place: its last frame is the photo's
  // own transform); an animation kept filling kept the photo, the veils and the stage on full-screen layers that the
  // moving ticker tape had redrawn every frame
  ph.onanimationend = e => { if(e.animationName === 'settle') ph.classList.remove('settle'); };
  const dvb = document.querySelector('.dv-bg');   // the detail page's blurred copy (bootDetail)
  if(dvb) dvb.style.backgroundImage = next;
  const fr = CONFIG.detail || CONFIG.widget ? null : document.getElementById('tape-frost');   // the ticker tape's frost
  if(fr){ fr.style.backgroundImage = next; fr.style.setProperty('--dim', ph.style.getPropertyValue('--dim')); }
  const cr = document.getElementById('credit');
  if(cr) cr.textContent = b.c ? 'الصورة: ' + b.c : '';
}

// Every 4 days a new random set of 12 hosted photos (same draw as the launcher: Park-Miller generator seeded
// by the 4-day period), rotating every 5 minutes. Only the photo on screen is downloaded.
// 12 photos every 5 minutes (was 5 every 30), so one comes back once an hour, not every 25 minutes
const PHOTO_SET = 12, PHOTO_PERIOD_DAYS = 4, PHOTO_SLOT_MIN = 5;
const PHOTO_SLOTS_PER_DAY = Math.floor(1440 / PHOTO_SLOT_MIN);
function riyadhDayNumber(){
  const p = riyadhParts();
  return Math.floor(Date.UTC(p.y, p.mo - 1, p.d) / 86400000);
}
function photoSet(n){
  const period = Math.floor(riyadhDayNumber() / PHOTO_PERIOD_DAYS);
  let seed = (period % 2147483646) + 1;
  const pick = [];
  for(let guard = 0; pick.length < Math.min(PHOTO_SET, n) && guard < 1000; guard++){
    seed = (seed * 48271) % 2147483647;
    const k = seed % n;
    if(!pick.includes(k)) pick.push(k);
  }
  return pick;
}
let BG_SLOT = -1, PREFETCHED = false;
function applyBackground(force){
  try {
    const p = riyadhParts();
    const slot = riyadhDayNumber() * PHOTO_SLOTS_PER_DAY + Math.floor((p.h * 60 + p.mi) / PHOTO_SLOT_MIN);
    if(slot === BG_SLOT && !force) return;
    BG_SLOT = slot;
    const set = REMOTE_BGS.length ? photoSet(REMOTE_BGS.length).map(k => REMOTE_BGS[k]) : [];
    const local = BGS[slot % BGS.length];
    if(!set.length){ showBackground(local.u, local); return; }
    const b = set[slot % set.length], url = PHOTO_BASE + b.f;
    // First photo: wait briefly for the hosted one (the app serves it from disk at once) so the screen
    // doesn't flash a bundled photo first; slow network → bundled one, swapped when the hosted one arrives.
    let done = false;
    const fallback = () => { if(!done && !document.querySelector('.photo').style.backgroundImage) showBackground(local.u, local); };
    const t = setTimeout(fallback, 1200);
    const img = new Image();
    img.onload = () => { done = true; clearTimeout(t); showBackground(url, b); };
    img.onerror = () => { clearTimeout(t); fallback(); done = true; };
    img.src = url;
    // fetch the rest of the set once, quietly, so the app has each one on disk before its turn
    // not from the detail page, which shows one photo
    if(!PREFETCHED && !CONFIG.detail){ PREFETCHED = true; setTimeout(() => set.forEach(x => { new Image().src = PHOTO_BASE + x.f; }), 20000); }
  } catch(e) {}
}

function dvTitle(){

function dvPrayers(){
  if(!DAY_TIMES) return '';
  const p = riyadhParts(), mins = p.h*60 + p.mi + p.s/60, fri = isFriday();
  const names = {Fajr:'الفجر', Sunrise:'الشروق', Dhuhr: fri ? 'الجمعة' : 'الظهر', Asr:'العصر', Maghrib:'المغرب', Isha:'العشاء'};
  const at = k => { const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number); return h*60 + mi; };
  const gap = k => (k === 'Sunrise' || (k === 'Dhuhr' && fri)) ? 0 : (CONFIG.iqama[k] || 0);   // as tickPrayer
  const keys = Object.keys(names).filter(k => DAY_TIMES[k] && Number.isFinite(at(k)));
  // the prayer between its adhan and iqama, else the next one (after Isha: tomorrow's Fajr, on today's Fajr row)
  let hot = PRAYER_KEYS.find(k => keys.includes(k) && gap(k) && mins >= at(k) && mins < at(k) + gap(k)), note = '';
  if(hot) note = 'الإقامة بعد ' + humanRemaining(Math.max(60, Math.ceil(at(hot) + gap(hot) - mins)*60));
  else {
    hot = PRAYER_KEYS.find(k => keys.includes(k) && at(k) > mins) || 'Fajr';
    let left = at(hot) - mins; if(left <= 0) left += 1440;
    note = 'بعد ' + humanRemaining(Math.max(0, Math.round(left*60)));
  }
  const t12 = m => fmt12(Math.floor(m/60) % 24, m % 60);
  let today = '';
  try{
    today = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {timeZone:CONFIG.timezone, day:'numeric', month:'long'}).format(new Date())
      + ' · ' + new Intl.DateTimeFormat(GREG, {timeZone:CONFIG.timezone, weekday:'long', day:'numeric', month:'long'}).format(new Date());
  }catch(e){}
  const rows = keys.map(k => `<div class="dv-tr${k === hot ? ' hot' : ''}"><span>${names[k]}</span><span>${t12(at(k))}</span>`
    + `<span>${gap(k) ? t12(at(k) + gap(k)) : '—'}</span><span>${k === hot ? note : ''}</span></div>`).join('');
  // the next 7 days, offline (computePrayers, same method); local noon of each day, so a DST change cannot skip one
  const off = Date.UTC(p.y, p.mo-1, p.d, p.h, p.mi, p.s) - Date.now();
  const fD = (o, d) => { try{ return new Intl.DateTimeFormat(o.cal || GREG, Object.assign({timeZone:CONFIG.timezone}, o.f)).format(d); }catch(e){ return ''; } };
  let week = '';
  for(let i = 1; i <= 7; i++){
    const d = new Date(Date.UTC(p.y, p.mo-1, p.d + i, 12) - off);
    let t;
    try{ t = computePrayers(d); }catch(e){ continue; }
    week += `<div class="dv-tr"><span><b>${fD({f:{weekday:'long'}}, d)}</b> <span class="dv-meta">${fD({f:{day:'numeric', month:'long'}}, d)}`
      + ` · ${fD({cal:'ar-SA-u-ca-islamic-umalqura', f:{day:'numeric', month:'long'}}, d)}</span></span>`
      + PRAYER_KEYS.map(k => `<span>${dvHM(t[k])}</span>`).join('') + '</div>';
  }
  return `<div class="dv-scroll"><div class="dv-sec">اليوم<span class="dv-meta">${today}</span></div>`
    + `<div class="dv-tbl dv-pt"><div class="dv-tr dv-th"><span>الصلاة</span><span>الأذان</span><span>الإقامة</span><span></span></div>${rows}</div>`
    + (week ? `<div class="dv-sec">الأيام القادمة</div><div class="dv-tbl dv-pw"><div class="dv-tr dv-th"><span>اليوم</span>`
      + PRAYER_KEYS.map(k => `<span>${PRAYER_NAMES[k]}</span>`).join('') + `</div>${week}</div>` : '')
    + '</div>';
}

function dvForecast(){
  if(!WX_NOW && !FORECAST.length) return '';
  let html = '<div class="dv-scroll">';
  if(WX_NOW){
    const meta = [`الإحساس ${dvT(WX_NOW.feels)}`, `الرطوبة ${dvPct(WX_NOW.hum)}`,
                  `الرياح ${Number.isFinite(WX_NOW.wind) ? ar(Math.round(WX_NOW.wind)) + ' كم/س' : '—'}`].join(' · ');
    html += `<div class="dv-now"><span class="dv-temp">${dvT(WX_NOW.temp)}</span><div>`
          + `<div class="dv-desc">${esc(WX_NOW.dust || WX_CODES[WX_NOW.code] || '')}</div><div class="dv-meta">${meta}</div></div></div>`;
  }
  if(WX_HOURS.length){
    html += '<div class="dv-sec">الساعات القادمة</div><div class="dv-hours">' + WX_HOURS.map(x => {
      const h = +String(x.t).slice(11, 13);
      return `<div class="dv-hr"><span class="dv-meta">${ar(h % 12 || 12)} ${h < 12 ? 'ص' : 'م'}</span><span>${dvT(x.temp)}</span>`
           + `<span class="dv-meta">${dvPct(x.rain)}</span></div>`;
    }).join('') + '</div>';
  }
  if(FORECAST.length){
    html += '<div class="dv-sec">الأيام القادمة</div><div class="dv-tbl dv-fd"><div class="dv-tr dv-th"><span>اليوم</span><span>الحالة</span>'
          + '<span>العظمى / الصغرى</span><span>المطر</span><span>الشروق / الغروب</span></div>'
          + FORECAST.slice(0, 7).map((d, i) => {
      const day = i === 0 ? 'اليوم' : i === 1 ? 'غداً'
        : new Intl.DateTimeFormat(GREG, {timeZone:'UTC', weekday:'long'}).format(new Date(d.date + 'T12:00:00Z'));
      return `<div class="dv-tr"><span>${day}</span><span>${WX_CODES[d.code] || ''}</span><span>${dvT(d.hi)} / ${dvT(d.lo)}</span>`
           + `<span>${dvPct(d.rain)}</span><span>${dvHM(d.rise)} / ${dvHM(d.set)}</span></div>`;
    }).join('') + '</div>';
  }
  return html + '</div>';
}

// the competition, in Arabic when it is the Saudi league
const dvComp = s => /saudi|roshn/i.test(s || '') && /pro|league|دوري/i.test(s || '') ? 'دوري روشن السعودي' : String(s || '');
function dvMatches(){
  const now = Date.now(), seen = new Set(), evs = [];
  const add = ev => { if(ev && ev.idEvent && !seen.has(ev.idEvent)){ seen.add(ev.idEvent); evs.push(ev); } };
  CONFIG.teamIds.forEach(id => { add(MATCHES[id]); (NEXT_LIST[id] || []).forEach(add); resultsFor(id).forEach(add); });
  const done = [], ahead = [];
  evs.forEach(ev => {
    const t = toDate(ev).getTime();
    if(!Number.isFinite(t) || t < now - 7*86400000 || t > now + 14*86400000) return;   // 7 days back, 14 ahead
    const scored = ev.intHomeScore != null && ev.intAwayScore != null && ev.intHomeScore !== '' && ev.intAwayScore !== '';
    const over = FINAL.includes((ev.strStatus || '').toUpperCase()) ? now >= t : now >= t + 2.5*3600000;
    if(over){ if(scored) done.push({ev, t}); return; }   // a past game without a score has nothing to show
    ahead.push({ev, t, scored});
  });
  done.sort((a, b) => b.t - a.t); ahead.sort((a, b) => a.t - b.t);   // newest results first, then by date
  const rows = [...done.map(x => Object.assign(x, {fin: true})), ...ahead];
  if(!rows.length) return '';
  const hm = d => new Intl.DateTimeFormat('en-GB', {timeZone:CONFIG.timezone, hour:'2-digit', minute:'2-digit', hour12:false})
    .formatToParts(d).reduce((a, x) => (a[x.type] = x.value, a), {});
  return '<div class="dv-scroll"><div class="dv-tbl dv-mt">' + rows.map(({ev, t, fin, scored}) => {
    const d = new Date(t), q = hm(d), t12 = fmt12(+q.hour % 24, +q.minute);
    const live = !fin && now >= t;
    const when = live ? `<span class="live">مباشر</span> · ${liveStatus(ev, t12)}`
      : new Intl.DateTimeFormat(GREG, {timeZone:CONFIG.timezone, weekday:'long', day:'numeric', month:'long'}).format(d) + ' · ' + t12;
    const mid = fin || (live && scored) ? ` <span class="dv-sc">${ar(+ev.intHomeScore)} - ${ar(+ev.intAwayScore)}</span> ` : ' × ';
    return `<div class="dv-tr"><span>${when}</span><span>${esc(teamAr(ev.strHomeTeam))}${mid}${esc(teamAr(ev.strAwayTeam))}</span>`
         + `<span class="dv-meta" dir="auto">${esc(dvComp(ev.strLeague))}</span></div>`;   // English names keep their start
  }).join('') + '</div></div>';
}

function dvStandings(){
  if(!STANDINGS.length) return '';
  // followed: by the match data (followedKeys) or by the Arabic names the app sent (#teamnames)
  const keys = followedKeys(), want = new Set(Object.values(TEAM_NAME_OF).map(arNorm));
  const isF = x => keys.has(standKey(x.name)) || want.has(arNorm(STAND_AR[standKey(x.name)]));
  const n = v => Number.isFinite(v) ? ar(Math.round(v)) : '—';
  const gd = v => Number.isFinite(v) ? `<span dir="ltr">${v > 0 ? '+' : v < 0 ? '−' : ''}${ar(Math.abs(Math.round(v)))}</span>` : '—';
  return '<div class="dv-scroll"><div class="dv-tbl dv-st"><div class="dv-tr dv-th"><span>#</span><span>النادي</span><span>لعب</span>'
    + '<span>فاز</span><span>تعادل</span><span>خسر</span><span>له</span><span>عليه</span><span>الفارق</span><span>النقاط</span></div>'
    + STANDINGS.map(x => `<div class="dv-tr${isF(x) ? ' fol' : ''}"><span>${n(x.rank)}</span><span>${esc(STAND_AR[standKey(x.name)] || x.name)}</span>`
      + `<span>${n(x.gp)}</span><span>${n(x.w)}</span><span>${n(x.d)}</span><span>${n(x.l)}</span><span>${n(x.gf)}</span><span>${n(x.ga)}</span>`
      + `<span>${gd(x.gd)}</span><span><b>${n(x.pts)}</b></span></div>`).join('')
    + '</div></div>';
}

// the week's series (loadWeek's list, up to 50), laid out like the news page: on the right the list
// (poster, name, channel or streaming service · SxxExx · day and time · rating), ▲▼ moving the focus; on the left
// the focused series: a larger poster, the same facts and its summary (TVMaze's, in English)
const dvSE = o => o.s && o.n ? `<span dir="ltr">S${pad(o.s)}E${pad(o.n)}</span>` : '';
const dvRate = o => o.rating ? '★ ' + ar(o.rating.toFixed(1)).replace('.', '٫') : '';
function dvShowWhen(o){
  const at = o.at ? new Date(o.at) : null;
  if(!at || !Number.isFinite(at.getTime())) return showDay(o, false);
  const q = new Intl.DateTimeFormat('en-GB', {timeZone:CONFIG.timezone, hour:'2-digit', minute:'2-digit', hour12:false})
    .formatToParts(at).reduce((a, x) => (a[x.type] = x.value, a), {});
  return showDay(o, false) + ' ' + fmt12(+q.hour % 24, +q.minute);
}
function dvShowMeta(o){
  return [o.net ? `<span dir="auto">${esc(o.net)}</span>` : '', dvSE(o), dvShowWhen(o), dvRate(o)].filter(Boolean).join(' · ');
}
function dvShows(){
  DV.items = WEEK_POOL.slice();
  if(!DV.items.length) return '';
  return '<div class="dv-news dv-shw"><div class="dv-list">' + DV.items.map((o, i) =>
    `<div class="dv-item" data-i="${i}"><div class="pp">${posterImg(o)}</div><div class="dv-st2">`
    + `<div class="h" dir="auto">${esc(o.name)}</div><div class="dv-meta">${dvShowMeta(o)}</div></div></div>`
  ).join('') + '</div><div class="dv-side"></div></div>';
}
// the focused series on the left (dvNewsFocus calls it on the shows page)
function dvShowSide(o){
  return `<div class="dv-shd"><div class="pp">${posterImg(o)}</div><div><div class="h" dir="auto">${esc(o.name)}</div>`
    + `<div class="dv-meta">${dvShowMeta(o)}</div></div></div>`
    + (o.sum ? `<div class="dv-sum" dir="auto">${esc(o.sum)}</div>` : '<div class="dv-sum none">لا يوجد ملخص</div>');
}

// the day's verse or hadith (quoteOfDay, as on the card), large, its source under it
function dvVerse(){
  const q = quoteOfDay();
  return `<div class="dv-scroll"><ul class="dv-q">${q.rows.join('')}</ul></div>`;
}

function dvNews(P){
  DV.items = (NEWS[P] || []).slice(0, NEWS_DETAIL_KEEP);
  if(!DV.items.length) return '';
  const now = Date.now();
  return '<div class="dv-news"><div class="dv-list">' + DV.items.map((x, i) => {
    const meta = [newsSource(P, x.source), Number.isFinite(x.t) ? agoAr(now - x.t) : ''].filter(Boolean).join(' · ');
    return `<div class="dv-item" data-i="${i}"><div class="h"${bidiAttr(P, x.headline)}>${esc(x.headline)}</div><div class="dv-meta">${meta}</div></div>`;
  }).join('') + '</div><div class="dv-side"></div></div>';
}
// focus item i: its row framed and kept in view, its summary on the left
function dvNewsFocus(i){
  const list = document.querySelector('#dv .dv-list'), side = document.querySelector('#dv .dv-side');
  if(!list || !side || !DV.items.length) return;
  i = Math.max(0, Math.min(DV.items.length - 1, i));
  DV.focus = i;
  Array.from(list.children).forEach((el, k) => el.classList.toggle('focus', k === i));
  const row = list.children[i];
  if(row){
    const top = row.offsetTop, bot = top + row.offsetHeight;
    if(top < list.scrollTop) list.scrollTop = top;
    else if(bot > list.scrollTop + list.clientHeight) list.scrollTop = bot - list.clientHeight;
  }
  const x = DV.items[i];
  if(CONFIG.detail === 'shows'){ side.innerHTML = dvShowSide(x); dvSideFit(side); return; }   // the shows page
  const P = CONFIG.detail;
  const meta = [newsSource(P, x.source), Number.isFinite(x.t) ? agoAr(Date.now() - x.t) : ''].filter(Boolean).join(' · ');
  side.innerHTML = `<div class="h"${bidiAttr(P, x.headline)}>${esc(x.headline)}</div><div class="dv-meta">${meta}</div>`
    + (x.summary ? `<div class="dv-sum"${bidiAttr(P, x.summary)}>${esc(x.summary)}</div>` : '<div class="dv-sum none">لا يوجد ملخص</div>')
    + (x.link ? '<div class="dv-ok">OK لقراءة الخبر كاملاً</div>' : '');
  dvSideFit(side);
  if(document.fonts && document.fonts.status !== 'loaded') document.fonts.ready.then(() => dvSideFit(side));
}
// clamp the summary to the whole lines that fit in the side column (ends with an ellipsis)
function dvSideFit(side){
  const sum = side && side.querySelector('.dv-sum:not(.none)');
  if(!sum) return;
  sum.style.webkitLineClamp = '';
  const over = side.scrollHeight - side.clientHeight;
  if(over <= 0) return;
  const lh = parseFloat(getComputedStyle(sum).lineHeight) || 32;
  sum.style.webkitLineClamp = String(Math.max(1, Math.floor((sum.clientHeight - over) / lh)));
}

function renderDetail(){
  const body = document.querySelector('#dv .dv-body');
  if(!body) return;
  const P = CONFIG.detail, news = isNewsPanel(P) || P === 'shows';   // shows, a list like news; local
  const was = news ? DV.items[DV.focus] : null;   // keep the focused item across a refresh
  let html = '';
  try{
    html = P === 'prayers' ? dvPrayers() : P === 'forecast' ? dvForecast() : P === 'matches' ? dvMatches()
         : P === 'standings' ? dvStandings() : P === 'shows' ? dvShows() : news ? dvNews(P)
         : P === 'verse' ? dvVerse() : '';   // shows, verse
  }catch(e){ console.error('SaudiTV: detail ' + (e && e.message)); }
  if(!html) html = `<div class="dv-empty">${DV.answered[P] ? (P === 'matches' ? 'لا مباريات في هذه الفترة' : 'لا تتوفر بيانات الآن')
                                          : DV.failed[P] ? 'لا تتوفر بيانات الآن' : 'جارٍ التحميل…'}</div>`;
  if(html === DV.html) return;   // nothing changed: focus and scroll stay as they are
  DV.html = html;
  const sc = body.querySelector('.dv-scroll'), top = sc ? sc.scrollTop : 0;
  body.innerHTML = html;
  const sc2 = body.querySelector('.dv-scroll');
  if(sc2) sc2.scrollTop = top;
  if(news && DV.items.length){
    let i = was ? DV.items.findIndex(x => P === 'shows' ? x.name === was.name   // shows
                                          : (x.link && x.link === was.link) || x.headline === was.headline) : 0;
    dvNewsFocus(i < 0 ? Math.min(DV.focus, DV.items.length - 1) : i);
  }
}

function detailKey(e){
  const k = e.key;
  if(!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(k)) return;
  e.preventDefault();   // no native scrolling: the page moves only as below
  // ◀ = the next page, ▶ = the previous one (RTL)
  if(k === 'ArrowLeft' || k === 'ArrowRight'){ dvGo(k === 'ArrowLeft' ? 1 : -1); return; }
  const P = CONFIG.detail;
  if(isNewsPanel(P) || P === 'shows'){   // shows (OK does nothing there); local
    if(!DV.items.length) return;
    if(k === 'ArrowDown') dvNewsFocus(DV.focus + 1);
    else if(k === 'ArrowUp') dvNewsFocus(DV.focus - 1);
    else if(k === 'Enter'){
      const x = DV.items[DV.focus], N = window.SaudiTVNative;
      if(x && x.link && N && typeof N.openUrl === 'function'){ try{ N.openUrl(x.link); }catch(err){} }
    }
    return;
  }
  const sc = document.querySelector('#dv .dv-scroll');
  if(sc && (k === 'ArrowDown' || k === 'ArrowUp')) sc.scrollTop += (k === 'ArrowDown' ? 1 : -1) * Math.round(sc.clientHeight * 0.4);
}

// start the loaders page P needs, each page once (a page seen again keeps its running refresh).
// The first load (retried by firstLoad until it answers) also decides between "loading" and "no data".
const DV_STARTED = new Set();
function dvStart(P){
  if(DV_STARTED.has(P)) return;
  DV_STARTED.add(P);
  const watch = (load, name) => firstLoad(() => Promise.resolve().then(load).catch(() => false).then(ok => {
    if(ok === false) DV.failed[P] = true; else DV.answered[P] = true;
    renderDetail();
    return ok;
  }), name);
  if(P === 'prayers'){ watch(loadPrayers, 'prayers'); setInterval(loadPrayers, 6*3600*1000); setInterval(renderDetail, 15000); }
  if(P === 'forecast'){ watch(loadWeather, 'weather'); setInterval(loadWeather, 30*60*1000); }
  if(P === 'matches'){ watch(loadMatches, 'matches'); setInterval(loadMatches, 30*60*1000); setInterval(loadLive, 2*60000); setInterval(renderDetail, 60000); }
  if(P === 'standings'){   // the match data marks the followed clubs; the matches page, once seen, refreshes it
    watch(loadStandings, 'standings'); setInterval(loadStandings, 3*3600*1000);
    if(!DV_STARTED.has('matches')) firstLoad(loadMatches, 'matches');
  }
  if(P === 'news' || P === 'tech'){ watch(() => loadNews(P), P); setInterval(() => loadNews(P), 30*60*1000); setInterval(renderDetail, 5*60*1000); }
  if(P === 'local'){ watch(loadLocalNews, P); setInterval(loadLocalNews, 30*60*1000); setInterval(renderDetail, 5*60*1000); }
  if(P === 'shows'){ watch(loadWeek, 'shows'); setInterval(loadWeek, 6*3600*1000); }   // (verse: offline)
}
// the card shows the page last seen here when the home screen is back (bootRotatingWidget's sauditvHold)
function dvSavePos(){

}
function dvDots(){

}
// page P: its title, its own data, a fresh page (top of the page, first news item)
function dvShow(P){
  CONFIG.detail = P; CONFIG.panel = P;
  DV.html = null; DV.items = []; DV.focus = 0;
  const body = document.querySelector('#dv .dv-body'), title = document.querySelector('#dv .dv-title');
  if(body) body.innerHTML = '';   // renderDetail keeps the scroll of what is shown: nothing is
  if(title) title.textContent = dvTitle();
  const ic = document.querySelector('#dv .dv-ic');   // the page's icon

}
// d pages on (+1 next, -1 previous, wrapping), at most one switch per 300 ms (a held key repeats);
// the title and the page fade out (.2 s), the next one fades in (.25 s, CSS); no fade with reduced motion
let DV_LAST_GO = 0, DV_OUT_T = 0, DV_TO = '';
function dvGo(d){
  const now = Date.now();
  if(DV_LIST.length < 2 || now - DV_LAST_GO < 300) return;
  DV_LAST_GO = now;
  const cur = DV_LIST.indexOf(DV_TO || CONFIG.detail);   // a switch still fading out counts as made
  DV_TO = DV_LIST[((cur + d) % DV_LIST.length + DV_LIST.length) % DV_LIST.length];
  const root = document.getElementById('dv');
  if(CARD_STILL || !root){ const P = DV_TO; DV_TO = ''; dvShow(P); return; }
  root.classList.add('out');
  clearTimeout(DV_OUT_T);
  DV_OUT_T = setTimeout(() => {
    const P = DV_TO; DV_TO = ''; DV_OUT_T = 0;
    dvShow(P);
    root.classList.remove('out');
  }, 200);
}

function bootDetail(){
  document.documentElement.classList.add('detail');

    + '<div class="dv-hint">◀ ▶ للتبديل · ▲▼ للتنقل · OK للاختيار · رجوع للعودة</div></header><div class="dv-body"></div>';

function boot(){
  if(CONFIG.ticker){ bootTicker(); return; }
  if(CONFIG.detail){ bootDetail(); return; }
  if(CONFIG.home){ bootHome(); return; }
  if(CONFIG.widget){ bootWidget(); return; }
  restoreSnap();

  setInterval(saveSnap, 60*1000);
  addEventListener('pagehide', saveSnap);
  const wxCity = document.getElementById('wx-city');
  if(wxCity) wxCity.textContent = CONFIG.city;

  if(cs) cs.textContent = 'بتوقيت ' + CONFIG.city;
  document.title = 'سعودي TV';
  applyBackground(true);
  loadPhotoIndex().then(() => applyBackground(true));
  setInterval(() => applyBackground(false), 60*1000);
  tickClock(); tickDates(); tickRamadan();
  tapeStart();   // the ticker tape at the bottom edge (was the three markets under the weather)
  const ROT = CONFIG.panels.length > 1 ? CONFIG.panels : null;   // rotating card on the screensaver too
  if(ROT) CONFIG.panel = ROT[0];
  if(CONFIG.panel === 'none') document.querySelector('.week').style.display = 'none';
  else if(CONFIG.panel !== 'shows') renderPanel(false);   // its own data arrives with prayers, weather, matches
  // a first load without an answer tries again soon (firstLoad)
  firstLoad(loadPrayers, 'prayers'); firstLoad(loadMatches, 'matches'); if(!ROT && CONFIG.panel === 'shows') firstLoad(loadWeek, 'shows'); firstLoad(loadWeather, 'weather');   // !ROT (startPanelData)
  startPanelData(ROT || [CONFIG.panel], true);   // standings / news / tech (matches load above)
  if(ROT){
    newsFlipArm();   // the first panel, if it is news, pages like the later visits
    let ri = 0;
    rotInit(ROT); rotMark(0); rotRestart();   // rotation indicator
    setInterval(() => {
      const k = rotNext(ROT, ri, 1);   // past a panel with nothing to show
      if(k === ri){ rotRestart(); return; }
      ri = k;
      swapPanel(ROT[ri]);   // fade out, then slide the next panel in (sets CONFIG.panel, LIST_PAGE)
      rotMark(ri); rotRestart();
    }, CONFIG.rotateMs);
  }
  applyNight(); pixelShift();
  ssStart();   // the sides change places every hour, a photo-only minute twice an hour

  setInterval(tickClock, 1000);
  setInterval(()=>{ tickDates(); tickPrayer(); tickRamadan(); if(CONFIG.panel === 'prayers') renderPanel(false); }, 15000);
  setInterval(renderMatches, 60000);   // one match, no page turns (was every 15 s)
  setInterval(loadLive, 2*60000);
  setInterval(loadPrayers, 6*3600*1000);
  setInterval(loadMatches, 30*60*1000);
  if(!ROT && CONFIG.panel === 'shows') setInterval(loadWeek, 6*3600*1000);   // !ROT
  setInterval(loadWeather, 30*60*1000);
  setInterval(()=>{
    if(CONFIG.panel === 'shows' && WEEK_POOL.length > WEEK_POSTERS){ WEEK_PAGE++; renderWeekPage(true); }
    if(CONFIG.panel === 'matches'){ LIST_PAGE++; renderPanel(matchRows().length > WEEK_ROWS); }
  }, 25*1000);
  setInterval(applyNight, 20*1000);     // was every minute (it writes only a change: see applyNight)
  setInterval(pixelShift, 2*60*1000);   // was every 4 min
  let lastDay = new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(new Date());
  setInterval(()=>{
    const d = new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(new Date());
    if(d !== lastDay){ lastDay = d; loadPhotoIndex().then(() => applyBackground(true)); tickDates(); tickRamadan(); loadPrayers(); loadMatches(); if((ROT || [CONFIG.panel]).includes('shows')) loadWeek(); loadWeather(); renderPanel(false); }   // ROT
  }, 60*1000);
}

// #home=1: the launcher's home screen (HomePage.java): the screensaver's page in rows (see html.home):

function bootHome(){
  const root = document.documentElement;

  applyBackground(true);
  loadPhotoIndex().then(() => applyBackground(true));
  setInterval(() => applyBackground(false), 60*1000);
  tickClock(); tickDates(); tickRamadan();
  tapeStart();
  firstLoad(loadPrayers, 'prayers'); firstLoad(loadWeather, 'weather');   // the card's own loaders skip these two
  // the info strip's next match: the matches unless the card loads them (matches, or standings, which
  // loads them without the live refresh), then the pick again every minute (a game starts or ends)
  const cardList = CONFIG.panels.length > 1 ? CONFIG.panels : [CONFIG.panel];

    if(!cardList.includes('standings')){ firstLoad(loadMatches, 'matches'); setInterval(loadMatches, 30*60*1000); }

    document.querySelector('.week').style.display = 'none';

  } else cardStart();

  setInterval(loadPrayers, 6*3600*1000);
  setInterval(loadWeather, 30*60*1000);
  let lastDay = riyadhDayNumber();
  setInterval(() => {
    if(riyadhDayNumber() === lastDay) return;
    lastDay = riyadhDayNumber();
    loadPhotoIndex().then(() => applyBackground(true)); tickDates(); tickRamadan(); loadPrayers(); loadWeather();
  }, 60*1000);
}

// where the card is (CSS px, as laid out, without the focus scale), sent to the launcher
// (SaudiTVNative.cardRect) whenever it moves or changes size, e.g. a panel with fewer rows; 0 x 0 = no card
function homeCardRect(){
  const N = window.SaudiTVNative, card = document.querySelector('.week'), stage = document.querySelector('.stage');
  if(!N || typeof N.cardRect !== 'function' || !card || !stage) return;
  let last = '';
  const send = () => {
    let x = 0, y = 0, w = 0, h = 0;
    if(card.offsetParent){   // offsets from the stage: a scaled (focused) card reports its own box
      const s = stage.getBoundingClientRect();
      for(let el = card; el && el !== stage; el = el.offsetParent){ x += el.offsetLeft; y += el.offsetTop; }
      x += s.left; y += s.top; w = card.offsetWidth; h = card.offsetHeight;
    }
    const v = [x, y, w, h, innerWidth].map(Math.round), key = v.join(',');
    if(key === last) return;
    last = key;
    try{ N.cardRect(...v); }catch(e){}
  };
  if(window.ResizeObserver) new ResizeObserver(send).observe(card);
  addEventListener('resize', send);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(send);
  send();
}

// The launcher's card: the chosen panel only, refreshed like on the screensaver, nothing else loaded.
function bootWidget(){
  document.documentElement.classList.add('widget');
  restoreSnap();
  setTimeout(saveSnap, 15*1000);
  setInterval(saveSnap, 60*1000);
  addEventListener('pagehide', saveSnap);
  cardStart();
  reveal();
}

// the card and its bridge for the launcher, on the launcher's card (#widget=1) and on the home screen
// (#home=1, which loads the prayers and the weather itself, for its own lines too)
function cardStart(){
  // for the launcher: which panel the card shows now (it rotates), and its focus ring
  window.sauditvCurrentPanel = () => CONFIG.panel;
  window.sauditvSetFocused = on => { document.documentElement.classList.toggle('card-focused', !!on); };
  window.sauditvStep = () => {};   // LEFT/RIGHT on the card; only a rotating card has panels to step through
  if(CONFIG.panels.length > 1){ bootRotatingWidget(); return; }
  const P = CONFIG.panel, own = !CONFIG.home;   // own: the prayers and weather loaders are the card's to start
  if(P === 'shows'){ firstLoad(loadWeek, 'shows'); setInterval(loadWeek, 6*3600*1000); }
  else renderPanel(false);
  if(P === 'prayers' && own){ firstLoad(loadPrayers, 'prayers'); setInterval(loadPrayers, 6*3600*1000); setInterval(() => renderPanel(false), 15000); }
  if(P === 'forecast' && own){ firstLoad(loadWeather, 'weather'); setInterval(loadWeather, 30*60*1000); }
  if(P === 'matches'){ firstLoad(loadMatches, 'matches'); setInterval(loadMatches, 30*60*1000); setInterval(loadLive, 2*60000); }
  startPanelData([P], false);   // standings / news / tech
  setInterval(() => {
    if(APPS_OPEN) return;   // no page turns behind the apps grid
    if(P === 'shows' && WEEK_POOL.length > WEEK_POSTERS){ WEEK_PAGE++; renderWeekPage(true); }
    if(P === 'matches'){ LIST_PAGE++; renderPanel(matchRows().length > WEEK_ROWS); }
  }, 25*1000);
  let lastDay = riyadhDayNumber();
  setInterval(() => { if(riyadhDayNumber() !== lastDay){ lastDay = riyadhDayNumber(); if(P === 'prayers' && own) loadPrayers(); renderPanel(false); } }, 60*1000);
}

// one card that shows each panel in turn (e.g. prayers -> forecast -> matches), every CONFIG.rotateMs
function bootRotatingWidget(){
  const L = CONFIG.panels, own = !CONFIG.home;   // own: as in cardStart
  if(L.includes('prayers') && own){ firstLoad(loadPrayers, 'prayers'); setInterval(loadPrayers, 6*3600*1000); }
  if(L.includes('forecast') && own){ firstLoad(loadWeather, 'weather'); setInterval(loadWeather, 30*60*1000); }
  if(L.includes('matches')){ firstLoad(loadMatches, 'matches'); setInterval(loadMatches, 30*60*1000); setInterval(loadLive, 2*60000); }
  startPanelData(L, L.includes('matches'));   // standings / news / tech
  // the card remembers where it was (a reloaded or re-created card, a restarted launcher):
  // a panel stored less than 30 minutes ago is where the rotation resumes, else it starts at the first one
  const POS_KEY = 'sauditv-card-pos', POS_MAX_AGE = 30*60*1000;
  let i = 0;
  try{
    const s = JSON.parse(localStorage.getItem(POS_KEY) || 'null'), age = s ? Date.now() - Number(s.at) : NaN;
    if(s && age >= 0 && age < POS_MAX_AGE && L.includes(s.panel)) i = L.indexOf(s.panel);
  }catch(e){}
  const savePos = () => { try{ localStorage.setItem(POS_KEY, JSON.stringify({panel: L[i], at: Date.now()})); }catch(e){} };
  CONFIG.panel = L[i];
  savePos();
  renderPanel(false);
  newsFlipArm();   // the first panel, if it is news, pages like the later visits
  rotInit(L); rotMark(i);   // rotation indicator (its line starts with arm)
  // d panels on (+1 next, -1 previous, wrapping), with the rotation's transition (swapPanel)
  const go = d => {
    let k = i;   // |d| steps, each past a panel with nothing to show (rotNext)
    for(let n = 0; n < Math.abs(d); n++) k = rotNext(L, k, d < 0 ? -1 : 1);
    if(k === i) return;
    i = k;
    swapPanel(L[i]);   // fade out, then slide the next panel in (sets CONFIG.panel, LIST_PAGE)
    rotMark(i);
    savePos();
  };
  let rotTimer = 0, held = false;
  // the indicator's line starts again with every (re)start of the timer and every rotation
  // ... except while the launcher holds it (sauditvHold) or its apps grid is open (sauditvAppsOpen)
  const arm = () => {
    clearInterval(rotTimer);
    if(held || APPS_OPEN){ rotTimer = 0; rotFreeze(); return; }
    rotTimer = setInterval(() => { go(1); rotRestart(); }, CONFIG.rotateMs);
    rotRestart();
  };
  arm();
  // the launcher's LEFT/RIGHT (window.sauditvStep(+1 | -1)). Presses during a transition add up and
  // run as one step when it ends; every press restarts the rotation, so the chosen panel stays a full rotateMs.
  let stepQ = 0, stepT = 0;
  const stepRun = () => {
    stepT = 0;
    const wait = CARD_BUSY_UNTIL - Date.now();
    if(wait > 0){ stepT = setTimeout(stepRun, wait + 20); return; }
    const d = stepQ; stepQ = 0;
    if(d){ go(d); arm(); }
  };
  window.sauditvStep = d => {
    stepQ += Number(d) < 0 ? -1 : 1;
    arm();   // no rotation while a step waits for the running transition
    if(!stepT) stepRun();
  };
  // the launcher holds the rotation while a detail window is open (sauditvHold(true)) and releases it when
  // the home screen is back (sauditvHold(false)): the card stays on the panel that was opened, then a fresh rotateMs.
  // ... or on the page last seen in the detail window (it stores 'sauditv-card-pos' on every switch),
  // shown at once, without the rotation's fade-out (the card was hidden behind the window)
  const resumePos = () => {
    let s = null;
    try{ s = JSON.parse(localStorage.getItem(POS_KEY) || 'null'); }catch(e){}
    const k = s ? L.indexOf(s.panel) : -1;
    if(k < 0 || k === i) return;
    i = k;
    clearTimeout(CARD_TIMER); CARD_BUSY_UNTIL = 0; CARD_PENDING = null;   // a swap still running is replaced
    clearTimeout(stepT); stepT = 0; stepQ = 0;
    const card = document.querySelector('.week');
    if(card) card.classList.remove('out');
    CONFIG.panel = L[i];
    LIST_PAGE = 0;
    renderPanel(false, true);
    newsFlipArm();
    rotMark(i);
    savePos();
  };
  // a held rotation stops the indicator's line where it is; arm() starts it again from empty
  window.sauditvHold = on => { held = !!on; if(on){ clearInterval(rotTimer); rotTimer = 0; rotFreeze(); } else { resumePos(); arm(); } };
  // the apps grid opened or closed (sauditvAppsOpen): hold on the same panel, then a fresh rotateMs
  CARD_APPS = on => { if(on){ clearInterval(rotTimer); rotTimer = 0; rotFreeze(); } else arm(); };
  let lastDay = riyadhDayNumber();
  setInterval(() => {
    if(riyadhDayNumber() !== lastDay){ lastDay = riyadhDayNumber(); if(L.includes('prayers') && own) loadPrayers(); renderPanel(false); }
  }, 60*1000);
}

document.addEventListener('keydown', e=>{
  if(e.key === 'f' || e.key === 'F'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen().catch(()=>{});
  }
});

boot();
