  :root{
    --sand:#F6EFE0;
    --dim:#C3B8A2;
    --gold:#DCB86F;
    --green-lt:#57D294;
    --red:#EE6A50;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  /* Hidden until the clock, the saved panels and the photo are in place, then one fade in: no half-built
     frames. The delayed animation shows it anyway if the script ever fails. */
  body{opacity:0;animation:reveal .3s 2.5s forwards}
  html.ready body{opacity:1;animation:none;transition:opacity .3s ease}
  @keyframes reveal{to{opacity:1}}
  /* card-only mode for the launcher */
  html.widget,html.widget body{background:transparent}
  html.widget .photo,html.widget .veil,html.widget .grain,html.widget .top-veil,html.widget .bottom-veil,
  html.widget .dimmer,html.widget #credit,html.widget .top,html.widget .clockwrap,html.widget .bottom{display:none}
  html.widget .stage{height:auto;padding:8px;display:block;transition:none}   /* 8px room for the focus ring (the launcher enlarges the WebView by 8dp per side) */
  html.widget .mid{display:block}
  html.widget .week{width:100%}
  /* the launcher's focus on the card (sauditvSetFocused): a white ring around the card's own rounded box,
     and the card a little larger, growing from its top-right corner */
  html.widget .stage{overflow:visible}   /* or the stage (as tall as the card) clips the ring and the scaled card */
  html.widget .week{transform-origin:top right;transition:transform .15s ease}
  html.widget.card-focused .week{outline:3px solid #fff;outline-offset:2px;transform:scale(1.02);transform-origin:center}
  @media (prefers-reduced-motion:reduce){html.widget .week{transition:none}}
  /* readable from the sofa: row labels 17px, times and values 14px, news 15 / 13px; tighter rows and
     padding so six prayer rows, the title and the rotation indicator stay within the 250px WebView */
  html.widget .week{padding:5px 10px 6px}
  html.widget .week .hd{margin-bottom:1px}
  html.widget .week li:not(.quote):not(.src):not(.empty){font-size:17px;line-height:1.25;padding:2px 0}
  html.widget .week li .ep,html.widget .week li .rt,html.widget .week li .dt{font-size:14px}
  html.widget .week li.news-item span.nw{font-size:15px;line-height:1.25}
  html.widget .week li.news-item .dt{font-size:13px;line-height:1.3}
  html.widget .rot{margin-top:4px}
  html.widget .rot-dots{margin-top:4px}

  /* #detail=<panel>: one panel full screen on a dark page (the launcher's detail window, 1280x720) */
  html.detail,html.detail body{background:#0f0d18;color:#F3EEE3}
  html.detail .photo,html.detail .veil,html.detail .grain,html.detail .top-veil,html.detail .bottom-veil,
  html.detail .dimmer,html.detail #credit,html.detail .stage{display:none}
  /* the screensaver's current photo behind the detail page, blurred and darkened, still (no animation);
     the page's dark colour shows while it loads or when there is none */
  .dv-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-color:transparent;background-size:cover;
    background-position:center 26%;background-repeat:no-repeat;
    filter:blur(24px) brightness(.35) saturate(1.1);transform:scale(1.1)}
  .dv{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;gap:14px;padding:36px 48px 20px;
    font-size:20px;line-height:1.4;color:#F3EEE3}
  .dv-hd{flex:0 0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:24px;min-width:0}
  .dv-title{font-size:34px;font-weight:500;line-height:1.25;color:#E2C38A;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:.15em}
  .dv-hint{flex:0 0 auto;font-size:16px;color:#9C9279;white-space:nowrap}
  /* the title and, under it, one dot per page of the detail window (◀ ▶ switches; RTL order) */
  .dv-tt{flex:0 1 auto;display:flex;flex-direction:column;min-width:0}
  /* a 24px gold outline icon before the title (right of it, RTL) */
  .dv-tl{display:flex;align-items:center;gap:12px;min-width:0}
  .dv-ic{flex:0 0 auto;display:flex;width:24px;height:24px;color:#E2C38A;margin-bottom:.15em}
  .dv-ic svg{width:24px;height:24px;display:block}
  .dv-dots{display:flex;align-items:center;gap:8px;height:12px;margin-top:2px}
  .dv-dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:#5a5470}
  .dv-dot.on{width:11px;height:11px;background:#E2C38A}
  /* a page switch fades the title and the page out (.2 s), then the next one in (.25 s) */
  .dv-title,.dv-body,.dv-ic{transition:opacity .25s ease-out}
  .dv.out .dv-title,.dv.out .dv-body,.dv.out .dv-ic{opacity:0;transition:opacity .2s ease-in}
  @media (prefers-reduced-motion: reduce){ .dv-title,.dv-body,.dv-ic,.dv.out .dv-title,.dv.out .dv-body,.dv.out .dv-ic{transition:none} }
  .dv-body{flex:1 1 auto;min-height:0;position:relative}
  .dv-scroll{height:100%;overflow:hidden;position:relative}
  .dv-empty{font-size:20px;color:#9C9279;padding-top:8px}
  .dv-meta{font-size:16px;color:#9C9279;font-weight:400}
  .dv-sec{font-size:22px;font-weight:500;color:#E2C38A;line-height:1.3;margin:0 0 6px}
  .dv-sec .dv-meta{margin-inline-start:.6em}
  .dv-tbl + .dv-sec,.dv-hours + .dv-sec{margin-top:14px}
  /* tables, hours, news items and the summary at 88% over the blurred photo (.dv-bg) */
  .dv-tbl{background:rgba(28,25,41,.88);border-radius:12px;padding:2px 0}
  .dv-tr{display:grid;align-items:baseline;column-gap:16px;padding:4px 20px;line-height:1.3;border-bottom:1px solid rgba(243,238,227,.07)}
  .dv-tr:last-child{border-bottom:none}
  .dv-tr > *{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
  .dv-th{font-size:16px;color:#9C9279;padding-top:3px;padding-bottom:3px}
  .dv-tr.hot{background:#2d2940;color:#E2C38A}
  .dv-tr.hot .dv-meta{color:#E2C38A}
  .dv-tr.fol{color:#E2C38A}
  .dv-pt .dv-tr{grid-template-columns:150px 150px 150px minmax(0,1fr)}
  /* the TV lays this page out at 960x540 CSS px; narrower prayer columns leave the date its full line */
  .dv-pw .dv-tr{grid-template-columns:minmax(0,1fr) repeat(5,88px)}
  .dv-fd .dv-tr{grid-template-columns:110px minmax(0,1fr) 150px 80px 230px}
  .dv-mt .dv-tr{grid-template-columns:310px minmax(0,1fr) 230px}
  .dv-mt .dv-tr > :last-child{text-align:right}
  /* at 960 CSS px the fixed columns (40+8*80+gaps) took all 824px and left the club 0; keep it >=220px */
  .dv-st .dv-tr{grid-template-columns:32px minmax(220px,1fr) repeat(8,60px);column-gap:8px}
  .dv-st .dv-tr > :not(:nth-child(2)),.dv-pw .dv-tr > :not(:first-child){text-align:center}
  .dv-sc{color:#E2C38A}
  .dv .live{color:#EE8B70;font-weight:500}
  /* forecast */
  .dv-now{display:flex;align-items:center;gap:28px;margin-bottom:16px}
  .dv-temp{font-family:'ThmanyahDisplay','Thmanyah',serif;font-weight:700;font-size:64px;line-height:1;direction:ltr;
    font-variant-numeric:tabular-nums}
  .dv-now .dv-desc{font-size:20px;font-weight:500}
  .dv-now .dv-meta{margin-top:4px}
  .dv-hours{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));background:rgba(28,25,41,.88);border-radius:12px;padding:8px 6px}
  .dv-hr{display:flex;flex-direction:column;align-items:center;line-height:1.35;white-space:nowrap;font-variant-numeric:tabular-nums}
  /* news / tech */
  .dv-news{display:flex;gap:28px;height:100%}
  .dv-list{flex:0 0 55%;height:100%;overflow:hidden;position:relative}
  .dv-item{background:rgba(28,25,41,.88);border:2px solid transparent;border-radius:10px;padding:8px 16px;margin-bottom:10px}
  .dv-item.focus{border-color:#fff;background:#2d2940}
  .dv-item .h{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
  .dv-item .dv-meta{margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dv-side{flex:1 1 0;min-width:0;align-self:flex-start;max-height:100%;overflow:hidden;background:rgba(28,25,41,.88);border-radius:12px;
    padding:22px 26px;display:flex;flex-direction:column;gap:10px}
  .dv-side .h{font-size:24px;font-weight:500;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;
    -webkit-box-orient:vertical;overflow:hidden}
  .dv-sum{line-height:1.6;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
  /* the side column's parts never shrink (a shrunk clamp box cut a line through the middle); the
     headline is clamped at 3 whole lines and the summary at as many whole lines as fit (dvSideFit) */
  .dv-side > *{flex:none}
  .dv-sum.none{color:#9C9279}
  .dv-news .h[dir=auto]{text-align:right}   /* an English title of the city's news (dvNews), as the shows' */
  .dv-ok{font-size:16px;color:#9C9279;margin-top:6px}
  /* the shows page (dvShows), laid out like the news page: each row a poster thumbnail, the series and
     a line of facts; the focused one on the left with a larger poster and its summary. Posters: 2:3, sized before
     the image arrives; without one, the series' initial on the glass */
  .dv-shw .pp{position:relative;flex:0 0 auto;aspect-ratio:2/3;border-radius:6px;overflow:hidden;
    background:rgba(243,238,227,.07);box-shadow:inset 0 0 0 1px rgba(243,238,227,.1)}
  .dv-shw .pp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .dv-shw .pi{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:500;color:#E2C38A}
  .dv-shw .dv-item{display:flex;align-items:center;gap:14px;padding:6px 14px}
  .dv-shw .dv-item .pp{width:44px}
  .dv-shw .dv-item .pi{font-size:22px}
  .dv-st2{flex:1 1 auto;min-width:0}
  .dv-shw .dv-item .h{-webkit-line-clamp:1;text-align:right}
  .dv-shd{display:flex;gap:18px;align-items:flex-start;margin-bottom:10px}
  .dv-shd > div:last-child{min-width:0;display:flex;flex-direction:column;gap:4px}
  .dv-shd .pp{width:110px}
  .dv-shd .pi{font-size:44px}
  .dv-shd .h{font-size:24px;font-weight:500;line-height:1.35;text-align:right}
  /* the verse / hadith page (dvVerse): the card's quote, large, with its source under it */
  .dv-q{list-style:none;margin:0;padding:28px 40px 24px;background:rgba(28,25,41,.88);border-radius:12px}
  .dv-q li.quote{white-space:normal;font-size:38px;line-height:1.8;color:#FFF7E6}
  .dv-q li.quote.hadith{font-size:30px;line-height:1.75}
  .dv-q li.quote .orn{font-family:'NotoMarks','Noto Naskh Arabic',serif;color:#D6AF6B;font-size:1.05em;padding:0 .15em}
  .dv-q li.quote .saw{font-family:'NotoMarks','Noto Naskh Arabic',serif;color:#D6AF6B;font-size:1.6em;line-height:1;vertical-align:-.1em}
  .dv-q li.quote .nar{font-size:.66em;color:#B9AE96}
  .dv-q li.quote .nar .saw{font-size:1.45em}
  .dv-q li.src{margin-top:14px;font-size:22px;color:#D6AF6B}
  html,body{
    height:100%;overflow:hidden;background:#040E09;color:var(--sand);
    font-family:'Thmanyah',system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;cursor:none;
  }

  .photo{
    position:fixed;inset:0;z-index:0;
    background-image:none;
    background-color:#040E09;
    background-size:cover;
    background-position:center 26%;
    background-repeat:no-repeat;
    transform:scale(1.03);   /* edges stay covered while it settles */
  }
  /* each photo's darkness as a plain black layer: same look as filter:brightness, nothing to recompute */
  .photo::after{content:'';position:absolute;inset:0;background:#000;opacity:var(--dim,.05)}
  .veil{
    position:fixed;inset:0;z-index:1;
    background:
      linear-gradient(180deg,rgba(3,10,7,.62) 0%,rgba(3,10,7,.30) 22%,rgba(3,10,7,.12) 46%,rgba(3,10,7,.42) 74%,rgba(2,6,4,.88) 100%),
      radial-gradient(120% 85% at 22% 34%,rgba(3,14,9,.42) 0%,rgba(3,14,9,0) 58%);
  }
  /* photo credits live in PHOTO-CREDITS.md on GitHub, not on screen */
  #credit{display:none;
    position:fixed;left:26px;bottom:6px;z-index:4;
    font-size:10px;letter-spacing:.02em;
    color:rgba(246,239,224,.30);pointer-events:none;
  }
  .grain{
    position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.55'/></svg>");
  }
  .top-veil{
    position:fixed;left:0;top:0;width:56vw;height:34vh;z-index:3;pointer-events:none;
    background:radial-gradient(120% 100% at 0% 0%,rgba(2,9,6,.82) 0%,rgba(2,9,6,.42) 45%,rgba(2,9,6,0) 76%);
  }
  .bottom-veil{
    position:fixed;left:0;right:0;bottom:0;height:30vh;z-index:3;pointer-events:none;
    background:linear-gradient(180deg,rgba(2,7,4,0) 0%,rgba(2,7,4,.55) 42%,rgba(2,6,4,.86) 100%);
  }
  /* the same place, held from the top: a fixed box held from the bottom gets a layer of its own in
     Chromium (it could follow a browser's toolbar), and then the stage above it gets one too, a full-screen layer
     redrawn every frame while the ticker tape moves */
  .bottom-veil{top:70vh;bottom:auto}

  .stage{
    position:relative;z-index:5;height:100vh;
    padding:3.1vh 3.6vw 5.4vh;
    display:grid;grid-template-rows:auto 1fr auto;gap:1.5vh;
    /* one column no wider than the screen, and nothing drawn past it (an RTL overflow goes left) */
    grid-template-columns:minmax(0,1fr);overflow:hidden;
  }
  /* the bottom bar sits above the 42px ticker tape at the bottom edge (was 5.4vh from the edge) */
  .stage{padding-bottom:calc(42px + 3.4vh)}

  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:2.5vw}

  .up{color:var(--green-lt)}.down{color:var(--red)}

  .week{
    width:min(760px,48vw);justify-self:end;
    background:rgba(4,14,9,.60);   /* no backdrop blur: over a moving photo it is redone every frame */
    border:1px solid rgba(220,184,111,.16);
    border-radius:12px;
    padding:1.7vh 1.4vw;
  }
  .week .hd{
    display:flex;align-items:center;gap:.7em;margin-bottom:1vh;
    font-size:clamp(12px,1vw,18px);font-weight:500;letter-spacing:.18em;color:#D6AF6B;
  }
  .week .hd::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(220,184,111,.5),transparent)}
  .week ul{list-style:none;display:flex;flex-direction:column;gap:0}
  .week li{
    display:flex;align-items:baseline;gap:1.05em;
    font-size:clamp(14px,1.16vw,22px);font-weight:400;color:#F6EEDC;
    white-space:nowrap;line-height:1.3;
    padding:.8vh 0;border-bottom:1px solid rgba(220,184,111,.13);
  }
  .week li:last-child{border-bottom:none}
  .week li span:first-child{flex:0 1 auto;max-width:68%;overflow:hidden;text-overflow:ellipsis;padding-bottom:.3em;margin-bottom:-.3em}
  /* screensaver card row labels at 17px (card mode and detail keep their own sizes) */
  html:not(.widget):not(.detail) .week li:not(.quote):not(.src):not(.empty) span:first-child{font-size:17px}
  .week li .ep{flex:0 0 auto;color:#9FB8A8;font-size:.74em;font-variant-numeric:tabular-nums}
  .week li .rt{flex:0 0 auto;color:#E0BA74;font-size:.74em;font-variant-numeric:tabular-nums}
  .week li .dt{flex:1 1 auto;color:#9C9279;font-size:.72em;min-width:3.2em;text-align:left}
  /* the muted times and values at least 15px, readable from 3 m (the card mode sets its own sizes) */
  .week li .ep,.week li .rt{font-size:max(15px,.74em)}
  .week li .dt{font-size:max(15px,.72em)}
  /* slower, softer slide-in (was .5s ease, .06s steps); six rows for the prayers */
  .week ul.flip li{animation:weekIn 1.1s cubic-bezier(.22,.61,.36,1) both}
  .week ul.flip li:nth-child(2){animation-delay:.12s}
  .week ul.flip li:nth-child(3){animation-delay:.24s}
  .week ul.flip li:nth-child(4){animation-delay:.36s}
  .week ul.flip li:nth-child(5){animation-delay:.48s}
  .week ul.flip li:nth-child(6){animation-delay:.6s}
  @keyframes weekIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* when the card rotates, its list and title fade out first (0.6 s); then the list is back at once
     (its rows slide in from transparent) and the title fades back in */
  .week .hd{transition:opacity .6s ease}
  .week.out .hd,.week.out ul{opacity:0;transition:opacity .6s ease}
  @media (prefers-reduced-motion:reduce){
    .week ul.flip li{animation:none}
    .week .hd,.week.out .hd,.week.out ul{transition:none}
  }
  /* a news item is a headline in up to two lines at the card's full width (0.8x the row font), with
     its source and age on one muted line under it (0.62x); li.news-item outranks the span:first-child and .dt
     rules above, so the other panels keep their rows */
  .week li.news-item{display:block;white-space:normal}
  .week li.news-item span.nw{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    max-width:none;padding-bottom:0;margin-bottom:0;font-size:.8em;line-height:1.3}
  .week li.news-item .dt{display:block;min-width:0;font-size:.62em;line-height:1.3;text-align:start;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* the source / age line at least 14px, and the headline at least 16px so it stays above it */
  .week li.news-item span.nw{font-size:max(16px,.8em)}
  .week li.news-item .dt{font-size:max(14px,.62em)}
  /* the city's news keeps each title in its own language: an English one (dir=auto) reads left to right and keeps
     the card's right edge, as the shows' names do */
  .week li.news-item span.nw[dir=auto]{text-align:right}
  /* rotation indicator at the bottom of a rotating card: a 2px line that fills from the right over
     CONFIG.rotateMs (rotRestart), and one dot per panel, the current one larger and gold */
  .rot{margin-top:1.2vh}
  .rot-ln{height:2px;border-radius:1px;background:rgba(90,84,112,.45);overflow:hidden}
  .rot-ln i{display:block;height:100%;background:#E2C38A;transform:scaleX(0);transform-origin:right center}
  .rot-dots{display:flex;justify-content:center;align-items:center;gap:6px;height:7px;margin-top:.9vh}
  .rot-dots b{flex:0 0 auto;width:5px;height:5px;border-radius:50%;background:#5a5470}
  .rot-dots b.on{width:7px;height:7px;background:#E2C38A}
  .week li.past{color:#8F8670}
  .week li.next{color:#FFE9B8}
  .week li.next .dt{color:#E0BA74}
  .week li.quote{white-space:normal;display:block;font-size:clamp(17px,1.5vw,29px);line-height:1.75;
    border-bottom:none;padding:.4vh 0 0;color:#FFF7E6}
  /* Thmanyah draws ﴿﴾ as small angle marks: they come from the NotoMarks subset */
  .week li.quote .orn{font-family:'NotoMarks','Noto Naskh Arabic',serif;color:#D6AF6B;
    font-size:1.05em;padding:0 .15em}
  /* ﷺ is not in Thmanyah either: NotoMarks, in gold like the verse brackets so it reads as ornament */
  .week li.quote .saw{font-family:'NotoMarks','Noto Naskh Arabic',serif;color:#D6AF6B;font-size:1.6em;line-height:1;vertical-align:-.1em}
  /* a full hadith: the isnad and the narration small and muted, the Prophet's words ﷺ at full size */
  .week li.quote.hadith{font-size:clamp(15px,1.3vw,25px);line-height:1.7}
  .week li.quote .nar{font-size:.66em;color:#B9AE96}
  .week li.quote .nar .saw{font-size:1.45em}
  .week li.src{border-bottom:none;padding:.6vh 0 0;font-size:clamp(12px,.95vw,18px);color:#D6AF6B}
  .week .empty{color:#9A9078;font-size:clamp(14px,1.1vw,21px);font-weight:300;margin-top:1vh}
  /* the shows card: a row of posters (2:3, rounded; the box is sized before the image arrives, so nothing
     moves when it does), each with its name (one line) and its episode and day under it. No poster: the series'
     initial on the glass. Still images: nothing animates but the card's own slide-in. */
  .week li.posters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 .9vw;align-items:start;
    white-space:normal;border-bottom:none;padding:.4vh 0 0}
  .week li.posters .pt{min-width:0}
  .week li.posters .pp{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;
    background:rgba(243,238,227,.07);box-shadow:inset 0 0 0 1px rgba(243,238,227,.1)}
  .week li.posters .pp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .week li.posters .pi{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:clamp(26px,2.4vw,48px);font-weight:500;color:#D6AF6B}
  .week li.posters .pn{margin-top:.6vh;font-size:clamp(14px,1.05vw,20px);line-height:1.3;text-align:right;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .week li.posters .ps{font-size:clamp(12px,.85vw,16px);line-height:1.3;color:#9FB8A8;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .dates{text-align:right;flex-shrink:0}
  .hijri{font-size:clamp(19px,1.86vw,37px);font-weight:500;color:var(--sand);line-height:1.3}
  .greg{margin-top:.55vh;font-size:clamp(12px,1.06vw,21px);font-weight:300;color:var(--dim)}
  /* starts at the screen edge, under the first letters, and fades toward the middle */
  .rule{margin-top:1.2vh;width:clamp(100px,9vw,190px);height:1px;margin-left:auto;margin-right:0;
    background:linear-gradient(270deg,var(--gold),rgba(220,184,111,0))}

  /* the card keeps its width on the left; the clock is centred in the space between it and the right edge */
  /* the clock's column may shrink below the clock (minmax(0,1fr)) so a wide time can never make the
     row wider than the screen; in an RTL page that pushed the card, the markets and the matches off the left edge */
  .mid{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4.5vw}
  .clockwrap{display:flex;flex-direction:column;align-items:center;justify-self:center}
  .clock{
    display:flex;align-items:baseline;justify-content:center;direction:ltr;
    font-family:'ThmanyahDisplay','Thmanyah',serif;
    font-weight:700;

    color:#FFFDF6;font-variant-numeric:tabular-nums;
    text-shadow:0 4px 70px rgba(0,0,0,.65), 0 0 130px rgba(255,236,190,.12);
  }
  /* below 1600px the card takes 48vw, so the clock (with the VPN badge, widest at 12:33) is set at
     14vw instead of 17vw to fit the space beside it; 1920x1080 keeps the full size */
  @media (max-width:1599.98px){.clock{font-size:clamp(120px,min(14vw,31vh),345px)}}
  .clock .d{unicode-bidi:isolate}
  .clock .d i{font-style:normal}
  .clock .d i + i{margin-left:var(--digit-gap,.09em)}
  .clock .sep{
    font-size:.46em;align-self:center;transform:translateY(-.08em);color:var(--gold);opacity:.9;padding:0 .1em;
  }
  /* VPN status beside the clock (the app answers SaudiTVNative.vpn()) */
  .clock .vpn{display:flex;flex-direction:column;align-items:center;align-self:flex-start;
    font-size:.11em;margin-top:1.15em;margin-inline-end:.7em;letter-spacing:0;text-shadow:none}
  .clock .vpn[hidden]{display:none}
  .clock .vpn b{display:flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;
    font:700 1em/1 system-ui,sans-serif;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.45)}
  .clock .vpn::after{content:'VPN';font:700 .42em/1 system-ui,sans-serif;margin-top:.35em;letter-spacing:.04em}
  /* the VPN server's country flag left of the check while the VPN works (tickVpn); where the WebView
     has no colour flags, its two letters in a small pill */
  .clock .vpn-r{display:flex;align-items:center;gap:.35em}
  .clock .vpn-f{font:400 1.3em/1 'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif}
  .clock .vpn-f:empty{display:none}
  .clock .vpn-f.cc{font:700 .62em/1 system-ui,sans-serif;padding:.3em .45em;border-radius:.7em;color:#fff;
    background:rgba(255,255,255,.16);letter-spacing:.04em}
  .clock .vpn.on b{background:#34C759} .clock .vpn.on::after{color:#34C759}
  .clock .vpn.off b{background:#FF453A} .clock .vpn.off::after{color:#FF453A}
  .clock .vpn.warn b{background:#FF9F0A} .clock .vpn.warn::after{color:#FF9F0A}
  .clock .ampm{
    font-size:.28em;font-weight:500;color:var(--gold);
    align-self:flex-start;margin-top:.12em;margin-inline-end:.25em;

  .p-prayer{text-align:right}

  .p-mid .num{font-size:1.3em;line-height:1}
  .p-mid .unit{font-size:.46em;font-weight:500;color:#D6AF6B;letter-spacing:.02em;display:inline;vertical-align:.5em}
  .p-match{text-align:left}

  .mrow{display:flex;flex-direction:row;gap:1.6vw;align-items:flex-end;justify-content:flex-end;min-width:0}
  .mblock{text-align:left;flex:0 1 auto;min-width:0;max-width:100%}
  .mblock:not(:last-child){padding-inline-end:1.6vw;border-inline-end:1px solid rgba(220,184,111,.25)}
  .mrow:has(.mblock + .mblock) .big{font-size:clamp(18px,1.6vw,34px)}
  .mblock .big{justify-content:flex-end;min-width:0}
  .mrow.flip .mblock{animation:weekIn .5s ease both}
  .mrow.flip .mblock + .mblock{animation-delay:.08s}
  .mblock .big > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;
    padding-bottom:.3em;margin-bottom:-.3em}  /* room for the dots under ي, ج… */
  .none-week{font-size:clamp(26px,2.5vw,54px);font-weight:700;font-family:'ThmanyahDisplay','Thmanyah',serif;color:#A79C85}

  /* A new photo settles in over a minute, then holds still: an endless drift kept the TV redrawing
     the whole screen 60 times a second, for hours. */
  @keyframes settle{
    from{transform:scale(1.055) translate3d(-.55%,-.4%,0)}
    to{transform:scale(1.03) translate3d(0,0,0)}
  }
  @media (prefers-reduced-motion:no-preference){.photo.settle{animation:settle 60s ease-out both}}

  /* ===== top left: weather and markets, set like the date block on the right (no boxes) ===== */
  .markets{text-align:left;flex-shrink:0}
  .wxline{display:flex;align-items:baseline;gap:.5em;justify-content:flex-end;line-height:1.3;
    font-size:clamp(19px,1.86vw,37px);font-weight:500;color:var(--sand)}
  .wxt{font-family:'ThmanyahDisplay','Thmanyah',serif;font-weight:700;color:#FFFCF2;direction:ltr;
    font-variant-numeric:tabular-nums}
  .wxd.dust{color:#E8B86A}
  .wxsub{margin-top:.55vh;font-size:clamp(12px,1.06vw,21px);font-weight:300;color:var(--dim);white-space:nowrap}
  .wxr:not(:empty)::before{content:'  ·  ';white-space:pre;color:rgba(214,175,107,.7)}
  .wxt:empty,.wxd:empty,.wxr:empty{display:none}
  .rule.l{margin-left:0;margin-right:auto;background:linear-gradient(90deg,var(--gold),rgba(220,184,111,0))}
  /* the market ticker tape (tapeRender), in place of the three markets under the weather: a thin
     full-width glass strip at the bottom edge of the screensaver, or alone on the page (#ticker=1). Each item is
     the name, the value and the daily change (green up, red down, grey unchanged), then a dot.
     The run holds the list twice and moves right (RTL news ticker) by exactly one copy's width, so the loop has no
     seam; only its transform animates, on its own layer. Glass as the card beside the clock: its tint over the photo
     and its thin gold edge (on top), plus a frosted blur of the photo, a faint highlight under the edge and a soft
     shadow. 42px on screen; its glass reaches 12px past either side and 10px below the screen (padding), room for
     pixelShift's ±12 / ±10 px, and the markets sit 1px above the middle so they stay whole at +10 px. */
  .tape{position:fixed;left:-12px;right:-12px;bottom:-10px;z-index:6;height:52px;padding:0 0 12px;overflow:hidden;
    contain:strict;display:flex;align-items:center;pointer-events:none;
    background:rgba(4,14,9,.60);border-top:1px solid rgba(220,184,111,.16);box-shadow:0 -8px 24px rgba(0,0,0,.28);
    font-size:17px;font-weight:400;line-height:1.3;color:#D8CDB6;white-space:nowrap}
  .tape::after{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:rgba(255,255,255,.06)}
  /* The frost: the photo itself behind the strip (showBackground sets it, with its darkness), blurred when it is
     drawn and then kept, under the card's tint. Not a backdrop-filter: on this TV's WebView that is redone every
     frame while the run moves, about +40% of a CPU core whatever the radius (4 or 12px). Its box is the screen plus
     40px around (the blur's soft edge stays off the strip); the shift and the margin are lost in the blur. */
  .tape-frost{position:absolute;z-index:-1;left:-28px;right:-28px;bottom:-30px;height:calc(100vh + 80px);
    background:#040E09 no-repeat center 26% / cover;filter:blur(12px) saturate(1.2)}
  .tape-frost::before,.tape-frost::after{content:'';position:absolute;inset:0}
  .tape-frost::before{background:#000;opacity:var(--dim,.05)}
  .tape-frost::after{background:rgba(4,14,9,.60)}
  .tape[hidden]{display:none}
  .tape-run{display:flex;flex:none;align-items:center;will-change:transform}
  .tape-set{display:flex;flex:none;align-items:center}
  .tape-i{display:flex;flex:none;align-items:baseline;gap:.45em}
  .tape-n{font-size:.95em}
  .tape-v{color:var(--sand);font-variant-numeric:tabular-nums}
  .tape-c{font-size:.89em;font-variant-numeric:tabular-nums;color:#9C9279}
  .tape-c.up{color:#4ADE80}
  .tape-c.down{color:#F87171}
  .tape-dot{flex:none;width:4px;height:4px;margin:0 1.1em;border-radius:50%;background:var(--gold);opacity:.45}
  @media (prefers-reduced-motion:reduce){   /* still: the first market clear of the edge */
    .tape{padding-left:calc(3.6vw + 12px);padding-right:calc(3.6vw + 12px)}
    html.ticker .tape{padding:0 3.6vw}
  }
  html.widget .tape,html.detail .tape{display:none}
  /* #ticker=1: only the tape, filling the page (e.g. a short WebView), on a transparent page; no
     photo, veils, clock or card. A blur here would only see the empty page, not whatever is behind the WebView:
     the glass is drawn instead, like the launcher's pills and VPN chip (a dark see-through fill, a
     light top edge), with a slight vertical gradient. */
  html.ticker,html.ticker body{background:transparent}
  html.ticker .photo,html.ticker .veil,html.ticker .grain,html.ticker .top-veil,html.ticker .bottom-veil,
  html.ticker .dimmer,html.ticker #credit,html.ticker .stage{display:none}
  html.ticker .tape{inset:0;height:auto;padding:0;font-size:16px;box-shadow:none;
    background:linear-gradient(180deg,rgba(0,0,0,.34),rgba(0,0,0,.46));border-top-color:rgba(255,255,255,.20)}
  html.ticker .tape-frost{display:none}
  /* the screensaver only (not home, card, detail or ticker): its still content a little see-through, so
     no bright pixel stays full white for hours (burn-in). Opacity on each group, never on the moving tape run (its
     own layer): the clock's digits .7, the am/pm mark, the VPN badge, the dates, the weather, the line under the
     clock and the info bar .78, the card's text .8 and its glass a lighter tint (.48, was .60), the tape's glass .50
     (was .60) and its markets .8. The card's text by its colours (.8 alpha) and opacity on its small coloured parts,
     not on the card or its list: rows that have played their entry animation sit on layers of their own, and an
     opacity around them is drawn off-screen every frame the moving tape redraws (+7% of a core on this TV). The
     night dimmer stays on top of all of it. */
  html:not(.widget):not(.detail):not(.home):not(.ticker) .clock .d{opacity:.7}
  html:not(.widget):not(.detail):not(.home):not(.ticker) .clock .sep{opacity:.63}
  html:not(.widget):not(.detail):not(.home):not(.ticker) :is(.clock .ampm,.clock .vpn,.dates,.markets,.subline,.bottom){opacity:.78}
  html:not(.widget):not(.detail):not(.home):not(.ticker) .week{background:rgba(4,14,9,.48)}
  html:not(.widget):not(.detail):not(.home):not(.ticker) :is(.week .hd,.week li.src){color:rgba(214,175,107,.8)}
  html:not(.widget):not(.detail):not(.home):not(.ticker) .week li:not(:where(.past,.empty)){color:rgba(246,238,220,.8)}
  html:not(.widget):not(.detail):not(.home):not(.ticker) .week li.next{color:rgba(255,233,184,.8)}
  html:not(.widget):not(.detail):not(.home):not(.ticker) .week li.quote{color:rgba(255,247,230,.8)}
  html:not(.widget):not(.detail):not(.home):not(.ticker) .week li :is(.dt,.ep,.rt,.orn,.nar),
  html:not(.widget):not(.detail):not(.home):not(.ticker) .week li.quote > .saw{opacity:.8}
  html:not(.widget):not(.detail):not(.home):not(.ticker) .tape{background:rgba(4,14,9,.50)}
  html:not(.widget):not(.detail):not(.home):not(.ticker) .tape-frost::after{background:rgba(4,14,9,.50)}
  html:not(.widget):not(.detail):not(.home):not(.ticker) .tape-i{opacity:.8}
  /* the screensaver against image retention (ssTick; html.ss-swap is set on the screensaver only): every
     hour the sides change places (odd hours swapped). The clock (with its VPN badge and the line under it) goes left and the card right; on
     top the dates go left and the weather right; in the info bar the match goes right and the next prayer left
     (Ramadan in the middle moves with the columns). Each block keeps to its own screen edge, as before: its text,
     its rows and its gold rule are set from that side. The ticker tape stays (pixelShift moves it). Not on a narrow
     page (its own layout below). */
  @media not all and (max-aspect-ratio:5/4){
    html.ss-swap .mid{grid-template-columns:auto minmax(0,1fr)}
    html.ss-swap .mid .clockwrap{grid-column:2;grid-row:1}
    html.ss-swap .mid .week{grid-column:1;grid-row:1}
    html.ss-swap .top{flex-direction:row-reverse}
    html.ss-swap .dates{text-align:left}
    html.ss-swap .dates .rule{margin-left:0;margin-right:auto;background:linear-gradient(90deg,var(--gold),rgba(220,184,111,0))}
    html.ss-swap .markets{text-align:right}
    html.ss-swap .wxline{justify-content:flex-start}
    html.ss-swap .markets .rule.l{margin-left:auto;margin-right:0;background:linear-gradient(270deg,var(--gold),rgba(220,184,111,0))}
    html.ss-swap .bottom{grid-template-columns:1.3fr .9fr 1fr}
    html.ss-swap .p-match{grid-column:1;grid-row:1;text-align:right}
    html.ss-swap .p-mid{grid-column:2;grid-row:1}
    html.ss-swap .p-prayer{grid-column:3;grid-row:1;text-align:left}
    html.ss-swap .p-prayer .big{justify-content:flex-end}
    html.ss-swap :is(.p-match .big,.mblock .big,.mrow){justify-content:flex-start}
    html.ss-swap .mblock{text-align:right}
  }
  /* the screensaver's photo-only minute (ssTick): once the stage and the tape have faded out they are
     hidden, so nothing of them is drawn until they fade back in */
  html.ss-break .stage,html.ss-break .tape{visibility:hidden}
  /* #home=1: the launcher's home screen (HomePage.java), the screensaver's look in rows. On top the
     dates and the weather, under the launcher's pills (--pills-h, at the top left); then the clock with its VPN
     badge, beside the rotating card; then an empty band for the launcher's apps row (--dock-h tall, --dock-b above
     the bottom edge: only the photo shows there); under it the info strip (.hinfo: next prayer, Ramadan, next match)
     in the room between the apps row and the tape; the ticker tape at the bottom edge, moving as on the screensaver
     (tapeLay; was stepping, tapeStep). The
     launcher sends the three sizes in dp, which are CSS px here.
     No info bar, no pixelShift, no night dimming and no photo drift: every frame the page draws redraws the whole
     home screen, the launcher's views included. */
  .hinfo{display:none}
  /* 90 / 72 (was 112 / 50): a slimmer apps row, and under it the info strip (72 - 42 = 30px); the card's
     tallest panel (three two-line news items and the rotation dots, 260px) still fits above the row, ring and all */
  html.home{--dock-h:90px;--dock-b:72px;--pills-h:26px}
  /* 8px above the apps row (was 10) and the rules under the dates and the weather a little closer
     (.8vh, was 1.2vh): room for the focus ring (3px outline, 2px offset, 1.02 scale) around a 260px card */
  html.home .stage{padding:16px 3.6vw calc(var(--dock-b) + var(--dock-h) + 8px);grid-template-rows:auto minmax(0,1fr);gap:8px}
  html.home .rule{margin-top:.8vh}
  html.home .bottom,html.home .subline{display:none}
  html.home .markets{margin-top:calc(var(--pills-h) + 8px)}
  /* the card a little tighter than the screensaver's, so its tallest panel (three two-line news items) fits beside
     the clock at 960x540; whatever is still taller (a long hadith) is cut at the bottom, never over the apps row */
  html.home .week{padding:1.3vh 1.4vw;max-height:100%;overflow:hidden}
  html.home .week .hd{margin-bottom:.6vh}
  html.home .week li:not(.quote):not(.src){padding:.6vh 0}
  html.home .rot{margin-top:.9vh}
  /* the info strip under the apps row (homeLine: hi-pray, hi-ram, hi-match): the screensaver's info bar
     in one line, laid out like it (prayer right, Ramadan centre, match left), on the photo's bottom shade: no glass,
     no rule, so it reads lighter than the tape under it. Each item a small gold icon, its facts and a muted tail; an
     item without data is empty and hidden, the others keep their places. */
  html.home .hinfo{display:grid;position:absolute;left:3.6vw;right:3.6vw;top:calc(100% - var(--dock-b));
    height:calc(var(--dock-b) - 42px);grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;
    column-gap:24px;font-size:15px;font-weight:400;line-height:1.3;color:#BDB29B;white-space:nowrap;
    text-shadow:0 1px 6px rgba(0,0,0,.7)}
  html.home .hi{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;padding-bottom:.2em;margin-bottom:-.2em}
  html.home .hi:empty{display:none}
  html.home #hi-pray{grid-column:1;justify-self:start}
  html.home #hi-ram{grid-column:2;justify-self:center}
  html.home #hi-match{grid-column:3;justify-self:end}
  html.home .hi svg{flex:none;width:15px;height:15px;color:var(--gold);fill:none;stroke:currentColor;stroke-width:1.4;
    stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
  html.home .hi b{font-weight:500;color:#F3EBD8;font-variant-numeric:tabular-nums}
  html.home .hi .m{color:#A99E86;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
  html.home .hi .sc{color:#E0BA74}
  html.home .hi.now svg{color:#F1CF8A;filter:drop-shadow(0 0 5px rgba(220,184,111,.75))}
  html.home .hi.now b{color:#FFE9B8}
  /* a new photo fades in over the last one (1.5 s), then holds still: no 60 s settle */
  html.home .photo.settle{animation:none}
  html.home .photo{transition:background-image 1.5s ease}
  html.home .photo::after{transition:opacity 1.5s ease}
  /* the launcher's focus on the card (sauditvSetFocused): a white ring around it, and the card a little larger */
  html.home .week{transition:transform .15s ease}
  html.home.card-focused .week{outline:3px solid #fff;outline-offset:2px;transform:scale(1.02)}
  /* the launcher's apps grid is open (sauditvAppsOpen): only the photo, blurred and darker, behind it; the
     page's text, card and ticker fade out (.25 s) and are then hidden, so nothing behind the grid is drawn again */
  html.home .photo{transition:background-image 1.5s ease,filter .25s ease,transform .25s ease}
  html.home.apps-open .photo{filter:blur(16px) brightness(.6) saturate(1.1);transform:scale(1.08)}
  html.home .stage,html.home .tape,html.home .grain{transition:opacity .25s ease,visibility 0s}
  html.home.apps-open .stage,html.home.apps-open .tape,html.home.apps-open .grain{opacity:0;visibility:hidden;
    transition:opacity .25s ease,visibility 0s .25s}
  @media (prefers-reduced-motion:reduce){html.home .week,html.home .photo,html.home .photo::after{transition:none}}
  .p-prayer.now .big{color:#FFE9B8;text-shadow:0 0 40px rgba(220,184,111,.45)}
  .p-prayer.now .label{color:#F1CF8A}
  .live{color:#EE8B70;font-weight:500}
  /* no 6 s transition: applyNight moves it by at most .004 a minute, invisible, and the transition kept
     a full-screen layer animating 6 s of every minute through the evening and the early morning */
  .dimmer{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:30}
  .stage{transition:none}   /* pixelShift moves it at once, one repaint (was a 3 s transition) */
  .sc{color:#E0BA74;letter-spacing:.02em}

  @media (max-aspect-ratio:5/4){
    .top{flex-direction:column-reverse;gap:1.4vh}
    .bottom{grid-template-columns:1fr 1fr}
    .p-match{grid-column:1/-1;text-align:right}
    .mrow{align-items:flex-start}
  }
</style>
</head>
<body>
<div class="photo"></div>
<div id="credit"></div>
<div class="veil"></div>
<div class="grain"></div>
<div class="top-veil"></div>
<div class="bottom-veil"></div>
<div class="dimmer" id="dimmer"></div>

<main class="stage">

  <header class="top">
    <div class="dates">
      <div class="hijri" id="hijri">—</div>
      <div class="greg" id="greg">—</div>
      <div class="rule"></div>
    </div>

    <div class="markets">
      <div class="wxline"><span class="wxt" id="wx-temp"></span><span class="wxd" id="wx-desc"></span></div>
      <div class="wxsub"><span id="wx-city">الرياض</span><span class="wxr" id="wx-range"></span></div>

    </div>
  </header>

  <section class="mid">
    <div class="clockwrap">
      <div class="clock">
        <span class="vpn" id="vpn" hidden><span class="vpn-r"><i class="vpn-f" id="vpn-flag"></i><b></b></span></span><span class="ampm" id="ck-ap">—</span><span class="d" id="ck-h">--</span><span class="sep">:</span><span class="d" id="ck-m">--</span>
      </div>
      <div class="subline"><span class="dot"></span><span id="clock-sub">بتوقيت الرياض</span></div>
    </div>

    <div class="week">
      <div class="hd" id="week-hd">هذا الأسبوع</div>
      <ul id="week-list"><li class="empty">جارٍ التحميل…</li></ul>
      <!-- rotation indicator (rotInit), only on a card that rotates through two or more panels -->
      <div class="rot" id="rot" hidden><div class="rot-ln"><i id="rot-fill"></i></div><div class="rot-dots" id="rot-dots"></div></div>
    </div>
  </section>

  <footer class="bottom">
    <div class="panel p-prayer">
      <div class="label" id="prayer-label">الصلاة القادمة</div>
      <div class="big"><span id="prayer-name">—</span><span class="num" id="prayer-time"></span></div>
      <div class="sub" id="prayer-count">—</div>
    </div>

    <div class="panel p-mid">
      <div class="label" id="ramadan-label">رمضان ١٤٤٨</div>
      <div class="big"><span class="num" id="ramadan-days">—</span></div>
      <div class="sub" id="ramadan-sub">—</div>
    </div>

    <div class="panel p-match">
      <div class="label">المباريات</div>
      <div class="mrow" id="match-row">
        <div class="none-week">لا شيء هذا الأسبوع</div>
      </div>
    </div>
  </footer>

  <!-- home screen only, the info strip under the apps row (tickPrayer, tickRamadan, renderMatches) -->
  <div class="hinfo"><div class="hi" id="hi-pray"></div><div class="hi" id="hi-ram"></div><div class="hi" id="hi-match"></div></div>

</main>

<!-- the market ticker tape (tapeRender); hidden until a first item has loaded -->
<div class="tape" id="tape" hidden><div class="tape-frost" id="tape-frost"></div><div class="tape-run" id="tape-run"></div></div>

<script>
// script errors reach the console (the home card's WebView logs warnings and errors, tag SaudiTV-Card)
addEventListener('error', e => console.error('SaudiTV: ' + e.message + ' (line ' + e.lineno + ':' + e.colno + ')'));
addEventListener('unhandledrejection', e => console.error('SaudiTV: unhandled ' + ((e.reason && e.reason.stack) || e.reason)));
// daily background: one photo per Riyadh day, deterministic
const BGS = [
  {u:"https://raw.githubusercontent.com/raad113/SaudiTV/main/assets/backgrounds/9hWJs7iblh8.jpg", c:"NEOM · Unsplash", d:0.9},
  {u:"https://raw.githubusercontent.com/raad113/SaudiTV/main/assets/backgrounds/XDtzu1D2P8c.jpg", c:"NEOM · Unsplash", d:0.84},
  {u:"https://raw.githubusercontent.com/raad113/SaudiTV/main/assets/backgrounds/t3dlLOhdEzs.jpg", c:"NEOM · Unsplash", d:0.99},
  {u:"https://raw.githubusercontent.com/raad113/SaudiTV/main/assets/backgrounds/LAj90eAXOZA.jpg", c:"NEOM · Unsplash", d:0.96},
  {u:"https://raw.githubusercontent.com/raad113/SaudiTV/main/assets/backgrounds/f5ZB0LHwi0s.jpg", c:"Hala AlGhanim · Unsplash", d:0.88}
];
// the app passes the chosen city in the URL fragment: #city=..&lat=..&lon=..&tz=..
const _Q = new URLSearchParams((location.hash || '').replace(/^#/, ''));
const _list = k => (_Q.get(k) || '').split(',').map(x=>x.trim()).filter(Boolean);
const _num = (k, d) => { const v = parseFloat(_Q.get(k)); return isNaN(v) ? d : v; };
const CONFIG = {
  city: _Q.get('city') || 'الرياض',
  latitude: _num('lat', 24.7136),
  longitude: _num('lon', 46.6753),
  timezone: _Q.get('tz') || 'Asia/Riyadh',
  prayerMethod: _num('method', 4),   // 2 = ISNA (North America), 4 = Umm al-Qura
  // followed teams in priority order: #teams=id,id,... (up to 10); older builds send team1/team2
  teamIds: (_Q.has('teams') ? _Q.get('teams').split(',')
            : [_Q.has('team1') ? _Q.get('team1') : '136013', _Q.has('team2') ? _Q.get('team2') : '136137'])
    .map(x=>(x||'').trim()).filter(x=>/^\d+$/.test(x)).slice(0, 10),
  sportsKey: '123',
  // the card beside the clock: shows | prayers | forecast | matches | verse | standings | news | local | tech | none
  // (#week=0 from older builds = none); standings, news and tech added; local = news of the city (loadLocalNews)
  panel: (p => ['shows','prayers','forecast','matches','verse','standings','news','local','tech','none'].includes(p) ? p : 'shows')
         (_Q.get('panel') || (_Q.get('week') === '0' ? 'none' : 'shows')),
  // the card can rotate through several panels (#panels=prayers,forecast,matches&rotate=10),
  // on the home screen and on the screensaver
  // shows too (it was missing here, so a rotation that listed it never showed it)
  panels: _list('panels').filter(p => ['prayers','forecast','matches','verse','standings','news','local','tech','shows'].includes(p)),
  rotateMs: Math.max(5, _num('rotate', 10)) * 1000,
  // minutes from adhan to iqama (Ministry of Islamic Affairs defaults); Friday Dhuhr has none
  iqama: {Fajr:25, Dhuhr:20, Asr:20, Maghrib:10, Isha:20},
  // "new this week" filters from the app: TVMaze genres, languages, countries, picked show ids
  shows: {
    genres: _list('genres'),
    langs: _list('langs'),
    ids: _list('shows').filter(x=>/^\d+$/.test(x)).slice(0, 30),
    countries: _list('countries').length ? _list('countries') : ['US'],
    minRating: _num('minrating', 7),
  },
  weekWindowDays: 7,
  // #widget=1: only the card, on a transparent page (the launcher's home screen shows it)
  widget: _Q.get('widget') === '1',
  // #detail=<panel>: that one panel full screen (the launcher opens it from the home card)
  detail: (p => ['prayers','forecast','matches','standings','news','local','tech','shows','verse'].includes(p) ? p : '')(_Q.get('detail') || ''),   // shows, verse, local
  // #ticker=1: only the market ticker tape, on a transparent page (bootTicker)
  ticker: _Q.get('ticker') === '1',
  // #home=1: the launcher's home screen (bootHome); dockh / dockb / pillsh: the room its own views
  // take, in dp (= CSS px): the apps row's height and its distance from the bottom edge, the pills' height
  home: _Q.get('home') === '1',
  homeRoom: {'--dock-h': _num('dockh', NaN), '--dock-b': _num('dockb', NaN), '--pills-h': _num('pillsh', NaN)},
  // the screensaver's anti-ghosting periods in minutes (ssTick): the sides change every swapmin, a
  // photo-only minute every breakmin. Tests only: e.g. #swapmin=4&breakmin=4; #nighth=23.5 dims as at that hour
  // (applyNight). The app's preview passes them from ADB (ScreenView.create)
  swapMin: Math.max(1, _num('swapmin', 60)),
  breakMin: Math.max(2, _num('breakmin', 30)),
  nightH: _num('nighth', -1),
};
// in detail mode the loaders' own "redraw if this panel is shown" checks draw the detail page
if(CONFIG.detail) CONFIG.panel = CONFIG.detail;

const GREG = 'ar-SA-u-ca-gregory-nu-arab';
const AR = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
const ar = s => String(s).replace(/[0-9]/g, d => AR[+d]);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');

// one formatter, built once (it was rebuilt on every call, i.e. every second by the clock)
let RP_FMT = null, RP_TZ = '';
function riyadhParts(d = new Date()){
  if(!RP_FMT || RP_TZ !== CONFIG.timezone){
    RP_FMT = new Intl.DateTimeFormat('en-GB',{
      timeZone: CONFIG.timezone, hour12:false,
      year:'numeric', month:'2-digit', day:'2-digit',
      hour:'2-digit', minute:'2-digit', second:'2-digit'
    });
    RP_TZ = CONFIG.timezone;
  }
  const f = RP_FMT.formatToParts(d).reduce((a,p)=>(a[p.type]=p.value,a),{});
  return { y:+f.year, mo:+f.month, d:+f.day, h:(+f.hour)%24, mi:+f.minute, s:+f.second };
}
function fmt12(h, mi){
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${ar(h12)}:${ar(pad(mi))} ${h < 12 ? 'ص' : 'م'}`;
}

// VPN badge, refreshed every 3 s from the Android app (absent in a browser: stays hidden)
function tickVpn(){
  const el = document.getElementById('vpn');
  if(!el || !window.SaudiTVNative || CONFIG.widget) return;
  // 0 = no VPN, 1 = VPN working, 2 = VPN reported but no traffic gets through
  let st = 0, cc = '';
  try{
    const N = window.SaudiTVNative;
    st = N.vpnState ? N.vpnState() : (N.vpn() ? 1 : 0);
    // the VPN server's country (ISO code, '' while unknown), shown only while the VPN works
    if(st === 1 && N.vpnCountry) cc = String(N.vpnCountry() || '').toUpperCase();
  }catch(_){ return; }
  if(!/^[A-Z]{2}$/.test(cc)) cc = '';
  // touch the page only when the state (or the country) changes: rewriting the badge every 3 s
  // repainted the clock around it (its wide text shadows) every 3 s
  if(st + cc === tickVpn.last) return;
  tickVpn.last = st + cc;
  el.hidden = false;
  el.className = 'vpn ' + (st === 1 ? 'on' : st === 2 ? 'warn' : 'off');
  el.querySelector('b').textContent = st === 1 ? '\u2713' : st === 2 ? '!' : '\u2715';
  const f = document.getElementById('vpn-flag');   // its flag, or its two letters (flagEmojiOk)
  if(f){
    const emoji = !!cc && flagEmojiOk();
    f.className = 'vpn-f' + (cc && !emoji ? ' cc' : '');
    f.textContent = !cc ? '' : emoji ? String.fromCodePoint(...[...cc].map(c => 0x1F1E6 + c.charCodeAt(0) - 65)) : cc;
  }
}
// does this WebView draw flag emoji, in colour? Asked once, on a small canvas: a flag it lacks comes
// out as two plain letters or boxes, without colour
let FLAG_OK = null;
function flagEmojiOk(){
  if(FLAG_OK !== null) return FLAG_OK;
  FLAG_OK = false;
  try{
    const c = document.createElement('canvas'); c.width = c.height = 32;
    const x = c.getContext('2d');
    x.textBaseline = 'top'; x.font = "24px 'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif";
    x.fillText('\u{1F1EC}\u{1F1E7}', 0, 0);
    const d = x.getImageData(0, 0, 32, 32).data;
    for(let i = 0; i < d.length; i += 4){
      if(d[i+3] > 64 && (Math.abs(d[i] - d[i+1]) > 30 || Math.abs(d[i+1] - d[i+2]) > 30)){ FLAG_OK = true; break; }
    }
  }catch(e){}
  return FLAG_OK;
}
if(!CONFIG.ticker){ setInterval(tickVpn, 3000); setTimeout(tickVpn, 300); }   // no badge on the ticker page

function tickClock(){
  const p = riyadhParts();
  const h12 = p.h % 12 === 0 ? 12 : p.h % 12;
  // one box per digit: browsers ignore letter-spacing on Arabic digits, and ٤ reaches into the next digit
  const digits = s => [...s].map(ch => '<i>' + ch + '</i>').join('');
  const key = h12 + ':' + p.mi;
  if(key === tickClock.last) return;   // ticks every second, redraws once a minute
  tickClock.last = key;
  document.getElementById('ck-h').innerHTML = digits(ar(h12));
  document.getElementById('ck-m').innerHTML = digits(ar(pad(p.mi)));
  document.getElementById('ck-ap').textContent = p.h < 12 ? 'ص' : 'م';
}

function tickDates(){
  const now = new Date();
  try{
    let h = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{
      timeZone: CONFIG.timezone, weekday:'long', day:'numeric', month:'long', year:'numeric'
    }).format(now);
    h = h.replace(/\s*هـ\s*$/,'').replace(/،\s*$/,'');
    document.getElementById('hijri').textContent = h + ' هـ';
  }catch(e){}
  try{
    document.getElementById('greg').textContent = new Intl.DateTimeFormat(GREG,{
      timeZone: CONFIG.timezone, weekday:'long', day:'numeric', month:'long', year:'numeric'
    }).format(now);
  }catch(e){}
}

const PRAYER_KEYS = ['Fajr','Dhuhr','Asr','Maghrib','Isha'];
const PRAYER_NAMES = {Fajr:'الفجر',Dhuhr:'الظهر',Asr:'العصر',Maghrib:'المغرب',Isha:'العشاء'};
let PRAYERS = [];

let DAY_TIMES = null;
function buildPrayers(t){
  DAY_TIMES = t;
  PRAYERS = PRAYER_KEYS.map(k=>{
    const [h,mi] = String(t[k]).split(':').map(Number);
    return {key:k, name:PRAYER_NAMES[k], h, mi};
  });
}

// Umm al-Qura: Fajr at 18.5°, Maghrib at sunset, Isha 90 min after Maghrib (120 in Ramadan),
// Asr at shadow factor 1. Same method as Aladhan's method 4, so the offline times match to a minute or two.
// `at` (a Date, default now) = the day to compute, for the detail page's next days
function computePrayers(at){
  at = at || new Date();
  const p = riyadhParts(at), lat = CONFIG.latitude, lng = CONFIG.longitude;
  const tz = Math.round((Date.UTC(p.y,p.mo-1,p.d,p.h,p.mi,p.s) - at.getTime()) / 60000) / 60;
  const rad = d => d*Math.PI/180, deg = r => r*180/Math.PI;
  const fix = (a,b) => { a = a - b*Math.floor(a/b); return a < 0 ? a + b : a; };
  const jd0 = Date.UTC(p.y,p.mo-1,p.d)/86400000 + 2440587.5 - lng/(15*24);
  const sun = t => {
    const D = jd0 + t - 2451545;
    const g = fix(357.529 + .98560028*D, 360), q = fix(280.459 + .98564736*D, 360);
    const L = fix(q + 1.915*Math.sin(rad(g)) + .020*Math.sin(rad(2*g)), 360);
    const e = 23.439 - .00000036*D;
    const RA = fix(deg(Math.atan2(Math.cos(rad(e))*Math.sin(rad(L)), Math.cos(rad(L))))/15, 24);
    return {decl: deg(Math.asin(Math.sin(rad(e))*Math.sin(rad(L)))), eqt: q/15 - RA};
  };
  const noon = t => fix(12 - sun(t/24).eqt, 24);
  const angleTime = (angle, t, ccw) => {
    const d = sun(t/24).decl, n = noon(t);
    const T = deg(Math.acos((-Math.sin(rad(angle)) - Math.sin(rad(d))*Math.sin(rad(lat))) /
                            (Math.cos(rad(d))*Math.cos(rad(lat)))))/15;
    return n + (ccw ? -T : T);
  };
  const asrTime = t => {
    const d = sun(t/24).decl;
    const a = -deg(Math.atan(1/(1 + Math.tan(rad(Math.abs(lat - d))))));
    return angleTime(a, t, false);
  };
  const adj = h => h + tz - lng/15;
  const isna = CONFIG.prayerMethod === 2;   // ISNA = Fajr and Isha at 15 degrees
  const fajr = adj(angleTime(isna ? 15 : 18.5, 5, true)), dhuhr = adj(noon(12)), asr = adj(asrTime(13));
  const sunrise = adj(angleTime(.833, 6, true));
  const maghrib = adj(angleTime(.833, 18, false));
  const isha = isna ? adj(angleTime(15, 18, false)) : maghrib + (hijriMonthNow(at) === 9 ? 120 : 90)/60;
  const hm = h => { const m = Math.round(fix(h, 24)*60) % 1440; return pad(Math.floor(m/60)) + ':' + pad(m%60); };
  return {Fajr:hm(fajr), Sunrise:hm(sunrise), Dhuhr:hm(dhuhr), Asr:hm(asr), Maghrib:hm(maghrib), Isha:hm(isha)};
}

async function loadPrayers(){
  const p = riyadhParts();
  const url = `https://api.aladhan.com/v1/timings/${pad(p.d)}-${pad(p.mo)}-${p.y}`
            + `?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}`
            + `&method=${CONFIG.prayerMethod}&timezonestring=${encodeURIComponent(CONFIG.timezone)}`;
  let ok = true;   // false = the offline times are shown (see firstLoad)
  try{
    const r = await fetchT(url, 12000);
    const j = await r.json();
    if(!j?.data?.timings?.Fajr) throw 0;
    buildPrayers(j.data.timings);
  }catch(e){
    ok = false;
    try{ buildPrayers(computePrayers()); }catch(_){}
  }
  tickPrayer();
  tickRamadan();   // Ramadan mode needs the prayer times
  if(CONFIG.panel === 'prayers') renderPanel(false);
  return ok;
}

const UNIT = {
  day: {one:'يوم', two:'يومين', few:'أيام', many:'يوم'},
  hour:{one:'ساعة', two:'ساعتين', few:'ساعات', many:'ساعة'},
  min: {one:'دقيقة', two:'دقيقتين', few:'دقائق', many:'دقيقة'}
};
function qty(n,u){
  if(n === 2) return u.two;
  if(n >= 3 && n <= 10) return `${ar(n)} ${u.few}`;
  return `${ar(n)} ${u.many}`;
}
function humanRemaining(sec){
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), out = [];
  if(h) out.push(qty(h,UNIT.hour));
  if(m || !h) out.push(qty(m,UNIT.min));
  return out.join(' و ');
}
function shortRemaining(ms){
  const d = Math.floor(ms/86400000), h = Math.floor((ms%86400000)/3600000);
  const out = [];
  if(d) out.push(qty(d,UNIT.day));
  if(h && out.length < 2) out.push(qty(h,UNIT.hour));
  if(!out.length) out.push(qty(Math.max(1, Math.ceil(ms/60000)), UNIT.min));
  return out.join(' و ');
}

function isFriday(){
  return new Intl.DateTimeFormat('en-US',{timeZone:CONFIG.timezone,weekday:'short'}).format(new Date()) === 'Fri';
}
function prayerName(x){ return x.key === 'Dhuhr' && isFriday() ? 'الجمعة' : x.name; }

function tickPrayer(){
  const elL=document.getElementById('prayer-label'),
        elN=document.getElementById('prayer-name'),
        elT=document.getElementById('prayer-time'),
        elC=document.getElementById('prayer-count'),
        panel=document.querySelector('.p-prayer');
  if(!PRAYERS.length) return;
  const p = riyadhParts();
  const mins = p.h*60 + p.mi + p.s/60;

  // between adhan and iqama: show the iqama countdown
  const cur = PRAYERS.find(x=>{
    const at = x.h*60 + x.mi;
    const gap = (x.key === 'Dhuhr' && isFriday()) ? 0 : (CONFIG.iqama[x.key] || 0);
    return mins >= at && mins < at + gap;
  });
  if(cur){
    const left = (cur.h*60 + cur.mi + CONFIG.iqama[cur.key]) - mins;
    panel.classList.add('now');
    elL.textContent = 'حان الآن';
    elN.textContent = prayerName(cur);
    elT.textContent = fmt12(cur.h, cur.mi);
    elC.innerHTML = 'الإقامة بعد <b>' + humanRemaining(Math.max(60, Math.ceil(left)*60)) + '</b>';
    homeLine('hi-pray', HI_ICON.pray + `<b>${prayerName(cur)} ${fmt12(cur.h, cur.mi)}</b>`
      + `<span class="m">· الإقامة بعد ${shortHM(Math.max(60, Math.ceil(left)*60))}</span>`, 'hi now');
    return;
  }

  panel.classList.remove('now');
  elL.textContent = 'الصلاة القادمة';
  let next = PRAYERS.find(x => (x.h*60+x.mi) > mins);
  const leftM = next ? (next.h*60 + next.mi) - mins
                     : (PRAYERS[0].h*60 + PRAYERS[0].mi) + 1440 - mins;
  if(!next) next = PRAYERS[0];
  elN.textContent = prayerName(next);
  elT.textContent = fmt12(next.h, next.mi);
  elC.innerHTML = 'بعد <b>' + humanRemaining(Math.max(0, Math.round(leftM*60))) + '</b>';
  // the home screen's info strip, e.g. «الفجر ٥:٥٢ ص · بعد ٩ س ٢٣ د»
  homeLine('hi-pray', HI_ICON.pray + `<b>${prayerName(next)} ${fmt12(next.h, next.mi)}</b>`
    + `<span class="m">· بعد ${shortHM(Math.max(0, Math.round(leftM*60)))}</span>`, 'hi');
}
// an item of the home screen (#home=1), rewritten only when it changes (one repaint, not one per tick);
// '' empties it, which hides it
function homeLine(id, html, cls){
  const el = CONFIG.home ? document.getElementById(id) : null;
  if(!el) return;
  if(cls && el.className !== cls) el.className = cls;
  if(el.innerHTML !== html) el.innerHTML = html;
}
// the info strip's short countdown, e.g. «٩ س ٢٣ د», «٢ س», «٤٥ د» (never «٠ د»)
function shortHM(sec){
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60);
  return h ? ar(h) + ' س' + (m ? ' ' + ar(m) + ' د' : '') : ar(Math.max(1, m)) + ' د';
}
// the info strip's small gold icons (15px, drawn in the text colour: .hi svg): a dome, a crescent, a ball

let RAM_CACHE = {day:'', val:null};
function ramadanStart(){
  const dayKey = new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(new Date());
  if(RAM_CACHE.day === dayKey) return RAM_CACHE.val;
  const fmt = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,month:'numeric'});
  let found = null;
  for(let i=0;i<400;i++){
    const d = new Date(Date.now()+i*86400000);
    if(fmt.format(d) === '9'){
      const p = riyadhParts(d);
      const hy = +new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,year:'numeric'})
        .format(d).replace(/[^0-9]/g,'');
      found = {y:p.y, mo:p.mo, d:p.d, hy};
      break;
    }
  }
  RAM_CACHE = {day: dayKey, val: found};
  return found;
}
function hijriYearNow(){
  try{
    return +new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,year:'numeric'})
      .format(new Date()).replace(/[^0-9]/g,'');
  }catch(e){ return 1448; }
}
function hijriMonthNow(d){   // d = another day (default now)
  try{
    return +new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,month:'numeric'})
      .format(d || new Date()).replace(/[^0-9]/g,'');
  }catch(e){ return 0; }
}
function tickRamadan(){
  const elL=document.getElementById('ramadan-label'),
        elD=document.getElementById('ramadan-days'),
        elS=document.getElementById('ramadan-sub');

  // ---- Ramadan mode: iftar / suhoor instead of the countdown ----
  if(hijriMonthNow() === 9 && PRAYERS.length){
    const rp = riyadhParts();
    const mins = rp.h*60 + rp.mi + rp.s/60;
    const fajr = PRAYERS.find(p=>p.key==='Fajr');
    const maghrib = PRAYERS.find(p=>p.key==='Maghrib');
    const fajrM = fajr.h*60 + fajr.mi, maghribM = maghrib.h*60 + maghrib.mi;
    let label, targetM;
    if(mins < fajrM){ label = 'الإمساك'; targetM = fajrM; }
    else if(mins < maghribM){ label = 'الإفطار'; targetM = maghribM; }
    else { label = 'الإمساك'; targetM = fajrM + 1440; }
    const th = Math.floor((targetM % 1440) / 60), tm = targetM % 60;
    elL.textContent = label;
    elD.innerHTML = ar(th%12===0?12:th%12) + ':' + ar(String(tm).padStart(2,'0'))
                  + ' <span class="unit">' + (th < 12 ? 'ص' : 'م') + '</span>';
    elS.innerHTML = 'بعد <b>' + humanRemaining(Math.max(0, Math.round((targetM - mins)*60))) + '</b>';
    // the home screen's info strip, e.g. «الإفطار ٦:٠٩ م · بعد ٢ س»
    homeLine('hi-ram', HI_ICON.ram + `<b>${label} ${fmt12(th % 24, tm)}</b>`
      + `<span class="m">· بعد ${shortHM(Math.max(0, Math.round((targetM - mins)*60)))}</span>`);
    return;
  }

  // ---- countdown mode ----
  const st = ramadanStart();
  elL.textContent = 'رمضان ' + ar(st ? st.hy : hijriYearNow());
  if(!st){ elD.textContent='—'; elS.textContent=''; homeLine('hi-ram', ''); return; }   // homeLine
  const rp2 = riyadhParts();
  const days = Math.max(0, Math.round(
    (Date.UTC(st.y, st.mo-1, st.d) - Date.UTC(rp2.y, rp2.mo-1, rp2.d)) / 86400000));
  elD.innerHTML = ar(days) + ' <span class="unit">يوم</span>';
  elS.textContent = days === 0 ? 'رمضان مبارك'
    : 'يبدأ ' + new Intl.DateTimeFormat(GREG,{timeZone:CONFIG.timezone,weekday:'long',day:'numeric',month:'long'})
        .format(new Date(Date.UTC(st.y, st.mo-1, st.d, 12)));
  // the home screen's info strip, e.g. «رمضان بعد ١١٠ يوم»
  homeLine('hi-ram', HI_ICON.ram + (days === 0 ? '<b>رمضان مبارك</b>' : days === 1 ? '<b>رمضان</b> غداً'
    : '<b>رمضان</b> بعد ' + qty(days, UNIT.day)));
}

// 1) built-in table, 2) the Arabic label on Wikidata (cached on the device), 3) transliteration meanwhile
const AR_NAMES = (()=>{ try{ return JSON.parse(localStorage.getItem('arNames') || '{}'); }catch(e){ return {}; } })();
const AR_PENDING = new Set();
const AR_KIND = {team:/football|soccer|club|team|منتخب|نادي/i, show:/television|series|sitcom|anime|miniseries|show|مسلسل/i};
const hasArabic = s => /[؀-ۿ]/.test(s);

const TL_WORDS = {the:'ذا',of:'أوف',and:'آند',a:'إيه',in:'إن',on:'أون',to:'تو',us:'أس',fc:'',cf:'',sc:'',afc:'',
  united:'يونايتد',city:'سيتي',real:'ريال',club:'كلوب',sporting:'سبورتنغ',saint:'سانت',st:'سانت'};
const TL_LETTERS = {a:'إيه',b:'بي',c:'سي',d:'دي',e:'إي',f:'إف',g:'جي',h:'إتش',i:'آي',j:'جيه',k:'كيه',l:'إل',m:'إم',
  n:'إن',o:'أو',p:'بي',q:'كيو',r:'آر',s:'إس',t:'تي',u:'يو',v:'في',w:'دبليو',x:'إكس',y:'واي',z:'زد'};
function translit(en){
  const map = {sh:'ش',kh:'خ',th:'ث',dh:'ذ',gh:'غ',ch:'تش',ph:'ف',ck:'ك',qu:'كو',ou:'و',oo:'و',ee:'ي',
    a:'ا',b:'ب',c:'ك',d:'د',e:'ي',f:'ف',g:'ج',h:'ه',i:'ي',j:'ج',k:'ك',l:'ل',m:'م',n:'ن',o:'و',p:'ب',
    q:'ق',r:'ر',s:'س',t:'ت',u:'و',v:'ف',w:'و',x:'كس',y:'ي',z:'ز'};
  const start = {a:'أ',e:'إ',i:'إ',o:'أو',u:'أ'};
  const word = w => {
    if(hasArabic(w) || !/[A-Za-z0-9]/.test(w)) return w;
    const lw = w.toLowerCase();
    if(TL_WORDS[lw] !== undefined) return TL_WORDS[lw];
    if(/^[A-Z]{2,4}$/.test(w)) return lw.split('').map(c=>TL_LETTERS[c]).join(' ');   // CP, PSG
    if(/^al-/.test(lw)) return 'ال' + word(w.slice(3));
    let out = '', x = lw.replace(/(.)\1/g,'$1');
    for(let i = 0; i < x.length;){
      const two = i+1 < x.length ? map[x.slice(i,i+2)] : undefined;
      if(i === 0 && start[x[0]] && !two){ out += start[x[0]]; i++; continue; }
      if(two){ out += two; i += 2; continue; }
      const ch = x[i];
      if(ch === 'e' && i > 0){ i++; continue; }                         // short or silent e
      if(ch === 'c' && /[eiy]/.test(x[i+1] || '')){ out += 'س'; i++; continue; }
      out += /[0-9]/.test(ch) ? ar(ch) : (map[ch] || '');
      i++;
    }
    return out;
  };
  return String(en).replace(/&/g,' و ').replace(/\bAl (?=[A-Z])/g,'Al-')
    .split(/(\s+)/).map(word).join('').replace(/\s{2,}/g,' ').trim();
}

async function wikidataArabic(en, kind){
  const api = 'https://www.wikidata.org/w/api.php?format=json&origin=*';
  const r = await fetchT(`${api}&action=wbsearchentities&type=item&limit=7&language=en&search=${encodeURIComponent(en)}`, 10000);
  const hits = ((await r.json()).search || []).filter(h => AR_KIND[kind].test(h.description || ''));
  if(!hits.length) return '';
  const r2 = await fetchT(`${api}&action=wbgetentities&props=labels&languages=ar&ids=${hits.slice(0,3).map(h=>h.id).join('|')}`, 10000);
  const ents = (await r2.json()).entities || {};
  for(const h of hits.slice(0,3)){
    const l = ents[h.id] && ents[h.id].labels && ents[h.id].labels.ar;
    if(l && l.value) return l.value.replace(/\s*\([^)]*\)\s*/g,' ').replace(/^(نادي|فريق)\s+/,'').trim();
  }
  return '';
}

let arQueue = Promise.resolve();
function arName(en, kind){
  en = String(en || '').trim();
  if(!en || hasArabic(en)) return en;
  if(kind === 'team'){
    const k = TEAM_KEYS[teamKey(en)];
    if(k) return k;
  }
  const key = kind + ':' + en;
  if(AR_NAMES[key] !== undefined) return AR_NAMES[key] || translit(en);
  if(!AR_PENDING.has(key)){
    AR_PENDING.add(key);
    arQueue = arQueue.then(async ()=>{            // one lookup at a time
      try{
        AR_NAMES[key] = await wikidataArabic(en, kind);   // '' = Wikidata has none: keep the transliteration
        try{ localStorage.setItem('arNames', JSON.stringify(AR_NAMES)); }catch(e){}
        if(AR_NAMES[key]){ renderMatches(); renderPanel(false); }
      }catch(e){}                                    // offline: try again next time
      AR_PENDING.delete(key);
    });
  }
  return translit(en);
}
const teamAr = s => arName(s, 'team');

async function fetchNext(id){
  const r = await fetch(`https://www.thesportsdb.com/api/v1/json/${CONFIG.sportsKey}/eventsnext.php?id=${id}`,{cache:'no-store'});
  if(!r.ok) throw 0;
  const j = await r.json();
  if(j?.events) NEXT_LIST[id] = j.events;
  return (j?.events || [])[0] || null;
}
function toDate(ev){
  const s = ev.strTimestamp || `${ev.dateEvent}T${ev.strTime || '00:00:00'}`;
  return new Date(s.endsWith('Z') ? s : s+'Z');
}

// one slot per picked team: a result from the last 24h, else a fixture this week, else hidden
// A game is over once its status says so, or 2.5 h after kick-off; its score stays up for a day after that.
const FINAL = ['FT','AET','PEN','MATCH FINISHED'];
function finishedRecently(ev, now){
  if(!ev || ev.intHomeScore == null || ev.intAwayScore == null) return false;
  const k = toDate(ev).getTime(), end = k + 2.5*3600000;
  const over = FINAL.includes((ev.strStatus || '').toUpperCase()) ? now >= k : now >= end;
  return over && now - end < 86400000;
}
// Keep a score seen at the final whistle: the free API's "last games" list can lag, and "next game"
// moves on to the following fixture right away. Saved, so a restart within the day still shows it.
const KEPT = (()=>{ try{ return JSON.parse(localStorage.getItem('keptResults') || '{}'); }catch(e){ return {}; } })();
function keepResult(id, ev){
  if(!finishedRecently(ev, Date.now())) return;
  KEPT[id] = [ev, ...(KEPT[id] || []).filter(x => x.idEvent !== ev.idEvent && finishedRecently(x, Date.now()))];
  try{ localStorage.setItem('keptResults', JSON.stringify(KEPT)); }catch(e){}
}
function resultsFor(id){
  const seen = new Set();
  return [...(RESULTS[id] || []), ...(KEPT[id] || []), MATCHES[id]]
    .filter(ev => ev && ev.idEvent && !seen.has(ev.idEvent) && seen.add(ev.idEvent));
}

// the bottom bar shows ONE match of all the followed teams: a game in progress first, else the next
// one this week, else the latest result of the last day. Fixtures come from MATCHES (each team's next game, kept
// fresh by loadLive), results from resultsFor, as before.
function pickMatch(now){
  const ms = ev => toDate(ev).getTime();
  const fx = CONFIG.teamIds.map(id => MATCHES[id])
    .filter(ev => ev && ev.idEvent && Number.isFinite(ms(ev)) && !finishedRecently(ev, now));
  const live = fx.filter(ev => now >= ms(ev) && now - ms(ev) <= 2.5*3600000
                            && !FINAL.includes((ev.strStatus || '').toUpperCase())).sort((a, b) => ms(a) - ms(b))[0];
  if(live) return {ev: live, done: false};
  const next = fx.filter(ev => ms(ev) > now && ms(ev) - now <= CONFIG.weekWindowDays * 86400000).sort((a, b) => ms(a) - ms(b))[0];
  if(next) return {ev: next, done: false};
  const done = [].concat(...CONFIG.teamIds.map(resultsFor)).filter(ev => finishedRecently(ev, now)).sort((a, b) => ms(b) - ms(a))[0];
  return done ? {ev: done, done: true} : null;
}

    const day = new Intl.DateTimeFormat(GREG,{timeZone:CONFIG.timezone,weekday:'long'}).format(toDate(done));
    return `<div class="mblock">`
      + `<div class="big"><span>${esc(teamAr(done.strHomeTeam))} <span class="sc">${ar(+done.intHomeScore)} - ${ar(+done.intAwayScore)}</span> ${esc(teamAr(done.strAwayTeam))}</span></div>`
      + `<div class="sub">النتيجة النهائية · ${day}</div></div>`;
  }
  const ev = m.ev;
  const home = esc(teamAr(ev.strHomeTeam)), away = esc(teamAr(ev.strAwayTeam));
  const d = toDate(ev), diff = d - now;
  const p = new Intl.DateTimeFormat('en-GB',{timeZone:CONFIG.timezone,hour:'2-digit',minute:'2-digit',hour12:false})
    .formatToParts(d).reduce((a,x)=>(a[x.type]=x.value,a),{});
  const t12 = ar(fmt12(+p.hour % 24, +p.minute));
  const live = diff <= 0 && ev.intHomeScore != null && ev.intAwayScore != null;
  const sub = diff > 0 ? `بعد ${shortRemaining(diff)} · ${t12}` : `<span class="live">مباشر</span> · ${liveStatus(ev, t12)}`;
  const mid = live ? ` <span class="sc">${ar(+ev.intHomeScore)} - ${ar(+ev.intAwayScore)}</span> ` : ' × ';
  return `<div class="mblock">`
       + `<div class="big"><span>${home}${mid}${away}</span></div>`
       + `<div class="sub">${sub}</div>`
       + `</div>`;
}

// the picked match (pickMatch) in the home screen's info strip, one line: «الأهلي × الخليج · الخميس
// ١١:٠٠ ص» (today: «اليوم»), a game in progress with its score and minute, a result of the last day with its score
function homeMatch(m, now){
  const ev = m.ev, home = esc(teamAr(ev.strHomeTeam)), away = esc(teamAr(ev.strAwayTeam));
  const d = toDate(ev), scored = ev.intHomeScore != null && ev.intAwayScore != null;
  const sc = scored ? ` <span class="sc">${ar(+ev.intHomeScore)} - ${ar(+ev.intAwayScore)}</span> ` : ' × ';
  if(m.done) return HI_ICON.match + `<b>${home}${sc}${away}</b><span class="m">· النتيجة النهائية</span>`;
  const p = new Intl.DateTimeFormat('en-GB',{timeZone:CONFIG.timezone,hour:'2-digit',minute:'2-digit',hour12:false})
    .formatToParts(d).reduce((a,x)=>(a[x.type]=x.value,a),{});
  const t12 = fmt12(+p.hour % 24, +p.minute);
  if(d - now <= 0) return HI_ICON.match + `<b>${home}${scored ? sc : ' × '}${away}</b>`
    + `<span class="m">· <span class="live">مباشر</span> ${liveStatus(ev, t12)}</span>`;
  const day = new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(d)
           === new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(new Date(now))
    ? 'اليوم' : new Intl.DateTimeFormat(GREG,{timeZone:CONFIG.timezone,weekday:'long'}).format(d);
  return HI_ICON.match + `<b>${home} × ${away}</b><span class="m">· ${day} ${t12}</span>`;
}

function liveStatus(ev, t12){
  const st = (ev.strStatus || '').toUpperCase();
  if(st === 'HT') return 'استراحة';
  if(['FT','AET','PEN'].includes(st)) return 'انتهت';
  const m = parseInt(ev.strProgress, 10);
  return isNaN(m) ? `بدأت ${t12}` : `الدقيقة ${ar(m)}`;
}

// while a picked team is playing, refresh that event every 2 minutes
async function loadLive(){
  const now = Date.now(), did = new Set();
  await Promise.all(Object.entries(MATCHES).map(async ([id, ev])=>{
    if(!ev || !ev.idEvent) return;
    const k = toDate(ev).getTime();
    if(now < k - 5*60000 || now > k + 2.5*3600000) return;
    if(ESPN_TEAMS[id]){                     // an ESPN club's schedule again, once per game
      if(did.has(ev.idEvent)) return;
      did.add(ev.idEvent);
      await loadEspnTeam(id);
      return;
    }
    try{
      const r = await fetchT(`https://www.thesportsdb.com/api/v1/json/${CONFIG.sportsKey}/lookupevent.php?id=${ev.idEvent}`, 10000);
      const j = await r.json();
      const fresh = (j.events || [])[0];
      if(fresh && fresh.idEvent === ev.idEvent){ MATCHES[id] = Object.assign({}, ev, fresh); keepResult(id, MATCHES[id]); }
    }catch(e){}
  }));
  pruneEspn();
  renderMatches();
}

// one match (pickMatch), no paging; the row is rewritten only when its text changes

async function fetchLast(id){
