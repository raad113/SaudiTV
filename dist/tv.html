"],[7505,"عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:"],[7553,"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:"],[7563,"عن أبي هريرة رضي الله عنه قال: قال النبي ﷺ:"]],"fallback":[{"n":9,"head":"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ، قَالَ حَدَّثَنَا أَبُو عَامِرٍ الْعَقَدِيُّ، قَالَ حَدَّثَنَا سُلَيْمَانُ بْنُ بِلاَلٍ، عَنْ عَبْدِ اللَّهِ بْنِ دِينَارٍ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ الإِيمَانُ بِضْعٌ وَسِتُّونَ شُعْبَةً، وَالْحَيَاءُ شُعْبَةٌ مِنَ الإِيمَانِ ‏\"‏‏.‏"},{"n":39,"head":"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا عَبْدُ السَّلاَمِ بْنُ مُطَهَّرٍ، قَالَ حَدَّثَنَا عُمَرُ بْنُ عَلِيٍّ، عَنْ مَعْنِ بْنِ مُحَمَّدٍ الْغِفَارِيِّ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ الْمَقْبُرِيِّ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ إِنَّ الدِّينَ يُسْرٌ، وَلَنْ يُشَادَّ الدِّينَ أَحَدٌ إِلاَّ غَلَبَهُ، فَسَدِّدُوا وَقَارِبُوا وَأَبْشِرُوا، وَاسْتَعِينُوا بِالْغَدْوَةِ وَالرَّوْحَةِ وَشَىْءٍ مِنَ الدُّلْجَةِ ‏\"‏‏.‏"},{"n":54,"head":"عن عمر رضي الله عنه أن رسول الله ﷺ قال:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، قَالَ أَخْبَرَنَا مَالِكٌ، عَنْ يَحْيَى بْنِ سَعِيدٍ، عَنْ مُحَمَّدِ بْنِ إِبْرَاهِيمَ، عَنْ عَلْقَمَةَ بْنِ وَقَّاصٍ، عَنْ عُمَرَ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ الأَعْمَالُ بِالنِّيَّةِ، وَلِكُلِّ امْرِئٍ مَا نَوَى، فَمَنْ كَانَتْ هِجْرَتُهُ إِلَى اللَّهِ وَرَسُولِهِ، فَهِجْرَتُهُ إِلَى اللَّهِ وَرَسُولِهِ، وَمَنْ كَانَتْ هِجْرَتُهُ لِدُنْيَا يُصِيبُهَا، أَوِ امْرَأَةٍ يَتَزَوَّجُهَا، فَهِجْرَتُهُ إِلَى مَا هَاجَرَ إِلَيْهِ ‏\"‏‏.‏"},{"n":212,"head":"عن عائشة رضي الله عنها أن رسول الله ﷺ قال:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، قَالَ أَخْبَرَنَا مَالِكٌ، عَنْ هِشَامٍ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ إِذَا نَعَسَ أَحَدُكُمْ وَهُوَ يُصَلِّي فَلْيَرْقُدْ حَتَّى يَذْهَبَ عَنْهُ النَّوْمُ، فَإِنَّ أَحَدَكُمْ إِذَا صَلَّى وَهُوَ نَاعِسٌ لاَ يَدْرِي لَعَلَّهُ يَسْتَغْفِرُ فَيَسُبَّ نَفْسَهُ ‏\"‏‏.‏"},{"n":392,"head":"عن أنس بن مالك رضي الله عنه قال: قال رسول الله ﷺ:","text":"حَدَّثَنَا نُعَيْمٌ، قَالَ حَدَّثَنَا ابْنُ الْمُبَارَكِ، عَنْ حُمَيْدٍ الطَّوِيلِ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ أُمِرْتُ أَنْ أُقَاتِلَ النَّاسَ حَتَّى يَقُولُوا لاَ إِلَهَ إِلاَّ اللَّهُ‏.‏ فَإِذَا قَالُوهَا وَصَلَّوْا صَلاَتَنَا، وَاسْتَقْبَلُوا قِبْلَتَنَا، وَذَبَحُوا ذَبِيحَتَنَا، فَقَدْ حَرُمَتْ عَلَيْنَا دِمَاؤُهُمْ وَأَمْوَالُهُمْ إِلاَّ بِحَقِّهَا، وَحِسَابُهُمْ عَلَى اللَّهِ ‏\"‏‏.‏"},{"n":415,"head":"عن أنس بن مالك رضي الله عنه قال: قال النبي ﷺ:","text":"حَدَّثَنَا آدَمُ، قَالَ حَدَّثَنَا شُعْبَةُ، قَالَ حَدَّثَنَا قَتَادَةُ، قَالَ سَمِعْتُ أَنَسَ بْنَ مَالِكٍ، قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ الْبُزَاقُ فِي الْمَسْجِدِ خَطِيئَةٌ، وَكَفَّارَتُهَا دَفْنُهَا ‏\"‏‏.‏"},{"n":585,"head":"عن ابن عمر رضي الله عنهما أن رسول الله ﷺ قال:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، قَالَ أَخْبَرَنَا مَالِكٌ، عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ لاَ يَتَحَرَّى أَحَدُكُمْ فَيُصَلِّي عِنْدَ طُلُوعِ الشَّمْسِ وَلاَ عِنْدَ غُرُوبِهَا ‏\"‏‏.‏"},{"n":691,"head":"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا حَجَّاجُ بْنُ مِنْهَالٍ، قَالَ حَدَّثَنَا شُعْبَةُ، عَنْ مُحَمَّدِ بْنِ زِيَادٍ، سَمِعْتُ أَبَا هُرَيْرَةَ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ أَمَا يَخْشَى أَحَدُكُمْ ـ أَوْ لاَ يَخْشَى أَحَدُكُمْ ـ إِذَا رَفَعَ رَأْسَهُ قَبْلَ الإِمَامِ أَنْ يَجْعَلَ اللَّهُ رَأْسَهُ رَأْسَ حِمَارٍ أَوْ يَجْعَلَ اللَّهُ صُورَتَهُ صُورَةَ حِمَارٍ ‏\"‏‏.‏"},{"n":734,"head":"عن أبي هريرة رضي الله عنه قال: قال النبي ﷺ:","text":"حَدَّثَنَا أَبُو الْيَمَانِ، قَالَ أَخْبَرَنَا شُعَيْبٌ، قَالَ حَدَّثَنِي أَبُو الزِّنَادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ إِنَّمَا جُعِلَ الإِمَامُ لِيُؤْتَمَّ بِهِ، فَإِذَا كَبَّرَ فَكَبِّرُوا، وَإِذَا رَكَعَ فَارْكَعُوا، وَإِذَا قَالَ سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ‏.‏ فَقُولُوا رَبَّنَا وَلَكَ الْحَمْدُ‏.‏ وَإِذَا سَجَدَ فَاسْجُدُوا، وَإِذَا صَلَّى جَالِسًا فَصَلُّوا جُلُوسًا أَجْمَعُونَ ‏\"‏‏.‏"},{"n":781,"head":"عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، أَخْبَرَنَا مَالِكٌ، عَنْ أَبِي الزِّنَادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ إِذَا قَالَ أَحَدُكُمْ آمِينَ‏.‏ وَقَالَتِ الْمَلاَئِكَةُ فِي السَّمَاءِ آمِينَ‏.‏ فَوَافَقَتْ إِحْدَاهُمَا الأُخْرَى، غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ ‏\"‏‏.‏"},{"n":1035,"head":"عن ابن عباس رضي الله عنهما أن النبي ﷺ قال:","text":"حَدَّثَنَا مُسْلِمٌ، قَالَ حَدَّثَنَا شُعْبَةُ، عَنِ الْحَكَمِ، عَنْ مُجَاهِدٍ، عَنِ ابْنِ عَبَّاسٍ، أَنَّ النَّبِيَّ صلى الله عليه وسلم قَالَ ‏ \"‏ نُصِرْتُ بِالصَّبَا، وَأُهْلِكَتْ عَادٌ بِالدَّبُورِ ‏\"‏‏.‏"},{"n":1214,"head":"عن أنس رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا مُحَمَّدٌ، حَدَّثَنَا غُنْدَرٌ، حَدَّثَنَا شُعْبَةُ، قَالَ سَمِعْتُ قَتَادَةَ، عَنْ أَنَسٍ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ إِذَا كَانَ فِي الصَّلاَةِ فَإِنَّهُ يُنَاجِي رَبَّهُ، فَلاَ يَبْزُقَنَّ بَيْنَ يَدَيْهِ وَلاَ عَنْ يَمِينِهِ، وَلَكِنْ عَنْ شِمَالِهِ تَحْتَ قَدَمِهِ الْيُسْرَى ‏\"‏‏.‏"},{"n":1412,"head":"عن أبي هريرة رضي الله عنه قال: قال النبي ﷺ:","text":"حَدَّثَنَا أَبُو الْيَمَانِ، أَخْبَرَنَا شُعَيْبٌ، حَدَّثَنَا أَبُو الزِّنَادِ، عَنْ عَبْدِ الرَّحْمَنِ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ لاَ تَقُومُ السَّاعَةُ حَتَّى يَكْثُرَ فِيكُمُ الْمَالُ فَيَفِيضَ، حَتَّى يُهِمَّ رَبَّ الْمَالِ مَنْ يَقْبَلُ صَدَقَتَهُ، وَحَتَّى يَعْرِضَهُ فَيَقُولَ الَّذِي يَعْرِضُهُ عَلَيْهِ لاَ أَرَبَ لِي ‏\"‏‏.‏"},{"n":1476,"head":"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا حَجَّاجُ بْنُ مِنْهَالٍ، حَدَّثَنَا شُعْبَةُ، أَخْبَرَنِي مُحَمَّدُ بْنُ زِيَادٍ، قَالَ سَمِعْتُ أَبَا هُرَيْرَةَ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ لَيْسَ الْمِسْكِينُ الَّذِي تَرُدُّهُ الأُكْلَةُ وَالأُكْلَتَانِ، وَلَكِنِ الْمِسْكِينُ الَّذِي لَيْسَ لَهُ غِنًى وَيَسْتَحْيِي أَوْ لاَ يَسْأَلُ النَّاسَ إِلْحَافًا ‏\"‏‏.‏"},{"n":1871,"head":"عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، أَخْبَرَنَا مَالِكٌ، عَنْ يَحْيَى بْنِ سَعِيدٍ، قَالَ سَمِعْتُ أَبَا الْحُبَابِ، سَعِيدَ بْنَ يَسَارٍ يَقُولُ سَمِعْتُ أَبَا هُرَيْرَةَ ـ رضى الله عنه ـ يَقُولُ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم‏.‏ ‏ \"‏ أُمِرْتُ بِقَرْيَةٍ تَأْكُلُ الْقُرَى يَقُولُونَ يَثْرِبُ‏.‏ وَهْىَ الْمَدِينَةُ، تَنْفِي النَّاسَ كَمَا يَنْفِي الْكِيرُ خَبَثَ الْحَدِيدِ ‏\"‏‏.‏"},{"n":1923,"head":"عن أنس بن مالك رضي الله عنه قال: قال النبي ﷺ:","text":"حَدَّثَنَا آدَمُ بْنُ أَبِي إِيَاسٍ، حَدَّثَنَا شُعْبَةُ، حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ صُهَيْبٍ، قَالَ سَمِعْتُ أَنَسَ بْنَ مَالِكٍ ـ رضى الله عنه ـ قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ تَسَحَّرُوا فَإِنَّ فِي السَّحُورِ بَرَكَةً ‏\"‏‏.‏"},{"n":2110,"head":"عن حكيم بن حزام رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنِي إِسْحَاقُ، أَخْبَرَنَا حَبَّانُ، حَدَّثَنَا شُعْبَةُ، قَالَ قَتَادَةُ أَخْبَرَنِي عَنْ صَالِحٍ أَبِي الْخَلِيلِ، عَنْ عَبْدِ اللَّهِ بْنِ الْحَارِثِ، قَالَ سَمِعْتُ حَكِيمَ بْنَ حِزَامٍ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ الْبَيِّعَانِ بِالْخِيَارِ مَا لَمْ يَتَفَرَّقَا، فَإِنْ صَدَقَا وَبَيَّنَا بُورِكَ لَهُمَا فِي بَيْعِهِمَا، وَإِنْ كَذَبَا وَكَتَمَا مُحِقَتْ بَرَكَةُ بَيْعِهِمَا ‏\"‏‏.‏"},{"n":2234,"head":"عن أبي هريرة رضي الله عنه قال: سمعت النبي ﷺ يقول:","text":"حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ عَبْدِ اللَّهِ، قَالَ أَخْبَرَنِي اللَّيْثُ، عَنْ سَعِيدٍ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ سَمِعْتُ النَّبِيَّ صلى الله عليه وسلم يَقُولُ ‏ \"‏ إِذَا زَنَتْ أَمَةُ أَحَدِكُمْ، فَتَبَيَّنَ زِنَاهَا فَلْيَجْلِدْهَا الْحَدَّ، وَلاَ يُثَرِّبْ عَلَيْهَا، ثُمَّ إِنْ زَنَتْ فَلْيَجْلِدْهَا الْحَدَّ وَلاَ يُثَرِّبْ، ثُمَّ إِنْ زَنَتِ الثَّالِثَةَ فَتَبَيَّنَ زِنَاهَا فَلْيَبِعْهَا وَلَوْ بِحَبْلٍ مِنْ شَعَرٍ ‏\"‏‏.‏"},{"n":2354,"head":"عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:","text":"حَدَّثَنَا يَحْيَى بْنُ بُكَيْرٍ، حَدَّثَنَا اللَّيْثُ، عَنْ عُقَيْلٍ، عَنِ ابْنِ شِهَابٍ، عَنِ ابْنِ الْمُسَيَّبِ، وَأَبِي، سَلَمَةَ عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ لاَ تَمْنَعُوا فَضْلَ الْمَاءِ لِتَمْنَعُوا بِهِ فَضْلَ الْكَلإِ ‏\"‏‏.‏"},{"n":2486,"head":"عن أبي موسى رضي الله عنه قال: قال النبي ﷺ:","text":"حَدَّثَنَا مُحَمَّدُ بْنُ الْعَلاَءِ، حَدَّثَنَا حَمَّادُ بْنُ أُسَامَةَ، عَنْ بُرَيْدٍ، عَنْ أَبِي بُرْدَةَ، عَنْ أَبِي مُوسَى، قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ إِنَّ الأَشْعَرِيِّينَ إِذَا أَرْمَلُوا فِي الْغَزْوِ، أَوْ قَلَّ طَعَامُ عِيَالِهِمْ بِالْمَدِينَةِ جَمَعُوا مَا كَانَ عِنْدَهُمْ فِي ثَوْبٍ وَاحِدٍ، ثُمَّ اقْتَسَمُوهُ بَيْنَهُمْ فِي إِنَاءٍ وَاحِدٍ بِالسَّوِيَّةِ، فَهُمْ مِنِّي وَأَنَا مِنْهُمْ ‏\"‏‏.‏"},{"n":2529,"head":"عن عمر بن الخطاب رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا مُحَمَّدُ بْنُ كَثِيرٍ، عَنْ سُفْيَانَ، حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، عَنْ مُحَمَّدِ بْنِ إِبْرَاهِيمَ التَّيْمِيِّ، عَنْ عَلْقَمَةَ بْنِ وَقَّاصٍ اللَّيْثِيِّ، قَالَ سَمِعْتُ عُمَرَ بْنَ الْخَطَّابِ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ الأَعْمَالُ بِالنِّيَّةِ، وَلاِمْرِئٍ مَا نَوَى، فَمَنْ كَانَتْ هِجْرَتُهُ إِلَى اللَّهِ وَرَسُولِهِ، فَهِجْرَتُهُ إِلَى اللَّهِ وَرَسُولِهِ، وَمَنْ كَانَتْ هِجْرَتُهُ لِدُنْيَا يُصِيبُهَا، أَوِ امْرَأَةٍ يَتَزَوَّجُهَا، فَهِجْرَتُهُ إِلَى مَا هَاجَرَ إِلَيْهِ ‏\"‏‏.‏"},{"n":2566,"head":"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا عَاصِمُ بْنُ عَلِيٍّ، حَدَّثَنَا ابْنُ أَبِي ذِئْبٍ، عَنِ الْمَقْبُرِيِّ، ‏{‏عَنْ أَبِيهِ،‏}‏ عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ يَا نِسَاءَ الْمُسْلِمَاتِ لاَ تَحْقِرَنَّ جَارَةٌ لِجَارَتِهَا، وَلَوْ فِرْسِنَ شَاةٍ ‏\"‏‏.‏"},{"n":2776,"head":"عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، أَخْبَرَنَا مَالِكٌ، عَنْ أَبِي الزِّنَادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ لاَ يَقْتَسِمْ وَرَثَتِي دِينَارًا، مَا تَرَكْتُ بَعْدَ نَفَقَةِ نِسَائِي وَمَئُونَةِ عَامِلِي فَهْوَ صَدَقَةٌ ‏\"‏‏.‏"},{"n":2859,"head":"عن سهل بن سعد الساعدي رضي الله عنه أن رسول الله ﷺ قال:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، عَنْ مَالِكٍ، عَنْ أَبِي حَازِمِ بْنِ دِينَارٍ، عَنْ سَهْلِ بْنِ سَعْدٍ السَّاعِدِيِّ ـ رضى الله عنه ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ إِنْ كَانَ فِي شَىْءٍ فَفِي الْمَرْأَةِ وَالْفَرَسِ وَالْمَسْكَنِ ‏\"‏‏.‏"},{"n":3117,"head":"عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:","text":"حَدَّثَنَا مُحَمَّدُ بْنُ سِنَانٍ، حَدَّثَنَا فُلَيْحٌ، حَدَّثَنَا هِلاَلٌ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبِي عَمْرَةَ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ مَا أُعْطِيكُمْ وَلاَ أَمْنَعُكُمْ، أَنَا قَاسِمٌ أَضَعُ حَيْثُ أُمِرْتُ ‏\"‏‏.‏"},{"n":3222,"head":"عن أبي ذر رضي الله عنه قال: قال النبي ﷺ:","text":"حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا ابْنُ أَبِي عَدِيٍّ، عَنْ شُعْبَةَ، عَنْ حَبِيبِ بْنِ أَبِي ثَابِتٍ، عَنْ زَيْدِ بْنِ وَهْبٍ، عَنْ أَبِي ذَرٍّ ـ رضى الله عنه ـ قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ قَالَ لِي جِبْرِيلُ مَنْ مَاتَ مِنْ أُمَّتِكَ لاَ يُشْرِكُ بِاللَّهِ شَيْئًا دَخَلَ الْجَنَّةَ، أَوْ لَمْ يَدْخُلِ النَّارَ، قَالَ وَإِنْ زَنَى وَإِنْ سَرَقَ قَالَ وَإِنْ ‏\"‏‏.‏"},{"n":3223,"head":"عن أبي هريرة رضي الله عنه قال: قال النبي ﷺ:","text":"حَدَّثَنَا أَبُو الْيَمَانِ، أَخْبَرَنَا شُعَيْبٌ، حَدَّثَنَا أَبُو الزِّنَادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ الْمَلاَئِكَةُ يَتَعَاقَبُونَ، مَلاَئِكَةٌ بِاللَّيْلِ وَمَلاَئِكَةٌ بِالنَّهَارِ، وَيَجْتَمِعُونَ فِي صَلاَةِ الْفَجْرِ وَالْعَصْرِ، ثُمَّ يَعْرُجُ إِلَيْهِ الَّذِينَ بَاتُوا فِيكُمْ، فَيَسْأَلُهُمْ وَهْوَ أَعْلَمُ، فَيَقُولُ كَيْفَ تَرَكْتُمْ ‏{‏عِبَادِي‏}‏ فَيَقُولُونَ تَرَكْنَاهُمْ يُصَلُّونَ، وَأَتَيْنَاهُمْ يُصَلُّونَ ‏\"‏‏.‏"},{"n":3286,"head":"عن أبي هريرة رضي الله عنه قال: قال النبي ﷺ:","text":"حَدَّثَنَا أَبُو الْيَمَانِ، أَخْبَرَنَا شُعَيْبٌ، عَنْ أَبِي الزِّنَادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ كُلُّ بَنِي آدَمَ يَطْعُنُ الشَّيْطَانُ فِي جَنْبَيْهِ بِإِصْبَعِهِ حِينَ يُولَدُ، غَيْرَ عِيسَى بْنِ مَرْيَمَ، ذَهَبَ يَطْعُنُ فَطَعَنَ فِي الْحِجَابِ ‏\"‏‏.‏"},{"n":3357,"head":"عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ:","text":"حَدَّثَنَا سَعِيدُ بْنُ تَلِيدٍ الرُّعَيْنِيُّ، أَخْبَرَنَا ابْنُ وَهْبٍ، قَالَ أَخْبَرَنِي جَرِيرُ بْنُ حَازِمٍ، عَنْ أَيُّوبَ، عَنْ مُحَمَّدٍ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ لَمْ يَكْذِبْ إِبْرَاهِيمُ إِلاَّ ثَلاَثًا ‏\"‏‏.‏"},{"n":3444,"head":"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:","text":"وَحَدَّثَنَا عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، أَخْبَرَنَا مَعْمَرٌ، عَنْ هَمَّامٍ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ رَأَى عِيسَى ابْنُ مَرْيَمَ رَجُلاً يَسْرِقُ، فَقَالَ لَهُ أَسَرَقْتَ قَالَ كَلاَّ وَاللَّهِ الَّذِي لاَ إِلَهَ إِلاَّ هُوَ‏.‏ فَقَالَ عِيسَى آمَنْتُ بِاللَّهِ وَكَذَّبْتُ عَيْنِي ‏\"‏‏.‏"},{"n":3538,"head":"عن جابر رضي الله عنهما عن النبي ﷺ قال:","text":"حَدَّثَنَا مُحَمَّدُ بْنُ كَثِيرٍ، أَخْبَرَنَا شُعْبَةُ، عَنْ مَنْصُورٍ، عَنْ سَالِمٍ، عَنْ جَابِرٍ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ تَسَمَّوْا بِاسْمِي، وَلاَ تَكْتَنُوا بِكُنْيَتِي ‏\"‏"},{"n":3898,"head":"عن عمر رضي الله عنه قال: سمعت النبي ﷺ يقول:","text":"حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا حَمَّادٌ ـ هُوَ ابْنُ زَيْدٍ ـ عَنْ يَحْيَى، عَنْ مُحَمَّدِ بْنِ إِبْرَاهِيمَ، عَنْ عَلْقَمَةَ بْنِ وَقَّاصٍ، قَالَ سَمِعْتُ عُمَرَ ـ رضى الله عنه ـ قَالَ سَمِعْتُ النَّبِيَّ صلى الله عليه وسلم يَقُولُ ‏ \"‏ الأَعْمَالُ بِالنِّيَّةِ، فَمَنْ كَانَتْ هِجْرَتُهُ إِلَى دُنْيَا يُصِيبُهَا أَوِ امْرَأَةٍ يَتَزَوَّجُهَا، فَهِجْرَتُهُ إِلَى مَا هَاجَرَ إِلَيْهِ، وَمَنْ كَانَتْ هِجْرَتُهُ إِلَى اللَّهِ وَرَسُولِهِ، فَهِجْرَتُهُ إِلَى اللَّهِ وَرَسُولِهِ صلى الله عليه وسلم ‏\"‏‏.‏"},{"n":4479,"head":"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنِي مُحَمَّدٌ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ، عَنِ ابْنِ الْمُبَارَكِ، عَنْ مَعْمَرٍ، عَنْ هَمَّامِ بْنِ مُنَبِّهٍ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏\"‏ قِيلَ لِبَنِي إِسْرَائِيلَ ‏{‏ادْخُلُوا الْبَابَ سُجَّدًا وَقُولُوا حِطَّةٌ‏}‏ فَدَخَلُوا يَزْحَفُونَ عَلَى أَسْتَاهِهِمْ، فَبَدَّلُوا وَقَالُوا حِطَّةٌ، حَبَّةٌ فِي شَعَرَةٍ ‏\"‏‏.‏"},{"n":4662,"head":"عن أبي بكرة رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ عَبْدِ الْوَهَّابِ، حَدَّثَنَا حَمَّادُ بْنُ زَيْدٍ، عَنْ أَيُّوبَ، عَنْ مُحَمَّدٍ، عَنِ ابْنِ أَبِي بَكْرَةَ، عَنْ أَبِي بَكْرَةَ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ إِنَّ الزَّمَانَ قَدِ اسْتَدَارَ كَهَيْئَتِهِ يَوْمَ خَلَقَ اللَّهُ السَّمَوَاتِ وَالأَرْضَ، السَّنَةُ اثْنَا عَشَرَ شَهْرًا مِنْهَا، أَرْبَعَةٌ حُرُمٌ، ثَلاَثٌ مُتَوَالِيَاتٌ، ذُو الْقَعْدَةِ وَذُو الْحِجَّةِ وَالْمُحَرَّمُ وَرَجَبُ مُضَرَ الَّذِي بَيْنَ جُمَادَى وَشَعْبَانَ ‏\"‏‏.‏"},{"n":4805,"head":"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنِي إِبْرَاهِيمُ بْنُ الْمُنْذِرِ، حَدَّثَنَا مُحَمَّدُ بْنُ فُلَيْحٍ، قَالَ حَدَّثَنِي أَبِي، عَنْ هِلاَلِ بْنِ عَلِيٍّ، مِنْ بَنِي عَامِرِ بْنِ لُؤَىٍّ عَنْ عَطَاءِ بْنِ يَسَارٍ، عَنْ أَبِي هُرَيْرَةَ، رضى الله عنه عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ مَنْ قَالَ أَنَا خَيْرٌ مِنْ يُونُسَ بْنِ مَتَّى فَقَدْ كَذَبَ ‏\"‏‏.‏"},{"n":5033,"head":"عن أبي موسى رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا مُحَمَّدُ بْنُ الْعَلاَءِ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ بُرَيْدٍ، عَنْ أَبِي بُرْدَةَ، عَنْ أَبِي مُوسَى، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ تَعَاهَدُوا الْقُرْآنَ فَوَالَّذِي نَفْسِي بِيَدِهِ لَهُوَ أَشَدُّ تَفَصِّيًا مِنَ الإِبِلِ فِي عُقُلِهَا ‏\"‏‏.‏"},{"n":5178,"head":"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا عَبْدَانُ، عَنْ أَبِي حَمْزَةَ، عَنِ الأَعْمَشِ، عَنْ أَبِي حَازِمٍ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ لَوْ دُعِيتُ إِلَى كُرَاعٍ لأَجَبْتُ، وَلَوْ أُهْدِيَ إِلَىَّ ذِرَاعٌ لَقَبِلْتُ ‏\"‏‏.‏"},{"n":5356,"head":"عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:","text":"حَدَّثَنَا سَعِيدُ بْنُ عُفَيْرٍ، قَالَ حَدَّثَنِي اللَّيْثُ، قَالَ حَدَّثَنِي عَبْدُ الرَّحْمَنِ بْنُ خَالِدِ بْنِ مُسَافِرٍ، عَنِ ابْنِ شِهَابٍ، عَنِ ابْنِ الْمُسَيَّبِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ خَيْرُ الصَّدَقَةِ مَا كَانَ عَنْ ظَهْرِ غِنًى، وَابْدَأْ بِمَنْ تَعُولُ ‏\"‏‏.‏"},{"n":5482,"head":"عن عبد الله بن عمر رضي الله عنهما قال: قال رسول الله ﷺ:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، أَخْبَرَنَا مَالِكٌ، عَنْ نَافِعٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ مَنِ اقْتَنَى كَلْبًا إِلاَّ كَلْبَ مَاشِيَةٍ أَوْ ضَارٍ، نَقَصَ مِنْ عَمَلِهِ كُلَّ يَوْمٍ قِيرَاطَانِ ‏\"‏‏.‏"},{"n":5678,"head":"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا مُحَمَّدُ بْنُ الْمُثَنَّى، حَدَّثَنَا أَبُو أَحْمَدَ الزُّبَيْرِيُّ، حَدَّثَنَا عُمَرُ بْنُ سَعِيدِ بْنِ أَبِي حُسَيْنٍ، قَالَ حَدَّثَنِي عَطَاءُ بْنُ أَبِي رَبَاحٍ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ مَا أَنْزَلَ اللَّهُ دَاءً إِلاَّ أَنْزَلَ لَهُ شِفَاءً ‏\"‏‏.‏"},{"n":5764,"head":"عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:","text":"حَدَّثَنِي عَبْدُ الْعَزِيزِ بْنُ عَبْدِ اللَّهِ، قَالَ حَدَّثَنِي سُلَيْمَانُ، عَنْ ثَوْرِ بْنِ زَيْدٍ، عَنْ أَبِي الْغَيْثِ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ اجْتَنِبُوا الْمُوبِقَاتِ الشِّرْكُ بِاللَّهِ، وَالسِّحْرُ ‏\"‏‏.‏"},{"n":5985,"head":"عن أبي هريرة رضي الله عنه قال: سمعت رسول الله ﷺ يقول:","text":"حَدَّثَنِي إِبْرَاهِيمُ بْنُ الْمُنْذِرِ، حَدَّثَنَا مُحَمَّدُ بْنُ مَعْنٍ، قَالَ حَدَّثَنِي أَبِي، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ ‏ \"‏ مَنْ سَرَّهُ أَنْ يُبْسَطَ لَهُ فِي رِزْقِهِ، وَأَنْ يُنْسَأَ لَهُ فِي أَثَرِهِ، فَلْيَصِلْ رَحِمَهُ ‏\"‏‏.‏"},{"n":6066,"head":"عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، أَخْبَرَنَا مَالِكٌ، عَنْ أَبِي الزِّنَادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ إِيَّاكُمْ وَالظَّنَّ، فَإِنَّ الظَّنَّ أَكْذَبُ الْحَدِيثِ، وَلاَ تَحَسَّسُوا، وَلاَ تَجَسَّسُوا، وَلاَ تَنَاجَشُوا، وَلاَ تَحَاسَدُوا، وَلاَ تَبَاغَضُوا، وَلاَ تَدَابَرُوا، وَكُونُوا عِبَادَ اللَّهِ إِخْوَانًا ‏\"‏‏.‏"},{"n":6138,"head":"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ، حَدَّثَنَا هِشَامٌ، أَخْبَرَنَا مَعْمَرٌ، عَنِ الزُّهْرِيِّ، عَنْ أَبِي سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيُكْرِمْ ضَيْفَهُ، وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيَصِلْ رَحِمَهُ، وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ ‏\"‏‏.‏"},{"n":6234,"head":"عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ:","text":"وَقَالَ إِبْرَاهِيمُ عَنْ مُوسَى بْنِ عُقْبَةَ، عَنْ صَفْوَانَ بْنِ سُلَيْمٍ، عَنْ عَطَاءِ بْنِ يَسَارٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ يُسَلِّمُ الصَّغِيرُ عَلَى الْكَبِيرِ، وَالْمَارُّ عَلَى الْقَاعِدِ، وَالْقَلِيلُ عَلَى الْكَثِيرِ ‏\"‏‏.‏"},{"n":6351,"head":"عن أنس رضي الله عنه قال: قال رسول الله ﷺ:","text":"حَدَّثَنَا ابْنُ سَلاَمٍ، أَخْبَرَنَا إِسْمَاعِيلُ ابْنُ عُلَيَّةَ، عَنْ عَبْدِ الْعَزِيزِ بْنِ صُهَيْبٍ، عَنْ أَنَسٍ ـ رضى الله عنه ـ قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ لاَ يَتَمَنَّيَنَّ أَحَدٌ مِنْكُمُ الْمَوْتَ لِضُرٍّ نَزَلَ بِهِ، فَإِنْ كَانَ لاَ بُدَّ مُتَمَنِّيًا لِلْمَوْتِ فَلْيَقُلِ اللَّهُمَّ أَحْيِنِي مَا كَانَتِ الْحَيَاةُ خَيْرًا لِي، وَتَوَفَّنِي إِذَا كَانَتِ الْوَفَاةُ خَيْرًا لِي ‏\"‏‏.‏"},{"n":6460,"head":"عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ، حَدَّثَنَا مُحَمَّدُ بْنُ فُضَيْلٍ، عَنْ أَبِيهِ، عَنْ عُمَارَةَ، عَنْ أَبِي زُرْعَةَ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ اللَّهُمَّ ارْزُقْ آلَ مُحَمَّدٍ قُوتًا ‏\"‏‏.‏"},{"n":6482,"head":"عن أبي موسى رضي الله عنه قال: قال رسول الله ﷺ:","text":"حَدَّثَنَا مُحَمَّدُ بْنُ الْعَلاَءِ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ بُرَيْدِ بْنِ عَبْدِ اللَّهِ بْنِ أَبِي بُرْدَةَ، عَنْ أَبِي بُرْدَةَ، عَنْ أَبِي مُوسَى، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ مَثَلِي وَمَثَلُ مَا بَعَثَنِي اللَّهُ كَمَثَلِ رَجُلٍ أَتَى قَوْمًا فَقَالَ رَأَيْتُ الْجَيْشَ بِعَيْنَىَّ، وَإِنِّي أَنَا النَّذِيرُ الْعُرْيَانُ فَالنَّجَا النَّجَاءَ‏.‏ فَأَطَاعَتْهُ طَائِفَةٌ فَأَدْلَجُوا عَلَى مَهْلِهِمْ فَنَجَوْا، وَكَذَّبَتْهُ طَائِفَةٌ فَصَبَّحَهُمُ الْجَيْشُ فَاجْتَاحَهُمْ ‏\"‏‏.‏"},{"n":6489,"head":"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنِي مُحَمَّدُ بْنُ الْمُثَنَّى، حَدَّثَنَا غُنْدَرٌ، حَدَّثَنَا شُعْبَةُ، عَنْ عَبْدِ الْمَلِكِ بْنِ عُمَيْرٍ، عَنْ أَبِي سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ أَصْدَقُ بَيْتٍ قَالَهُ الشَّاعِرُ أَلاَ كُلُّ شَىْءٍ مَا خَلاَ اللَّهَ بَاطِلُ ‏\"‏‏.‏"},{"n":6545,"head":"عن أبي هريرة رضي الله عنه قال: قال النبي ﷺ:","text":"حَدَّثَنَا أَبُو الْيَمَانِ، أَخْبَرَنَا شُعَيْبٌ، حَدَّثَنَا أَبُو الزِّنَادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ يُقَالُ لأَهْلِ الْجَنَّةِ خُلُودٌ لاَ مَوْتَ‏.‏ وَلأَهْلِ النَّارِ يَا أَهْلَ النَّارِ خُلُودٌ لاَ مَوْتَ ‏\"‏‏.‏"},{"n":6616,"head":"عن أبي هريرة رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا سُفْيَانُ، عَنْ سُمَىٍّ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ تَعَوَّذُوا بِاللَّهِ مِنْ جَهْدِ الْبَلاَءِ، وَدَرَكِ الشَّقَاءِ، وَسُوءِ الْقَضَاءِ، وَشَمَاتَةِ الأَعْدَاءِ ‏\"‏‏.‏"},{"n":6729,"head":"عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:","text":"حَدَّثَنَا إِسْمَاعِيلُ، قَالَ حَدَّثَنِي مَالِكٌ، عَنْ أَبِي الزِّنَادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ لاَ يَقْتَسِمُ وَرَثَتِي دِينَارًا، مَا تَرَكْتُ بَعْدَ نَفَقَةِ نِسَائِي وَمُؤْنَةِ عَامِلِي فَهْوَ صَدَقَةٌ ‏\"‏‏.‏"},{"n":6799,"head":"عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ:","text":"حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا عَبْدُ الْوَاحِدِ، حَدَّثَنَا الأَعْمَشُ، قَالَ سَمِعْتُ أَبَا صَالِحٍ، قَالَ سَمِعْتُ أَبَا هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ لَعَنَ اللَّهُ السَّارِقَ، يَسْرِقُ الْبَيْضَةَ فَتُقْطَعُ يَدُهُ، وَيَسْرِقُ الْحَبْلَ فَتُقْطَعُ يَدُهُ ‏\"‏‏.‏"},{"n":6983,"head":"عن أنس بن مالك رضي الله عنه أن رسول الله ﷺ قال:","text":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، عَنْ مَالِكٍ، عَنْ إِسْحَاقَ بْنِ عَبْدِ اللَّهِ بْنِ أَبِي طَلْحَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ الرُّؤْيَا الْحَسَنَةُ مِنَ الرَّجُلِ الصَّالِحِ جُزْءٌ مِنْ سِتَّةٍ وَأَرْبَعِينَ جُزْءًا مِنَ النُّبُوَّةِ ‏\"‏‏.‏"},{"n":7071,"head":"عن أبي موسى رضي الله عنه عن النبي ﷺ قال:","text":"حَدَّثَنَا مُحَمَّدُ بْنُ الْعَلاَءِ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ بُرَيْدٍ، عَنْ أَبِي بُرْدَةَ، عَنْ أَبِي مُوسَى، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ مَنْ حَمَلَ عَلَيْنَا السِّلاَحَ فَلَيْسَ مِنَّا ‏\"‏‏.‏"},{"n":7142,"head":"عن أنس بن مالك رضي الله عنه قال: قال رسول الله ﷺ:","text":"حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا يَحْيَى، عَنْ شُعْبَةَ، عَنْ أَبِي التَّيَّاحِ، عَنْ أَنَسِ بْنِ مَالِكٍ ـ رضى الله عنه ـ قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ اسْمَعُوا وَأَطِيعُوا وَإِنِ اسْتُعْمِلَ عَلَيْكُمْ عَبْدٌ حَبَشِيٌّ كَأَنَّ رَأْسَهُ زَبِيبَةٌ ‏\"‏‏.‏"},{"n":7376,"head":"عن جرير بن عبد الله رضي الله عنه قال: قال رسول الله ﷺ:","text":"حَدَّثَنَا مُحَمَّدٌ، أَخْبَرَنَا أَبُو مُعَاوِيَةَ، عَنِ الأَعْمَشِ، عَنْ زَيْدِ بْنِ وَهْبٍ، وَأَبِي، ظَبْيَانَ عَنْ جَرِيرِ بْنِ عَبْدِ اللَّهِ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ لاَ يَرْحَمُ اللَّهُ مَنْ لاَ يَرْحَمُ النَّاسَ ‏\"‏‏.‏"},{"n":7464,"head":"عن أنس رضي الله عنه قال: قال رسول الله ﷺ:","text":"حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا عَبْدُ الْوَارِثِ، عَنْ عَبْدِ الْعَزِيزِ، عَنْ أَنَسٍ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ إِذَا دَعَوْتُمُ اللَّهَ فَاعْزِمُوا فِي الدُّعَاءِ، وَلاَ يَقُولَنَّ أَحَدُكُمْ إِنْ شِئْتَ فَأَعْطِنِي، فَإِنَّ اللَّهَ لاَ مُسْتَكْرِهَ لَهُ ‏\"‏‏.‏"},{"n":7466,"head":"عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:","text":"حَدَّثَنَا مُحَمَّدُ بْنُ سِنَانٍ، حَدَّثَنَا فُلَيْحٌ، حَدَّثَنَا هِلاَلُ بْنُ عَلِيٍّ، عَنْ عَطَاءِ بْنِ يَسَارٍ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ مَثَلُ الْمُؤْمِنِ كَمَثَلِ خَامَةِ الزَّرْعِ، يَفِيءُ وَرَقُهُ مِنْ حَيْثُ أَتَتْهَا الرِّيحُ تُكَفِّئُهَا، فَإِذَا سَكَنَتِ اعْتَدَلَتْ، وَكَذَلِكَ الْمُؤْمِنُ يُكَفَّأُ بِالْبَلاَءِ، وَمَثَلُ الْكَافِرِ كَمَثَلِ الأَرْزَةِ صَمَّاءَ مُعْتَدِلَةً حَتَّى يَقْصِمَهَا اللَّهُ إِذَا شَاءَ ‏\"‏‏.‏"},{"n":7486,"head":"عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال:","text":"حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، عَنْ مَالِكٍ، عَنْ أَبِي الزِّنَادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ يَتَعَاقَبُونَ فِيكُمْ مَلاَئِكَةٌ بِاللَّيْلِ وَمَلاَئِكَةٌ بِالنَّهَارِ، وَيَجْتَمِعُونَ فِي صَلاَةِ الْعَصْرِ وَصَلاَةِ الْفَجْرِ، ثُمَّ يَعْرُجُ الَّذِينَ بَاتُوا فِيكُمْ فَيَسْأَلُهُمْ وَهْوَ أَعْلَمُ كَيْفَ تَرَكْتُمْ عِبَادِي فَيَقُولُونَ تَرَكْنَاهُمْ وَهُمْ يُصَلُّونَ، وَأَتَيْنَاهُمْ وَهُمْ يُصَلُّونَ ‏\"‏‏.‏"}]};
const BUKHARI_URL = 'https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ara-bukhari/';
const HADITH_KEY = 'sauditv-hadith2';   // 2: the short form (head and his words)
let HADITH_DAY = null;   // {day, n, head, matn, offline}: the day's hadith (loadHadith)
// the day's [number, head] in the short list: a prime stride (7919), so the days go through all of it
const hadithPick = day => { const L = BUKHARI.short; return L[((day * 7919) % L.length + L.length) % L.length]; };
// his words in the book's text, as the script takes them (fetch_bukhari.py, matn): between its two straight quotes,
// without the direction marks and the spaces and full stops around them; '' unless there are exactly two quotes and
// nothing but punctuation after them, or when they are longer than the card takes (maxWords)
function hadithMatn(text){
  const parts = String(text || '').split('"');
  if(parts.length !== 3 || parts[2].replace(/[\s.،,:\u200e\u200f]/g, '')) return '';
  const m = parts[1].replace(/[\u200e\u200f]/g, '').split(/\s+/).filter(Boolean).join(' ').replace(/^[ .]+|[ .]+$/g, '');
  return m && m.split(' ').length <= BUKHARI.maxWords ? m : '';
}
// resolves to false while the day's hadith is a bundled one because the API did not answer (see firstLoad)
async function loadHadith(){
  const day = riyadhDayNumber();
  if(HADITH_DAY && HADITH_DAY.day === day && !HADITH_DAY.offline) return true;
  const [n, head] = hadithPick(day);
  try{
    const c = JSON.parse(localStorage.getItem(HADITH_KEY) || 'null');
    if(c && c.day === day && c.n === n && c.head === head && c.matn){ HADITH_DAY = c; hadithDrawn(); return true; }
  }catch(e){}
  const local = BUKHARI.fallback.find(h => h.n === n);
  let matn = local ? hadithMatn(local.text) : '';
  for(const ext of matn ? [] : ['.min.json', '.json']){   // the API's advice: the other form when one fails
    try{
      const r = await fetchT(BUKHARI_URL + n + ext, 15000);
      if(!r.ok) continue;
      const h = ((await r.json()).hadiths || [])[0];
      if(h && +h.hadithnumber === n && (matn = hadithMatn(h.text))) break;
    }catch(e){}
  }
  if(matn){
    HADITH_DAY = {day, n, head, matn};
    try{ localStorage.setItem(HADITH_KEY, JSON.stringify(HADITH_DAY)); }catch(e){}
  } else if(!HADITH_DAY || HADITH_DAY.day !== day){
    // no answer (or one that is not the narration the head was made for): a bundled one, the day's own, until the
    // API answers
    const f = BUKHARI.fallback[day % BUKHARI.fallback.length];
    HADITH_DAY = {day, n: f.n, head: f.head, matn: hadithMatn(f.text), offline: true};
  }
  hadithDrawn();
  return !HADITH_DAY.offline;
}
function hadithDrawn(){ if(CONFIG.panel === 'hadith') renderPanel(false); }
// typography only: no direction marks, «صلى الله عليه وسلم» as ﷺ, {…} as ﴿…﴾, no space before a comma or full stop
const HK = '[\u064B-\u0652\u0670]*';
const SAW_RE = new RegExp('صلى الله عليه وسلم'.split(' ').map(w => [...w].join(HK) + HK).join('\\s+'), 'g');
const hadithType = t => String(t || '').replace(SAW_RE, 'ﷺ').replace(/\{/g, '﴿').replace(/\}/g, '﴾').replace(/\s+([،,.:؛])/g, '$1');
const sawHtml = s => s.replace(/ﷺ/g, '<span class="saw">ﷺ</span>').replace(/[﴿﴾]/g, m => `<span class="orn">${m}</span>`);
// the short form: the companion and how he quoted the Prophet ﷺ small and muted, his words at full size; under it
// «صحيح البخاري، رقم N»
function hadithRows(){
  if(HADITH_DAY && HADITH_DAY.day !== riyadhDayNumber()) loadHadith();   // a new day: its own (redrawn when known)
  const h = HADITH_DAY;
  if(!h || !h.matn) return [];
  return [`<li class="quote hadith"><span class="nar">${sawHtml(esc(h.head))}</span> «${sawHtml(esc(hadithType(h.matn)))}»</li>`,
          `<li class="src">صحيح البخاري، رقم ${ar(h.n)}</li>`];
}

const WX_CODES = {
  0:'صافي',1:'صافي غالباً',2:'غائم جزئياً',3:'غائم',45:'ضباب',48:'ضباب متجمد',
  51:'رذاذ',53:'رذاذ',55:'رذاذ كثيف',56:'رذاذ متجمد',57:'رذاذ متجمد',
  61:'مطر خفيف',63:'مطر',65:'مطر غزير',66:'مطر متجمد',67:'مطر متجمد',
  71:'ثلج خفيف',73:'ثلج',75:'ثلج كثيف',77:'حبيبات ثلج',
  80:'زخات خفيفة',81:'زخات مطر',82:'زخات غزيرة',85:'زخات ثلج',86:'زخات ثلج',
  95:'عواصف رعدية',96:'عواصف مصحوبة ببرد',99:'عواصف قوية'
};
async function loadWeather(){
  // the city's days and hours (its own time zone)
  const q = `latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}&timezone=${encodeURIComponent(CONFIG.cityTz)}`;
  const DX = !!CONFIG.detail;   // the detail page also reads feels-like, humidity, wind, the hours, rain, sun
  // #units=f: °F and the wind in mph (WIND_UNIT)
  const U = CONFIG.units === 'f' ? '&temperature_unit=fahrenheit&wind_speed_unit=mph' : '';
  try{
    const r = await fetchT(`https://api.open-meteo.com/v1/forecast?${q}${U}&current=temperature_2m,weather_code`
                         + (DX ? ',apparent_temperature,relative_humidity_2m,wind_speed_10m' : '')
                         + `&daily=temperature_2m_max,temperature_2m_min,weather_code`
                         + (DX ? ',precipitation_probability_max,sunrise,sunset&hourly=temperature_2m,precipitation_probability&forecast_days=7'
                               : '&forecast_days=5'), 12000);
    if(!r.ok) throw 0;
    const j = await r.json();
    document.getElementById('wx-temp').textContent = ar(Math.round(j.current.temperature_2m)) + '°';
    const d = document.getElementById('wx-desc');
    d.textContent = WX_CODES[j.current.weather_code] || '';
    d.classList.remove('dust');
    const hi = j.daily?.temperature_2m_max?.[0], lo = j.daily?.temperature_2m_min?.[0];
    document.getElementById('wx-range').textContent =
      (hi != null && lo != null) ? `${ar(Math.round(hi))}° / ${ar(Math.round(lo))}°` : '';
    const dl = j.daily || {};
    FORECAST = (dl.time || []).map((t, i) => ({date:t, code:dl.weather_code?.[i],
      hi:dl.temperature_2m_max?.[i], lo:dl.temperature_2m_min?.[i],
      rain:dl.precipitation_probability_max?.[i], rise:dl.sunrise?.[i], set:dl.sunset?.[i]}))   // rain, rise, set
      .filter(x => x.hi != null && x.lo != null);
    if(DX){   // now, and the next 12 hours (hourly times are local, like current.time)
      const c = j.current || {}, hr = j.hourly || {}, nowT = String(c.time || '');
      WX_NOW = {temp:c.temperature_2m, feels:c.apparent_temperature, hum:c.relative_humidity_2m,
                wind:c.wind_speed_10m, code:c.weather_code, dust:''};
      WX_HOURS = (hr.time || []).map((t, i) => ({t, temp:hr.temperature_2m?.[i], rain:hr.precipitation_probability?.[i]}))
        .filter(x => x.t > nowT && x.temp != null).slice(0, 12);
    }
    if(CONFIG.panel === 'forecast') renderPanel(false);
  }catch(e){ return false; }   // keep the last reading; with none only the city shows (false = no answer)

  // dust overrides the condition word: PM10 in µg/m³
  try{
    const r = await fetchT(`https://air-quality-api.open-meteo.com/v1/air-quality?${q}&current=pm10,dust`, 12000);
    if(!r.ok) throw 0;
    const c = (await r.json()).current || {};
    const pm = Math.max(c.pm10 || 0, c.dust || 0);
    if(pm >= 150){
      const d = document.getElementById('wx-desc');
      d.textContent = pm >= 400 ? 'غبار كثيف' : 'غبار';
      d.classList.add('dust');
      if(DX && WX_NOW){ WX_NOW.dust = d.textContent; renderDetail(); }
    }
  }catch(e){}
  return true;   // answered (see firstLoad)
}

// night dimming: transparent by day, dark after 21:00 and before 07:00
// and darker from 23:00 to 06:00: .60 (about 40% of the brightness left; was .46 all night), reached by
// 23:30 and held to 05:30, then back to the old curve (.23) by 06:00. The evening (21:00-23:00, up to .46) and the
// morning after 06:00 are as before. Straight lines between these hours, in the page's time zone. Set every 20 s
// (boot) and only when it changes: a step is at most .004, invisible, with no transition.
const NIGHT = [[0, .6], [5.5, .6], [6, .23], [7, 0], [21, 0], [23, .46], [23.5, .6], [24, .6]];   // [hour, dimmer]
function applyNight(){
  const p = riyadhParts();
  const h = CONFIG.nightH >= 0 ? CONFIG.nightH % 24 : p.h + p.mi/60 + p.s/3600;   // #nighth (tests)
  let o = 0;
  for(let i = 1; i < NIGHT.length; i++){
    const [h0, o0] = NIGHT[i - 1], [h1, o1] = NIGHT[i];
    if(h < h1){ o = o0 + (o1 - o0) * (h - h0) / (h1 - h0); break; }
  }
  const v = Math.max(0, Math.min(.6, o)).toFixed(3);
  const el = document.getElementById('dimmer');
  if(el && v !== applyNight.last){ applyNight.last = v; el.style.opacity = v; }
}

// gentle pixel shift so static text never burns into the panel
// a larger orbit that never repeats (was 7 fixed spots, ±3-4 px, every 4 min): every 2 min (boot) a
// random offset within ±SHIFT_X px across and ±SHIFT_Y px up and down, at least SHIFT_MIN px away from the last one
// on each axis, so every edge moves. One transform for the stage (clock, VPN badge, card, its dots and line, the
// bottom bar) and the ticker tape outside it, set at once (no transition: one repaint per move). Both keep room for
// it: the stage's padding, the tape's glass reaching past the screen's sides and bottom.
const SHIFT_X = 12, SHIFT_Y = 10, SHIFT_MIN = 4;
let SHIFT_AT = [0, 0];
function pixelShift(){
  const r = m => Math.round((Math.random() * 2 - 1) * m);
  let dx = 0, dy = 0;
  for(let n = 0; n < 100; n++){
    dx = r(SHIFT_X); dy = r(SHIFT_Y);
    if(Math.abs(dx - SHIFT_AT[0]) >= SHIFT_MIN && Math.abs(dy - SHIFT_AT[1]) >= SHIFT_MIN) break;
  }
  SHIFT_AT = [dx, dy];
  ['.stage', '#tape'].forEach(q => { const el = document.querySelector(q); if(el) el.style.transform = `translate(${dx}px,${dy}px)`; });
}

// ---- the screensaver against image retention, besides pixelShift and the dimming
// - Every CONFIG.swapMin minutes of the local day (60: on the hour) the sides change (html.ss-swap): odd hours swapped,
//   even hours not, so a short run of the screensaver changes too. The stage fades out (.6 s), changes, and fades back
//   in (.8 s); the tape stays.
// - Every CONFIG.breakMin minutes, half a period after the swaps (30: at :15 and :45), a photo-only minute: the stage
//   and the tape fade out (2 s), are hidden (html.ss-break) with the tape's run paused where it is, and fade back in
//   SS_BREAK_S after the start. A break that would come within 12 s of a swap is skipped.
// Nothing runs in between: one timeout to the next change (ssTick). Only the fades animate, on opacity.
const SS_BREAK_S = 60, SS_FADE_OUT = 600, SS_FADE_IN = 800, SS_BREAK_FADE = 2000;
let SS_SWAPPED = false, SS_QUEUE = Promise.resolve(), SS_T = 0;
// minutes into the local day (page's time zone), with the seconds
function ssMinute(){ const p = riyadhParts(); return p.h*60 + p.mi + (p.s + Date.now() % 1000 / 1000)/60; }
// the start of the photo-only minute at or before minute m (it may be negative: the day before)
function ssBreakStart(m){ const B = CONFIG.breakMin; return Math.floor((m - B/2) / B) * B + B/2; }
function ssWant(m){
  const S = CONFIG.swapMin, b = ssBreakStart(m), e = b + SS_BREAK_S/60, M = .2;
  const meets = Math.floor((e + M) / S) !== Math.floor((b - M) / S);   // a swap boundary within 12 s of it
  return {swap: Math.floor(m / S) % 2 === 1, pause: m >= b && m < e && !meets};
}
// opacity from where it is to `to` (0 or 1), ms long; resolves at the end. 1 is the stylesheet's own (no inline style
// left behind). Reduced motion: at once.
function ssFade(els, to, ms){
  return Promise.all(els.filter(Boolean).map(el => {
    const from = getComputedStyle(el).opacity;
    el.style.opacity = to ? '' : '0';
    if(CARD_STILL || !el.animate) return null;
    return el.animate([{opacity: from}, {opacity: to}], {duration: ms, easing: 'ease-in-out'}).finished.catch(() => {});
  }));
}
// brings the page to `swap` / `pause`, one change after the other; `now`: no fades (the first paint)
function ssApply(swap, pause, now){
  SS_QUEUE = SS_QUEUE.then(async () => {
    const root = document.documentElement, stage = document.querySelector('.stage'), all = [stage, document.getElementById('tape')];
    if(pause && !SS_BREAK){
      SS_BREAK = true;
      await (now ? ssFade(all, 0, 0) : ssFade(all, 0, SS_BREAK_FADE));
      root.classList.add('ss-break');
      if(TAPE_ANIM) TAPE_ANIM.pause();
    }
    if(swap !== SS_SWAPPED){
      SS_SWAPPED = swap;
      if(now || SS_BREAK) root.classList.toggle('ss-swap', swap);   // nothing on screen to fade
      else {
        await ssFade([stage], 0, SS_FADE_OUT);
        root.classList.toggle('ss-swap', swap);
        await ssFade([stage], 1, SS_FADE_IN);
      }
    }
    if(!pause && SS_BREAK){
      SS_BREAK = false;
      root.classList.remove('ss-break');
      if(TAPE_ANIM) TAPE_ANIM.play();   // carries on from where it was held
      await ssFade(all, 1, now ? 0 : SS_BREAK_FADE);
    }
  }).catch(e => console.error('SaudiTV: ssApply ' + e));
}
// applies what the clock wants now, then sleeps until the next change: a swap, a break's end or the next break, or
// midnight (the day's minutes start again)
function ssTick(first){
  clearTimeout(SS_T);
  const m = ssMinute(), w = ssWant(m), S = CONFIG.swapMin, B = CONFIG.breakMin, b = ssBreakStart(m);
  ssApply(w.swap, w.pause, first);
  const next = Math.min(...[(Math.floor(m / S) + 1) * S, b + SS_BREAK_S/60, b + B, 1440].filter(x => x > m)) - m;
  SS_T = setTimeout(() => ssTick(false), Math.max(1000, next * 60000 + 250));
}
// the screensaver only (boot). Tests from a browser's console: sauditvSaver.swap(true|false), .pause(true|false),
// .night(23.5) (dims as at that hour; -1: the clock's); the next change of the clock's plan undoes the first two
function ssStart(){
  ssTick(true);
  window.sauditvSaver = {
    swap: on => ssApply(!!on, SS_BREAK, false),
    pause: on => ssApply(SS_SWAPPED, !!on, false),
    night: h => { CONFIG.nightH = +h; applyNight(); },
  };
}
// ---- end: the screensaver against image retention

// Background photos: the hosted set in photos/ (photos/index.json in the repo). A hosted photo is used only
// once it has loaded; offline, or if it fails, a bundled one is shown, so the screen is never empty.
const PHOTO_BASE = 'https://raw.githubusercontent.com/raad113/SaudiTV/main/photos/';
let REMOTE_BGS = (()=>{ try{ return JSON.parse(localStorage.getItem('photoIndex') || '[]'); }catch(e){ return []; } })();

async function loadPhotoIndex(){
  try{
    const r = await fetchT(PHOTO_BASE + 'index.json', 15000);
    if(!r.ok) return;
    const list = (await r.json()).filter(p => p && p.f);
    if(list.length){
      REMOTE_BGS = list;
      try{ localStorage.setItem('photoIndex', JSON.stringify(list)); }catch(e){}
    }
  }catch(e){}
}

let REVEALED = false;
function reveal(){
  if(REVEALED) return;
  REVEALED = true;
  // fonts may still be arriving (tv.html loads them as files): wait for them, briefly
  const fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.race([fonts, new Promise(r => setTimeout(r, 800))])
    .then(() => document.documentElement.classList.add('ready'));
}

function showBackground(url, b){
  const ph = document.querySelector('.photo');
  reveal();
  if(!ph) return;
  const next = "url('" + url + "')";
  if(ph.style.backgroundImage === next) return;   // same photo: no reload, no new movement
  ph.style.backgroundImage = next;
  ph.style.setProperty('--dim', (1 - (b.d || 0.95)).toFixed(2));
  ph.classList.remove('settle'); void ph.offsetWidth; ph.classList.add('settle');
  // once settled, the photo drops the finished animation (same place: its last frame is the photo's
  // own transform); an animation kept filling kept the photo, the veils and the stage on full-screen layers that the
  // moving ticker tape had redrawn every frame
  ph.onanimationend = e => { if(e.animationName === 'settle') ph.classList.remove('settle'); };
  const dvb = document.querySelector('.dv-bg');   // the detail page's blurred copy (bootDetail)
  if(dvb) dvb.style.backgroundImage = next;
  const fr = CONFIG.detail || CONFIG.widget ? null : document.getElementById('tape-frost');   // the ticker tape's frost
  if(fr){ fr.style.backgroundImage = next; fr.style.setProperty('--dim', ph.style.getPropertyValue('--dim')); }
  const cr = document.getElementById('credit');
  if(cr) cr.textContent = b.c ? 'الصورة: ' + b.c : '';
}

// Every 4 days a new random set of 12 hosted photos (same draw as the launcher: Park-Miller generator seeded
// by the 4-day period), rotating every 5 minutes. Only the photo on screen is downloaded.
// 12 photos every 5 minutes (was 5 every 30), so one comes back once an hour, not every 25 minutes
const PHOTO_SET = 12, PHOTO_PERIOD_DAYS = 4, PHOTO_SLOT_MIN = 5;
const PHOTO_SLOTS_PER_DAY = Math.floor(1440 / PHOTO_SLOT_MIN);
function riyadhDayNumber(){
  const p = riyadhParts();
  return Math.floor(Date.UTC(p.y, p.mo - 1, p.d) / 86400000);
}
function photoSet(n){
  const period = Math.floor(riyadhDayNumber() / PHOTO_PERIOD_DAYS);
  let seed = (period % 2147483646) + 1;
  const pick = [];
  for(let guard = 0; pick.length < Math.min(PHOTO_SET, n) && guard < 1000; guard++){
    seed = (seed * 48271) % 2147483647;
    const k = seed % n;
    if(!pick.includes(k)) pick.push(k);
  }
  return pick;
}
let BG_SLOT = -1, PREFETCHED = false;
function applyBackground(force){
  try {
    const p = riyadhParts();
    const slot = riyadhDayNumber() * PHOTO_SLOTS_PER_DAY + Math.floor((p.h * 60 + p.mi) / PHOTO_SLOT_MIN);
    if(slot === BG_SLOT && !force) return;
    BG_SLOT = slot;
    const set = REMOTE_BGS.length ? photoSet(REMOTE_BGS.length).map(k => REMOTE_BGS[k]) : [];
    const local = BGS[slot % BGS.length];
    if(!set.length){ showBackground(local.u, local); return; }
    const b = set[slot % set.length], url = PHOTO_BASE + b.f;
    // First photo: wait briefly for the hosted one (the app serves it from disk at once) so the screen
    // doesn't flash a bundled photo first; slow network → bundled one, swapped when the hosted one arrives.
    let done = false;
    const fallback = () => { if(!done && !document.querySelector('.photo').style.backgroundImage) showBackground(local.u, local); };
    const t = setTimeout(fallback, 1200);
    const img = new Image();
    img.onload = () => { done = true; clearTimeout(t); showBackground(url, b); };
    img.onerror = () => { clearTimeout(t); fallback(); done = true; };
    img.src = url;
    // fetch the rest of the set once, quietly, so the app has each one on disk before its turn
    // not from the detail page, which shows one photo
    if(!PREFETCHED && !CONFIG.detail){ PREFETCHED = true; setTimeout(() => set.forEach(x => { new Image().src = PHOTO_BASE + x.f; }), 20000); }
  } catch(e) {}
}

const dvT = v => Number.isFinite(v) ? ar(Math.round(v)) + '°' : '—';
const dvPct = v => Number.isFinite(v) ? ar(Math.round(v)) + PCT : '—';
const dvHM = s => { const m = /(\d{1,2}):(\d{2})/.exec(String(s || '')); return m ? fmt12(+m[1] % 24, +m[2]) : '—'; };

  shows: DV_SVG('<rect x="3" y="5" width="18" height="12" rx="1.5"/><path d="M9 21h6M12 17v4"/><path d="M10.5 9v4.5l3.6-2.25z"/>'),
  verse: DV_SVG('<path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z"/><path d="M12 6.5v13"/>'),
  hadith: DV_SVG('<path d="M5.5 4.5A1.5 1.5 0 0 1 7 3h11.5v15H7a1.5 1.5 0 0 0-1.5 1.5z"/><path d="M5.5 19.5A1.5 1.5 0 0 0 7 21h11.5v-3"/><path d="M14 3v6l-1.75-1.25L10.5 9V3"/>'),

function dvTitle(){
  const P = CONFIG.detail;
  if(P === 'prayers') return 'مواقيت الصلاة · ' + CONFIG.city;
  if(P === 'forecast') return 'الطقس · ' + CONFIG.city;
  if(P === 'shows') return 'جديد المسلسلات · ' + PANEL_TITLE.shows;
  if(P === 'local') return localTitle();
  return PANEL_TITLE[P] || '';
}

function dvPrayers(){
  if(!DAY_TIMES) return '';
  const p = placeParts(), mins = p.h*60 + p.mi + p.s/60, fri = isFriday();
  const names = {Fajr:'الفجر', Sunrise:'الشروق', Dhuhr: fri ? 'الجمعة' : 'الظهر', Asr:'العصر', Maghrib:'المغرب', Isha:'العشاء'};
  const at = k => { const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number); return h*60 + mi; };
  const gap = k => (k === 'Sunrise' || (k === 'Dhuhr' && fri)) ? 0 : (CONFIG.iqama[k] || 0);   // as tickPrayer
  const keys = Object.keys(names).filter(k => DAY_TIMES[k] && Number.isFinite(at(k)));
  // the prayer between its adhan and iqama, else the next one (after Isha: tomorrow's Fajr, on today's Fajr row)
  let hot = PRAYER_KEYS.find(k => keys.includes(k) && gap(k) && mins >= at(k) && mins < at(k) + gap(k)), note = '';
  if(hot) note = 'الإقامة بعد ' + humanRemaining(Math.max(60, Math.ceil(at(hot) + gap(hot) - mins)*60));
  else {
    hot = PRAYER_KEYS.find(k => keys.includes(k) && at(k) > mins) || 'Fajr';
    let left = at(hot) - mins; if(left <= 0) left += 1440;
    note = 'بعد ' + humanRemaining(Math.max(0, Math.round(left*60)));
  }
  const t12 = m => fmt12(Math.floor(m/60) % 24, m % 60);
  let today = '';
  try{   // the city's day (and «بتوقيت <city>» when its clock is not the TV's)
    today = new Intl.DateTimeFormat(HIJRI, {timeZone:CONFIG.cityTz, day:'numeric', month:'long'}).format(new Date())
      + ' · ' + new Intl.DateTimeFormat(GREG, {timeZone:CONFIG.cityTz, weekday:'long', day:'numeric', month:'long'}).format(new Date())
      + (placeNote() ? ' · ' + placeNote() : '');
  }catch(e){}
  const rows = keys.map(k => `<div class="dv-tr${k === hot ? ' hot' : ''}"><span>${names[k]}</span><span>${t12(at(k))}</span>`
    + `<span>${gap(k) ? t12(at(k) + gap(k)) : '—'}</span><span>${k === hot ? note : ''}</span></div>`).join('');
  // the next 7 days, offline (computePrayers, same method); local noon of each day, so a DST change cannot skip one
  const off = Date.UTC(p.y, p.mo-1, p.d, p.h, p.mi, p.s) - Date.now();
  const fD = (o, d) => { try{ return new Intl.DateTimeFormat(o.cal || GREG, Object.assign({timeZone:CONFIG.cityTz}, o.f)).format(d); }catch(e){ return ''; } };
  let week = '';
  for(let i = 1; i <= 7; i++){
    const d = new Date(Date.UTC(p.y, p.mo-1, p.d + i, 12) - off);
    let t;
    try{ t = computePrayers(d); }catch(e){ continue; }
    week += `<div class="dv-tr"><span><b>${fD({f:{weekday:'long'}}, d)}</b> <span class="dv-meta">${fD({f:{day:'numeric', month:'long'}}, d)}`
      + ` · ${fD({cal:HIJRI, f:{day:'numeric', month:'long'}}, d)}</span></span>`
      + PRAYER_KEYS.map(k => `<span>${dvHM(t[k])}</span>`).join('') + '</div>';
  }
  return `<div class="dv-scroll"><div class="dv-sec">اليوم<span class="dv-meta">${today}</span></div>`
    + `<div class="dv-tbl dv-pt"><div class="dv-tr dv-th"><span>الصلاة</span><span>الأذان</span><span>الإقامة</span><span></span></div>${rows}</div>`
    + (week ? `<div class="dv-sec">الأيام القادمة</div><div class="dv-tbl dv-pw"><div class="dv-tr dv-th"><span>اليوم</span>`
      + PRAYER_KEYS.map(k => `<span>${PRAYER_NAMES[k]}</span>`).join('') + `</div>${week}</div>` : '')
    + '</div>';
}

function dvForecast(){
  if(!WX_NOW && !FORECAST.length) return '';
  let html = '<div class="dv-scroll">';
  if(WX_NOW){
    const meta = [`الإحساس ${dvT(WX_NOW.feels)}`, `الرطوبة ${dvPct(WX_NOW.hum)}`,
                  `الرياح ${Number.isFinite(WX_NOW.wind) ? ar(Math.round(WX_NOW.wind)) + (CONFIG.units === 'f' ? ' ميل/س' : ' كم/س') : '—'}`].join(' · ');
    html += `<div class="dv-now"><span class="dv-temp">${dvT(WX_NOW.temp)}</span><div>`
          + `<div class="dv-desc">${esc(WX_NOW.dust || WX_CODES[WX_NOW.code] || '')}</div><div class="dv-meta">${meta}</div></div></div>`;
  }
  if(WX_HOURS.length){
    html += '<div class="dv-sec">الساعات القادمة</div><div class="dv-hours">' + WX_HOURS.map(x => {
      const h = +String(x.t).slice(11, 13);
      return `<div class="dv-hr"><span class="dv-meta">${ar(h % 12 || 12)} ${h < 12 ? 'ص' : 'م'}</span><span>${dvT(x.temp)}</span>`
           + `<span class="dv-meta">${dvPct(x.rain)}</span></div>`;
    }).join('') + '</div>';
  }
  if(FORECAST.length){
    html += '<div class="dv-sec">الأيام القادمة</div><div class="dv-tbl dv-fd"><div class="dv-tr dv-th"><span>اليوم</span><span>الحالة</span>'
          + '<span>العظمى / الصغرى</span><span>المطر</span><span>الشروق / الغروب</span></div>'
          + FORECAST.slice(0, 7).map((d, i) => {
      const day = i === 0 ? 'اليوم' : i === 1 ? 'غداً'
        : new Intl.DateTimeFormat(GREG, {timeZone:'UTC', weekday:'long'}).format(new Date(d.date + 'T12:00:00Z'));
      return `<div class="dv-tr"><span>${day}</span><span>${WX_CODES[d.code] || ''}</span><span>${dvT(d.hi)} / ${dvT(d.lo)}</span>`
           + `<span>${dvPct(d.rain)}</span><span>${dvHM(d.rise)} / ${dvHM(d.set)}</span></div>`;
    }).join('') + '</div>';
  }
  return html + '</div>';
}

// the competition, in Arabic when it is the Saudi league
const dvComp = s => /saudi|roshn/i.test(s || '') && /pro|league|دوري/i.test(s || '') ? 'دوري روشن السعودي' : String(s || '');
function dvMatches(){
  const now = Date.now(), seen = new Set(), evs = [];
  const add = ev => { if(ev && ev.idEvent && !seen.has(ev.idEvent)){ seen.add(ev.idEvent); evs.push(ev); } };
  CONFIG.teamIds.forEach(id => { add(MATCHES[id]); (NEXT_LIST[id] || []).forEach(add); resultsFor(id).forEach(add); });
  const done = [], ahead = [];
  evs.forEach(ev => {
    const t = toDate(ev).getTime();
    if(!Number.isFinite(t) || t < now - 7*86400000 || t > now + 14*86400000) return;   // 7 days back, 14 ahead
    const scored = ev.intHomeScore != null && ev.intAwayScore != null && ev.intHomeScore !== '' && ev.intAwayScore !== '';
    const over = FINAL.includes((ev.strStatus || '').toUpperCase()) ? now >= t : now >= t + 2.5*3600000;
    if(over){ if(scored) done.push({ev, t}); return; }   // a past game without a score has nothing to show
    ahead.push({ev, t, scored});
  });
  done.sort((a, b) => b.t - a.t); ahead.sort((a, b) => a.t - b.t);   // newest results first, then by date
  const rows = [...done.map(x => Object.assign(x, {fin: true})), ...ahead];
  if(!rows.length) return '';
  const hm = d => new Intl.DateTimeFormat('en-GB', {timeZone:CONFIG.timezone, hour:'2-digit', minute:'2-digit', hour12:false})
    .formatToParts(d).reduce((a, x) => (a[x.type] = x.value, a), {});
  return '<div class="dv-scroll"><div class="dv-tbl dv-mt">' + rows.map(({ev, t, fin, scored}) => {
    const d = new Date(t), q = hm(d), t12 = fmt12(+q.hour % 24, +q.minute);
    const live = !fin && now >= t;
    const when = live ? `<span class="live">مباشر</span> · ${liveStatus(ev, t12)}`
      : new Intl.DateTimeFormat(GREG, {timeZone:CONFIG.timezone, weekday:'long', day:'numeric', month:'long'}).format(d) + ' · ' + t12;
    const mid = fin || (live && scored) ? ` <span class="dv-sc">${ar(+ev.intHomeScore)} - ${ar(+ev.intAwayScore)}</span> ` : ' × ';
    return `<div class="dv-tr"><span>${when}</span><span>${esc(teamAr(ev.strHomeTeam))}${mid}${esc(teamAr(ev.strAwayTeam))}</span>`
         + `<span class="dv-meta" dir="auto">${esc(dvComp(ev.strLeague))}</span></div>`;   // English names keep their start
  }).join('') + '</div></div>';
}

function dvStandings(){
  if(!STANDINGS.length) return '';
  // followed: by id or the match data (standFollowed), or by the Arabic names the app sent (#teamnames)
  const fol = standFollowed(), want = new Set(Object.values(TEAM_NAME_OF).map(arNorm));
  const isF = x => fol(x) || (CONFIG.league === 'ksa.1' && want.has(arNorm(STAND_AR[standKey(x.name)])));
  const n = v => Number.isFinite(v) ? ar(Math.round(v)) : '—';
  const gd = v => Number.isFinite(v) ? `<span dir="ltr">${v > 0 ? '+' : v < 0 ? '−' : ''}${ar(Math.abs(Math.round(v)))}</span>` : '—';
  return '<div class="dv-scroll"><div class="dv-tbl dv-st"><div class="dv-tr dv-th"><span>#</span><span>النادي</span><span>لعب</span>'
    + '<span>فاز</span><span>تعادل</span><span>خسر</span><span>له</span><span>عليه</span><span>الفارق</span><span>النقاط</span></div>'
    + STANDINGS.map(x => `<div class="dv-tr${isF(x) ? ' fol' : ''}"><span>${n(x.rank)}</span><span>${esc(standAr(x.name))}</span>`
      + `<span>${n(x.gp)}</span><span>${n(x.w)}</span><span>${n(x.d)}</span><span>${n(x.l)}</span><span>${n(x.gf)}</span><span>${n(x.ga)}</span>`
      + `<span>${gd(x.gd)}</span><span><b>${n(x.pts)}</b></span></div>`).join('')
    + '</div></div>';
}

// the week's series (loadWeek's list, up to 50), laid out like the news page: on the right the list
// (poster, name, channel or streaming service · SxxExx · day and time · rating), ▲▼ moving the focus; on the left
// the focused series: a larger poster, the same facts and its summary (TVMaze's, in English)
const dvSE = o => o.s && o.n ? `<span dir="ltr">S${pad(o.s)}E${pad(o.n)}</span>` : '';
const dvRate = o => o.rating ? '★ ' + ar(o.rating.toFixed(1)).replace('.', DEC) : '';
function dvShowWhen(o){
  const at = o.at ? new Date(o.at) : null;
  if(!at || !Number.isFinite(at.getTime())) return showDay(o, false);
  const q = new Intl.DateTimeFormat('en-GB', {timeZone:CONFIG.timezone, hour:'2-digit', minute:'2-digit', hour12:false})
    .formatToParts(at).reduce((a, x) => (a[x.type] = x.value, a), {});
  return showDay(o, false) + ' ' + fmt12(+q.hour % 24, +q.minute);
}
function dvShowMeta(o){
  return [o.net ? `<span dir="auto">${esc(o.net)}</span>` : '', dvSE(o), dvShowWhen(o), dvRate(o)].filter(Boolean).join(' · ');
}
function dvShows(){
  DV.items = WEEK_POOL.slice();
  if(!DV.items.length) return '';
  return '<div class="dv-news dv-shw"><div class="dv-list">' + DV.items.map((o, i) =>
    `<div class="dv-item" data-i="${i}"><div class="pp">${posterImg(o)}</div><div class="dv-st2">`
    + `<div class="h" dir="auto">${esc(o.name)}</div><div class="dv-meta">${dvShowMeta(o)}</div></div></div>`
  ).join('') + '</div><div class="dv-side"></div></div>';
}
// the focused series on the left (dvNewsFocus calls it on the shows page)
function dvShowSide(o){
  return `<div class="dv-shd"><div class="pp">${posterImg(o)}</div><div><div class="h" dir="auto">${esc(o.name)}</div>`
    + `<div class="dv-meta">${dvShowMeta(o)}</div></div></div>`
    + (o.sum ? `<div class="dv-sum" dir="auto">${esc(o.sum)}</div>` : '<div class="dv-sum none">لا يوجد ملخص</div>');
}

// the day's verse (quoteOfDay) or hadith (hadithRows), as on the card, large, its source under it
function dvVerse(){
  const rows = CONFIG.detail === 'hadith' ? hadithRows() : quoteOfDay().rows;
  return rows.length ? `<div class="dv-scroll"><ul class="dv-q">${rows.join('')}</ul></div>` : '';
}

function dvNews(P){
  DV.items = (NEWS[P] || []).slice(0, NEWS_DETAIL_KEEP);
  if(!DV.items.length) return '';
  const now = Date.now();
  return '<div class="dv-news"><div class="dv-list">' + DV.items.map((x, i) => {
    const meta = [newsSource(P, x.source), Number.isFinite(x.t) ? agoAr(now - x.t) : ''].filter(Boolean).join(' · ');
    return `<div class="dv-item" data-i="${i}"><div class="h"${bidiAttr(P, x.headline)}>${esc(x.headline)}</div><div class="dv-meta">${meta}</div></div>`;
  }).join('') + '</div><div class="dv-side"></div></div>';
}
// focus item i: its row framed and kept in view, its summary on the left
function dvNewsFocus(i){
  const list = document.querySelector('#dv .dv-list'), side = document.querySelector('#dv .dv-side');
  if(!list || !side || !DV.items.length) return;
  i = Math.max(0, Math.min(DV.items.length - 1, i));
  DV.focus = i;
  Array.from(list.children).forEach((el, k) => el.classList.toggle('focus', k === i));
  const row = list.children[i];
  if(row){
    const top = row.offsetTop, bot = top + row.offsetHeight;
    if(top < list.scrollTop) list.scrollTop = top;
    else if(bot > list.scrollTop + list.clientHeight) list.scrollTop = bot - list.clientHeight;
  }
  const x = DV.items[i];
  if(CONFIG.detail === 'shows'){ side.innerHTML = dvShowSide(x); dvSideFit(side); return; }   // the shows page
  const P = CONFIG.detail;
  const meta = [newsSource(P, x.source), Number.isFinite(x.t) ? agoAr(Date.now() - x.t) : ''].filter(Boolean).join(' · ');
  side.innerHTML = `<div class="h"${bidiAttr(P, x.headline)}>${esc(x.headline)}</div><div class="dv-meta">${meta}</div>`
    + (x.summary ? `<div class="dv-sum"${bidiAttr(P, x.summary)}>${esc(x.summary)}</div>` : '<div class="dv-sum none">لا يوجد ملخص</div>')
    + (x.link ? '<div class="dv-ok">OK لقراءة الخبر كاملاً</div>' : '');
  dvSideFit(side);
  if(document.fonts && document.fonts.status !== 'loaded') document.fonts.ready.then(() => dvSideFit(side));
}
// clamp the summary to the whole lines that fit in the side column (ends with an ellipsis)
function dvSideFit(side){
  const sum = side && side.querySelector('.dv-sum:not(.none)');
  if(!sum) return;
  sum.style.webkitLineClamp = '';
  const over = side.scrollHeight - side.clientHeight;
  if(over <= 0) return;
  const lh = parseFloat(getComputedStyle(sum).lineHeight) || 32;
  sum.style.webkitLineClamp = String(Math.max(1, Math.floor((sum.clientHeight - over) / lh)));
}

function renderDetail(){
  const body = document.querySelector('#dv .dv-body');
  if(!body) return;
  const P = CONFIG.detail, news = isNewsPanel(P) || P === 'shows';   // shows, a list like news; local
  const was = news ? DV.items[DV.focus] : null;   // keep the focused item across a refresh
  let html = '';
  try{
    html = P === 'prayers' ? dvPrayers() : P === 'forecast' ? dvForecast() : P === 'matches' ? dvMatches()
         : P === 'standings' ? dvStandings() : P === 'shows' ? dvShows() : news ? dvNews(P)
         : P === 'verse' || P === 'hadith' ? dvVerse() : '';
  }catch(e){ console.error('SaudiTV: detail ' + (e && e.message)); }
  if(!html) html = `<div class="dv-empty">${DV.answered[P] ? (P === 'matches' ? 'لا مباريات في هذه الفترة' : 'لا تتوفر بيانات الآن')
                                          : DV.failed[P] ? 'لا تتوفر بيانات الآن' : 'جارٍ التحميل…'}</div>`;
  if(html === DV.html) return;   // nothing changed: focus and scroll stay as they are
  DV.html = html;
  const sc = body.querySelector('.dv-scroll'), top = sc ? sc.scrollTop : 0;
  body.innerHTML = html;
  const sc2 = body.querySelector('.dv-scroll');
  if(sc2) sc2.scrollTop = top;
  if(news && DV.items.length){
    let i = was ? DV.items.findIndex(x => P === 'shows' ? x.name === was.name   // shows
                                          : (x.link && x.link === was.link) || x.headline === was.headline) : 0;
    dvNewsFocus(i < 0 ? Math.min(DV.focus, DV.items.length - 1) : i);
  }
}

function detailKey(e){
  const k = e.key;
  if(!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(k)) return;
  e.preventDefault();   // no native scrolling: the page moves only as below
  // ◀ = the next page, ▶ = the previous one (RTL)
  if(k === 'ArrowLeft' || k === 'ArrowRight'){ dvGo(k === 'ArrowLeft' ? 1 : -1); return; }
  const P = CONFIG.detail;
  if(isNewsPanel(P) || P === 'shows'){   // shows (OK does nothing there); local
    if(!DV.items.length) return;
    if(k === 'ArrowDown') dvNewsFocus(DV.focus + 1);
    else if(k === 'ArrowUp') dvNewsFocus(DV.focus - 1);
    else if(k === 'Enter'){
      const x = DV.items[DV.focus], N = window.SaudiTVNative;
      if(x && x.link && N && typeof N.openUrl === 'function'){ try{ N.openUrl(x.link); }catch(err){} }
    }
    return;
  }
  const sc = document.querySelector('#dv .dv-scroll');
  if(sc && (k === 'ArrowDown' || k === 'ArrowUp')) sc.scrollTop += (k === 'ArrowDown' ? 1 : -1) * Math.round(sc.clientHeight * 0.4);
}

// start the loaders page P needs, each page once (a page seen again keeps its running refresh).
// The first load (retried by firstLoad until it answers) also decides between "loading" and "no data".
const DV_STARTED = new Set();
function dvStart(P){
  if(DV_STARTED.has(P)) return;
  DV_STARTED.add(P);
  const watch = (load, name) => firstLoad(() => Promise.resolve().then(load).catch(() => false).then(ok => {
    if(ok === false) DV.failed[P] = true; else DV.answered[P] = true;
    renderDetail();
    return ok;
  }), name);
  if(P === 'prayers'){ watch(loadPrayers, 'prayers'); setInterval(loadPrayers, 6*3600*1000); setInterval(renderDetail, 15000); }
  if(P === 'forecast'){ watch(loadWeather, 'weather'); setInterval(loadWeather, 30*60*1000); }
  if(P === 'matches'){ watch(loadMatches, 'matches'); setInterval(loadMatches, 30*60*1000); setInterval(loadLive, 2*60000); setInterval(renderDetail, 60000); }
  if(P === 'standings'){   // the match data marks the followed clubs; the matches page, once seen, refreshes it
    watch(loadStandings, 'standings'); setInterval(loadStandings, 3*3600*1000);
    if(!DV_STARTED.has('matches')) firstLoad(loadMatches, 'matches');
  }
  if(P === 'news' || P === 'tech' || P === 'world'){ watch(() => loadNews(P), P); setInterval(() => loadNews(P), 30*60*1000); setInterval(renderDetail, 5*60*1000); }
  if(P === 'hadith') watch(loadHadith, 'hadith');
  if(P === 'local'){ watch(loadLocalNews, P); setInterval(loadLocalNews, 30*60*1000); setInterval(renderDetail, 5*60*1000); }
  if(P === 'shows'){ watch(loadWeek, 'shows'); setInterval(loadWeek, 6*3600*1000); }   // (verse: offline)
}
// the card shows the page last seen here when the home screen is back (bootRotatingWidget's sauditvHold)
function dvSavePos(){
  try{ localStorage.setItem('sauditv-card-pos', JSON.stringify({panel: CONFIG.detail, at: Date.now()})); }catch(e){}
}
function dvDots(){
  const el = document.querySelector('#dv .dv-dots');
  if(el) el.innerHTML = DV_LIST.map(p => `<span class="dv-dot${p === CONFIG.detail ? ' on' : ''}"></span>`).join('');
}
// page P: its title, its own data, a fresh page (top of the page, first news item)
function dvShow(P){
  CONFIG.detail = P; CONFIG.panel = P;
  DV.html = null; DV.items = []; DV.focus = 0;
  const body = document.querySelector('#dv .dv-body'), title = document.querySelector('#dv .dv-title');
  if(body) body.innerHTML = '';   // renderDetail keeps the scroll of what is shown: nothing is
  if(title) title.textContent = dvTitle();
  const ic = document.querySelector('#dv .dv-ic');   // the page's icon
  if(ic) ic.innerHTML = DV_ICON[P] || '';
  document.title = dvTitle();
  dvDots();
  dvStart(P);
  renderDetail();
  dvSavePos();
}
// d pages on (+1 next, -1 previous, wrapping), at most one switch per 300 ms (a held key repeats);
// the title and the page fade out (.2 s), the next one fades in (.25 s, CSS); no fade with reduced motion
let DV_LAST_GO = 0, DV_OUT_T = 0, DV_TO = '';
function dvGo(d){
  const now = Date.now();
  if(DV_LIST.length < 2 || now - DV_LAST_GO < 300) return;
  DV_LAST_GO = now;
  const cur = DV_LIST.indexOf(DV_TO || CONFIG.detail);   // a switch still fading out counts as made
  DV_TO = DV_LIST[((cur + d) % DV_LIST.length + DV_LIST.length) % DV_LIST.length];
  const root = document.getElementById('dv');
  if(CARD_STILL || !root){ const P = DV_TO; DV_TO = ''; dvShow(P); return; }
  root.classList.add('out');
  clearTimeout(DV_OUT_T);
  DV_OUT_T = setTimeout(() => {
    const P = DV_TO; DV_TO = ''; DV_OUT_T = 0;
    dvShow(P);
    root.classList.remove('out');
  }, 200);
}

function bootDetail(){
  document.documentElement.classList.add('detail');
  document.title = dvTitle();
  const root = document.createElement('section');
  root.className = 'dv'; root.id = 'dv';
  // the icon before the title (dvShow fills it)
  root.innerHTML = `<header class="dv-hd"><div class="dv-tt"><div class="dv-tl"><span class="dv-ic"></span><h1 class="dv-title">${esc(dvTitle())}</h1></div><div class="dv-dots"></div></div>`
    + '<div class="dv-hint">◀ ▶ للتبديل · ▲▼ للتنقل · OK للاختيار · رجوع للعودة</div></header><div class="dv-body"></div>';
  // the screensaver's current photo, blurred and darkened, behind the page (showBackground sets it)
  const bg = document.createElement('div');
  bg.className = 'dv-bg';
  document.body.appendChild(bg);
  document.body.appendChild(root);
  applyBackground(true);
  loadPhotoIndex().then(() => applyBackground(true));
  document.addEventListener('keydown', detailKey);
  dvShow(CONFIG.detail);   // جارٍ التحميل…, its loaders, the dots, the card's position
  let lastDay = riyadhDayNumber();
  setInterval(() => {
    if(riyadhDayNumber() === lastDay) return;
    lastDay = riyadhDayNumber();

  reveal();
}

function boot(){
  if(CONFIG.feedTest) setTimeout(feedTest, 3000);   // tests only (#feedtest=1)
  if(CONFIG.tapeTest) setTimeout(tapeTest, 3000);   // tests only (#tapetest=1)
  if(CONFIG.ticker){ bootTicker(); return; }
  if(CONFIG.detail){ bootDetail(); return; }
  if(CONFIG.home){ bootHome(); return; }
  if(CONFIG.widget){ bootWidget(); return; }
  restoreSnap();
  setTimeout(saveSnap, 15*1000);   // the dream can be killed before pagehide
  setInterval(saveSnap, 60*1000);
  addEventListener('pagehide', saveSnap);
  const wxCity = document.getElementById('wx-city');
  if(wxCity) wxCity.textContent = CONFIG.city;
  const cs = document.getElementById('clock-sub');
  // the clock is the TV's: «بتوقيت <city>» when the city keeps the same time, else «التوقيت المحلي»
  if(cs) cs.textContent = placeNote() ? 'التوقيت المحلي' : 'بتوقيت ' + CONFIG.city;
  document.title = 'سعودي TV';
  applyBackground(true);
  loadPhotoIndex().then(() => applyBackground(true));
  setInterval(() => applyBackground(false), 60*1000);
  tickClock(); tickDates(); tickRamadan();
  tapeStart();   // the ticker tape at the bottom edge (was the three markets under the weather)
  const ROT = CONFIG.panels.length > 1 ? CONFIG.panels : null;   // rotating card on the screensaver too
  if(ROT) CONFIG.panel = ROT[0];
  if(CONFIG.panel === 'none') document.querySelector('.week').style.display = 'none';
  else if(CONFIG.panel !== 'shows') renderPanel(false);   // its own data arrives with prayers, weather, matches
  // a first load without an answer tries again soon (firstLoad)
  firstLoad(loadPrayers, 'prayers'); firstLoad(loadMatches, 'matches'); if(!ROT && CONFIG.panel === 'shows') firstLoad(loadWeek, 'shows'); firstLoad(loadWeather, 'weather');   // !ROT (startPanelData)
  startPanelData(ROT || [CONFIG.panel], true);   // standings / news / tech (matches load above)
  if(ROT){
    newsFlipArm();   // the first panel, if it is news, pages like the later visits
    let ri = 0;
    rotInit(ROT); rotMark(0); rotRestart();   // rotation indicator
    setInterval(() => {
      const k = rotNext(ROT, ri, 1);   // past a panel with nothing to show
      if(k === ri){ rotRestart(); return; }
      ri = k;
      swapPanel(ROT[ri]);   // fade out, then slide the next panel in (sets CONFIG.panel, LIST_PAGE)
      rotMark(ri); rotRestart();
    }, CONFIG.rotateMs);
  }
  applyNight(); pixelShift();
  ssStart();   // the sides change places every hour, a photo-only minute twice an hour

  setInterval(tickClock, 1000);
  setInterval(()=>{ tickDates(); tickPrayer(); tickRamadan(); if(CONFIG.panel === 'prayers') renderPanel(false); }, 15000);
  setInterval(renderMatches, 60000);   // one match, no page turns (was every 15 s)
  setInterval(loadLive, 2*60000);
  setInterval(loadPrayers, 6*3600*1000);
  setInterval(loadMatches, 30*60*1000);
  if(!ROT && CONFIG.panel === 'shows') setInterval(loadWeek, 6*3600*1000);   // !ROT
  setInterval(loadWeather, 30*60*1000);
  setInterval(()=>{
    if(CONFIG.panel === 'shows' && WEEK_POOL.length > WEEK_POSTERS){ WEEK_PAGE++; renderWeekPage(true); }
    if(CONFIG.panel === 'matches'){ LIST_PAGE++; renderPanel(matchRows().length > WEEK_ROWS); }
  }, 25*1000);
  setInterval(applyNight, 20*1000);     // was every minute (it writes only a change: see applyNight)
  setInterval(pixelShift, 2*60*1000);   // was every 4 min
  let lastDay = new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(new Date());
  setInterval(()=>{
    const d = new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(new Date());
    if(d !== lastDay){ lastDay = d; loadPhotoIndex().then(() => applyBackground(true)); tickDates(); tickRamadan(); loadPrayers(); loadMatches(); if((ROT || [CONFIG.panel]).includes('shows')) loadWeek(); loadWeather(); renderPanel(false); }   // ROT
  }, 60*1000);
}
