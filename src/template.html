let RAM_CACHE = {day:'', val:null};
function ramadanStart(){
  const dayKey = new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(new Date());
  if(RAM_CACHE.day === dayKey) return RAM_CACHE.val;
  const fmt = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,month:'numeric'});
  let found = null;
  for(let i=0;i<400;i++){
    const d = new Date(Date.now()+i*86400000);
    if(fmt.format(d) === '9'){
      const p = riyadhParts(d);
      const hy = +new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,year:'numeric'})
        .format(d).replace(/[^0-9]/g,'');
      found = {y:p.y, mo:p.mo, d:p.d, hy};
      break;
    }
  }
  RAM_CACHE = {day: dayKey, val: found};
  return found;
}
function hijriYearNow(){
  try{
    return +new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,year:'numeric'})
      .format(new Date()).replace(/[^0-9]/g,'');
  }catch(e){ return 1448; }
}
function hijriMonthNow(d){   // d = another day (default now)
  try{
    return +new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,month:'numeric'})
      .format(d || new Date()).replace(/[^0-9]/g,'');
  }catch(e){ return 0; }
}
function tickRamadan(){
  const elL=document.getElementById('ramadan-label'),
        elD=document.getElementById('ramadan-days'),
        elS=document.getElementById('ramadan-sub');

  // ---- Ramadan mode: iftar / suhoor instead of the countdown ----
  if(hijriMonthNow() === 9 && PRAYERS.length){
    const rp = placeParts();
    const mins = rp.h*60 + rp.mi + rp.s/60;
    const fajr = PRAYERS.find(p=>p.key==='Fajr');
    const maghrib = PRAYERS.find(p=>p.key==='Maghrib');
    const fajrM = fajr.h*60 + fajr.mi, maghribM = maghrib.h*60 + maghrib.mi;
    let label, targetM;
    if(mins < fajrM){ label = 'الإمساك'; targetM = fajrM; }
    else if(mins < maghribM){ label = 'الإفطار'; targetM = maghribM; }
    else { label = 'الإمساك'; targetM = fajrM + 1440; }
    const th = Math.floor((targetM % 1440) / 60), tm = targetM % 60;
    elL.textContent = label;
    elD.innerHTML = ar(th%12===0?12:th%12) + ':' + ar(String(tm).padStart(2,'0'))
                  + ' <span class="unit">' + (th < 12 ? 'ص' : 'م') + '</span>';
    elS.innerHTML = 'بعد <b>' + humanRemaining(Math.max(0, Math.round((targetM - mins)*60))) + '</b>';
    // the home screen's info strip, e.g. «الإفطار ٦:٠٩ م · بعد ٢ س»
    homeLine('hi-ram', HI_ICON.ram + `<b>${label} ${fmt12(th % 24, tm)}</b>`
      + `<span class="m">· بعد ${shortHM(Math.max(0, Math.round((targetM - mins)*60)))}</span>`);
    return;
  }

  // ---- countdown mode ----
  const st = ramadanStart();
  elL.textContent = 'رمضان ' + ar(st ? st.hy : hijriYearNow());
  if(!st){ elD.textContent='—'; elS.textContent=''; homeLine('hi-ram', ''); return; }   // homeLine
  const rp2 = riyadhParts();
  const days = Math.max(0, Math.round(
    (Date.UTC(st.y, st.mo-1, st.d) - Date.UTC(rp2.y, rp2.mo-1, rp2.d)) / 86400000));
  elD.innerHTML = ar(days) + ' <span class="unit">يوم</span>';
  elS.textContent = days === 0 ? 'رمضان مبارك'
    : 'يبدأ ' + new Intl.DateTimeFormat(GREG,{timeZone:CONFIG.timezone,weekday:'long',day:'numeric',month:'long'})
        .format(new Date(Date.UTC(st.y, st.mo-1, st.d, 12)));
  // the home screen's info strip, e.g. «رمضان بعد ١١٠ يوم»
  homeLine('hi-ram', HI_ICON.ram + (days === 0 ? '<b>رمضان مبارك</b>' : days === 1 ? '<b>رمضان</b> غداً'
    : '<b>رمضان</b> بعد ' + qty(days, UNIT.day)));
}

const TEAM_AR = __TEAMS_AR__;   // assets/shared/teams-ar.json
// match "Al-Adalah", "Al Adalah", "Al-Adalah FC" and "AL ADALAH" to the same entry
const teamKey = s => String(s).toLowerCase().replace(/\b(fc|sc|cf|afc|club|saudi club)\b/g,'')
  .replace(/[^a-z0-9]+/g,' ').trim().replace(/^al /,'al');
const TEAM_KEYS = {};
for(const [en, arName] of Object.entries(TEAM_AR)) TEAM_KEYS[teamKey(en)] = arName;
let MATCHES = {};   // team id -> next event
let RESULTS = {};   // team id -> recent events
let NEXT_LIST = {};   // team id -> upcoming events

// ---------- team names in Arabic ----------
// 1) built-in table, 2) the Arabic label on Wikidata (cached on the device), 3) transliteration meanwhile
const AR_NAMES = (()=>{ try{ return JSON.parse(localStorage.getItem('arNames') || '{}'); }catch(e){ return {}; } })();
const AR_PENDING = new Set();
const AR_KIND = {team:/football|soccer|club|team|منتخب|نادي/i};
const hasArabic = s => /[؀-ۿ]/.test(s);

const TL_WORDS = {the:'ذا',of:'أوف',and:'آند',a:'إيه',in:'إن',on:'أون',to:'تو',us:'أس',fc:'',cf:'',sc:'',afc:'',
  united:'يونايتد',city:'سيتي',real:'ريال',club:'كلوب',sporting:'سبورتنغ',saint:'سانت',st:'سانت'};
const TL_LETTERS = {a:'إيه',b:'بي',c:'سي',d:'دي',e:'إي',f:'إف',g:'جي',h:'إتش',i:'آي',j:'جيه',k:'كيه',l:'إل',m:'إم',
  n:'إن',o:'أو',p:'بي',q:'كيو',r:'آر',s:'إس',t:'تي',u:'يو',v:'في',w:'دبليو',x:'إكس',y:'واي',z:'زد'};
function translit(en){
  const map = {sh:'ش',kh:'خ',th:'ث',dh:'ذ',gh:'غ',ch:'تش',ph:'ف',ck:'ك',qu:'كو',ou:'و',oo:'و',ee:'ي',
    a:'ا',b:'ب',c:'ك',d:'د',e:'ي',f:'ف',g:'ج',h:'ه',i:'ي',j:'ج',k:'ك',l:'ل',m:'م',n:'ن',o:'و',p:'ب',
    q:'ق',r:'ر',s:'س',t:'ت',u:'و',v:'ف',w:'و',x:'كس',y:'ي',z:'ز'};
  const start = {a:'أ',e:'إ',i:'إ',o:'أو',u:'أ'};
  const word = w => {
    if(hasArabic(w) || !/[A-Za-z0-9]/.test(w)) return w;
    const lw = w.toLowerCase();
    if(TL_WORDS[lw] !== undefined) return TL_WORDS[lw];
    if(/^[A-Z]{2,4}$/.test(w)) return lw.split('').map(c=>TL_LETTERS[c]).join(' ');   // CP, PSG
    if(/^al-/.test(lw)) return 'ال' + word(w.slice(3));
    let out = '', x = lw.replace(/(.)\1/g,'$1');
    for(let i = 0; i < x.length;){
      const two = i+1 < x.length ? map[x.slice(i,i+2)] : undefined;
      if(i === 0 && start[x[0]] && !two){ out += start[x[0]]; i++; continue; }
      if(two){ out += two; i += 2; continue; }
      const ch = x[i];
      if(ch === 'e' && i > 0){ i++; continue; }                         // short or silent e
      if(ch === 'c' && /[eiy]/.test(x[i+1] || '')){ out += 'س'; i++; continue; }
      out += /[0-9]/.test(ch) ? ar(ch) : (map[ch] || '');
      i++;
    }
    return out;
  };
  return String(en).replace(/&/g,' و ').replace(/\bAl (?=[A-Z])/g,'Al-')
    .split(/(\s+)/).map(word).join('').replace(/\s{2,}/g,' ').trim();
}

async function wikidataArabic(en, kind){
  const api = 'https://www.wikidata.org/w/api.php?format=json&origin=*';
  const r = await fetchT(`${api}&action=wbsearchentities&type=item&limit=7&language=en&search=${encodeURIComponent(en)}`, 10000);
  const hits = ((await r.json()).search || []).filter(h => AR_KIND[kind].test(h.description || ''));
  if(!hits.length) return '';
  const r2 = await fetchT(`${api}&action=wbgetentities&props=labels&languages=ar&ids=${hits.slice(0,3).map(h=>h.id).join('|')}`, 10000);
  const ents = (await r2.json()).entities || {};
  for(const h of hits.slice(0,3)){
    const l = ents[h.id] && ents[h.id].labels && ents[h.id].labels.ar;
    if(l && l.value) return l.value.replace(/\s*\([^)]*\)\s*/g,' ').replace(/^(نادي|فريق)\s+/,'').trim();
  }
  return '';
}

let arQueue = Promise.resolve();
function arName(en, kind){
  en = String(en || '').trim();
  if(!en || hasArabic(en)) return en;
  if(kind === 'team'){
    const k = TEAM_KEYS[teamKey(en)];
    if(k) return k;
  }
  const key = kind + ':' + en;
  if(AR_NAMES[key] !== undefined) return AR_NAMES[key] || translit(en);
  if(!AR_PENDING.has(key)){
    AR_PENDING.add(key);
    arQueue = arQueue.then(async ()=>{            // one lookup at a time
      try{
        AR_NAMES[key] = await wikidataArabic(en, kind);   // '' = Wikidata has none: keep the transliteration
        try{ localStorage.setItem('arNames', JSON.stringify(AR_NAMES)); }catch(e){}
        if(AR_NAMES[key]){ renderMatches(); renderPanel(false); }
      }catch(e){}                                    // offline: try again next time
      AR_PENDING.delete(key);
    });
  }
  return translit(en);
}
const teamAr = s => arName(s, 'team');

// a followed team's TheSportsDB id: "138995@tsdb.4829" -> "138995" (the league after @ is the settings app's)
const tsdbOf = id => String(id).split('@')[0];
async function fetchNext(id){
  const r = await fetch(`https://www.thesportsdb.com/api/v1/json/${CONFIG.sportsKey}/eventsnext.php?id=${tsdbOf(id)}`,{cache:'no-store'});
  if(!r.ok) throw 0;
  const j = await r.json();
  if(j?.events) NEXT_LIST[id] = j.events;
  return (j?.events || [])[0] || null;
}
function toDate(ev){
  const s = ev.strTimestamp || `${ev.dateEvent}T${ev.strTime || '00:00:00'}`;
  return new Date(s.endsWith('Z') ? s : s+'Z');
}

// one slot per picked team: a result from the last 24h, else a fixture this week, else hidden
// A game is over once its status says so, or 2.5 h after kick-off; its score stays up for a day after that.
const FINAL = ['FT','AET','PEN','MATCH FINISHED'];
function finishedRecently(ev, now){
  if(!ev || ev.intHomeScore == null || ev.intAwayScore == null) return false;
  const k = toDate(ev).getTime(), end = k + 2.5*3600000;
  const over = FINAL.includes((ev.strStatus || '').toUpperCase()) ? now >= k : now >= end;
  return over && now - end < 86400000;
}
// Keep a score seen at the final whistle: the free API's "last games" list can lag, and "next game"
// moves on to the following fixture right away. Saved, so a restart within the day still shows it.
const KEPT = (()=>{ try{ return JSON.parse(localStorage.getItem('keptResults') || '{}'); }catch(e){ return {}; } })();
function keepResult(id, ev){
  if(!finishedRecently(ev, Date.now())) return;
  KEPT[id] = [ev, ...(KEPT[id] || []).filter(x => x.idEvent !== ev.idEvent && finishedRecently(x, Date.now()))];
  try{ localStorage.setItem('keptResults', JSON.stringify(KEPT)); }catch(e){}
}
function resultsFor(id){
  const seen = new Set();
  return [...(RESULTS[id] || []), ...(KEPT[id] || []), MATCHES[id]]
    .filter(ev => ev && ev.idEvent && !seen.has(ev.idEvent) && seen.add(ev.idEvent));
}

// the bottom bar shows ONE match of all the followed teams: a game in progress first, else the next
// one this week, else the latest result of the last day. Fixtures come from MATCHES (each team's next game, kept
// fresh by loadLive), results from resultsFor, as before.
function pickMatch(now){
  const ms = ev => toDate(ev).getTime();
  const fx = CONFIG.teamIds.map(id => MATCHES[id])
    .filter(ev => ev && ev.idEvent && Number.isFinite(ms(ev)) && !finishedRecently(ev, now));
  const live = fx.filter(ev => now >= ms(ev) && now - ms(ev) <= 2.5*3600000
                            && !FINAL.includes((ev.strStatus || '').toUpperCase())).sort((a, b) => ms(a) - ms(b))[0];
  if(live) return {ev: live, done: false};
  const next = fx.filter(ev => ms(ev) > now && ms(ev) - now <= CONFIG.weekWindowDays * 86400000).sort((a, b) => ms(a) - ms(b))[0];
  if(next) return {ev: next, done: false};
  const done = [].concat(...CONFIG.teamIds.map(resultsFor)).filter(ev => finishedRecently(ev, now)).sort((a, b) => ms(b) - ms(a))[0];
  return done ? {ev: done, done: true} : null;
}

function matchSlot(m, now){   // the picked match (pickMatch), its block as before
  if(m.done){
    const done = m.ev;
    const day = new Intl.DateTimeFormat(GREG,{timeZone:CONFIG.timezone,weekday:'long'}).format(toDate(done));
    return `<div class="mblock">`
      + `<div class="big"><span>${esc(teamAr(done.strHomeTeam))} <span class="sc">${ar(+done.intHomeScore)} - ${ar(+done.intAwayScore)}</span> ${esc(teamAr(done.strAwayTeam))}</span></div>`
      + `<div class="sub">النتيجة النهائية · ${day}</div></div>`;
  }
  const ev = m.ev;
  const home = esc(teamAr(ev.strHomeTeam)), away = esc(teamAr(ev.strAwayTeam));
  const d = toDate(ev), diff = d - now;
  const p = new Intl.DateTimeFormat('en-GB',{timeZone:CONFIG.timezone,hour:'2-digit',minute:'2-digit',hour12:false})
    .formatToParts(d).reduce((a,x)=>(a[x.type]=x.value,a),{});
  const t12 = ar(fmt12(+p.hour % 24, +p.minute));
  const live = diff <= 0 && ev.intHomeScore != null && ev.intAwayScore != null;
  const sub = diff > 0 ? `بعد ${shortRemaining(diff)} · ${t12}` : `<span class="live">مباشر</span> · ${liveStatus(ev, t12)}`;
  const mid = live ? ` <span class="sc">${ar(+ev.intHomeScore)} - ${ar(+ev.intAwayScore)}</span> ` : ' × ';
  return `<div class="mblock">`
       + `<div class="big"><span>${home}${mid}${away}</span></div>`
       + `<div class="sub">${sub}</div>`
       + `</div>`;
}

// the picked match (pickMatch) in the home screen's info strip, one line: «الأهلي × الخليج · الخميس
// ١١:٠٠ ص» (today: «اليوم»), a game in progress with its score and minute, a result of the last day with its score
function homeMatch(m, now){
  const ev = m.ev, home = esc(teamAr(ev.strHomeTeam)), away = esc(teamAr(ev.strAwayTeam));
  const d = toDate(ev), scored = ev.intHomeScore != null && ev.intAwayScore != null;
  const sc = scored ? ` <span class="sc">${ar(+ev.intHomeScore)} - ${ar(+ev.intAwayScore)}</span> ` : ' × ';
  if(m.done) return HI_ICON.match + `<b>${home}${sc}${away}</b><span class="m">· النتيجة النهائية</span>`;
  const p = new Intl.DateTimeFormat('en-GB',{timeZone:CONFIG.timezone,hour:'2-digit',minute:'2-digit',hour12:false})
    .formatToParts(d).reduce((a,x)=>(a[x.type]=x.value,a),{});
  const t12 = fmt12(+p.hour % 24, +p.minute);
  if(d - now <= 0) return HI_ICON.match + `<b>${home}${scored ? sc : ' × '}${away}</b>`
    + `<span class="m">· <span class="live">مباشر</span> ${liveStatus(ev, t12)}</span>`;
  const day = new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(d)
           === new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(new Date(now))
    ? 'اليوم' : new Intl.DateTimeFormat(GREG,{timeZone:CONFIG.timezone,weekday:'long'}).format(d);
  const bc = bcastOf(ev, now);   // its channel, when known
  return HI_ICON.match + `<b>${home} × ${away}</b><span class="m">· ${day} ${t12}${bc && bc.ch.length ? ' · ' + bcCh(bc.ch) : ''}</span>`;
}

function liveStatus(ev, t12){
  const st = (ev.strStatus || '').toUpperCase();
  if(st === 'HT') return 'استراحة';
  if(['FT','AET','PEN'].includes(st)) return 'انتهت';
  const m = parseInt(ev.strProgress, 10);
  return isNaN(m) ? `بدأت ${t12}` : `الدقيقة ${ar(m)}`;
}

// while a picked team is playing, refresh that event every 2 minutes
async function loadLive(){
  const now = Date.now(), did = new Set();
  await Promise.all(Object.entries(MATCHES).map(async ([id, ev])=>{
    if(!ev || !ev.idEvent) return;
    const k = toDate(ev).getTime();
    if(now < k - 5*60000 || now > k + 2.5*3600000) return;
    if(ESPN_TEAMS[id]){                     // an ESPN club's schedule again, once per game
      if(did.has(ev.idEvent)) return;
      did.add(ev.idEvent);
      await loadEspnTeam(id);
      return;
    }
    try{
      const r = await fetchT(`https://www.thesportsdb.com/api/v1/json/${CONFIG.sportsKey}/lookupevent.php?id=${ev.idEvent}`, 10000);
      const j = await r.json();
      const fresh = (j.events || [])[0];
      if(fresh && fresh.idEvent === ev.idEvent){ MATCHES[id] = Object.assign({}, ev, fresh); keepResult(id, MATCHES[id]); }
    }catch(e){}
  }));
  pruneEspn();
  renderMatches();
}

// one match (pickMatch), no paging; the row is rewritten only when its text changes
let MATCH_HTML = null;
function renderMatches(){
  const now = Date.now(), m = pickMatch(now);
  if(CONFIG.home) homeLine('hi-match', m ? homeMatch(m, now) : '');   // the home screen's info strip; none: hidden
  const html = m ? matchSlot(m, now) : '<div class="none-week">لا شيء هذا الأسبوع</div>';
  if(html === MATCH_HTML) return;
  MATCH_HTML = html;
  document.getElementById('match-row').innerHTML = html;
}

async function fetchLast(id){
  const r = await fetch(`https://www.thesportsdb.com/api/v1/json/${CONFIG.sportsKey}/eventslast.php?id=${tsdbOf(id)}`,{cache:'no-store'});
  if(!r.ok) throw 0;
  const j = await r.json();
  return j.results || [];
}

// ---- clubs and national teams from ESPN team schedules (no key; TheSportsDB's free key blocks the TV's shared VPN
// address). Two kinds of followed team are read from ESPN:
// - an ESPN id picked in the settings (E<id>@<league>): its schedule in every competition (ESPN's "all" league;
//   the league it was picked from when that fails);
// - a Saudi club of older builds, a TheSportsDB id: #teamnames= carries the followed teams' Arabic names in #teams
//   order, and a name that is a club of ESPN's Saudi Pro League table (STAND_AR) is read from that league's schedules.
// Every other team (e.g. the national team of older builds, a club picked from a TheSportsDB league) is read from
// TheSportsDB. ESPN events are turned into TheSportsDB-shaped events, so matchRows / matchSlot / loadLive read them
// unchanged.
const TEAM_NAME_OF = (() => {      // TheSportsDB id (older builds) -> Arabic name
  const ids = (_Q.get('teams') || '').split(','), names = (_Q.get('teamnames') || '').split(','), o = {};
  ids.forEach((id, i) => { id = (id || '').trim(); const n = (names[i] || '').trim(); if(/^\d+$/.test(id) && n) o[id] = n; });
  return o;
})();
const TEAM_NAME_ANY = (() => {     // any followed id -> its name in the settings (Arabic where the app has one)
  const ids = (_Q.get('teams') || '').split(','), names = (_Q.get('teamnames') || '').split(','), o = {};
  ids.forEach((id, i) => { id = (id || '').trim(); const n = (names[i] || '').trim(); if(id && n) o[id] = n; });
  return o;
})();
const arNorm = s => String(s || '').replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا')
  .replace(/ى/g, 'ي').replace(/ة/g, 'ه').trim().replace(/^(نادي|فريق)\s+/, '').replace(/\s+/g, '');
const ESPN_SITE = 'https://site.api.espn.com/apis/site/v2/sports/soccer/';
const ESPN_SCHED = ESPN_SITE + 'ksa.1/teams/';   // the Saudi clubs of older builds
// "E929@ksa.1" -> {espn: '929', league: 'ksa.1'}; null for a TheSportsDB id
const espnOf = id => { const m = /^E(\d+)@([a-z0-9._]+)$/.exec(String(id)); return m ? {espn: m[1], league: m[2]} : null; };
let ESPN_TEAMS = {};       // followed id -> {espn: ESPN team id, name: ESPN English name, league, all: every competition}
const ESPN_EVENTS = {};    // 'espn:<event id>' -> converted event, one object shared by both followed sides

// the ESPN ids of the settings, and the older builds' teams whose Arabic name is a club of the loaded Saudi table
// (KSA_TABLE; kept as they are while the table is missing)
function mapEspnTeams(){
  const m = {}, used = new Set();
  CONFIG.teamIds.forEach(id => {
    const e = espnOf(id);
    if(e){ used.add(e.espn); m[id] = Object.assign({name: (ESPN_TEAMS[id] || {}).name || '', all: true}, e); }
  });
  if(KSA_TABLE.length) CONFIG.teamIds.forEach(id => {
    const want = arNorm(TEAM_NAME_OF[id]);
    if(!want) return;
    const hit = KSA_TABLE.find(x => x.espnId && !used.has(x.espnId) && arNorm(STAND_AR[standKey(x.name)]) === want);
    if(hit){ used.add(hit.espnId); m[id] = {espn: hit.espnId, name: hit.name, league: 'ksa.1', all: false}; }
  });
  else Object.entries(ESPN_TEAMS).forEach(([id, t]) => { if(!t.all && !m[id]) m[id] = t; });   // the last good mapping
  ESPN_TEAMS = m;
}

const espnTeamAr = en => STAND_AR[standKey(en)] || TEAM_KEYS[teamKey(en)] || en;
function espnScore(c){
  const s = c && c.score, v = s && typeof s === 'object' ? (s.displayValue != null ? s.displayValue : s.value) : s;
  return v == null || v === '' ? null : String(v);
}
// one ESPN schedule event -> the TheSportsDB fields the page reads; byEspn: ESPN team id -> followed id
function espnEvent(e, byEspn){
  const c = e && e.competitions && e.competitions[0];
  if(!c || !e.id || !Array.isArray(c.competitors)) return null;
  const t = new Date(c.date || e.date);
  if(isNaN(t)) return null;
  const st = c.status || e.status || {}, ty = st.type || {}, name = String(ty.name || '').toUpperCase(), state = ty.state || 'pre';
  if(/POSTPONED|CANCEL|ABANDON|SUSPEND|FORFEIT/.test(name) || (state === 'post' && !ty.completed)) return null;
  const home = c.competitors.find(x => x.homeAway === 'home'), away = c.competitors.find(x => x.homeAway === 'away');
  if(!home || !away || !home.team || !away.team) return null;
  const side = x => {
    const id = String(x.team.id != null ? x.team.id : x.id), fid = byEspn[id], en = x.team.displayName || x.team.name || '';
    // a followed team picked in the settings is shown by the name it has there (e.g. «مصر»)
    const own = fid && espnOf(fid) && TEAM_NAME_ANY[fid];
    return {id: fid || 'espn:' + id, name: own && hasArabic(own) ? own : espnTeamAr(en)};
  };
  const H = side(home), A = side(away), iso = t.toISOString();
  let status = 'NS', prog = NaN;
  if(state === 'post') status = /PEN|SHOOTOUT/.test(name) ? 'PEN' : /AET|EXTRA|OVERTIME/.test(name) ? 'AET' : 'FT';
  else if(state === 'in'){ status = /HALF/.test(name) ? 'HT' : (+st.period >= 2 ? '2H' : '1H'); prog = parseInt(st.displayClock, 10); }
  const scored = state !== 'pre';
  return {idEvent: 'espn:' + e.id, strHomeTeam: H.name, strAwayTeam: A.name, idHomeTeam: H.id, idAwayTeam: A.id,
    espnHome: String(home.team.id), espnAway: String(away.team.id),
    dateEvent: iso.slice(0, 10), strTime: iso.slice(11, 19), strTimestamp: iso.slice(0, 19),
    intHomeScore: scored ? espnScore(home) : null, intAwayScore: scored ? espnScore(away) : null,
    strStatus: status, strProgress: Number.isFinite(prog) ? String(prog) : null,
    strLeague: (e.league && e.league.name) || ''};
}

async function espnEvents(url){
  const r = await fetchT(url, 15000);
  if(!r.ok) throw 0;
  const j = await r.json();
  if(!j || !Array.isArray(j.events)) throw 0;
  if(j.team && j.team.id != null && j.team.displayName) ESPN_NAMES[String(j.team.id)] = j.team.displayName;
  return j.events;
}
const ESPN_NAMES = {};   // ESPN team id -> its English name, from its schedule (followedKeys)
// a team's schedule: recent results and upcoming fixtures, [past, next]; null where ESPN did not answer
async function espnSchedule(base){
  return Promise.all([espnEvents(base).catch(() => null), espnEvents(base + '?fixture=true').catch(() => null)]);
}
// a team's recent results and upcoming fixtures; 1 = ESPN answered, 0 = failed (what is shown stays)
async function loadEspnTeam(id){
  const t = ESPN_TEAMS[id];
  if(!t) return 0;
  const byEspn = {};
  Object.entries(ESPN_TEAMS).forEach(([fid, x]) => { byEspn[x.espn] = fid; });
  // an ESPN pick: every competition (league "all"), else the league it was picked from; older builds' clubs: ksa.1
  let [past, next] = await espnSchedule((t.all ? ESPN_SITE + 'all/teams/' : ESPN_SITE + t.league + '/teams/')
    + encodeURIComponent(t.espn) + '/schedule');
  if(!past && !next && t.all) [past, next] = await espnSchedule(ESPN_SITE + t.league + '/teams/' + encodeURIComponent(t.espn) + '/schedule');
  if(!past && !next) return 0;
  if(ESPN_NAMES[t.espn]) t.name = ESPN_NAMES[t.espn];
  const evs = [];
  [].concat(past || [], next || []).forEach(e => {
    const x = espnEvent(e, byEspn);
    if(!x) return;
    const ev = ESPN_EVENTS[x.idEvent] ? Object.assign(ESPN_EVENTS[x.idEvent], x) : (ESPN_EVENTS[x.idEvent] = x);
    if(!evs.includes(ev)) evs.push(ev);
  });
  const done = evs.filter(x => FINAL.includes(x.strStatus)).sort((a, b) => toDate(b) - toDate(a)).slice(0, 5);
  const ahead = evs.filter(x => !FINAL.includes(x.strStatus)).sort((a, b) => toDate(a) - toDate(b)).slice(0, 5);
  if(past || done.length) RESULTS[id] = done;
  if(next || ahead.length) NEXT_LIST[id] = ahead;
  const ev = ahead[0];
  if(ev){ if(MATCHES[id] && MATCHES[id].idEvent !== ev.idEvent) keepResult(id, MATCHES[id]); MATCHES[id] = ev; }
  return 1;
}
// drop converted events no list refers to any more
function pruneEspn(){
  const keep = new Set();
  [MATCHES, RESULTS, NEXT_LIST].forEach(o => Object.values(o).forEach(v => (Array.isArray(v) ? v : [v]).forEach(ev => { if(ev) keep.add(ev.idEvent); })));
  Object.keys(ESPN_EVENTS).forEach(k => { if(!keep.has(k)) delete ESPN_EVENTS[k]; });
}
// ---- end

// ---- the channel and commentator of a followed team's match in the next 48 h (optimize/run/match-channel-research.md).
// btolat's day page first; filgoal's day list only while btolat lacks a field of one of that day's matches (btolat wins
// where both have one). Both sites name days in UTC+3. Only the days of those matches are asked, at most every 3 h (1 h
// while a field of a match within 6 h of kick-off is missing; filgoal at most every 4 h), none once it has kicked off.
// A source row is used when it is the one row with both teams (bcKey) within a day of the date, or else the one row of
// the followed club that day whose kick-off agrees within 20 min (the opponent may be transliterated in our data);
// each field is hidden while unknown; any failure only logs.
const BC_URL = {
  btolat: d => { const [y, m, dd] = d.split('-').map(Number); return `https://mobile.btolat.com/match-score?d=${m}.${dd}.${y}`; },
  filgoal: d => 'https://www.filgoal.com/matches/ajaxlist?date=' + d,
};
const bcDay = t => new Date(t + 3*36e5).toISOString().slice(0, 10);
// the sites' other spellings of a club (research), after bcRaw. The page's own names (TEAM_AR, via teamAr) are the other
// side of the match; TEAM_AR's only pairs under one English key are different clubs (Al-Wehda / Al Wahda of the UAE,
// Al-Faisaly / Al-Faisaly of Jordan), so no alias is made from it.
const BC_ALIAS = {اتحادجده: 'اتحاد', اهليجده: 'اهلي', نيفتشي: 'نفتشي', نيفتشيفرغانه: 'نفتشي', نيفتشيفرجانه: 'نفتشي'};
// «الأهلي السعودي», «أهلي جدة», «نادي الأهلي» -> «اهلي»: harakat, tatweel, alef/ya/ta-marbuta forms, a leading
// «نادي|فريق», a trailing country, each word's «ال» and the spaces
const bcRaw = s => String(s || '').replace(/[ً-ٰٟـ]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي')
  .replace(/ة/g, 'ه').trim().replace(/^(نادي|فريق)\s+/, '').replace(/\s+(السعودي|السعوديه|الاماراتي|القطري|الكويتي|المصري)$/, '')
  .split(/\s+/).map(w => w.replace(/^ال(?=..)/, '')).join('');
const bcKey = s => { const k = bcRaw(s); return BC_ALIAS[k] || k; };
const bcName = s => String(s || '').replace(/\s+/g, ' ').trim();
const bcChan = s => bcName(s).replace(/^bein(?=\s|$)/i, 'beIN');   // btolat writes «BEIN SPORTS 3»; beIN's own casing
// a site's local time (UTC+3) on day -> ms; btolat writes «09:15 م», filgoal «2026-10-25T17:00:00»; none: null
function bcTime(day, hm, pm){
  const m = /(\d{1,2}):(\d\d)/.exec(String(hm || '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)));
  if(!m) return null;
  const h = +m[1] % 12 + (pm == null ? +m[1] - +m[1] % 12 : pm ? 12 : 0);
  const t = Date.parse(day + 'T00:00:00Z') + (h * 60 + +m[2] - 180) * 60000;
  return Number.isFinite(t) ? t : null;
}
// 'btolat|2026-10-26' -> {at: last try (ms), rows: [[home key, away key, day, [≤2 channels], commentator, kick-off ms|null]]}
const BC = (() => { try{ return JSON.parse(localStorage.getItem('bcast') || '{}'); }catch(e){ return {}; } })();

async function bcBtolat(day){
  const r = await fetchT(BC_URL.btolat(day), 15000);
  if(!r.ok) throw Error('HTTP ' + r.status);
  const doc = new DOMParser().parseFromString(await r.text(), 'text/html'), [y, m, d] = day.split('-').map(Number);
  // a redirect to today's page drops ?d=: the title must carry the asked day, «… 26-10-2026 - بطولات»
  if(!new RegExp(`(^|\\D)0?${d}-0?${m}-${y}(\\D|$)`).test(doc.title)) throw Error('not the asked day');
  const rows = [];
  doc.querySelectorAll('li[id^="m_"].item').forEach(li => {
    const names = [...li.querySelectorAll('a.team')].map(a => {
      const s = [...a.children].filter(e => e.tagName === 'SPAN' && e.textContent.trim()).pop();
      return bcName((s || a).textContent);
    });
    if(names.length !== 2 || !names[0] || !names[1]) return;
    const tm = li.querySelector('.match-time'), tx = tm ? tm.textContent : '';
    const t = /[صم]/.test(tx) ? bcTime(day, tx, /م/.test(tx)) : null;   // 12-hour, so ص/م must be there
    // in the footer a TV icon (svg with a rect) comes before a channel, a microphone (svg with a line) before the commentator
    const ch = [], com = [], all = [], f = li.querySelector('.match-footer');
    let icon = '';
    if(f) f.querySelectorAll('svg, .sc-interp').forEach(e => {
      if(e.tagName.toLowerCase() === 'svg'){
        const R = !!e.querySelector('rect'), L = !!e.querySelector('line');
        icon = R && !L ? 'ch' : L && !R ? 'com' : '';
        return;
      }
      const v = bcName(e.textContent);
      if(!v) return;
      all.push(v);
      if(icon === 'ch') ch.push(v); else if(icon === 'com') com.push(v);
    });
    if(!ch.length && !com.length && all.length === 2){ ch.push(all[0]); com.push(all[1]); }
    rows.push([bcKey(names[0]), bcKey(names[1]), day, [...new Set(ch.map(bcChan))].slice(0, 2), com[0] || '', t]);
  });
  if(!rows.length) throw Error('no matches on the page');
  return rows;
}
async function bcFilgoal(day){
  const r = await fetchT(BC_URL.filgoal(day), 15000);
  if(!r.ok) throw Error('HTTP ' + r.status);
  const j = await r.json(), rows = [];
  const walk = (o, n) => {
    if(!o || typeof o !== 'object' || n > 4) return;
    if(Array.isArray(o)){ o.forEach(x => walk(x, n + 1)); return; }
    if(o.HomeTeamName && o.AwayTeamName){
      const tv = Array.isArray(o.TvCoverage) ? o.TvCoverage.filter(x => x && typeof x === 'object') : [];
      const at = /^\d{4}-\d\d-\d\d/.test(o.Date || '') ? o.Date.slice(0, 10) : day;
      rows.push([bcKey(o.HomeTeamName), bcKey(o.AwayTeamName), at, [...new Set(tv.map(x => bcChan(x.TvChannelName)).filter(Boolean))].slice(0, 2),
                 tv.map(x => bcName(x.CommenterName)).find(Boolean) || '', bcTime(at, String(o.Date || '').slice(11, 16), null)]);
      return;
    }
    Object.values(o).forEach(x => walk(x, n + 1));
  };
  walk(j, 0);
  if(!rows.length) throw Error('no matches in the list');
  return rows;
}

// the followed teams' matches that kick off in the next 48 h
function bcTargets(now){
  const out = [], seen = new Set();
  CONFIG.teamIds.forEach(id => [MATCHES[id], ...(NEXT_LIST[id] || [])].forEach(ev => {
    if(!ev || !ev.idEvent || seen.has(ev.idEvent)) return;
    const t = toDate(ev).getTime();
    if(t > now && t - now <= 48*36e5){ seen.add(ev.idEvent); out.push({ev, t, day: bcDay(t)}); }
  }));
  return out;
}
// the source's row for ev: the one row with both its teams (either way round) within a day of its date; else the one row
// of a followed side that day, when its kick-off agrees within 20 min; none or several: null
const bcFollowed = id => id != null && CONFIG.teamIds.some(f => f === String(id) || tsdbOf(f) === String(id));
function bcRow(src, ev, t){
  const h = bcKey(teamAr(ev.strHomeTeam)), a = bcKey(teamAr(ev.strAwayTeam)), d = Date.parse(bcDay(t)), near = [];
  if(!h || !a || h === a) return null;
  Object.keys(BC).forEach(k => { if(k.startsWith(src + '|')) (BC[k].rows || []).forEach(r => {
    if(Math.abs(Date.parse(r[2]) - d) <= 864e5) near.push(r);
  }); });
  const both = near.filter(r => (r[0] === h && r[1] === a) || (r[0] === a && r[1] === h));
  if(both.length) return both.length === 1 ? both[0] : null;
  const hits = [[h, ev.idHomeTeam], [a, ev.idAwayTeam]].filter(([, id]) => bcFollowed(id)).map(([f]) => {
    const rs = near.filter(r => r[0] === f || r[1] === f);
    return rs.length === 1 && rs[0][5] != null && Math.abs(rs[0][5] - t) <= 20*60000 ? rs[0] : null;
  }).filter(Boolean);
  return hits.length && hits.every(r => r === hits[0]) ? hits[0] : null;
}
// {ch: [names], com} of an upcoming match in the next 48 h, btolat's where it has them; null when nothing is known
function bcastOf(ev, now = Date.now()){
  const t = toDate(ev).getTime();
  if(!(t > now && t - now <= 48*36e5)) return null;
  const b = bcRow('btolat', ev, t) || [], f = bcRow('filgoal', ev, t) || [];
  const ch = (b[3] && b[3].length ? b[3] : f[3]) || [], com = b[4] || f[4] || '';
  return ch.length || com ? {ch, com} : null;
}
// each name isolated (<bdi>), so «beIN SPORTS 1» does not reorder the Arabic line
const bcCh = ch => ch.map(c => `<bdi>${esc(c)}</bdi>`).join(' / ');
const bcLine = x => [x.ch.length ? 'القناة: ' + bcCh(x.ch) : '', x.com ? `المعلق: <bdi>${esc(x.com)}</bdi>` : ''].filter(Boolean).join(' · ');

let BC_BUSY = false;
async function bcastUpdate(){
  if(BC_BUSY) return;
  BC_BUSY = true;
  try{
    const now = Date.now(), days = {};
    let dirty = false, changed = false;
    Object.keys(BC).forEach(k => { if(!(now - (BC[k].at || 0) <= 3*864e5)){ delete BC[k]; dirty = true; } });
    bcTargets(now).forEach(x => (days[x.day] = days[x.day] || []).push(x));
    for(const [day, xs] of Object.entries(days)){
      // every 4 h; hourly within 6 h of a kick-off while a field of that match is missing, not at all once both are known
      const need = xs.map(x => { const b = bcastOf(x.ev, now); return x.t - now > 6*36e5 ? 4 : b && b.ch.length && b.com ? Infinity : 1; });
      const every = Math.min(...need) * 36e5;
      if(every === Infinity) continue;
      for(const src of ['btolat', 'filgoal']){
        // filgoal only while btolat lacks a field of one of that day's matches, at most every 4 h
        if(src === 'filgoal' && xs.every(x => { const r = bcRow('btolat', x.ev, x.t); return r && r[3].length && r[4]; })) continue;
        const k = src + '|' + day;
        if(BC[k] && now - BC[k].at < (src === 'filgoal' ? 4*36e5 : every)) continue;
        BC[k] = Object.assign(BC[k] || {rows: []}, {at: now});
        dirty = true;
        try{ BC[k].rows = await (src === 'btolat' ? bcBtolat(day) : bcFilgoal(day)); changed = true; }
        catch(e){ console.warn('SaudiTV bcast ' + k + ': ' + ((e && e.message) || e)); }   // the last good rows stay
      }
    }
    if(dirty) try{ localStorage.setItem('bcast', JSON.stringify(BC)); }catch(e){}
    if(changed){ renderMatches(); if(CONFIG.panel === 'matches') renderPanel(false); }
  }catch(e){ console.warn('SaudiTV bcast: ' + ((e && e.message) || e)); }
  finally{ BC_BUSY = false; }
}
// ---- end

async function loadMatches(){
  // the older builds' Saudi clubs need ESPN's Saudi table (their ESPN ids come from it); ESPN picks carry their id
  const legacy = Object.keys(TEAM_NAME_OF).length > 0;
  if(legacy && !KSA_TABLE.length) await loadKsaTable();
  mapEspnTeams();
  // never throw away a good fixture or result on a failed refresh
  let answered = 0;
  await Promise.all(CONFIG.teamIds.map(async id=>{
    if(ESPN_TEAMS[id]){ const n = await loadEspnTeam(id); answered += n; return; }
    if(espnOf(id)) return;   // an ESPN pick is never read from TheSportsDB
    try{
      const ev = await fetchNext(id); answered++;
      if(ev){ if(MATCHES[id] && MATCHES[id].idEvent !== ev.idEvent) keepResult(id, MATCHES[id]); MATCHES[id] = ev; }
    }catch(e){}
    try{ const l = await fetchLast(id); answered++; if(l.length) RESULTS[id] = l; }catch(e){}
  }));
  pruneEspn();
  if(!answered && CONFIG.teamIds.length) return false;   // offline: keep what is shown (the saved panels)
  renderMatches();
  if(CONFIG.panel === 'matches' || CONFIG.panel === 'standings') renderPanel(false);   // standings marks followed teams
  bcastUpdate();   // the channel and commentator of a match in the next 48 h (never throws)
  // answered (see firstLoad); without the Saudi table the older builds' clubs are not read from ESPN yet
  return !legacy || KSA_TABLE.length > 0;
}

// the ticker tape's markets, in this order: Yahoo symbol or CoinGecko id, and how its value is written

// ---- market formatting (value and daily change), pure: no DOM, no network
// the chosen digits and their separators (NU); every number group is its own left-to-right isolate, so the sign,
// the percent sign, $ and the brackets keep their places inside the right-to-left page.
const MK_NF = {};
function mkNum(x, d){
  const f = MK_NF[d] || (MK_NF[d] = new Intl.NumberFormat('ar-SA', {minimumFractionDigits:d, maximumFractionDigits:d, numberingSystem:NU}));
  return f.format(x);
}
const mkIso = s => `<span dir="ltr">${s}</span>`;
const mkSigned = (x, up, d, unit) => mkIso((up ? '+' : '−') + mkNum(Math.abs(x), d) + (unit || ''));
// a trading day as the exchange counts it
function mkDay(t, tz, off){
  try{ if(tz) return new Intl.DateTimeFormat('en-CA', {timeZone:tz}).format(new Date(t * 1000)); }catch(e){}
  return new Date((t + (off || 0)) * 1000).toISOString().slice(0, 10);
}
// Yahoo v8 chart (interval=1d) -> {price, prev, ...}; prev is the previous trading day's close or null.
// When the last daily bar is the same trading day as regularMarketPrice, the close before it; with a single bar,
// chartPreviousClose (the close just before the first bar). When the last bar is an earlier day, its close.
// ok: a test each close must pass to count (mkFxQuote: near the peg); the others are skipped as if missing.
function mkIndexQuote(res, ok){
  const m = (res && res.meta) || {}, price = m.regularMarketPrice;
  if(typeof price !== 'number' || !(price > 0)) return null;
  const good = x => typeof x === 'number' && x > 0 && (!ok || ok(x));
  const ts = res.timestamp || [], cl = ((res.indicators && res.indicators.quote && res.indicators.quote[0]) || {}).close || [];
  const bars = ts.map((t, i) => [t, cl[i]]).filter(b => good(b[1]));
  const day = t => mkDay(t, m.exchangeTimezoneName, m.gmtoffset);
  const q = {price, prev:null, priceDay: m.regularMarketTime ? day(m.regularMarketTime) : null, prevDay:null};
  const last = bars[bars.length - 1];
  if(!last || !q.priceDay) return q;
  if(day(last[0]) === q.priceDay){
    if(bars.length >= 2){ q.prev = bars[bars.length - 2][1]; q.prevDay = day(bars[bars.length - 2][0]); }
    else if(good(m.chartPreviousClose)){ q.prev = m.chartPreviousClose; q.prevDay = 'before ' + day(last[0]); }
  } else { q.prev = last[1]; q.prevDay = day(last[0]); }
  return q;
}
// the daily change in percent: against the previous trading day's close (null when unknown)
const mkIndexPct = q => q && q.prev > 0 ? (q.price - q.prev) / q.prev * 100 : null;
// The currencies held to the dollar: units per dollar (their central banks' pegs; HKD the middle of its 7.75-7.85
// band). Yahoo's daily bars for some of them are far off while the live price is right: SAR=X closed near 3.63 for
// days with the price at 3.752, and the tape showed «الدولار/الريال +3.22%», a move a peg never makes.
const FX_PEG = {SAR:3.75, AED:3.6725, QAR:3.64, BHD:0.376, OMR:0.3845, JOD:0.709, DJF:177.721, ERN:15, BZD:2, BBD:2,
  XCD:2.7, AWG:1.79, XCG:1.79, KYD:0.8333, HKD:7.8};
const FX_PEG_BAND = 0.01;   // a pegged rate within 1 % of its peg is real; further off, a bad bar or a bad price
const FX_PEG_MAX = 1;       // percent: a pegged currency's daily change over this is not shown
const FX_MAX = 10;          // percent: any other rate's daily change over this is not shown (a bad bar, not a day)
// 'SAR=X' -> 'SAR'; '' for anything else (EURUSD=X)
const fxCur = sym => (/^([A-Z]{3})=X$/.exec(sym || '') || [])[1] || '';
// a rate's quote with a sane daily change: pegged, the previous close is the last bar near the peg, a price off the
// peg is none at all (null: open.er-api.com's rate instead, where the item has one) and a change over FX_PEG_MAX
// percent is dropped; any other rate, a change over FX_MAX percent is dropped. The price stays, without its change.
function mkFxQuote(res, sym){
  const peg = FX_PEG[fxCur(sym)], near = peg ? x => Math.abs(x - peg) / peg <= FX_PEG_BAND : null;
  const q = mkIndexQuote(res, near);
  if(!q || (near && !near(q.price))) return null;
  const pct = mkIndexPct(q);
  if(pct != null && Math.abs(pct) > (peg ? FX_PEG_MAX : FX_MAX)){ q.prev = null; q.prevDay = null; }
  return q;
}
// -> {value, change, dir}: HTML for the value and the change in percent ('' when unknown); dir 1 up, -1 down,
// 0 unchanged (as shown: under 0.005 % is ٠٫٠٠٪, grey, no arrow). fmt: see TAPE.
function mkTapeHtml(price, pct, fmt){
  if(typeof price !== 'number' || !(price > 0)) return {value:'', change:'', dir:0};
  const d = fmt === 'fx' ? (price < 100 ? 4 : price < 1000 ? 2 : 0) : fmt === 'usd' && price < 1000 ? 2 : 0;
  const value = mkIso(mkNum(price, d) + (fmt === 'usd' ? ' $' : ''));
  if(typeof pct !== 'number' || !isFinite(pct) || pct <= -100) return {value, change:'', dir:0};
  const r = Math.round(pct * 100) / 100, dir = r > 0 ? 1 : r < 0 ? -1 : 0;
  return {value, dir, change: dir ? `${dir > 0 ? '▲' : '▼'} ${mkSigned(r, dir > 0, 2, PCT)}` : mkIso(mkNum(0, 2) + PCT)};
}

async function fetchT(url, ms){
  const c = new AbortController(); const id = setTimeout(()=>c.abort(), ms||12000);
  try{ return await fetch(url,{cache:'no-store', signal:c.signal}); }
  finally{ clearTimeout(id); }
}

// Yahoo has no CORS headers: try it directly (works inside the app), then through public CORS gateways
async function yahooChart(sym){
  const direct = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?interval=1d&range=5d`;
  const routes = [
    [direct, 7000, j => j],
    ['https://api.allorigins.win/get?url=' + encodeURIComponent(direct), 15000, w => JSON.parse(w.contents)],
    ['https://corsproxy.io/?url=' + encodeURIComponent(direct), 12000, j => j],
  ];
  for(const [url, ms, unwrap] of routes){
    try{
      const r = await fetchT(url, ms);
      if(!r.ok) continue;
      const j = unwrap(await r.json());
      if(j && j.chart && j.chart.result) return j;
    }catch(e){}
  }
  throw 0;
}

// ---- the market ticker tape
// One refresh asks for every market at once (Yahoo one request each, CoinGecko one for both coins). Each answer is
// kept; a failed one keeps the market's last good value, or leaves it out until it has one. Resolves to false when
// nothing answered (see firstLoad).
const TAPE_Q = [];   // TAPE index -> {value, change, dir} (mkTapeHtml)
// the dollar's rates on open.er-api.com (keyless, CORS friendly, once a day): the rate of a currency Yahoo has not
// answered for (t.er; '1/EUR' the euro in dollars), without a daily change; null when unknown
const erRates = () => fetchT('https://open.er-api.com/v6/latest/USD', 10000).then(r => r.ok ? r.json() : null)
  .then(j => j && j.result === 'success' && j.rates ? j.rates : null).catch(() => null);
function erRate(rates, er){
  const inv = /^1\//.test(er || ''), x = rates && rates[String(er || '').replace(/^1\//, '')];
  return typeof x === 'number' && x > 0 ? (inv ? 1 / x : x) : null;
}
async function loadTape(){
  const ids = TAPE.filter(t => t.cg).map(t => t.cg).join(',');
  const coins = ids ? fetchT(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`, 10000)
    .then(r => r.ok ? r.json() : null).catch(() => null) : null;
  let er = null;
  const got = await Promise.all(TAPE.map(async (t, i) => {
    let h;
    try{
      if(t.cg){                                  // crypto: CoinGecko, CORS friendly; the change is over 24 h
        const c = ((await coins) || {})[t.cg] || {};
        h = mkTapeHtml(c.usd, c.usd_24h_change ?? c.usd_24hr_change, t.fmt);
      } else {
        let q = null;
        try{
          const res = (await yahooChart(t.sym)).chart.result[0];
          q = t.fmt === 'fx' ? mkFxQuote(res, t.sym) : mkIndexQuote(res);   // a rate: its change sanity-checked
        }catch(e){ if(!t.er) throw e; }
        if(!q && t.er) h = mkTapeHtml(erRate(await (er || (er = erRates())), t.er), null, t.fmt);
        else h = mkTapeHtml(q && q.price, mkIndexPct(q), t.fmt);
      }
    }catch(e){ return false; }
    if(!h.value) return false;                   // an answer without a price is no better than none
    TAPE_Q[i] = h;
    tapeSoon();
    return true;
  }));
  tapeRender();
  return got.some(Boolean);
}

    let m;
    try{
      const res = (await yahooChart(sym)).chart.result[0], q = mkIndexQuote(res);
      const pc = p => p == null ? '?' : p.toFixed(2);
      m = q ? `${q.price} day ${q.priceDay} chg ${pc(mkIndexPct(q))}` : 'no price';
      // a rate as the tape shows it (mkFxQuote): its change after the sanity checks, or none
      if(kind === 'fx' || /=X$/.test(sym)){ const s = mkFxQuote(res, sym); m += ' | shown ' + (s ? `${s.price} chg ${pc(mkIndexPct(s))}` : 'none'); }
    }catch(x){ m = 'none'; }
    log(`${kind} ${id} ${sym} ${m}` + (e ? ' | er ' + (erRate(er, e) ?? 'none') : ''));
  };
  let k = 0;
  await Promise.all(Array.from({length: 4}, async () => { while(k < jobs.length) await run(jobs[k++]); }));
  log('done ' + jobs.length);
}

// the answers arrive one by one: the tape is redrawn once they stop for 2 s, or when the refresh ends
let TAPE_T = 0;
function tapeSoon(){ clearTimeout(TAPE_T); TAPE_T = setTimeout(tapeRender, 2000); }

// the markets that have a value, in TAPE order, each followed by a dot (so is the last: the loop's seam)
let TAPE_HTML = '';
function tapeRender(){
  clearTimeout(TAPE_T); TAPE_T = 0;
  const html = TAPE.map((t, i) => {
    const h = TAPE_Q[i];
    if(!h) return '';
    const cls = h.dir > 0 ? ' up' : h.dir < 0 ? ' down' : '';
    return `<span class="tape-i"><span class="tape-n">${tapeName(t)}</span><span class="tape-v">${h.value}</span>`
      + (h.change ? `<span class="tape-c${cls}" dir="ltr">${h.change}</span>` : '') + '</span><i class="tape-dot"></i>';
  }).join('');
  if(!html || html === TAPE_HTML) return;   // nothing yet (the strip stays hidden), or the same: no restart
  TAPE_HTML = html;
  tapeLay();
}

// Lays the run out and (re)starts it: the list repeated until one copy is at least as wide as the strip, that copy
// twice, and an endless linear move to the right by exactly one copy's width (whole px), TAPE_SPEED px a second.
// Only when the list or the page's size changes; a restart carries on from where the run was. Reduced motion: one
// copy, still. «توفير الطاقة» (#lowpower=1): the same move in TAPE_LOW_FPS steps a second.
const TAPE_SPEED = 55;   // CSS px per second
const TAPE_LOW_FPS = 30;
let TAPE_ANIM = null;

function tapeLay(){
  const tape = document.getElementById('tape'), run = document.getElementById('tape-run');
  if(!tape || !run || !TAPE_HTML) return;
  const fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  fonts.then(() => {   // measured in the page's own fonts
    const html = TAPE_HTML;
    tape.hidden = false;
    run.innerHTML = `<span class="tape-set">${html}</span>`;
    const one = run.firstChild.getBoundingClientRect().width;
    const k = CARD_STILL ? 1 : Math.max(1, Math.ceil(tape.clientWidth / Math.max(1, one)));
    const set = `<span class="tape-set">${html.repeat(k)}</span>`;
    run.innerHTML = CARD_STILL ? set : set + set.replace('class="tape-set"', 'class="tape-set" aria-hidden="true"');
    const w = Math.ceil(run.firstChild.getBoundingClientRect().width);
    for(const s of run.children) s.style.width = w + 'px';
    const at = TAPE_ANIM ? (Number(TAPE_ANIM.currentTime) || 0) / 1000 * TAPE_SPEED : 0;   // px moved so far
    if(TAPE_ANIM){ TAPE_ANIM.cancel(); TAPE_ANIM = null; }
    if(CARD_STILL || !run.animate) return;
    // «توفير الطاقة» (#lowpower=1): the same move in TAPE_LOW_FPS steps a second (steps() easing), still the
    // compositor's own animation. Measured on TV 1 (the screensaver's page, 30 s): 54% of one core instead of 76%. A
    // move set by the page itself 30 times a second cost more there (86%; on every other requestAnimationFrame 90%)
    TAPE_ANIM = run.animate([{transform:'translate3d(0,0,0)'}, {transform:`translate3d(${w}px,0,0)`}],
      {duration: w / TAPE_SPEED * 1000, iterations: Infinity,
       easing: CONFIG.lowPower ? `steps(${Math.max(1, Math.round(w / TAPE_SPEED * TAPE_LOW_FPS))}, end)` : 'linear'});
    TAPE_ANIM.currentTime = (at % w) / TAPE_SPEED * 1000;
    if(APPS_OPEN || SS_BREAK) TAPE_ANIM.pause();   // held where it is while the launcher's apps grid is open (or the screensaver's photo-only minute runs)
  });
}

// true while the launcher's apps grid is open (sauditvAppsOpen): the tape and the card hold still. The home
// screen's tape moves as the screensaver's (was stepping: tapeStep, a 4 s hold then a 0.6 s slide)
let APPS_OPEN = false;
// true during the screensaver's photo-only minute (ssTick): the tape is hidden and held there too
let SS_BREAK = false;

// a first load retried until it answers (firstLoad), then every 15 minutes; laid out again when the size changes
function tapeStart(){
  firstLoad(loadTape, 'markets');
  setInterval(loadTape, 15*60*1000);
  let t = 0;
  addEventListener('resize', () => { clearTimeout(t); t = setTimeout(tapeLay, 300); });
}
// ---- end: the market ticker tape

// HTML (<p>, <b>, entities): its text only
function plainText(h){
  if(!h) return '';
  try{ return (new DOMParser().parseFromString(String(h), 'text/html').body.textContent || '').replace(/\s+/g, ' ').trim(); }
  catch(e){ return String(h).replace(/<[^>]*>/g, '').trim(); }
}
const WEEK_ROWS = 5;

// ---- the card beside the clock: one of several contents, picked in the app
let FORECAST = [];
let WX_NOW = null, WX_HOURS = [];   // current conditions and the next 12 hours (detail page only)
let LIST_PAGE = 0;
const PANEL_TITLE = {prayers:'مواقيت اليوم', forecast:'الأيام القادمة', matches:'مباريات فرقك',
  standings:'ترتيب ' + CONFIG.leagueName, news:'أخبار ' + CONFIG.newsName, tech:'أخبار التقنية والذكاء الاصطناعي', world:'أخبار العالم',
  verse:'آية اليوم', hadith:'حديث اليوم'};

// the card's paint, shared by every panel. A rotation (swapPanel) fades the list and the title out,
// then paints the next panel and slides it in; while that runs, any other redraw waits (one is kept) and runs
// when it ends. A redraw that would show exactly what is shown does nothing, so it never cuts a slide-in short.
const CARD_OUT_MS = 600;      // .week.out: the fade-out
const CARD_IN_MS = 1700;      // weekIn 1.1 s + .6 s delay of the sixth row
const CARD_STILL = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
let CARD_BUSY_UNTIL = 0, CARD_TIMER = 0, CARD_PENDING = null, CARD_HTML = null;
function cardBusy(ms, then){
  CARD_BUSY_UNTIL = Date.now() + ms;
  clearTimeout(CARD_TIMER);
  CARD_TIMER = setTimeout(then, ms);
}
function cardIdle(){
  CARD_BUSY_UNTIL = 0;
  if(CARD_PENDING === null) return;
  const a = CARD_PENDING; CARD_PENDING = null;
  renderPanel(a);
}
function paintCard(html, title, animate, own){
  const ul = document.getElementById('week-list'), hd = document.getElementById('week-hd');
  if(!own && Date.now() < CARD_BUSY_UNTIL){ CARD_PENDING = !!(CARD_PENDING || animate); return; }
  if(!animate && html === CARD_HTML && (title == null || hd.textContent === title)) return;
  if(title != null) hd.textContent = title;
  ul.innerHTML = html;
  CARD_HTML = html;
  ul.classList.remove('flip');
  if(animate && !CARD_STILL){ void ul.offsetWidth; ul.classList.add('flip'); cardBusy(CARD_IN_MS, cardIdle); }
}
// a rotation passes over a panel with nothing to show (its list empty: not loaded yet or failed) instead of
// showing it blank; prayers, matches and verse always have rows or their own message
function cardHasData(P){
  if(P === 'forecast') return FORECAST.length > 0;
  if(P === 'standings') return STANDINGS.length > 0;
  if(isNewsPanel(P)) return (NEWS[P] || []).length > 0;   // news, local, world, tech
  if(P === 'hadith') return !!HADITH_DAY;
  return true;
}
// the index of the panel d steps on from i in list L (wrapping) that has data; i when none has
function rotNext(L, i, d){
  for(let n = 1; n < L.length; n++){
    const k = ((i + d*n) % L.length + L.length) % L.length;
    if(cardHasData(L[k])) return k;
  }
  return i;
}
// a rotation's switch to panel P
function swapPanel(P){
  const card = document.querySelector('.week');
  const show = () => {
    CONFIG.panel = P;
    LIST_PAGE = 0;
    CARD_PENDING = null;   // this paint is fresh: what waited during the fade-out is in it
    renderPanel(true, true);
    newsFlipArm();   // a news panel turns to its second page halfway through the slot
    if(card) card.classList.remove('out');
    if(CARD_BUSY_UNTIL && Date.now() >= CARD_BUSY_UNTIL) cardIdle();   // nothing to slide (reduced motion)
  };
  if(CARD_STILL || !card){ show(); return; }
  card.classList.add('out');
  cardBusy(CARD_OUT_MS, show);
}

// the rotation indicator under a rotating card: one dot per panel (RTL: the first on the right), the
// current one gold (rotMark), and a 2px line that fills from the right over CONFIG.rotateMs, started again at every
// switch (rotRestart) and stopped where it is while the launcher holds the rotation (rotFreeze). A CSS transition on
// transform: no script runs per frame. Hidden on a card with a single panel (rotInit is not called).
function rotInit(list){
  const el = document.getElementById('rot'), dots = document.getElementById('rot-dots');
  if(!el || !dots || list.length < 2) return;
  dots.innerHTML = list.map(() => '<b></b>').join('');
  el.hidden = false;
}
function rotMark(k){
  const dots = document.getElementById('rot-dots');
  if(dots) Array.from(dots.children).forEach((b, j) => b.classList.toggle('on', j === k));
}
function rotRestart(){
  const el = document.getElementById('rot'), f = document.getElementById('rot-fill');
  if(!el || !f || el.hidden) return;
  f.style.transition = 'none';
  f.style.transform = 'scaleX(0)';
  void f.offsetWidth;   // the empty line is applied before the new fill starts
  f.style.transition = 'transform ' + CONFIG.rotateMs + 'ms steps(' + Math.max(1, Math.round(CONFIG.rotateMs/1000)) + ', end)';   // one step per second
  f.style.transform = 'scaleX(1)';
}
function rotFreeze(){
  const f = document.getElementById('rot-fill');
  if(!f) return;
  const m = getComputedStyle(f).transform;   // where the running transition is now
  f.style.transition = 'none';
  f.style.transform = m && m !== 'none' ? m : 'scaleX(0)';
}

function renderPanel(animate, own){   // own = the rotation's own paint (paintCard)
  if(CONFIG.detail){ renderDetail(); return; }   // the full-screen page instead of the card
  const P = CONFIG.panel;
  let rows = [], title = null;
  if(P === 'prayers') rows = prayerRows();
  else if(P === 'forecast') rows = forecastRows();
  else if(P === 'matches') rows = matchRows();
  else if(P === 'standings') rows = standingRows();
  else if(isNewsPanel(P)) rows = newsRows(P, LIST_PAGE);   // one page of news (newsCardPages)
  else if(P === 'verse') rows = quoteOfDay().rows;
  else if(P === 'hadith') rows = hadithRows();
  if(PANEL_TITLE[P]) title = PANEL_TITLE[P];
  if(P === 'prayers' && placeNote()) title += ' · ' + placeNote();   // the city's prayer times, in its own time zone
  if(P === 'local') title = localTitle();   // «أخبار <city>»
  if(P === 'forecast' && CONFIG.city) title += ' · ' + CONFIG.city;   // whose weather it is
  if(!rows.length){
    paintCard(`<li class="empty">${P === 'matches' ? 'لا مباريات هذا الأسبوع' : 'لا تتوفر بيانات الآن'}</li>`, title, animate, own);
    return;
  }
  if(P === 'matches' && rows.length > WEEK_ROWS){        // page through
    const start = (LIST_PAGE * WEEK_ROWS) % rows.length;
    rows = Array.from({length: WEEK_ROWS}, (_, i) => rows[(start + i) % rows.length]);
  }
  paintCard(rows.join(''), title, animate, own);
}

function prayerRows(){
  if(!DAY_TIMES) return [];
  const p = placeParts(), now = p.h * 60 + p.mi;
  const names = {Fajr:'الفجر', Sunrise:'الشروق', Dhuhr:isFriday() ? 'الجمعة' : 'الظهر', Asr:'العصر', Maghrib:'المغرب', Isha:'العشاء'};
  let next = null;
  return Object.keys(names).filter(k => DAY_TIMES[k]).map(k => {
    const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number);
    const at = h * 60 + mi;
    let cls = at < now ? 'past' : '';
    if(at >= now && !next){ next = k; cls = 'next'; }
    return `<li class="${cls}"><span>${names[k]}</span><span class="dt">${fmt12(h, mi)}</span></li>`;
  });
}

function forecastRows(){
  return FORECAST.slice(0, 5).map((d, i) => {
    const day = i === 0 ? 'اليوم' : i === 1 ? 'غداً'
      : new Intl.DateTimeFormat(GREG, {timeZone:'UTC', weekday:'long'}).format(new Date(d.date + 'T12:00:00Z'));
    return `<li><span>${day}</span><span class="ep">${WX_CODES[d.code] || ''}</span>`
         + `<span class="dt">${ar(Math.round(d.hi))}° / ${ar(Math.round(d.lo))}°</span></li>`;
  });
}

// every followed team's games this week, plus results from the last day, in time order: [{ev, t (ms)}]
function matchEvents(now){
  const seen = new Set(), evs = [];
  CONFIG.teamIds.forEach(id => {
    const next = NEXT_LIST[id] || (MATCHES[id] ? [MATCHES[id]] : []);
    next.forEach(ev => { if(ev && ev.idEvent && !seen.has(ev.idEvent)){ seen.add(ev.idEvent); evs.push(MATCHES[id] && MATCHES[id].idEvent === ev.idEvent ? MATCHES[id] : ev); } });
    resultsFor(id).forEach(ev => { if(!seen.has(ev.idEvent)){ seen.add(ev.idEvent); evs.push(ev); } });
  });
  return evs.map(ev => ({ev, t: toDate(ev).getTime()}))
    .filter(x => finishedRecently(x.ev, now)
      || (now < x.t + 2.5*3600000 && !FINAL.includes((x.ev.strStatus || '').toUpperCase())
          && x.t - now <= CONFIG.weekWindowDays * 86400000))
    .sort((a, b) => a.t - b.t);
}
function matchRows(){
  const now = Date.now();
  const day = d => new Intl.DateTimeFormat(GREG, {timeZone:CONFIG.timezone, weekday:'long'}).format(d);
  const today = new Intl.DateTimeFormat('en-CA', {timeZone:CONFIG.timezone}).format(new Date());
  return matchEvents(now)
    .map(({ev, t}) => {
      const d = new Date(t), scored = ev.intHomeScore != null && ev.intAwayScore != null;
      const mid = scored && now >= t ? ` <span class="sc">${ar(+ev.intHomeScore)} - ${ar(+ev.intAwayScore)}</span> ` : ' × ';
      const p = new Intl.DateTimeFormat('en-GB', {timeZone:CONFIG.timezone, hour:'2-digit', minute:'2-digit', hour12:false})
        .formatToParts(d).reduce((a, x) => (a[x.type] = x.value, a), {});
      const when = finishedRecently(ev, now) ? 'انتهت'
        : now >= t ? '<span class="live">مباشر</span>'
        : (new Intl.DateTimeFormat('en-CA', {timeZone:CONFIG.timezone}).format(d) === today ? 'اليوم' : day(d))
          + ' ' + fmt12(+p.hour % 24, +p.minute);
      const bc = bcastOf(ev, now);   // its channel and commentator on a muted line under it, when known
      return `<li${bc ? ' class="bcl"' : ''}><span>${esc(teamAr(ev.strHomeTeam))}${mid}${esc(teamAr(ev.strAwayTeam))}</span><span class="dt">${when}</span>`
           + (bc ? `<span class="dt bc">${bcLine(bc)}</span>` : '') + '</li>';
    });
}

// ---- standings, news, local news and tech panels
// The table of the league picked in the settings (#league, «الدوري في الترتيب»): ESPN's (no key) for its slugs, e.g.
// ksa.1 (names "Al Hilal", "Al Qadsiah", "Neom SC"; TheSportsDB says "Al-Hilal"), or TheSportsDB's for a tsdb.<id>
// league ESPN does not carry (its free key gives the top 5). Saudi clubs in Arabic (STAND_AR, assets/shared/teams-ar.json),
// the others by the same table's names where it has them, else in English.
const espnStandingsUrl = league => 'https://site.api.espn.com/apis/v2/sports/soccer/' + league + '/standings';
const TSDB_API = 'https://www.thesportsdb.com/api/v1/json/123/';
const standKey = s => String(s || '').toLowerCase().normalize('NFD')   /* accents fall to the next step */
  .replace(/[^a-z0-9]+/g, '').replace(/^al/, '').replace(/(sc|fc|club)$/, '');
const STAND_AR = {};
for(const [en, a] of Object.entries(TEAM_AR)){ const k = standKey(en); if(k && !(k in STAND_AR)) STAND_AR[k] = a; }   // first entry wins
const standAr = name => STAND_AR[standKey(name)] || TEAM_KEYS[teamKey(name)] || name;
let STANDINGS = [];   // [{rank, name, gp, pts, espnId | tsdbId, …}] in table order: the card's league (CONFIG.league)
let KSA_TABLE = [];   // ESPN's Saudi Pro League table: the ESPN ids of the older builds' Saudi clubs (mapEspnTeams)

// ESPN's table: a league in groups (MLS's two conferences) shows the group of the first followed club, else the first
function standingsFrom(j){
  const groups = ((j && j.children) || []).map(c => (c && c.standings && c.standings.entries) || []).filter(g => g.length);
  if(!groups.length && j && j.standings && Array.isArray(j.standings.entries)) groups.push(j.standings.entries);
  const ids = followedEspnIds(), es = groups.find(g => g.some(e => e.team && ids.has(String(e.team.id)))) || groups[0] || [];
  return es.map(e => {
    const st = {};
    (e.stats || []).forEach(s => { if(s && s.name) st[s.name] = s; });
    const num = k => { const s = st[k]; if(!s) return NaN; return s.value != null ? +s.value : parseFloat(s.displayValue); };
    return {rank: num('rank'), name: (e.team && (e.team.displayName || e.team.name)) || '', gp: num('gamesPlayed'), pts: num('points'),
            espnId: e.team && e.team.id != null ? String(e.team.id) : '',   // espnId, for the team schedules
            // the detail page's full table
            w: num('wins'), d: num('ties'), l: num('losses'), gf: num('pointsFor'), ga: num('pointsAgainst'), gd: num('pointDifferential')};
  }).filter(x => x.name && Number.isFinite(x.rank)).sort((a, b) => a.rank - b.rank);
}
// TheSportsDB's table (lookuptable.php) in the same shape
function tsdbStandingsFrom(j){
  return ((j && j.table) || []).map(t => {
    const n = k => { const v = parseFloat(t[k]); return Number.isFinite(v) ? v : NaN; };
    return {rank: n('intRank'), name: String(t.strTeam || ''), gp: n('intPlayed'), pts: n('intPoints'), tsdbId: String(t.idTeam || ''),
            w: n('intWin'), d: n('intDraw'), l: n('intLoss'), gf: n('intGoalsFor'), ga: n('intGoalsAgainst'), gd: n('intGoalDifference')};
  }).filter(x => x.name && Number.isFinite(x.rank)).sort((a, b) => a.rank - b.rank);
}
// a TheSportsDB league's table: its current season (lookupleague.php, kept a day), else the one before
async function tsdbTable(id){
  const key = 'sauditv-season:' + id;
  let season = '';
  try{ const c = JSON.parse(localStorage.getItem(key) || 'null'); if(c && Date.now() - c.at < 86400000) season = c.season; }catch(e){}
  if(!season){
    const r = await fetchT(TSDB_API + 'lookupleague.php?id=' + id, 15000);
    if(!r.ok) throw 0;
    season = String((((await r.json()).leagues || [])[0] || {}).strCurrentSeason || '');
    if(season) try{ localStorage.setItem(key, JSON.stringify({season, at: Date.now()})); }catch(e){}
  }
  const seasons = [season];
  const m = /^(\d{4})-(\d{4})$/.exec(season);
  seasons.push(m ? (m[1] - 1) + '-' + (m[2] - 1) : /^\d{4}$/.test(season) ? String(season - 1) : '');
  for(const s of seasons.filter(Boolean)){
    const r = await fetchT(TSDB_API + 'lookuptable.php?l=' + id + '&s=' + encodeURIComponent(s), 15000);
    if(!r.ok) throw 0;
    const rows = tsdbStandingsFrom(await r.json());
    if(rows.length) return rows;
  }
  return [];
}

// one request at a time; loadMatches waits for the Saudi table too (the ESPN ids of the older builds' clubs)
let STAND_P = null;
function loadStandings(){
  // resolves to true when the table came (see firstLoad)
  if(!STAND_P){ STAND_P = loadStandingsNow().then(ok => { STAND_P = null; return ok; }, () => { STAND_P = null; return false; }); }
  return STAND_P;
}
async function loadStandingsNow(){
  let rows;
  try{
    const t = /^tsdb\.(\d+)$/.exec(CONFIG.league);
    if(t) rows = await tsdbTable(t[1]);
    else {
      const r = await fetchT(espnStandingsUrl(CONFIG.league), 15000);
      if(!r.ok) throw 0;
      rows = standingsFrom(await r.json());
      if(CONFIG.league === 'ksa.1' && rows.length) KSA_TABLE = rows;   // the same table: one request
    }
    if(rows.length) STANDINGS = rows;               // keep the last good table on a failed refresh
  }catch(e){ return false; }
  if(CONFIG.panel === 'standings') renderPanel(false);
  return rows.length > 0;
}
// ESPN's Saudi table for the older builds' Saudi clubs (the card's own when it shows Roshn)
let KSA_P = null;
function loadKsaTable(){
  if(CONFIG.league === 'ksa.1') return loadStandings();
  if(!KSA_P) KSA_P = fetchT(espnStandingsUrl('ksa.1'), 15000).then(r => r.ok ? r.json() : null).then(j => {
    const rows = j ? standingsFrom(j) : [];
    if(rows.length) KSA_TABLE = rows;
    KSA_P = null;
    return rows.length > 0;
  }, () => { KSA_P = null; return false; });
  return KSA_P;
}

// the ESPN ids of the followed teams: the settings' picks and the older builds' Saudi clubs (mapEspnTeams)
function followedEspnIds(){
  const out = new Set();
  CONFIG.teamIds.forEach(id => { const e = espnOf(id); if(e) out.add(e.espn); });
  Object.values(ESPN_TEAMS).forEach(t => { if(t && t.espn) out.add(String(t.espn)); });
  return out;
}
// English names of the followed teams, from whatever match data is loaded
function followedKeys(){
  const ids = new Set(CONFIG.teamIds.map(String).concat(CONFIG.teamIds.map(tsdbOf))), out = new Set();
  const add = ev => {
    if(!ev) return;
    if(ids.has(String(ev.idHomeTeam)) && ev.strHomeTeam) out.add(standKey(ev.strHomeTeam));
    if(ids.has(String(ev.idAwayTeam)) && ev.strAwayTeam) out.add(standKey(ev.strAwayTeam));
  };
  [MATCHES, KEPT].forEach(o => Object.values(o).forEach(v => (Array.isArray(v) ? v : [v]).forEach(add)));
  [NEXT_LIST, RESULTS].forEach(o => Object.values(o).forEach(l => (l || []).forEach(add)));
  Object.values(ESPN_TEAMS).forEach(t => out.add(standKey(t.name)));   // ESPN clubs by their table name
  out.delete('');
  return out;
}
// is table row x a followed team: by its ESPN or TheSportsDB id, else by its name
function standFollowed(){
  const keys = followedKeys(), espn = followedEspnIds(), tsdb = new Set(CONFIG.teamIds.filter(id => !espnOf(id)).map(tsdbOf));
  return x => (x.espnId && espn.has(x.espnId)) || (x.tsdbId && tsdb.has(x.tsdbId)) || keys.has(standKey(x.name));
}

// the top of the table, but every followed team stays visible: they replace the lowest other rows
function pickStandings(list, isFollowed, n){
  const fol = list.filter(isFollowed).slice(0, n);
  const others = list.filter(x => !isFollowed(x)).slice(0, n - fol.length);
  return list.filter(x => fol.includes(x) || others.includes(x));
}

function standingRows(){
  const isF = standFollowed();
  const n0 = v => ar(Number.isFinite(v) ? Math.round(v) : 0);
  return pickStandings(STANDINGS, isF, WEEK_ROWS).map(x =>
    `<li class="${isF(x) ? 'next' : ''}"><span>${n0(x.rank)}. ${esc(standAr(x.name))}</span>`
    + `<span class="ep">${n0(x.gp)} مباراة</span><span class="dt">${n0(x.pts)} نقطة</span></li>`);
}
