// (NEWS_SOURCES.news), an Arab country's outlets then Google News and Bing (off), or only those two (on)
function countryNews(cc, name, lang, en){
  if(cc === 'SA') return NEWS_SOURCES.news;
  const own = (COUNTRY_NEWS[cc] || []).map(x => Object.assign({cc}, x));   // cc: Bing's market (loadNewsFeed)
  return own.concat([
    {id: 'google', name: null, url: googleNews(cc, name, lang), on: !own.length},
    {id: 'bing', name: null, bing: bingNews(cc, name, lang, en), on: !own.length},
  ]);
}
// the sources page P reads: the ones picked in the settings, else its defaults
function newsSources(P){
  const all = P === 'news' ? countryNews(CONFIG.newsCC, CONFIG.newsName, CONFIG.newsLang, CONFIG.newsEn) : NEWS_SOURCES[P] || [];
  const want = (CONFIG.sources && CONFIG.sources[P]) || [];
  const picked = all.filter(x => want.includes(x.id));
  return picked.length ? picked : all.filter(x => x.on);
}
const NEWS = {news: [], tech: [], local: [], world: []};   // [{headline, source, t}] newest first
// the panels drawn as news items: Saudi news, the city's news (loadLocalNews), the world's news and tech
const isNewsPanel = P => P === 'news' || P === 'local' || P === 'tech' || P === 'world';

// "headline - Source": the source is after the last " - ", unless the item's <source> (which can itself
// contain " - ", e.g. "ارقام : ... - تاسي") is what the title ends with
function splitNewsTitle(title, fallbackSource){
  const s = String(title || '').trim(), src = String(fallbackSource || '').trim();
  if(src && s.endsWith(' - ' + src) && s.length > src.length + 3)
    return {headline: s.slice(0, s.length - src.length - 3).trim(), source: src};
  const i = s.lastIndexOf(' - ');
  return i > 0 ? {headline: s.slice(0, i).trim(), source: s.slice(i + 3).trim()}
               : {headline: s, source: String(fallbackSource || '').trim()};
}

function agoAr(ms){
  if(!Number.isFinite(ms) || ms < 60000) return 'الآن';
  const m = Math.floor(ms / 60000);
  if(m < 60) return `قبل ${ar(m)} د`;
  const h = Math.floor(m / 60);
  if(h < 24) return `قبل ${ar(h)} س`;
  const d = Math.floor(h / 24);
  return d === 1 ? 'أمس' : d === 2 ? 'قبل يومين' : d <= 10 ? `قبل ${ar(d)} أيام` : `قبل ${ar(d)} يوماً`;
}

// a title may carry HTML tags / entities (e.g. "&lt;b&gt;" or "&amp;quot;" in the XML)
function plainText(s){
  s = String(s || '');
  if(/[<&]/.test(s)) s = new DOMParser().parseFromString(s, 'text/html').body.textContent || '';
  return s.replace(/\s+/g, ' ').trim();
}

// items: [{title, pubDate, source}] as read from the feed
// feed.name: the publisher label (titles are bare headlines), or null for Google style. A Google search standing in
// for a site (feed.site) writes "headline - Site" too: split like Google's, then labelled with the site's name.
function newsFrom(items, feed){
  const label = feed.name, google = !label || feed.site;
  return items.map(it => {
    const x = google ? splitNewsTitle(plainText(it.title), plainText(it.source)) : {headline: plainText(it.title), source: label};
    if(label) x.source = label;
    return Object.assign(x, {t: Date.parse(it.pubDate || ''), link: String(it.link || '').trim(), desc: it.description || ''});
  })
    .filter(x => x.headline)
    .sort((a, b) => (Number.isFinite(b.t) ? b.t : -Infinity) - (Number.isFinite(a.t) ? a.t : -Infinity))
    // the newest NEWS_POOL (the card shows NEWS_KEEP of them, NEWS_ROWS at a time: newsCardPages); the detail page keeps
    // NEWS_DETAIL_KEEP, each with its summary
    .slice(0, CONFIG.detail ? NEWS_DETAIL_KEEP : NEWS_POOL)
    .map(x => { const desc = x.desc; delete x.desc; if(CONFIG.detail || NXH) x.summary = newsSummary(x, desc); return x; });
}
// the item's <description> as plain text. Google's repeats the headline and the source only: no summary.
function newsSummary(x, desc){
  let s = plainText(desc);
  if(s && s.startsWith(x.headline)){
    const rest = s.slice(x.headline.length).trim();
    s = !rest || rest === x.source || rest.length < 40 ? '' : rest;
  }
  return s;
}

// a news panel shows NEWS_ROWS items per page (three two-line items stay within the height of the six
// prayer rows on the screensaver and on the home card) and up to NEWS_KEEP in all. In a rotation it shows page 1,
// then page 2 halfway through its slot (newsFlipArm); a single news card turns its page every NEWS_PAGE_MS.
// A card page holds at most NEWS_PER_SOURCE items of one source (newsCardPages), so one busy source can't fill
// the card: the newest of the others take the other rows (the list keeps NEWS_POOL to find them). The detail page's
// list is not held to it.
const NEWS_ROWS = 3, NEWS_KEEP = 6, NEWS_PAGE_MS = 15000, NEWS_PER_SOURCE = 2, NEWS_POOL = 12;
const NEWS_DETAIL_KEEP = 15;   // the detail page's list
let NEWS_VISIT = 0;   // counts the rotation's switches: a flip armed for one visit never runs in another
// the card's pages of a news list (newest first): NEWS_ROWS items each, at most NEWS_PER_SOURCE of a source on a page;
// an item left out of a page waits for the next one
function newsCardPages(list){
  const rest = (list || []).slice(), pages = [];
  for(let p = 0; p < Math.ceil(NEWS_KEEP / NEWS_ROWS) && rest.length; p++){
    const page = [], per = {};
    for(let i = 0; i < rest.length && page.length < NEWS_ROWS; ){
      const s = String(rest[i].source || '').trim();
      if((per[s] || 0) < NEWS_PER_SOURCE){ per[s] = (per[s] || 0) + 1; page.push(rest.splice(i, 1)[0]); }
      else i++;
    }
    if(!page.length) break;
    pages.push(page);
  }
  return pages;
}
function newsPaged(P){ return isNewsPanel(P) && newsCardPages(NEWS[P]).length > 1; }
function newsFlipArm(){
  const P = CONFIG.panel, visit = ++NEWS_VISIT;
  if(!isNewsPanel(P)) return;   // paged or not is decided at the flip: the list may arrive meanwhile
  setTimeout(() => {
    if(visit !== NEWS_VISIT || CONFIG.panel !== P || !newsPaged(P) || LIST_PAGE !== 0) return;
    LIST_PAGE = 1;
    renderPanel(true);   // waits in paintCard while a slide-in still runs (CARD_BUSY_UNTIL)
  }, CONFIG.rotateMs / 2);
}

function newsRow(x, now, kind){
  const ago = Number.isFinite(x.t) ? agoAr(now - x.t) : '';
  const dt = [newsSource(kind, x.source), ago].filter(Boolean).join(' · ');
  return `<li class="news-item"><span class="nw"${bidiAttr(kind, x.headline)}>${esc(x.headline)}</span><span class="dt">${dt}</span></li>`;   // class
}

// the card's page `page` (wrapping) of a news list (newsCardPages)
function newsRows(kind, page){
  const now = Date.now(), pages = newsCardPages(NEWS[kind]);
  return pages.length ? pages[(page || 0) % pages.length].map(x => newsRow(x, now, kind)) : [];
}

// one feed -> its items as read ([{title, pubDate, source, link, description}]), null when the answer is not an RSS
// document with items (e.g. an HTML consent or block page). site: only Google's items from that host (<source url>).
async function readFeed(feed, withDesc){
  try{
    const r = await fetchT(feed.url, 15000);
    if(!r.ok) return null;
    const text = await r.text();
    if(!/<item[\s>]/.test(text)) return null;
    const doc = new DOMParser().parseFromString(text, 'text/xml');
    if(doc.getElementsByTagName('parsererror').length) return null;
    const txt = (el, tag) => { const n = el.getElementsByTagName(tag)[0]; return n ? n.textContent : ''; };
    const host = u => { try{ return new URL(u).hostname; }catch(e){ return ''; } };
    const items = [];
    for(const it of Array.from(doc.getElementsByTagName('item'))){
      const src = it.getElementsByTagName('source')[0];
      if(feed.site){ const h = host(src && src.getAttribute('url')); if(h !== feed.site && !h.endsWith('.' + feed.site)) continue; }
      items.push({title: txt(it, 'title'), pubDate: txt(it, 'pubDate'), source: src ? src.textContent : '',
                  link: txt(it, 'link'), description: CONFIG.detail || NXH || withDesc ? txt(it, 'description') : ''});
    }
    return items;
  }catch(e){ return null; }
}
// Bing's news ([{headline, source, t, link, desc}], localFeed) as a news page's items: newest first, its summaries
function bingItems(list){
  return list.filter(x => x.headline)
    .sort((a, b) => (Number.isFinite(b.t) ? b.t : -Infinity) - (Number.isFinite(a.t) ? a.t : -Infinity))
    .slice(0, CONFIG.detail ? NEWS_DETAIL_KEEP : NEWS_POOL)
    .map(x => { const desc = x.desc; delete x.desc; if(CONFIG.detail || NXH) x.summary = desc ? newsSummary(x, desc) : ''; return x; });
}
// one source of a news page -> its newest stories ([] when it did not answer, or too few matched its filter).
// fallback (the country news): an outlet whose own feed or Google search gave nothing (Google News answers the TVs'
// VPN with HTTP 403) is searched on Bing News instead (site:<its domain>, the country's market), kept to its own links
async function loadNewsFeed(feed, fallback){
  if(feed.bing){   // Bing's news: its RSS, or its page of cards (what it gives the TV's WebView: localFeed)
    try{ return bingItems(await localFeed('bing', feed.bing)); }catch(e){ return []; }
  }
  const all = await readFeed(feed);
  // with a filter, only the matching items are read further (a 300-item feed keeps a few dozen)
  const items = !all ? [] : feed.filter ? all.filter(it => feed.filter.test(plainText(it.title))) : all;
  if(items.length >= (feed.min || 1)){ feed.via = 'feed'; return newsFrom(items, feed); }
  const site = feed.bingSite || feed.site;
  if(!fallback || !site || /\//.test(site)) return [];
  const gl = /[?&]gl=([A-Z]{2})\b/.exec(feed.url || ''), mkt = feed.cc || (gl ? gl[1] : 'SA');
  const host = u => { try{ return new URL(u).hostname; }catch(e){ return ''; } };
  try{
    const got = (await localFeed('bing', `https://www.bing.com/news/search?q=${encodeURIComponent('site:' + site)}&format=rss&mkt=ar-${mkt}`))
      // its own links, its Arabic stories (a site's English edition, e.g. english.ahram.org.eg, is left out)
      .filter(x => { const h = host(x.link); return (h === site || h.endsWith('.' + site)) && AR_RE.test(x.headline)
        && (!feed.filter || feed.filter.test(x.headline)); });
    if(got.length) feed.via = 'bing';   // (#feedtest)
    return bingItems(got.map(x => Object.assign(x, {source: feed.name || x.source})));
  }catch(e){ return []; }
}

// #feedtest=1 (tests only, the preview from ADB): every source of every Arab country's news, once, four at a time,
// each in the TV's log: «SaudiTV feedtest EG ahram 12 items, newest 2 h» or «… none»; then «SaudiTV feedtest done»
const FEEDTEST_NAMES = {SA: 'السعودية', EG: 'مصر', AE: 'الإمارات', KW: 'الكويت', QA: 'قطر', BH: 'البحرين', OM: 'عمان',
  JO: 'الأردن', IQ: 'العراق', LB: 'لبنان', SY: 'سوريا', PS: 'فلسطين', YE: 'اليمن', SD: 'السودان', LY: 'ليبيا', TN: 'تونس',
  DZ: 'الجزائر', MA: 'المغرب'};
async function feedTest(){
  const jobs = [];
  Object.keys(FEEDTEST_NAMES).forEach(cc => countryNews(cc, FEEDTEST_NAMES[cc], 'ar', '').forEach(f => jobs.push([cc, f])));
  // what a source that gave nothing answered: its HTTP status, where it ended up, its title (a block or consent page)
  const why = async f => {
    try{
      const r = await fetchT(f.url || f.bing, 15000), text = await r.text();
      let at = ''; try{ const u = new URL(r.url); at = u.host + u.pathname.slice(0, 30); }catch(e){}
      const t = /<title[^>]*>([^<]{0,50})/i.exec(text);
      return ` (HTTP ${r.status} ${at}${t ? ' "' + t[1].trim() + '"' : ''}, ${(text.match(/<item[\s>]/g) || []).length} items)`;
    }catch(e){ return ' (' + (e && e.message || e) + ')'; }
  };
  const run = async ([cc, f]) => {
    f.via = '';
    const items = await loadNewsFeed(f, true).catch(() => []);
    const newest = items.reduce((m, x) => Number.isFinite(x.t) ? Math.max(m, x.t) : m, -Infinity);
    console.warn(`SaudiTV feedtest ${cc} ${f.id} ` + (items.length ? items.length + ' items' + (f.via ? ' (' + f.via + ')' : '') + ', newest '
      + (Number.isFinite(newest) ? Math.round((Date.now() - newest) / 36e5) + ' h' : '?') : 'none' + await why(f)));
  };
  // Google News one at a time, 3 s apart (a burst of searches is answered «unusual traffic»); the others four at a time
  const google = jobs.filter(([, f]) => /news\.google\.com/.test(f.url || '')), rest = jobs.filter(j => !google.includes(j));
  let k = 0;
  await Promise.all(Array.from({length: 4}, async () => { while(k < rest.length) await run(rest[k++]); }).concat([(async () => {
    for(const j of google){ await run(j); await new Promise(r => setTimeout(r, 3000)); }
  })()]));
  console.warn('SaudiTV feedtest done ' + jobs.length);
}

// a news page: every picked source at once (newsSources), each story once (the same headline or link), newest first
let NEWS_LOG = {};
async function loadNews(kind){
  const feeds = newsSources(kind);
  const got = await Promise.all(feeds.map(f => loadNewsFeed(f, kind === 'news')));   // the country news: Bing stands in
  const list = got.reduce((a, b) => newsMerge(a, b), []).slice(0, CONFIG.detail ? NEWS_DETAIL_KEEP : NEWS_POOL);
  // which sources answered, in the TV's log when that changes (a VPN exit can block one)
  const how = feeds.map((f, i) => f.id + (got[i].length ? '' : ' (none)')).join(', ');
  if(how !== NEWS_LOG[kind]){ NEWS_LOG[kind] = how; console.warn('SaudiTV: ' + kind + ' news from ' + how); }
  if(!list.length) return false;                      // keep the last good list on a failed refresh
  NEWS[kind] = list;
  if(CONFIG.panel === kind) renderPanel(false);
  return true;   // answered (see firstLoad)
}

// ---- local news: the city the TV is set to (#city, #lat, #lon)
// The place's English name, county and region come from a reverse geocoder (no key: BigDataCloud, then Nominatim,
// then Photon), asked once per lat/lon and kept in localStorage. A Saudi or other Arab city is searched in Arabic by
// the name the settings hold (#city), anywhere else in English. Each search, through the picked sources (localSearch):
// Google News RSS (the country's edition, the last 3 days) and Bing News RSS (Google answers some VPN exits with HTTP
// 403 or a consent page; Bing gives the TV's WebView its news page, read as cards: bingCards), and for an Arabic search
// the local sections of Okaz and Al-Watan, kept to the items that name the place. Still fewer
// for the city: the county (US) or the region too, e.g. «منطقة القصيم» for الرس. Kept: items that name the city (or
// that area), at most LOCAL_DAYS old, each story once, newest first. Titles stay in their language; one without
// Arabic letters gets dir="auto" (bidiAttr).
const AR_RE = /[\u0600-\u06FF]/;
const ARAB_CC = ['SA','AE','KW','QA','BH','OM','YE','IQ','JO','SY','LB','PS','EG','SD','LY','TN','DZ','MA','MR'];
const GN_EN = ['GB','CA','AU','IN','IE','NZ','ZA','SG','PH','PK','NG','KE','MY'];   // Google News editions in English
const LOCAL_FEW = 3, LOCAL_DAYS = 3;
// listings, not news: school sports schedules, obituaries, property, weather and directory pages
const LOCAL_JUNK = /^(MaxPreps|NFHS Network|Dignity Memorial|Legacy\.com|Realtor\.com|Zillow|Redfin|Trulia|Apartments\.com|IQAir|AccuWeather|Weather Underground|Psychology Today|Yelp|Tripadvisor)\b/i;
const localTitle = () => 'أخبار ' + CONFIG.city;
// an English title, source or summary of the city's news reads left to right; the other panels are unchanged
const bidiAttr = (P, s) => P === 'local' && s && !AR_RE.test(s) ? ' dir="auto"' : '';
const newsSource = (P, s) => !s ? '' : P === 'local' ? `<bdi>${esc(s)}</bdi>` : esc(s);   // bdi: not a span (.week li span rules)

async function fetchJson(url){
  const r = await fetchT(url, 12000);
  if(!r.ok) throw 'HTTP ' + r.status;
  return r.json();
}
// each -> {name, county, region, cc} in English; county: the area between the region and the city, if any
const GEO_AT = () => `lat=${CONFIG.latitude}&lon=${CONFIG.longitude}`;
const BDC = lang => `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}&localityLanguage=${lang}`;
const GEOCODERS = [
  ['bigdatacloud', async () => {
    const j = await fetchJson(BDC('en'));
    const adm = (j.localityInfo && j.localityInfo.administrative) || [];
    // "city" can be a bigger neighbour (a town comes back as its neighbour in city, itself in locality): the
    // locality, when it is a place of its own in the administrative list
    const name = j.locality && adm.some(a => a.name === j.locality) ? j.locality : (j.city || j.locality || '');
    const county = adm.filter(a => a.adminLevel >= 5 && a.adminLevel <= 7 && a.name !== name && a.name !== j.principalSubdivision).pop();
    return {name, county: county ? county.name : '', region: j.principalSubdivision || '', cc: j.countryCode || ''};
  }],
  // the WebView's own User-Agent (a page cannot set one); asked only when BigDataCloud failed, once per place
  ['nominatim', async () => {
    const j = await fetchJson(`https://nominatim.openstreetmap.org/reverse?${GEO_AT()}&format=jsonv2&zoom=10&accept-language=en`);
    const a = j.address || {};
    return {name: a.city || a.town || a.village || a.municipality || a.hamlet || '', county: a.county || a.state_district || '',
            region: a.state || a.region || '', cc: String(a.country_code || '').toUpperCase()};
  }],
  ['photon', async () => {
    const f = ((await fetchJson(`https://photon.komoot.io/reverse?${GEO_AT()}&lang=en`)).features || [])[0];
    const q = (f && f.properties) || {};
    return {name: q.city || q.town || q.village || '', county: q.county || '', region: q.state || '', cc: String(q.countrycode || '').toUpperCase()};
  }],
];
let LOCAL_PLACE = null;
async function localPlace(){
  if(LOCAL_PLACE) return LOCAL_PLACE;
  const key = 'sauditv-place:' + CONFIG.latitude + ',' + CONFIG.longitude;
  try{ const c = JSON.parse(localStorage.getItem(key) || 'null'); if(c && c.name) return LOCAL_PLACE = c; }catch(e){}
  for(const [label, ask] of GEOCODERS){
    let p = null;
    try{ p = await ask(); }catch(e){ console.warn('SaudiTV: local news: no place from ' + label + ' (' + e + ')'); }
    if(!p || !p.name) continue;
    // an Arab country: the region's Arabic name too, for the wider search (kept only once it is known)
    if(ARAB_CC.includes(p.cc)){
      try{ p.regionAr = (await fetchJson(BDC('ar'))).principalSubdivision || ''; }
      catch(e){
        try{ p.regionAr = ((await fetchJson(`https://nominatim.openstreetmap.org/reverse?${GEO_AT()}&format=jsonv2&zoom=10&accept-language=ar`)).address || {}).state || ''; }
        catch(e2){ console.warn('SaudiTV: local news: no Arabic region name (' + e + '; ' + e2 + ')'); return p; }
      }
    }
    try{ localStorage.setItem(key, JSON.stringify(p)); }catch(e){}
    return LOCAL_PLACE = p;
  }
  return null;
}

// the searches for place p (null: the geocoders did not answer): the city, then the wider area.
// [{what, q, ed, mkt, terms}]: q the search, ed Google's edition, mkt Bing's market (else the VPN exit's, e.g.
// en-GB, which matched «جريدة الرياض» rather than Riyadh), terms the names an item must contain one of
function localSearches(p){
  const cc = (p && p.cc) || CONFIG.country;
  const arabic = AR_RE.test(CONFIG.city) && (!cc || ARAB_CC.includes(cc));
  if(!arabic && !(p && p.name)) return [];
  // an Arabic search in the city's own country's edition and market (Saudi Arabia's when it is unknown)
  const acc = arabic && ARAB_CC.includes(cc) ? cc : 'SA';
  const ed = arabic ? `hl=ar&gl=${acc}&ceid=${acc}:ar` : GN_EN.includes(cc) ? `hl=en-${cc}&gl=${cc}&ceid=${cc}:en` : 'hl=en-US&gl=US&ceid=US:en';
  const mkt = arabic ? 'ar-' + acc : GN_EN.includes(cc) ? 'en-' + cc : 'en-US';
  const name = arabic ? CONFIG.city : p.name;
  // saudi: the local sections of the Saudi papers are read for a Saudi city only
  const saudi = arabic && acc === 'SA';
  const out = [{what: 'city', q: arabic ? `"${name}"` : `"${name}" ${p.region || ''}`.trim(), ed, mkt, terms: [name], arabic, saudi}];
  const area = arabic ? (p && p.regionAr) : (p.county || p.region);
  // the area's own name without its kind, as headlines write it ("Orange County" -> "Orange", «أمطار القصيم»)
  const core = String(area || '').replace(/\s+(County|Parish|Borough|District|Governorate|Province|Region)$/i, '')
    .replace(/^(منطقة|محافظة|إمارة|ولاية)\s+/, '').trim();
  if(core && core !== name)
    out.push({what: 'area', q: `"${area}"` + (cc === 'US' && p.county && p.region ? ' ' + p.region : ''), ed, mkt, terms: [name, core], arabic, saudi});
  return out;
}

// does the text name the place? English: the whole word, as written ("Reading", not "reading");
// Arabic: also joined to a prefix (بالرياض، والرياض) and after لـ, which drops the alif (للرياض)
function namesPlace(text, term){
  if(!term || !text) return false;
  if(AR_RE.test(term)) return text.includes(term) || (term.startsWith('ال') && text.includes('لل' + term.slice(2)));
  return new RegExp('(^|[^A-Za-z])' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![A-Za-z])').test(text);
}

// Bing's link to an item goes through its redirect (apiclick.aspx?...&url=<the article>): the article itself
function unBing(link){
  try{ const u = new URL(link); if(/(^|\.)bing\.com$/.test(u.hostname) && /^https?:/.test(u.searchParams.get('url') || '')) return u.searchParams.get('url'); }catch(e){}
  return link;
}
// Bing answers a phone's browser (the TV's WebView says "Mobile") with its news page instead of RSS: the first
// results as cards, each with url, data-title, data-author and an age (en "45m" "3h" "2d", ar «12 من الساعات»)
function bingAge(s, now){
  s = String(s || '').trim().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  const n = parseInt(s, 10);
  if(!(n >= 0)) return NaN;
  const ms = /^\d+\s*m(in)?$/i.test(s) || /دقي|دقائق/.test(s) ? 6e4 : /^\d+\s*h$/i.test(s) || /ساع/.test(s) ? 36e5
           : /^\d+\s*d$/i.test(s) || /يوم|أيام/.test(s) ? 864e5 : NaN;   // months, years: left out
  return now - n * ms;
}
function bingCards(text){
  const doc = new DOMParser().parseFromString(text, 'text/html'), now = Date.now();
  return Array.from(doc.querySelectorAll('[data-title][url]')).map(c => ({
    headline: plainText(c.getAttribute('data-title')), source: plainText(c.getAttribute('data-author')),
    t: bingAge((c.querySelector('.timestamp') || {}).textContent, now), link: unBing(String(c.getAttribute('url') || '').trim()), desc: ''}));
}
// what came back instead of RSS, for the log: where it ended up and its title (a consent page, a block page)
function notRss(r, text){
  let at = '';
  try{ const u = new URL(r.url); at = u.host + u.pathname; }catch(e){}
  const t = /<title[^>]*>([^<]{0,60})/i.exec(text);
  return 'not RSS: ' + at + (t ? ' "' + t[1].trim() + '"' : '');
}

// one RSS search -> [{headline, source, t, link, desc}]; throws when nothing usable answered (e.g. a consent page)
async function localFeed(kind, url){
  const r = await fetchT(url, 15000);
  if(!r.ok) throw 'HTTP ' + r.status;
  const text = await r.text();
  if(!/<item[\s>]/.test(text)){
    if(/<rss[\s>]/.test(text)) return [];   // no results
    const cards = kind === 'bing' ? bingCards(text) : [];
    if(cards.length) return cards;
    throw notRss(r, text);   // e.g. a consent page
  }
  const doc = new DOMParser().parseFromString(text, 'text/xml');
  if(doc.getElementsByTagName('parsererror').length) throw 'bad XML';
  const txt = (el, tag) => { const n = el.getElementsByTagName(tag)[0]; return n ? n.textContent : ''; };
  return Array.from(doc.getElementsByTagName('item')).map(it => {
    const title = plainText(txt(it, 'title')), t = Date.parse(txt(it, 'pubDate') || '');
    let link = txt(it, 'link').trim();
    if(kind === 'google'){   // "headline - Source"; the description is only links to the same story: no summary
      const s = splitNewsTitle(title, plainText(txt(it, 'source')));
      return {headline: s.headline, source: s.source, t, link, desc: ''};
    }
    // Bing: the publisher in <News:Source>, a summary in <description>, the link through Bing's redirect
    const src = plainText(txt(it, 'News:Source'));
    link = unBing(link);
    return {headline: src && title.endsWith(' - ' + src) ? title.slice(0, -src.length - 3).trim() : title, source: src, t, link,
            desc: plainText(txt(it, 'description'))};
  });
}

const newsKey = x => x.headline.toLowerCase().replace(/[\s"'“”‘’«».,:;!?()|\-–—]+/g, '');
// a and b together: newest first (an item without a date last), each story once (same headline, or same link: the
// newest copy stays)
function newsMerge(a, b){
  const seen = new Set(), t = x => Number.isFinite(x.t) ? x.t : -Infinity;
  return a.concat(b).sort((x, y) => t(y) - t(x)).filter(x => {
    const k = newsKey(x);
    if(seen.has(k) || (x.link && seen.has(x.link))) return false;
    seen.add(k); if(x.link) seen.add(x.link);
    return true;
  });
}

// a search s through the picked sources of the city's news (newsSources('local')), all at once: Google and Bing search
// for it; a Saudi paper's local section (an Arabic search only) is read once per refresh (papers) and kept to the
// items that name the place. Resolves to {items, answered, used}
async function localSearch(s, papers){
  const since = Date.now() - LOCAL_DAYS * 86400000;
  const keep = x => x.headline && Number.isFinite(x.t) && x.t >= since && x.t <= Date.now() + 3600000
    && !LOCAL_JUNK.test(x.source || '') && !/\bobituary\b/i.test(x.headline)
    && s.terms.some(n => namesPlace(x.headline, n) || namesPlace(x.desc, n));
  const URLS = {
    google: `https://news.google.com/rss/search?q=${encodeURIComponent(s.q + ' when:' + LOCAL_DAYS + 'd')}&${s.ed}`,
    bing: `https://www.bing.com/news/search?q=${encodeURIComponent(s.q)}&format=rss&qft=${encodeURIComponent('interval="8"')}&mkt=${s.mkt}`,   // the past week
  };
  const feeds = newsSources('local').filter(f => f.search ? URLS[f.search] : s.saudi);
  let items = [], answered = false;
  const used = [];
  await Promise.all(feeds.map(async f => {
    try{
      const all = f.search ? await localFeed(f.search, URLS[f.search]) : await paperItems(f, papers);
      const got = all.filter(keep);
      answered = true;
      if(got.length){ used.push(f.id + ' (' + s.what + ')'); items = newsMerge(items, got); }
    }catch(e){ console.warn('SaudiTV: local news: ' + f.id + ' failed for the ' + s.what + ' (' + e + ')'); }
  }));
  return {items, answered, used};
}
// a paper's feed, read once per refresh (papers: id -> promise), as [{headline, source, t, link, desc}]
function paperItems(f, papers){
  if(!papers[f.id]) papers[f.id] = readFeed(f, true).then(all => {
    if(!all) throw 'not RSS';
    return all.map(it => ({headline: plainText(it.title), source: f.name, t: Date.parse(it.pubDate || ''),
                           link: String(it.link || '').trim(), desc: plainText(it.description)}));
  });
  return papers[f.id];
}

// resolves to false when nothing answered (see firstLoad), or nothing was found while the place is still unknown
// (the geocoders are asked again); an answer with no recent item empties the card (cardHasData then passes over it)
let LOCAL_LOG = '';
async function loadLocalNews(){
  const place = await localPlace(), searches = localSearches(place), papers = {};
  let items = [], answered = false;
  const used = [];
  for(const s of searches){   // the city; the wider area only while there are fewer than LOCAL_FEW
    const r = await localSearch(s, papers);
    answered = answered || r.answered;
    items = newsMerge(items, r.items);
    used.push(...r.used);
    if(items.length >= LOCAL_FEW) break;
  }
  if(!answered || (!place && !items.length)) return false;   // keep the last good list
  // which sources served it, in the TV's log when that changes (a VPN exit can block one)
  const how = used.join(', ') || 'none';
  if(how !== LOCAL_LOG){ LOCAL_LOG = how; console.warn('SaudiTV: local news from ' + how + ': ' + items.length + ' items'); }
  NEWS.local = items.slice(0, CONFIG.detail ? NEWS_DETAIL_KEEP : NEWS_POOL).map(x => {
    const desc = x.desc; delete x.desc;
    if(CONFIG.detail || NXH) x.summary = desc ? newsSummary(x, desc) : '';
    return x;
  });
  if(CONFIG.panel === 'local') renderPanel(false);
  return true;
}

// a loader's first run that got no answer tries again soon, instead of leaving the panel empty until
// its regular refresh (30 min; standings 3 h, prayers 6 h). The page often starts with no network: the launcher
// started while the TV sleeps (Low Power Standby blocks the app: every request ends in ERR_NAME_NOT_RESOLVED),
// or right after power-on, before Wi-Fi and the VPN are up. Every 60 s for 10 tries, then every 5 min, until one
// answer arrives; the regular refresh carries on as before. `load` resolves to false when nothing answered.
function firstLoad(load, name){
  let tries = 0;
  const run = () => Promise.resolve().then(load).catch(() => false).then(ok => {
    if(ok !== false) return;
    const ms = ++tries < 10 ? 60*1000 : 5*60*1000;
    console.warn('SaudiTV: no answer for ' + name + ', trying again in ' + ms/1000 + ' s');
    setTimeout(run, ms);
  });
  run();
}

// Start the loaders the panels in `list` need (the others are started by boot / bootWidget).
// matchesLoaded: the caller already loads the match data that standings uses to mark followed teams.
function startPanelData(list, matchesLoaded){
  if(list.includes('standings')){
    firstLoad(loadStandings, 'standings'); setInterval(loadStandings, 3*3600*1000);
    if(!matchesLoaded){ firstLoad(loadMatches, 'matches'); setInterval(loadMatches, 30*60*1000); }
  }
  ['news', 'tech', 'world'].forEach(k => { if(list.includes(k)){ firstLoad(() => loadNews(k), k); setInterval(() => loadNews(k), 30*60*1000); } });
  if(list.includes('hadith')) firstLoad(loadHadith, 'hadith');   // a new day's: hadithRows
  if(list.includes('local')){ firstLoad(loadLocalNews, 'local'); setInterval(loadLocalNews, 30*60*1000); }   // the city's news
  // a single news card is only redrawn by its 30-min refresh: keep its "minutes ago" current
  if(CONFIG.panels.length <= 1 && list.some(isNewsPanel)){
    setInterval(() => { if(isNewsPanel(CONFIG.panel)) renderPanel(false); }, 5*60*1000);
    // and turn its page (three items each) every NEWS_PAGE_MS
    setInterval(() => { if(newsPaged(CONFIG.panel)){ LIST_PAGE++; renderPanel(true); } }, NEWS_PAGE_MS);
  }
}

// ---- the verse of the day (the Quran only) and the hadith of the day (Sahih al-Bukhari only)
// Verse texts come from the Quran API (.github/tools/fetch_verses.py), never typed; one a day, in turn.
const VERSES = __VERSES__;   // assets/shared/verses.json
function quoteOfDay(){
  const v = VERSES[riyadhDayNumber() % VERSES.length];
  return {title: PANEL_TITLE.verse, rows: !v ? [] : [`<li class="quote"><span class="orn">﴿</span>${esc(v.text)}<span class="orn">﴾</span></li>`,
                                                    `<li class="src">${esc(v.surah)} · ${ar(v.ayah)}</li>`]};
}
// Sahih al-Bukhari from fawazahmed0/hadith-api on jsDelivr (its ara-bukhari edition), as .github/tools/fetch_bukhari.py
// wrote it into assets/shared/bukhari.json, in the short form: the companion, then the Prophet's words ﷺ verbatim
// («عن النعمان بن بشير رضي الله عنهما قال: قال النبي ﷺ: «…»»), the chain of narrators before the companion left out.
// short = [number, head] of each narration the script could split for certain (the head: the short form before his
// words); maxWords = the longest of his words; fallback = about 60 of them, {n, head, text: the book's text verbatim},
// for a TV without the internet. One a day (hadithPick, the same all day), fetched once and kept (loadHadith).
const BUKHARI = __BUKHARI__;
const BUKHARI_URL = 'https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ara-bukhari/';
const HADITH_KEY = 'sauditv-hadith2';   // 2: the short form (head and his words)
let HADITH_DAY = null;   // {day, n, head, matn, offline}: the day's hadith (loadHadith)
// the day's [number, head] in the short list: a prime stride (7919), so the days go through all of it
const hadithPick = day => { const L = BUKHARI.short; return L[((day * 7919) % L.length + L.length) % L.length]; };
// his words in the book's text, as the script takes them (fetch_bukhari.py, matn): between its two straight quotes,
// without the direction marks and the spaces and full stops around them; '' unless there are exactly two quotes and
// nothing but punctuation after them, or when they are longer than the card takes (maxWords)
function hadithMatn(text){
  const parts = String(text || '').split('"');
  if(parts.length !== 3 || parts[2].replace(/[\s.،,:\u200e\u200f]/g, '')) return '';
  const m = parts[1].replace(/[\u200e\u200f]/g, '').split(/\s+/).filter(Boolean).join(' ').replace(/^[ .]+|[ .]+$/g, '');
  return m && m.split(' ').length <= BUKHARI.maxWords ? m : '';
}
// resolves to false while the day's hadith is a bundled one because the API did not answer (see firstLoad)
async function loadHadith(){
  const day = riyadhDayNumber();
  if(HADITH_DAY && HADITH_DAY.day === day && !HADITH_DAY.offline) return true;
  const [n, head] = hadithPick(day);
  try{
    const c = JSON.parse(localStorage.getItem(HADITH_KEY) || 'null');
    if(c && c.day === day && c.n === n && c.head === head && c.matn){ HADITH_DAY = c; hadithDrawn(); return true; }
  }catch(e){}
  const local = BUKHARI.fallback.find(h => h.n === n);
  let matn = local ? hadithMatn(local.text) : '';
  for(const ext of matn ? [] : ['.min.json', '.json']){   // the API's advice: the other form when one fails
    try{
      const r = await fetchT(BUKHARI_URL + n + ext, 15000);
      if(!r.ok) continue;
      const h = ((await r.json()).hadiths || [])[0];
      if(h && +h.hadithnumber === n && (matn = hadithMatn(h.text))) break;
    }catch(e){}
  }
  if(matn){
    HADITH_DAY = {day, n, head, matn};
    try{ localStorage.setItem(HADITH_KEY, JSON.stringify(HADITH_DAY)); }catch(e){}
  } else if(!HADITH_DAY || HADITH_DAY.day !== day){
    // no answer (or one that is not the narration the head was made for): a bundled one, the day's own, until the
    // API answers
    const f = BUKHARI.fallback[day % BUKHARI.fallback.length];
    HADITH_DAY = {day, n: f.n, head: f.head, matn: hadithMatn(f.text), offline: true};
  }
  hadithDrawn();
  return !HADITH_DAY.offline;
}
function hadithDrawn(){ if(CONFIG.panel === 'hadith') renderPanel(false); }
// typography only: no direction marks, «صلى الله عليه وسلم» as ﷺ, {…} as ﴿…﴾, no space before a comma or full stop
const HK = '[\u064B-\u0652\u0670]*';
const SAW_RE = new RegExp('صلى الله عليه وسلم'.split(' ').map(w => [...w].join(HK) + HK).join('\\s+'), 'g');
const hadithType = t => String(t || '').replace(SAW_RE, 'ﷺ').replace(/\{/g, '﴿').replace(/\}/g, '﴾').replace(/\s+([،,.:؛])/g, '$1');
const sawHtml = s => s.replace(/ﷺ/g, '<span class="saw">ﷺ</span>').replace(/[﴿﴾]/g, m => `<span class="orn">${m}</span>`);
// the short form: the companion and how he quoted the Prophet ﷺ small and muted, his words at full size; under it
// «صحيح البخاري، رقم N»
function hadithRows(){
  if(HADITH_DAY && HADITH_DAY.day !== riyadhDayNumber()) loadHadith();   // a new day: its own (redrawn when known)
  const h = HADITH_DAY;
  if(!h || !h.matn) return [];
  return [`<li class="quote hadith"><span class="nar">${sawHtml(esc(h.head))}</span> «${sawHtml(esc(hadithType(h.matn)))}»</li>`,
          `<li class="src">صحيح البخاري، رقم ${ar(h.n)}</li>`];
}

const WX_CODES = {
  0:'صافي',1:'صافي غالباً',2:'غائم جزئياً',3:'غائم',45:'ضباب',48:'ضباب متجمد',
  51:'رذاذ',53:'رذاذ',55:'رذاذ كثيف',56:'رذاذ متجمد',57:'رذاذ متجمد',
  61:'مطر خفيف',63:'مطر',65:'مطر غزير',66:'مطر متجمد',67:'مطر متجمد',
  71:'ثلج خفيف',73:'ثلج',75:'ثلج كثيف',77:'حبيبات ثلج',
  80:'زخات خفيفة',81:'زخات مطر',82:'زخات غزيرة',85:'زخات ثلج',86:'زخات ثلج',
  95:'عواصف رعدية',96:'عواصف مصحوبة ببرد',99:'عواصف قوية'
};
async function loadWeather(){
  // the city's days and hours (its own time zone)
  const q = `latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}&timezone=${encodeURIComponent(CONFIG.cityTz)}`;
  const DX = !!CONFIG.detail;   // the detail page also reads feels-like, humidity, wind, the hours, rain, sun
  // #units=f: °F and the wind in mph (WIND_UNIT)
  const U = CONFIG.units === 'f' ? '&temperature_unit=fahrenheit&wind_speed_unit=mph' : '';
  try{
    const r = await fetchT(`https://api.open-meteo.com/v1/forecast?${q}${U}&current=temperature_2m,weather_code`
                         + (DX ? ',apparent_temperature,relative_humidity_2m,wind_speed_10m' : NXH ? ',relative_humidity_2m' : '')
                         + `&daily=temperature_2m_max,temperature_2m_min,weather_code`
                         + (DX ? ',precipitation_probability_max,sunrise,sunset&hourly=temperature_2m,precipitation_probability&forecast_days=7'
                               : '&forecast_days=5'), 12000);
    if(!r.ok) throw 0;
    const j = await r.json();
    document.getElementById('wx-temp').textContent = ar(Math.round(j.current.temperature_2m)) + '°';
    const d = document.getElementById('wx-desc');
    d.textContent = WX_CODES[j.current.weather_code] || '';
    d.classList.remove('dust');
    const hi = j.daily?.temperature_2m_max?.[0], lo = j.daily?.temperature_2m_min?.[0];
    document.getElementById('wx-range').textContent =
      (hi != null && lo != null) ? `${ar(Math.round(hi))}° / ${ar(Math.round(lo))}°` : '';
    if(NX) NX_WX = {t: j.current.temperature_2m, code: j.current.weather_code, hum: j.current.relative_humidity_2m, hi, lo};
    const dl = j.daily || {};
    FORECAST = (dl.time || []).map((t, i) => ({date:t, code:dl.weather_code?.[i],
      hi:dl.temperature_2m_max?.[i], lo:dl.temperature_2m_min?.[i],
      rain:dl.precipitation_probability_max?.[i], rise:dl.sunrise?.[i], set:dl.sunset?.[i]}))   // rain, rise, set
      .filter(x => x.hi != null && x.lo != null);
    if(DX){   // now, and the next 12 hours (hourly times are local, like current.time)
      const c = j.current || {}, hr = j.hourly || {}, nowT = String(c.time || '');
      WX_NOW = {temp:c.temperature_2m, feels:c.apparent_temperature, hum:c.relative_humidity_2m,
                wind:c.wind_speed_10m, code:c.weather_code, dust:''};
      WX_HOURS = (hr.time || []).map((t, i) => ({t, temp:hr.temperature_2m?.[i], rain:hr.precipitation_probability?.[i]}))
        .filter(x => x.t > nowT && x.temp != null).slice(0, 12);
    }
    if(CONFIG.panel === 'forecast') renderPanel(false);
  }catch(e){ return false; }   // keep the last reading; with none only the city shows (false = no answer)

  // dust overrides the condition word: PM10 in µg/m³
  try{
    const r = await fetchT(`https://air-quality-api.open-meteo.com/v1/air-quality?${q}&current=pm10,dust`, 12000);
    if(!r.ok) throw 0;
    const c = (await r.json()).current || {};
    const pm = Math.max(c.pm10 || 0, c.dust || 0);
    if(pm >= 150){
      const d = document.getElementById('wx-desc');
      d.textContent = pm >= 400 ? 'غبار كثيف' : 'غبار';
      d.classList.add('dust');
      if(DX && WX_NOW){ WX_NOW.dust = d.textContent; renderDetail(); }
      if(NX_WX) NX_WX.dust = d.textContent;
    }
  }catch(e){}
  return true;   // answered (see firstLoad)
}

// night dimming: transparent by day, dark after 21:00 and before 07:00
// and darker from 23:00 to 06:00: .60 (about 40% of the brightness left; was .46 all night), reached by
// 23:30 and held to 05:30, then back to the old curve (.23) by 06:00. The evening (21:00-23:00, up to .46) and the
// morning after 06:00 are as before. Straight lines between these hours, in the page's time zone. Set every 20 s
// (boot) and only when it changes: a step is at most .004, invisible, with no transition.
const NIGHT = [[0, .6], [5.5, .6], [6, .23], [7, 0], [21, 0], [23, .46], [23.5, .6], [24, .6]];   // [hour, dimmer]
function applyNight(){
  const p = riyadhParts();
  const h = CONFIG.nightH >= 0 ? CONFIG.nightH % 24 : p.h + p.mi/60 + p.s/3600;   // #nighth (tests)
  let o = 0;
  for(let i = 1; i < NIGHT.length; i++){
    const [h0, o0] = NIGHT[i - 1], [h1, o1] = NIGHT[i];
    if(h < h1){ o = o0 + (o1 - o0) * (h - h0) / (h1 - h0); break; }
  }
  const v = Math.max(0, Math.min(.6, o)).toFixed(3);
  const el = document.getElementById('dimmer');
  if(el && v !== applyNight.last){ applyNight.last = v; el.style.opacity = v; }
}

// gentle pixel shift so static text never burns into the panel
// a larger orbit that never repeats (was 7 fixed spots, ±3-4 px, every 4 min): every 2 min (boot) a
// random offset within ±SHIFT_X px across and ±SHIFT_Y px up and down, at least SHIFT_MIN px away from the last one
// on each axis, so every edge moves. One transform for the stage (clock, VPN badge, card, its dots and line, the
// bottom bar) and the ticker tape outside it, set at once (no transition: one repaint per move). Both keep room for
// it: the stage's padding, the tape's glass reaching past the screen's sides and bottom.
const SHIFT_X = 12, SHIFT_Y = 10, SHIFT_MIN = 4;
let SHIFT_AT = [0, 0];
function pixelShift(){
  const r = m => Math.round((Math.random() * 2 - 1) * m);
  let dx = 0, dy = 0;
  for(let n = 0; n < 100; n++){
    dx = r(SHIFT_X); dy = r(SHIFT_Y);
    if(Math.abs(dx - SHIFT_AT[0]) >= SHIFT_MIN && Math.abs(dy - SHIFT_AT[1]) >= SHIFT_MIN) break;
  }
  SHIFT_AT = [dx, dy];
  ['.stage', '#tape'].forEach(q => { const el = document.querySelector(q); if(el) el.style.transform = `translate(${dx}px,${dy}px)`; });
}

// ---- the screensaver against image retention, besides pixelShift and the dimming
// - Every CONFIG.swapMin minutes of the local day (60: on the hour) the sides change (html.ss-swap): odd hours swapped,
//   even hours not, so a short run of the screensaver changes too. The stage fades out (.6 s), changes, and fades back
//   in (.8 s); the tape stays.
// - Every CONFIG.breakMin minutes, half a period after the swaps (30: at :15 and :45), a photo-only minute: the stage
//   and the tape fade out (2 s), are hidden (html.ss-break) with the tape's run paused where it is, and fade back in
//   SS_BREAK_S after the start. A break that would come within 12 s of a swap is skipped.
// Nothing runs in between: one timeout to the next change (ssTick). Only the fades animate, on opacity.
const SS_BREAK_S = 60, SS_FADE_OUT = 600, SS_FADE_IN = 800, SS_BREAK_FADE = 2000;
let SS_SWAPPED = false, SS_QUEUE = Promise.resolve(), SS_T = 0;
// minutes into the local day (page's time zone), with the seconds
function ssMinute(){ const p = riyadhParts(); return p.h*60 + p.mi + (p.s + Date.now() % 1000 / 1000)/60; }
// the start of the photo-only minute at or before minute m (it may be negative: the day before)
function ssBreakStart(m){ const B = CONFIG.breakMin; return Math.floor((m - B/2) / B) * B + B/2; }
function ssWant(m){
  const S = CONFIG.swapMin, b = ssBreakStart(m), e = b + SS_BREAK_S/60, M = .2;
  const meets = Math.floor((e + M) / S) !== Math.floor((b - M) / S);   // a swap boundary within 12 s of it
  return {swap: Math.floor(m / S) % 2 === 1, pause: m >= b && m < e && !meets};
}
// opacity from where it is to `to` (0 or 1), ms long; resolves at the end. 1 is the stylesheet's own (no inline style
// left behind). Reduced motion: at once.
function ssFade(els, to, ms){
  return Promise.all(els.filter(Boolean).map(el => {
    const from = getComputedStyle(el).opacity;
    el.style.opacity = to ? '' : '0';
    if(CARD_STILL || !el.animate) return null;
    return el.animate([{opacity: from}, {opacity: to}], {duration: ms, easing: 'ease-in-out'}).finished.catch(() => {});
  }));
}
// brings the page to `swap` / `pause`, one change after the other; `now`: no fades (the first paint)
function ssApply(swap, pause, now){
  SS_QUEUE = SS_QUEUE.then(async () => {
    const root = document.documentElement, stage = document.querySelector('.stage'), all = [stage, document.getElementById('tape')];
    if(pause && !SS_BREAK){
      SS_BREAK = true;
      await (now ? ssFade(all, 0, 0) : ssFade(all, 0, SS_BREAK_FADE));
      root.classList.add('ss-break');
      if(TAPE_ANIM) TAPE_ANIM.pause();
    }
    if(swap !== SS_SWAPPED){
      SS_SWAPPED = swap;
      if(now || SS_BREAK) root.classList.toggle('ss-swap', swap);   // nothing on screen to fade
      else {
        await ssFade([stage], 0, SS_FADE_OUT);
        root.classList.toggle('ss-swap', swap);
        await ssFade([stage], 1, SS_FADE_IN);
      }
    }
    if(!pause && SS_BREAK){
      SS_BREAK = false;
      root.classList.remove('ss-break');
      if(TAPE_ANIM) TAPE_ANIM.play();   // carries on from where it was held
      await ssFade(all, 1, now ? 0 : SS_BREAK_FADE);
    }
  }).catch(e => console.error('SaudiTV: ssApply ' + e));
}
// applies what the clock wants now, then sleeps until the next change: a swap, a break's end or the next break, or
// midnight (the day's minutes start again)
function ssTick(first){
  clearTimeout(SS_T);
  const m = ssMinute(), w = ssWant(m), S = CONFIG.swapMin, B = CONFIG.breakMin, b = ssBreakStart(m);
  ssApply(w.swap, w.pause, first);
  const next = Math.min(...[(Math.floor(m / S) + 1) * S, b + SS_BREAK_S/60, b + B, 1440].filter(x => x > m)) - m;
  SS_T = setTimeout(() => ssTick(false), Math.max(1000, next * 60000 + 250));
}
// the screensaver only (boot). Tests from a browser's console: sauditvSaver.swap(true|false), .pause(true|false),
// .night(23.5) (dims as at that hour; -1: the clock's); the next change of the clock's plan undoes the first two
function ssStart(){
  ssTick(true);
  window.sauditvSaver = {
    swap: on => ssApply(!!on, SS_BREAK, false),
    pause: on => ssApply(SS_SWAPPED, !!on, false),
    night: h => { CONFIG.nightH = +h; applyNight(); },
  };
}
// ---- end: the screensaver against image retention

// Background photos: the hosted set in photos/ (photos/index.json in the repo) and the online ones of
// photos/online.json (tools/online_photos.py: saudi, world, bing), as picked (#photos). A photo is used only
// once it has loaded; offline, or if it fails, a bundled one is shown, so the screen is never empty.
const PHOTO_BASE = 'https://raw.githubusercontent.com/raad113/SaudiTV/main/photos/';
const lsJSON = (k, d) => { try{ return JSON.parse(localStorage.getItem(k)) || d; }catch(e){ return d; } };
// photos/online.json as it was when the page was built (build.py: dist/online.js beside tv.html, inline in saudi-tv.html;
// window.SAUDITV_ONLINE): a new or offline TV has the Saudi photos and their places at once, until a fetch of the list
// succeeds (that one is kept, photoOnline, and used from then on)
const ONLINE_BUNDLED = (j => j && Array.isArray(j.saudi) ? j : null)(window.SAUDITV_ONLINE);
let REMOTE_BGS = lsJSON('photoIndex', []), ONLINE = lsJSON('photoOnline', null) || ONLINE_BUNDLED || {};

async function loadPhotoIndex(){
  await Promise.all([['index.json', 'photoIndex', j => Array.isArray(j) && (j = j.filter(p => p && p.f)).length ? (REMOTE_BGS = j) : 0],
                     ['online.json', 'photoOnline', j => j && Array.isArray(j.saudi) ? (ONLINE = j) : 0]].map(async ([f, k, use]) => {
    try{
      const r = await fetchT(PHOTO_BASE + f, 15000);
      const j = r.ok && use(await r.json());
      if(j) try{ localStorage.setItem(k, JSON.stringify(j)); }catch(e){}
    }catch(e){}
  }));
}

let REVEALED = false;
function reveal(){
  if(REVEALED) return;
  REVEALED = true;
  // fonts may still be arriving (tv.html loads them as files): wait for them, briefly
  const fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.race([fonts, new Promise(r => setTimeout(r, 800))])
    .then(() => document.documentElement.classList.add('ready'));
}

function showBackground(url, b){
  const ph = document.querySelector('.photo');
  reveal();
  if(!ph) return;
  const next = "url('" + url + "')";
  if(ph.style.backgroundImage === next) return;   // same photo: no reload, no new movement
  ph.style.backgroundImage = next;
  ph.style.setProperty('--dim', (1 - (b.d || 0.95)).toFixed(2));
  ph.classList.remove('settle'); void ph.offsetWidth; ph.classList.add('settle');
  // once settled, the photo drops the finished animation (same place: its last frame is the photo's
  // own transform); an animation kept filling kept the photo, the veils and the stage on full-screen layers that the
  // moving ticker tape had redrawn every frame
  ph.onanimationend = e => { if(e.animationName === 'settle') ph.classList.remove('settle'); };
  const dvb = document.querySelector('.dv-bg');   // the detail page's blurred copy (bootDetail)
  if(dvb) dvb.style.backgroundImage = next;
  const fr = CONFIG.detail || CONFIG.widget ? null : document.getElementById('tape-frost');   // the ticker tape's frost
  if(fr){ fr.style.backgroundImage = next; fr.style.setProperty('--dim', ph.style.getPropertyValue('--dim')); }
  const cr = document.getElementById('credit');
  // an online photo's credit on screen (its licence asks for it): «العُلا · تصوير <author> · CC BY-SA 4.0»
  if(cr){ cr.innerHTML = b.on ? photoCredit(b) : esc(b.c ? 'الصورة: ' + b.c : ''); cr.classList.toggle('on', !!b.on); }
}
// the author and the licence in <bdi>: a Latin name keeps its place in the Arabic line
const photoCredit = b => [b.p && esc(b.p), b.a && 'تصوير <bdi>' + esc(b.a) + '</bdi>', b.l && '<bdi>' + esc(b.l) + '</bdi>'].filter(Boolean).join(' · ');
// an online photo's darkening from its brightness (b, 0..1): the brighter, the stronger, so the text stays readable
const photoDim = b => Number.isFinite(b) ? Math.min(.32, Math.max(.05, (b - .35) * .8)) : .05;

// Every 4 days a new random set of 12 hosted photos (same draw as the launcher: Park-Miller generator seeded
// by the 4-day period), rotating every 5 minutes. Only the photo on screen is downloaded.
// 12 photos every 5 minutes (was 5 every 30), so one comes back once an hour, not every 25 minutes
const PHOTO_SET = 12, PHOTO_PERIOD_DAYS = 4, PHOTO_SLOT_MIN = 5;
const PHOTO_SLOTS_PER_DAY = Math.floor(1440 / PHOTO_SLOT_MIN);
function riyadhDayNumber(){
  const p = riyadhParts();
  return Math.floor(Date.UTC(p.y, p.mo - 1, p.d) / 86400000);
}
function photoSet(n){
  const period = Math.floor(riyadhDayNumber() / PHOTO_PERIOD_DAYS);
  let seed = (period % 2147483646) + 1;
  const pick = [];
  for(let guard = 0; pick.length < Math.min(PHOTO_SET, n) && guard < 1000; guard++){
    seed = (seed * 48271) % 2147483647;
    const k = seed % n;
    if(!pick.includes(k)) pick.push(k);
  }
  return pick;
}
// the picked sources (#photos) in turn, one per slot: ours the 12-photo set above, an online list in an order shuffled
// by the same 4-day period; a source with nothing at hand is left out, none at all: the bundled ones
function photoPools(){
  const seed0 = Math.floor(riyadhDayNumber() / PHOTO_PERIOD_DAYS) % 2147483646 + 1;
  return CONFIG.photos.map(s => {
    if(s === 'ours') return REMOTE_BGS.length ? photoSet(REMOTE_BGS.length).map(k => ({u: PHOTO_BASE + REMOTE_BGS[k].f, c: REMOTE_BGS[k].c, d: REMOTE_BGS[k].d})) : [];
    const L = (Array.isArray(ONLINE[s]) ? ONLINE[s] : []).filter(x => x && /^https:\/\//.test(x.u))
      .map(x => Object.assign({}, x, {on: 1, d: 1 - photoDim(x.b)}));
    for(let i = L.length - 1, seed = seed0; i > 0; i--){ seed = seed * 48271 % 2147483647; const k = seed % (i + 1); [L[i], L[k]] = [L[k], L[i]]; }
    return L;
  }).filter(L => L.length);
}
function photoFor(slot, P){
  if(!P.length) return null;
  const L = P[slot % P.length];
  return L[Math.floor(slot / P.length) % L.length];
}
let BG_SLOT = -1, PREFETCHED = false;
function applyBackground(force){
  try {
    const p = riyadhParts();
    const slot = riyadhDayNumber() * PHOTO_SLOTS_PER_DAY + Math.floor((p.h * 60 + p.mi) / PHOTO_SLOT_MIN);
    if(slot === BG_SLOT && !force) return;
    BG_SLOT = slot;
    const set = REMOTE_BGS.length && CONFIG.photos.includes('ours') ? photoSet(REMOTE_BGS.length).map(k => REMOTE_BGS[k]) : [];
    const local = BGS[slot % BGS.length], P = photoPools(), b = photoFor(slot, P);
    if(!b){ showBackground(local.u, local); return; }
    const url = b.u;
    // the next few online ones ahead of their turn, so the app has them on disk (PhotoCache keeps the last 30)
    if(!CONFIG.detail) setTimeout(() => [1, 2, 3].forEach(i => { const x = photoFor(slot + i, P); if(x && x.on) new Image().src = x.u; }), 20000);
    // First photo: wait briefly for the hosted one (the app serves it from disk at once) so the screen
    // doesn't flash a bundled photo first; slow network → bundled one, swapped when the hosted one arrives.
    let done = false;
    const fallback = () => { if(!done && !document.querySelector('.photo').style.backgroundImage) showBackground(local.u, local); };
    const t = setTimeout(fallback, 1200);
    const img = new Image();
    img.onload = () => { done = true; clearTimeout(t); showBackground(url, b); };
    img.onerror = () => { clearTimeout(t); fallback(); done = true; };
    img.src = url;
    // fetch the rest of the set once, quietly, so the app has each one on disk before its turn
    // not from the detail page, which shows one photo
    if(!PREFETCHED && !CONFIG.detail){ PREFETCHED = true; setTimeout(() => set.forEach(x => { new Image().src = PHOTO_BASE + x.f; }), 20000); }
  } catch(e) {}
}

// ---- #detail=<panel>, one panel full screen. The launcher opens it from the home card; the

const dvHM = s => { const m = /(\d{1,2}):(\d{2})/.exec(String(s || '')); return m ? fmt12(+m[1] % 24, +m[2]) : '—'; };
// the icon before each page's title: 24px outline, gold (currentColor of .dv-ic)

  // an open book (verse); a closed book with its ribbon (hadith)
  verse: DV_SVG('<path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z"/><path d="M12 6.5v13"/>'),
  hadith: DV_SVG('<path d="M5.5 4.5A1.5 1.5 0 0 1 7 3h11.5v15H7a1.5 1.5 0 0 0-1.5 1.5z"/><path d="M5.5 19.5A1.5 1.5 0 0 0 7 21h11.5v-3"/><path d="M14 3v6l-1.75-1.25L10.5 9V3"/>'),
};
function dvTitle(){
  const P = CONFIG.detail;
  if(P === 'prayers') return 'مواقيت الصلاة · ' + CONFIG.city;
  if(P === 'forecast') return 'الطقس · ' + CONFIG.city;
  if(P === 'local') return localTitle();
  return PANEL_TITLE[P] || '';
}

function dvPrayers(){
  if(!DAY_TIMES) return '';
  const p = placeParts(), mins = p.h*60 + p.mi + p.s/60, fri = isFriday();
  const names = {Fajr:'الفجر', Sunrise:'الشروق', Dhuhr: fri ? 'الجمعة' : 'الظهر', Asr:'العصر', Maghrib:'المغرب', Isha:'العشاء'};
  const at = k => { const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number); return h*60 + mi; };
  const gap = k => (k === 'Sunrise' || (k === 'Dhuhr' && fri)) ? 0 : (CONFIG.iqama[k] || 0);   // as tickPrayer
  const keys = Object.keys(names).filter(k => DAY_TIMES[k] && Number.isFinite(at(k)));
  // the prayer between its adhan and iqama, else the next one (after Isha: tomorrow's Fajr, on today's Fajr row)
  let hot = PRAYER_KEYS.find(k => keys.includes(k) && gap(k) && mins >= at(k) && mins < at(k) + gap(k)), note = '';
  if(hot) note = 'الإقامة بعد ' + humanRemaining(Math.max(60, Math.ceil(at(hot) + gap(hot) - mins)*60));
  else {
    hot = PRAYER_KEYS.find(k => keys.includes(k) && at(k) > mins) || 'Fajr';
    let left = at(hot) - mins; if(left <= 0) left += 1440;
    note = 'بعد ' + humanRemaining(Math.max(0, Math.round(left*60)));
  }
  const t12 = m => fmt12(Math.floor(m/60) % 24, m % 60);
  let today = '';
  try{   // the city's day (and «بتوقيت <city>» when its clock is not the TV's)
    today = new Intl.DateTimeFormat(HIJRI, {timeZone:CONFIG.cityTz, day:'numeric', month:'long'}).format(new Date())
      + ' · ' + new Intl.DateTimeFormat(GREG, {timeZone:CONFIG.cityTz, weekday:'long', day:'numeric', month:'long'}).format(new Date())
      + (placeNote() ? ' · ' + placeNote() : '');
  }catch(e){}
  const rows = keys.map(k => `<div class="dv-tr${k === hot ? ' hot' : ''}"><span>${names[k]}</span><span>${t12(at(k))}</span>`
    + `<span>${gap(k) ? t12(at(k) + gap(k)) : '—'}</span><span>${k === hot ? note : ''}</span></div>`).join('');
  // the next 7 days, offline (computePrayers, same method); local noon of each day, so a DST change cannot skip one
  const off = Date.UTC(p.y, p.mo-1, p.d, p.h, p.mi, p.s) - Date.now();
  const fD = (o, d) => { try{ return new Intl.DateTimeFormat(o.cal || GREG, Object.assign({timeZone:CONFIG.cityTz}, o.f)).format(d); }catch(e){ return ''; } };
  let week = '';
  for(let i = 1; i <= 7; i++){
    const d = new Date(Date.UTC(p.y, p.mo-1, p.d + i, 12) - off);
    let t;
    try{ t = computePrayers(d); }catch(e){ continue; }
    week += `<div class="dv-tr"><span><b>${fD({f:{weekday:'long'}}, d)}</b> <span class="dv-meta">${fD({f:{day:'numeric', month:'long'}}, d)}`
      + ` · ${fD({cal:HIJRI, f:{day:'numeric', month:'long'}}, d)}</span></span>`
      + PRAYER_KEYS.map(k => `<span>${dvHM(t[k])}</span>`).join('') + '</div>';
  }
  return `<div class="dv-scroll"><div class="dv-sec">اليوم<span class="dv-meta">${today}</span></div>`
    + `<div class="dv-tbl dv-pt"><div class="dv-tr dv-th"><span>الصلاة</span><span>الأذان</span><span>الإقامة</span><span></span></div>${rows}</div>`
    + (week ? `<div class="dv-sec">الأيام القادمة</div><div class="dv-tbl dv-pw"><div class="dv-tr dv-th"><span>اليوم</span>`
      + PRAYER_KEYS.map(k => `<span>${PRAYER_NAMES[k]}</span>`).join('') + `</div>${week}</div>` : '')
    + '</div>';
}

function dvForecast(){
  if(!WX_NOW && !FORECAST.length) return '';
  let html = '<div class="dv-scroll">';
  if(WX_NOW){
    const meta = [`الإحساس ${dvT(WX_NOW.feels)}`, `الرطوبة ${dvPct(WX_NOW.hum)}`,
                  `الرياح ${Number.isFinite(WX_NOW.wind) ? ar(Math.round(WX_NOW.wind)) + (CONFIG.units === 'f' ? ' ميل/س' : ' كم/س') : '—'}`].join(' · ');
    html += `<div class="dv-now"><span class="dv-temp">${dvT(WX_NOW.temp)}</span><div>`
          + `<div class="dv-desc">${esc(WX_NOW.dust || WX_CODES[WX_NOW.code] || '')}</div><div class="dv-meta">${meta}</div></div></div>`;
  }
  if(WX_HOURS.length){
    html += '<div class="dv-sec">الساعات القادمة</div><div class="dv-hours">' + WX_HOURS.map(x => {
      const h = +String(x.t).slice(11, 13);
      return `<div class="dv-hr"><span class="dv-meta">${ar(h % 12 || 12)} ${h < 12 ? 'ص' : 'م'}</span><span>${dvT(x.temp)}</span>`
           + `<span class="dv-meta">${dvPct(x.rain)}</span></div>`;
    }).join('') + '</div>';
  }
  if(FORECAST.length){
    html += '<div class="dv-sec">الأيام القادمة</div><div class="dv-tbl dv-fd"><div class="dv-tr dv-th"><span>اليوم</span><span>الحالة</span>'
          + '<span>العظمى / الصغرى</span><span>المطر</span><span>الشروق / الغروب</span></div>'
          + FORECAST.slice(0, 7).map((d, i) => {
      const day = i === 0 ? 'اليوم' : i === 1 ? 'غداً'
        : new Intl.DateTimeFormat(GREG, {timeZone:'UTC', weekday:'long'}).format(new Date(d.date + 'T12:00:00Z'));
      return `<div class="dv-tr"><span>${day}</span><span>${WX_CODES[d.code] || ''}</span><span>${dvT(d.hi)} / ${dvT(d.lo)}</span>`
           + `<span>${dvPct(d.rain)}</span><span>${dvHM(d.rise)} / ${dvHM(d.set)}</span></div>`;
    }).join('') + '</div>';
  }
  return html + '</div>';
}

// the competition, in Arabic when it is the Saudi league
const dvComp = s => /saudi|roshn/i.test(s || '') && /pro|league|دوري/i.test(s || '') ? 'دوري روشن السعودي' : String(s || '');
// a match's channel and commentator, each a labelled row under its teams; an unknown one is left out
const dvBcast = x => x ? (x.ch.length ? `<span class="dv-meta dv-bc">القناة: ${bcCh(x.ch)}</span>` : '')
  + (x.com ? `<span class="dv-meta dv-bc">المعلق: <bdi>${esc(x.com)}</bdi></span>` : '') : '';
function dvMatches(){
  const now = Date.now(), seen = new Set(), evs = [];
  const add = ev => { if(ev && ev.idEvent && !seen.has(ev.idEvent)){ seen.add(ev.idEvent); evs.push(ev); } };
  CONFIG.teamIds.forEach(id => { add(MATCHES[id]); (NEXT_LIST[id] || []).forEach(add); resultsFor(id).forEach(add); });
  const done = [], ahead = [];
  evs.forEach(ev => {
    const t = toDate(ev).getTime();
    if(!Number.isFinite(t) || t < now - 7*86400000 || t > now + 14*86400000) return;   // 7 days back, 14 ahead
    const scored = ev.intHomeScore != null && ev.intAwayScore != null && ev.intHomeScore !== '' && ev.intAwayScore !== '';
    const over = FINAL.includes((ev.strStatus || '').toUpperCase()) ? now >= t : now >= t + 2.5*3600000;
    if(over){ if(scored) done.push({ev, t}); return; }   // a past game without a score has nothing to show
    ahead.push({ev, t, scored});
  });
  done.sort((a, b) => b.t - a.t); ahead.sort((a, b) => a.t - b.t);   // newest results first, then by date
  const rows = [...done.map(x => Object.assign(x, {fin: true})), ...ahead];
  if(!rows.length) return '';
  const hm = d => new Intl.DateTimeFormat('en-GB', {timeZone:CONFIG.timezone, hour:'2-digit', minute:'2-digit', hour12:false})
    .formatToParts(d).reduce((a, x) => (a[x.type] = x.value, a), {});
  return '<div class="dv-scroll"><div class="dv-tbl dv-mt">' + rows.map(({ev, t, fin, scored}) => {
    const d = new Date(t), q = hm(d), t12 = fmt12(+q.hour % 24, +q.minute);
    const live = !fin && now >= t;
    const when = live ? `<span class="live">مباشر</span> · ${liveStatus(ev, t12)}`
      : new Intl.DateTimeFormat(GREG, {timeZone:CONFIG.timezone, weekday:'long', day:'numeric', month:'long'}).format(d) + ' · ' + t12;
    const mid = fin || (live && scored) ? ` <span class="dv-sc">${ar(+ev.intHomeScore)} - ${ar(+ev.intAwayScore)}</span> ` : ' × ';
    return `<div class="dv-tr"><span>${when}</span><span>${esc(teamAr(ev.strHomeTeam))}${mid}${esc(teamAr(ev.strAwayTeam))}</span>`
         + `<span class="dv-meta" dir="auto">${esc(dvComp(ev.strLeague))}</span>`   // English names keep their start
         + dvBcast(fin ? null : bcastOf(ev, now)) + '</div>';
  }).join('') + '</div></div>';
}

function dvStandings(){
  if(!STANDINGS.length) return '';
  // followed: by id or the match data (standFollowed), or by the Arabic names the app sent (#teamnames)
  const fol = standFollowed(), want = new Set(Object.values(TEAM_NAME_OF).map(arNorm));
  const isF = x => fol(x) || (CONFIG.league === 'ksa.1' && want.has(arNorm(STAND_AR[standKey(x.name)])));
  const n = v => Number.isFinite(v) ? ar(Math.round(v)) : '—';
  const gd = v => Number.isFinite(v) ? `<span dir="ltr">${v > 0 ? '+' : v < 0 ? '−' : ''}${ar(Math.abs(Math.round(v)))}</span>` : '—';
  return '<div class="dv-scroll"><div class="dv-tbl dv-st"><div class="dv-tr dv-th"><span>#</span><span>النادي</span><span>لعب</span>'
    + '<span>فاز</span><span>تعادل</span><span>خسر</span><span>له</span><span>عليه</span><span>الفارق</span><span>النقاط</span></div>'
    + STANDINGS.map(x => `<div class="dv-tr${isF(x) ? ' fol' : ''}"><span>${n(x.rank)}</span><span>${esc(standAr(x.name))}</span>`
      + `<span>${n(x.gp)}</span><span>${n(x.w)}</span><span>${n(x.d)}</span><span>${n(x.l)}</span><span>${n(x.gf)}</span><span>${n(x.ga)}</span>`
      + `<span>${gd(x.gd)}</span><span><b>${n(x.pts)}</b></span></div>`).join('')
    + '</div></div>';
}

// the day's verse (quoteOfDay) or hadith (hadithRows), as on the card, large, its source under it

function dvNews(P){
  DV.items = (NEWS[P] || []).slice(0, NEWS_DETAIL_KEEP);
  if(!DV.items.length) return '';
  const now = Date.now();
  return '<div class="dv-news"><div class="dv-list">' + DV.items.map((x, i) => {
    const meta = [newsSource(P, x.source), Number.isFinite(x.t) ? agoAr(now - x.t) : ''].filter(Boolean).join(' · ');
    return `<div class="dv-item" data-i="${i}"><div class="h"${bidiAttr(P, x.headline)}>${esc(x.headline)}</div><div class="dv-meta">${meta}</div></div>`;
  }).join('') + '</div><div class="dv-side"></div></div>';

// focus item i: its row framed and kept in view, its summary on the left
function dvNewsFocus(i){
  const list = document.querySelector('#dv .dv-list'), side = document.querySelector('#dv .dv-side');
  if(!list || !side || !DV.items.length) return;
  i = Math.max(0, Math.min(DV.items.length - 1, i));
  DV.focus = i;
  Array.from(list.children).forEach((el, k) => el.classList.toggle('focus', k === i));
  const row = list.children[i];
  if(row){
    const top = row.offsetTop, bot = top + row.offsetHeight;
    if(top < list.scrollTop) list.scrollTop = top;
    else if(bot > list.scrollTop + list.clientHeight) list.scrollTop = bot - list.clientHeight;
  }
  const x = DV.items[i];
  const P = CONFIG.detail;
  const meta = [newsSource(P, x.source), Number.isFinite(x.t) ? agoAr(Date.now() - x.t) : ''].filter(Boolean).join(' · ');
  side.innerHTML = `<div class="h"${bidiAttr(P, x.headline)}>${esc(x.headline)}</div><div class="dv-meta">${meta}</div>`
    + (x.summary ? `<div class="dv-sum"${bidiAttr(P, x.summary)}>${esc(x.summary)}</div>` : '<div class="dv-sum none">لا يوجد ملخص</div>')
    + (x.link ? '<div class="dv-ok">OK لقراءة الخبر كاملاً</div>' : '');
  dvSideFit(side);
  if(document.fonts && document.fonts.status !== 'loaded') document.fonts.ready.then(() => dvSideFit(side));
}
// clamp the summary to the whole lines that fit in the side column (ends with an ellipsis)
function dvSideFit(side){
  const sum = side && side.querySelector('.dv-sum:not(.none)');
  if(!sum) return;
  sum.style.webkitLineClamp = '';
  const over = side.scrollHeight - side.clientHeight;
  if(over <= 0) return;
  const lh = parseFloat(getComputedStyle(sum).lineHeight) || 32;
  sum.style.webkitLineClamp = String(Math.max(1, Math.floor((sum.clientHeight - over) / lh)));
}

function renderDetail(){
  const body = document.querySelector('#dv .dv-body');
  if(!body) return;
  const P = CONFIG.detail, news = isNewsPanel(P);   // news, local, world, tech
  const was = news ? DV.items[DV.focus] : null;   // keep the focused item across a refresh
  let html = '';
  try{
    html = P === 'prayers' ? dvPrayers() : P === 'forecast' ? dvForecast() : P === 'matches' ? dvMatches()
         : P === 'standings' ? dvStandings() : news ? dvNews(P)
         : P === 'verse' || P === 'hadith' ? dvVerse() : '';
  }catch(e){ console.error('SaudiTV: detail ' + (e && e.message)); }
  if(!html) html = `<div class="dv-empty">${DV.answered[P] ? (P === 'matches' ? 'لا مباريات في هذه الفترة' : 'لا تتوفر بيانات الآن')
                                          : DV.failed[P] ? 'لا تتوفر بيانات الآن' : 'جارٍ التحميل…'}</div>`;
  if(html === DV.html) return;   // nothing changed: focus and scroll stay as they are
  DV.html = html;
  const sc = body.querySelector('.dv-scroll'), top = sc ? sc.scrollTop : 0;
  body.innerHTML = html;
  const sc2 = body.querySelector('.dv-scroll');
  if(sc2) sc2.scrollTop = top;
  if(news && DV.items.length){
    let i = was ? DV.items.findIndex(x => (x.link && x.link === was.link) || x.headline === was.headline) : 0;
    dvNewsFocus(i < 0 ? Math.min(DV.focus, DV.items.length - 1) : i);
  }
}

function detailKey(e){
  const k = e.key;
  if(!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(k)) return;
  e.preventDefault();   // no native scrolling: the page moves only as below
  // ◀ = the next page, ▶ = the previous one (RTL)
  if(k === 'ArrowLeft' || k === 'ArrowRight'){ dvGo(k === 'ArrowLeft' ? 1 : -1); return; }
  const P = CONFIG.detail;
  if(isNewsPanel(P)){   // local too
    if(!DV.items.length) return;
    if(k === 'ArrowDown') dvNewsFocus(DV.focus + 1);
    else if(k === 'ArrowUp') dvNewsFocus(DV.focus - 1);
    else if(k === 'Enter'){
      const x = DV.items[DV.focus], N = window.SaudiTVNative;
      if(x && x.link && N && typeof N.openUrl === 'function'){ try{ N.openUrl(x.link); }catch(err){} }
    }
    return;
  }
  const sc = document.querySelector('#dv .dv-scroll');
  if(sc && (k === 'ArrowDown' || k === 'ArrowUp')) sc.scrollTop += (k === 'ArrowDown' ? 1 : -1) * Math.round(sc.clientHeight * 0.4);
}

// start the loaders page P needs, each page once (a page seen again keeps its running refresh).
// The first load (retried by firstLoad until it answers) also decides between "loading" and "no data".
const DV_STARTED = new Set();
function dvStart(P){
  if(DV_STARTED.has(P)) return;
  DV_STARTED.add(P);
  const watch = (load, name) => firstLoad(() => Promise.resolve().then(load).catch(() => false).then(ok => {
    if(ok === false) DV.failed[P] = true; else DV.answered[P] = true;
    renderDetail();
    return ok;
  }), name);
  if(P === 'prayers'){ watch(loadPrayers, 'prayers'); setInterval(loadPrayers, 6*3600*1000); setInterval(renderDetail, 15000); }
  if(P === 'forecast'){ watch(loadWeather, 'weather'); setInterval(loadWeather, 30*60*1000); }
  if(P === 'matches'){ watch(loadMatches, 'matches'); setInterval(loadMatches, 30*60*1000); setInterval(loadLive, 2*60000); setInterval(renderDetail, 60000); }
  if(P === 'standings'){   // the match data marks the followed clubs; the matches page, once seen, refreshes it
    watch(loadStandings, 'standings'); setInterval(loadStandings, 3*3600*1000);
    if(!DV_STARTED.has('matches')) firstLoad(loadMatches, 'matches');
  }
  if(P === 'news' || P === 'tech' || P === 'world'){ watch(() => loadNews(P), P); setInterval(() => loadNews(P), 30*60*1000); setInterval(renderDetail, 5*60*1000); }
  if(P === 'hadith') watch(loadHadith, 'hadith');
  if(P === 'local'){ watch(loadLocalNews, P); setInterval(loadLocalNews, 30*60*1000); setInterval(renderDetail, 5*60*1000); }
  // (verse: offline)
}
// the card shows the page last seen here when the home screen is back (bootRotatingWidget's sauditvHold)
function dvSavePos(){
  try{ localStorage.setItem('sauditv-card-pos', JSON.stringify({panel: CONFIG.detail, at: Date.now()})); }catch(e){}
}
function dvDots(){
  const el = document.querySelector('#dv .dv-dots');
  if(el) el.innerHTML = DV_LIST.map(p => `<span class="dv-dot${p === CONFIG.detail ? ' on' : ''}"></span>`).join('');
}
// page P: its title, its own data, a fresh page (top of the page, first news item)
function dvShow(P){
  CONFIG.detail = P; CONFIG.panel = P;
  DV.html = null; DV.items = []; DV.focus = 0;
  const body = document.querySelector('#dv .dv-body'), title = document.querySelector('#dv .dv-title');
  if(body) body.innerHTML = '';   // renderDetail keeps the scroll of what is shown: nothing is
  if(title) title.textContent = dvTitle();
  const ic = document.querySelector('#dv .dv-ic');   // the page's icon
  if(ic) ic.innerHTML = DV_ICON[P] || '';
  document.title = dvTitle();
  dvDots();
  dvStart(P);
  renderDetail();
  dvSavePos();
}
// d pages on (+1 next, -1 previous, wrapping), at most one switch per 300 ms (a held key repeats);
// the title and the page fade out (.2 s), the next one fades in (.25 s, CSS); no fade with reduced motion
let DV_LAST_GO = 0, DV_OUT_T = 0, DV_TO = '';
function dvGo(d){
  const now = Date.now();
  if(DV_LIST.length < 2 || now - DV_LAST_GO < 300) return;
  DV_LAST_GO = now;
  const cur = DV_LIST.indexOf(DV_TO || CONFIG.detail);   // a switch still fading out counts as made
  DV_TO = DV_LIST[((cur + d) % DV_LIST.length + DV_LIST.length) % DV_LIST.length];
  const root = document.getElementById('dv');
  if(CARD_STILL || !root){ const P = DV_TO; DV_TO = ''; dvShow(P); return; }
  root.classList.add('out');
  clearTimeout(DV_OUT_T);
  DV_OUT_T = setTimeout(() => {
    const P = DV_TO; DV_TO = ''; DV_OUT_T = 0;
    dvShow(P);
    root.classList.remove('out');
  }, 200);
}

function bootDetail(){

// Last painted panels, shown at once on the next start while fresh data loads.
const SNAP_KEY = 'snap5:' + location.hash;   // bump when the panels' markup changes (3, market values; 4, one match; 5, markets moved to the ticker tape)
const SNAP_SEL = ['.markets', '#week-list', '#match-row'];
function saveSnap(){
  try{ localStorage.setItem(SNAP_KEY, JSON.stringify(SNAP_SEL.map(q => (document.querySelector(q)||{}).innerHTML || ''))); }catch(e){}
}
function restoreSnap(){
  try{
    const v = JSON.parse(localStorage.getItem(SNAP_KEY) || 'null');
    if(v) SNAP_SEL.forEach((q, i) => { const el = document.querySelector(q); if(el && v[i]) el.innerHTML = v[i]; });
  }catch(e){}
}

// ---- the mouse, on the launcher's pages (never the screensaver): the pointer while it moves, hidden after 3 s still;
// on a detail page hover = the D-pad's focus, click = OK (a dot: its page), the wheel = ▲▼ or scrolls the text.
// The launcher's own views (pills, apps, the card) take the mouse themselves (Mouse.java).
function bootMouse(){
  const root = document.documentElement, key = k => detailKey({key: k, preventDefault(){}});
  let t = 0, x = -1, y = -1, acc = 0, at = 0;
  addEventListener('mousemove', e => {
    if(e.clientX === x && e.clientY === y) return;   // moved, not a page that moved under it
    x = e.clientX; y = e.clientY;
    root.classList.add('mouse');
    clearTimeout(t); t = setTimeout(() => root.classList.remove('mouse'), 3000);
    const it = CONFIG.detail && e.target.closest('#dv .dv-item');
    if(it && +it.dataset.i !== DV.focus) dvNewsFocus(+it.dataset.i);
  }, {passive: true});
  if(!CONFIG.detail) return;
  addEventListener('click', e => {
    const d = e.target.closest('.dv-dot'), it = e.target.closest('#dv .dv-item');
    if(d){ const k = [...d.parentNode.children].indexOf(d) - DV_LIST.indexOf(DV_TO || CONFIG.detail); if(k) dvGo(k); }
    else if(it){ dvNewsFocus(+it.dataset.i); key('Enter'); }
  });
  addEventListener('wheel', e => {
    e.preventDefault();
    const sc = document.querySelector('#dv .dv-scroll');
    if(sc){ sc.scrollTop += e.deltaY; return; }
    if(Date.now() - at > 400) acc = 0;   // a notch (or a trackpad's run) moves one row
    at = Date.now(); acc += e.deltaY;
    if(Math.abs(acc) >= 40){ key(acc > 0 ? 'ArrowDown' : 'ArrowUp'); acc = 0; }
  }, {passive: false});
}
// home: «يُتلى الآن»'s box (CSS px; 0 x 0 hidden) for the launcher's focusable view over it (SaudiTVNative.qrRect)
function homeQrRect(){
  const N = window.SaudiTVNative, el = document.getElementById('qr');
  window.sauditvQrFocused = on => document.documentElement.classList.toggle('qr-focus', !!on);
  if(!N || typeof N.qrRect !== 'function' || !el) return;
  let last = '';
  QR_SEND = () => {
    if(NX){   // «الجديد»: #nx is scaled (nxLay), its box as seen
      const b = el.getBoundingClientRect(), v = (el.hidden || !b.width ? [0, 0, 0, 0] : [b.left + scrollX, b.top + scrollY, b.width, b.height])
        .concat(innerWidth).map(Math.round);
      if(v.join() !== last){ last = v.join(); try{ N.qrRect(...v); }catch(e){} }
      return;
    }
    let x = 0, y = 0;
    for(let e = el; e; e = e.offsetParent){ x += e.offsetLeft; y += e.offsetTop; }
    const v = (el.offsetParent ? [x, y, el.offsetWidth, el.offsetHeight] : [0, 0, 0, 0]).concat(innerWidth).map(Math.round);
    if(v.join() !== last){ last = v.join(); try{ N.qrRect(...v); }catch(e){} }
  };
  if(window.ResizeObserver) new ResizeObserver(() => QR_SEND()).observe(el);
  addEventListener('resize', () => QR_SEND());
  QR_SEND();
}

function boot(){
  if(CONFIG.home || CONFIG.detail || CONFIG.ticker || CONFIG.widget) bootMouse();
  if(CONFIG.feedTest) setTimeout(feedTest, 3000);   // tests only (#feedtest=1)
  if(CONFIG.tapeTest) setTimeout(tapeTest, 3000);   // tests only (#tapetest=1)
  if(CONFIG.ticker){ bootTicker(); return; }
  if(CONFIG.detail){ bootDetail(); return; }
  if(CONFIG.home){ if(NXH) nxHome(); else bootHome(); return; }
  if(CONFIG.widget){ bootWidget(); return; }
  if(NXS) nxBoot();   // «الجديد»: its layer over this screensaver (the card moves into it; no ticker tape)
  restoreSnap();
  setTimeout(saveSnap, 15*1000);   // the dream can be killed before pagehide
  setInterval(saveSnap, 60*1000);
  addEventListener('pagehide', saveSnap);
  const wxCity = document.getElementById('wx-city');
  if(wxCity) wxCity.textContent = CONFIG.city;
  const cs = document.getElementById('clock-sub');
  // the clock is the TV's: «بتوقيت <city>» when the city keeps the same time, else «التوقيت المحلي»
  if(cs) cs.textContent = placeNote() ? 'التوقيت المحلي' : 'بتوقيت ' + CONFIG.city;
  document.title = 'سعودي TV';
  applyBackground(true);
  loadPhotoIndex().then(() => applyBackground(true));
  setInterval(() => applyBackground(false), 60*1000);
  tickClock(); tickDates(); tickRamadan();
  if(!NXS) tapeStart();   // the ticker tape at the bottom edge (was the three markets under the weather)
  const ROT = CONFIG.panels.length > 1 ? CONFIG.panels : null;   // rotating card on the screensaver too
  if(ROT) CONFIG.panel = ROT[0];
  if(CONFIG.panel === 'none') document.querySelector('.week').style.display = 'none';
  else renderPanel(false);   // its own data arrives with prayers, weather, matches
  // a first load without an answer tries again soon (firstLoad)
  firstLoad(loadPrayers, 'prayers'); firstLoad(loadMatches, 'matches'); firstLoad(loadWeather, 'weather');
  startPanelData(ROT || [CONFIG.panel], true);   // standings / news / tech (matches load above)
  if(ROT){
    newsFlipArm();   // the first panel, if it is news, pages like the later visits
    let ri = 0;
    rotInit(ROT); rotMark(0); rotRestart();   // rotation indicator
    setInterval(() => {
      const k = rotNext(ROT, ri, 1);   // past a panel with nothing to show
      if(k === ri){ rotRestart(); return; }
      ri = k;
      swapPanel(ROT[ri]);   // fade out, then slide the next panel in (sets CONFIG.panel, LIST_PAGE)
      rotMark(ri); rotRestart();
    }, CONFIG.rotateMs);
  }
  applyNight(); pixelShift();
  ssStart();   // the sides change places every hour, a photo-only minute twice an hour

  setInterval(tickClock, 1000);
  setInterval(()=>{ tickDates(); tickPrayer(); tickRamadan(); if(CONFIG.panel === 'prayers') renderPanel(false); }, 15000);
  setInterval(renderMatches, 60000);   // one match, no page turns (was every 15 s)
  setInterval(loadLive, 2*60000);
  setInterval(loadPrayers, 6*3600*1000);
  setInterval(loadMatches, 30*60*1000);
  setInterval(loadWeather, 30*60*1000);
  setInterval(()=>{
    if(CONFIG.panel === 'matches'){ LIST_PAGE++; renderPanel(matchRows().length > WEEK_ROWS); }
  }, 25*1000);
  setInterval(applyNight, 20*1000);     // was every minute (it writes only a change: see applyNight)
  setInterval(pixelShift, 2*60*1000);   // was every 4 min
  let lastDay = new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(new Date());
  setInterval(()=>{
    const d = new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(new Date());
    if(d !== lastDay){ lastDay = d; loadPhotoIndex().then(() => applyBackground(true)); tickDates(); tickRamadan(); loadPrayers(); loadMatches(); loadWeather(); renderPanel(false); }
  }, 60*1000);
}
