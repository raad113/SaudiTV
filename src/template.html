// #home=1: the launcher's home screen (HomePage.java): the screensaver's page in rows (see html.home):
// dates and weather; the clock with its VPN badge (SaudiTVNative.vpnState / vpnCountry); the rotating card, with the
// launcher's card bridge (cardStart); the info strip under the apps row (next prayer, Ramadan, next match); the
// moving ticker tape (was stepping); the same photos every 5 minutes. No pixelShift, night dimming or
// photo drift. The launcher draws its pills and its apps row where this page leaves room, and lays an invisible focusable view over the card
// where homeCardRect says it is.
function bootHome(){
  const root = document.documentElement;
  root.classList.add('home');
  Object.entries(CONFIG.homeRoom).forEach(([k, v]) => { if(Number.isFinite(v) && v >= 0) root.style.setProperty(k, v + 'px'); });
  restoreSnap();
  setTimeout(saveSnap, 15*1000);
  setInterval(saveSnap, 60*1000);
  addEventListener('pagehide', saveSnap);
  const wxCity = document.getElementById('wx-city');
  if(wxCity) wxCity.textContent = CONFIG.city;
  document.title = 'سعودي TV';
  applyBackground(true);
  loadPhotoIndex().then(() => applyBackground(true));
  setInterval(() => applyBackground(false), 60*1000);
  tickClock(); tickDates(); tickRamadan();
  tapeStart();
  firstLoad(loadPrayers, 'prayers'); firstLoad(loadWeather, 'weather');   // the card's own loaders skip these two
  // the info strip's next match: the matches unless the card loads them (matches, or standings, which
  // loads them without the live refresh), then the pick again every minute (a game starts or ends)
  const cardList = CONFIG.panels.length > 1 ? CONFIG.panels : [CONFIG.panel];
  if(!cardList.includes('matches')){
    if(!cardList.includes('standings')){ firstLoad(loadMatches, 'matches'); setInterval(loadMatches, 30*60*1000); }
    setInterval(loadLive, 2*60000);
  }
  setInterval(renderMatches, 60000);
  if(CONFIG.panel === 'none' && CONFIG.panels.length < 2){
    document.querySelector('.week').style.display = 'none';
    window.sauditvCurrentPanel = () => CONFIG.panel;
    window.sauditvSetFocused = window.sauditvStep = window.sauditvHold = () => {};
  } else cardStart();
  homeCardRect();
  homeQrRect();
  setInterval(tickClock, 1000);
  setInterval(() => { tickDates(); tickPrayer(); tickRamadan(); if(CONFIG.panel === 'prayers') renderPanel(false); }, 15000);
  setInterval(loadPrayers, 6*3600*1000);
  setInterval(loadWeather, 30*60*1000);
  let lastDay = riyadhDayNumber();
  setInterval(() => {
    if(riyadhDayNumber() === lastDay) return;
    lastDay = riyadhDayNumber();
    loadPhotoIndex().then(() => applyBackground(true)); tickDates(); tickRamadan(); loadPrayers(); loadWeather();
  }, 60*1000);
}

// where the card is (CSS px, as laid out, without the focus scale), sent to the launcher
// (SaudiTVNative.cardRect) whenever it moves or changes size, e.g. a panel with fewer rows; 0 x 0 = no card
function homeCardRect(){
  const N = window.SaudiTVNative, card = document.querySelector('.week'), stage = document.querySelector('.stage');
  if(!N || typeof N.cardRect !== 'function' || !card || !stage) return;
  let last = '';
  const send = () => {
    let x = 0, y = 0, w = 0, h = 0;
    if(card.offsetParent){   // offsets from the stage: a scaled (focused) card reports its own box
      const s = stage.getBoundingClientRect();
      for(let el = card; el && el !== stage; el = el.offsetParent){ x += el.offsetLeft; y += el.offsetTop; }
      x += s.left; y += s.top; w = card.offsetWidth; h = card.offsetHeight;
    }
    const v = [x, y, w, h, innerWidth].map(Math.round), key = v.join(',');
    if(key === last) return;
    last = key;
    try{ N.cardRect(...v); }catch(e){}
  };
  if(window.ResizeObserver) new ResizeObserver(send).observe(card);
  addEventListener('resize', send);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(send);
  send();
}

// the card and its bridge for the launcher, on the launcher's card (#widget=1) and on the home screen
// (#home=1, which loads the prayers and the weather itself, for its own lines too)
function cardStart(){
  // for the launcher: which panel the card shows now (it rotates), and its focus ring
  window.sauditvCurrentPanel = () => CONFIG.panel;
  window.sauditvSetFocused = on => { document.documentElement.classList.toggle('card-focused', !!on); };
  window.sauditvStep = () => {};   // LEFT/RIGHT on the card; only a rotating card has panels to step through
  if(CONFIG.panels.length > 1){ bootRotatingWidget(); return; }
  const P = CONFIG.panel, own = !CONFIG.home;   // own: the prayers and weather loaders are the card's to start
  renderPanel(false);
  if(P === 'prayers' && own){ firstLoad(loadPrayers, 'prayers'); setInterval(loadPrayers, 6*3600*1000); setInterval(() => renderPanel(false), 15000); }
  if(P === 'forecast' && own){ firstLoad(loadWeather, 'weather'); setInterval(loadWeather, 30*60*1000); }
  if(P === 'matches'){ firstLoad(loadMatches, 'matches'); setInterval(loadMatches, 30*60*1000); setInterval(loadLive, 2*60000); }
  startPanelData([P], false);   // standings / news / tech
  setInterval(() => {
    if(APPS_OPEN) return;   // no page turns behind the apps grid
    if(P === 'matches'){ LIST_PAGE++; renderPanel(matchRows().length > WEEK_ROWS); }
  }, 25*1000);
  let lastDay = riyadhDayNumber();
  setInterval(() => { if(riyadhDayNumber() !== lastDay){ lastDay = riyadhDayNumber(); if(P === 'prayers' && own) loadPrayers(); renderPanel(false); } }, 60*1000);
}

// one card that shows each panel in turn (e.g. prayers -> forecast -> matches), every CONFIG.rotateMs
function bootRotatingWidget(){
  const L = CONFIG.panels, own = !CONFIG.home;   // own: as in cardStart
  if(L.includes('prayers') && own){ firstLoad(loadPrayers, 'prayers'); setInterval(loadPrayers, 6*3600*1000); }
  if(L.includes('forecast') && own){ firstLoad(loadWeather, 'weather'); setInterval(loadWeather, 30*60*1000); }
  if(L.includes('matches')){ firstLoad(loadMatches, 'matches'); setInterval(loadMatches, 30*60*1000); setInterval(loadLive, 2*60000); }
  startPanelData(L, L.includes('matches'));   // standings / news / tech
  // the card remembers where it was (a reloaded or re-created card, a restarted launcher):
  // a panel stored less than 30 minutes ago is where the rotation resumes, else it starts at the first one
  const POS_KEY = 'sauditv-card-pos', POS_MAX_AGE = 30*60*1000;
  let i = 0;
  try{
    const s = JSON.parse(localStorage.getItem(POS_KEY) || 'null'), age = s ? Date.now() - Number(s.at) : NaN;
    if(s && age >= 0 && age < POS_MAX_AGE && L.includes(s.panel)) i = L.indexOf(s.panel);
  }catch(e){}
  const savePos = () => { try{ localStorage.setItem(POS_KEY, JSON.stringify({panel: L[i], at: Date.now()})); }catch(e){} };
  CONFIG.panel = L[i];
  savePos();
  renderPanel(false);
  newsFlipArm();   // the first panel, if it is news, pages like the later visits
  rotInit(L); rotMark(i);   // rotation indicator (its line starts with arm)
  // d panels on (+1 next, -1 previous, wrapping), with the rotation's transition (swapPanel)
  const go = d => {
    let k = i;   // |d| steps, each past a panel with nothing to show (rotNext)
    for(let n = 0; n < Math.abs(d); n++) k = rotNext(L, k, d < 0 ? -1 : 1);
    if(k === i) return;
    i = k;
    swapPanel(L[i]);   // fade out, then slide the next panel in (sets CONFIG.panel, LIST_PAGE)
    rotMark(i);
    savePos();
  };
  let rotTimer = 0, held = false;
  // the indicator's line starts again with every (re)start of the timer and every rotation
  // ... except while the launcher holds it (sauditvHold) or its apps grid is open (sauditvAppsOpen)
  const arm = () => {
    clearInterval(rotTimer);
    if(held || APPS_OPEN){ rotTimer = 0; rotFreeze(); return; }
    rotTimer = setInterval(() => { go(1); rotRestart(); }, CONFIG.rotateMs);
    rotRestart();
  };
  arm();
  // the launcher's LEFT/RIGHT (window.sauditvStep(+1 | -1)). Presses during a transition add up and
  // run as one step when it ends; every press restarts the rotation, so the chosen panel stays a full rotateMs.
  let stepQ = 0, stepT = 0;
  const stepRun = () => {
    stepT = 0;
    const wait = CARD_BUSY_UNTIL - Date.now();
    if(wait > 0){ stepT = setTimeout(stepRun, wait + 20); return; }
    const d = stepQ; stepQ = 0;
    if(d){ go(d); arm(); }
  };
  window.sauditvStep = d => {
    stepQ += Number(d) < 0 ? -1 : 1;
    arm();   // no rotation while a step waits for the running transition
    if(!stepT) stepRun();
  };
  // the launcher holds the rotation while a detail window is open (sauditvHold(true)) and releases it when
  // the home screen is back (sauditvHold(false)): the card stays on the panel that was opened, then a fresh rotateMs.
  // ... or on the page last seen in the detail window (it stores 'sauditv-card-pos' on every switch),
  // shown at once, without the rotation's fade-out (the card was hidden behind the window)
  const resumePos = () => {
    let s = null;
    try{ s = JSON.parse(localStorage.getItem(POS_KEY) || 'null'); }catch(e){}
    const k = s ? L.indexOf(s.panel) : -1;
    if(k < 0 || k === i) return;
    i = k;
    clearTimeout(CARD_TIMER); CARD_BUSY_UNTIL = 0; CARD_PENDING = null;   // a swap still running is replaced
    clearTimeout(stepT); stepT = 0; stepQ = 0;
    const card = document.querySelector('.week');
    if(card) card.classList.remove('out');
    CONFIG.panel = L[i];
    LIST_PAGE = 0;
    renderPanel(false, true);
    newsFlipArm();
    rotMark(i);
    savePos();
  };
  // a held rotation stops the indicator's line where it is; arm() starts it again from empty
  window.sauditvHold = on => { held = !!on; if(on){ clearInterval(rotTimer); rotTimer = 0; rotFreeze(); } else { resumePos(); arm(); } };
  // the apps grid opened or closed (sauditvAppsOpen): hold on the same panel, then a fresh rotateMs
  CARD_APPS = on => { if(on){ clearInterval(rotTimer); rotTimer = 0; rotFreeze(); } else arm(); };
  let lastDay = riyadhDayNumber();
  setInterval(() => {
    if(riyadhDayNumber() !== lastDay){ lastDay = riyadhDayNumber(); if(L.includes('prayers') && own) loadPrayers(); renderPanel(false); }
  }, 60*1000);
}

// ---- «الجديد» (#look=new, the settings' «شكل الواجهة»): design/concepts/1-ambient-editorial. A layer (#nx) in the

// the row's box for the launcher's view over it (CSS px; 0 x 0 with no card)
function nxRect(){
  const N = window.SaudiTVNative, z = NX_Z, rail = nxEl('nx-rail');
  if(!NXH || !N || typeof N.cardRect !== 'function' || !rail) return;
  const v = (rail.children.length ? [0, 188 * z, innerWidth - 40 * z, 176 * z] : [0, 0, 0, 0]).concat(innerWidth).map(Math.round);
  if(v.join() === NX_RECT) return;
  NX_RECT = v.join();
  try{ N.cardRect(...v); }catch(e){}
}
function nxLay(){
  const z = NX_Z = Math.min(innerWidth / 960, innerHeight / 540), nx = nxEl('nx'), R = CONFIG.homeRoom;
  document.documentElement.style.setProperty('--z', z);
  Object.assign(nx.style, {width: innerWidth / z + 'px', height: innerHeight / z + 'px', transform: z === 1 ? '' : `scale(${z})`});
  // «التطبيقات» just above the launcher's apps row (dockh tall, dockb from the bottom, in CSS px; «الجديد»'s 100 and 44)
  if(NXH) nx.style.setProperty('--ah', (innerHeight - (R['--dock-b'] >= 0 ? R['--dock-b'] : 44) - (R['--dock-h'] >= 0 ? R['--dock-h'] : 100)) / z - 22 + 'px');
  nxFocus(); nxRect();
  if(NXH && NX_PHOTO) nxCredit(NX_PHOTO);
}
// the home screen's photo credit (an online photo's: its licence asks for it) on the «الأسواق» line, at its left; the
// ticker starts after it (--cw). Whole, or, when it would take more than 40% of the line, without the licence's version
// («CC BY-SA»), then without the author too; the place is never cut. Again when the fonts arrive and the size changes.
function nxCredit(b){
  const cr = nxEl('credit'), z = NX_Z, ver = s => String(s || '').replace(/\s*\d+(\.\d+)*$/, '');
  NX_PHOTO = b;
  let w = 0;
  if(cr && b && b.on){
    for(const x of [b, Object.assign({}, b, {l: ver(b.l)}), Object.assign({}, b, {l: ver(b.l), a: ''})]){
      cr.innerHTML = photoCredit(x);
      if(cr.scrollWidth <= 880 * .4 * z) break;
    }
    w = Math.ceil(cr.scrollWidth + 16 * z);
  }
  if(w === NX_CW) return;
  NX_CW = w;
  document.documentElement.style.setProperty('--cw', w + 'px');
  if(TAPE_HTML) tapeLay();   // the run again for the tape's new width, on from where it was
}
// the cards' views: the panel last read in the detail window (its 'sauditv-card-pos') on its card, else the one shown,
// else the first (nxCards then passes one with no data)
function nxTab(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem('sauditv-card-pos') || 'null'); }catch(e){}
  const p = s && s.panel;
  NX_TAB = NX_TABS.includes(p) ? p : NX_TABS.includes(NX_TAB) ? NX_TAB : NX_TABS[0];
  NX_SUB = NX_SUBS.includes(p) ? p : NX_SUBS.includes(NX_SUB) ? NX_SUB : NX_SUBS[0];
}
// the cards' views in turn (each card's order, past a view with no data), every CONFIG.rotateMs as the classic card's
// rotation, the deen card half an interval after the news card (never both at once): one timer (NX_ROT) at half the
// interval, the news card on its even ticks, the deen card on its odd ones from the third; started again at every move
// of the launcher's focus (nxRotArm), stopped while the detail window is open (sauditvHold(true)); no switch for the
// card focused or with fewer than two views to show
let NX_ROT = 0, NX_ROT_N = 0, NX_ROT_HOLD = false, NX_ROT_FADE = 0;
const nxRotStill = () => CARD_STILL || CONFIG.lowPower;
function nxRotArm(){
  clearInterval(NX_ROT); NX_ROT = 0; NX_ROT_N = 0;
  if(!NX_ROT_HOLD) NX_ROT = setInterval(() => { const n = ++NX_ROT_N; if(n % 2 === 0) nxRotStep('news'); else if(n > 1) nxRotStep('deen'); }, CONFIG.rotateMs / 2);
  // the lines on the new schedule: the news card's first switch one interval on, the deen card's one and a half
  Object.keys(NX_VIEWS).forEach(k => { if(NX_ROT_HOLD || (NX_F && NX_K === k)) nxLnFreeze(k); else nxLnRun(k, CONFIG.rotateMs * (k === 'news' ? 1 : 1.5)); });
}
function nxRotStep(k){
  if(NX_ROT_HOLD || (NX_F && NX_K === k)) return;
  nxLnRun(k, CONFIG.rotateMs);   // its line again from empty, to its next switch (even when a fade under way skips this one)
  if(NX_ROT_FADE) return;
  const v = NX_VIEWS[k].filter(nxHas);
  if(v.length > 1) nxRotTo(k, v[(v.indexOf(nxView(k)) + 1) % v.length]);
}
// card k to view t: its views and its body fade out, then the row is drawn on t (nxDraw, the headers fitted again) and
// the card fades in
function nxRotTo(k, t){
  const q = () => nxEl('nx-rail') && nxEl('nx-rail').querySelector(`[data-k="${k}"]`), set = () => { if(k === 'news') NX_TAB = t; else NX_SUB = t; }, c = q();
  if(!c || nxRotStill()){ set(); nxDraw(); return; }
  c.classList.add('tx');
  NX_ROT_FADE = setTimeout(() => {
    NX_ROT_FADE = 0; set(); nxDraw();
    const e = q();
    if(e){ e.classList.remove('tx'); e.classList.add('ti'); }
  }, 150);
}
// the cards' rotation lines (.nx-ln i): per card (NX_LN) the fill running since s over d ms, or pinned at p while
// the card is focused or the row held (nxLnFreeze, as rotFreeze). The rail is drawn anew on new data and on the
// clock's minute, its lines with it: nxLnSync gives a new line its card's fill where it had got to (a negative
// transition-delay into the same stepped transition), so a redraw never starts it again. A CSS transition, one step
// a second: no script per frame, kept while the card is still (nxRotStill), as the classic card's.
let NX_LN = {};
const nxLnEl = k => { const r = nxEl('nx-rail'), c = r && r.querySelector(`[data-k="${k}"]`); return c && c.querySelector('.nx-ln i'); };
function nxLnRun(k, d){ NX_LN[k] = {s: Date.now(), d}; nxLnPaint(k); }
function nxLnFreeze(k){
  const f = nxLnEl(k), L = NX_LN[k];
  if(L && L.p != null) return;   // pinned already
  const m = f && /^matrix\(([-\d.e]+)/.exec(getComputedStyle(f).transform);   // where the running fill is now
  NX_LN[k] = {p: m ? Math.max(0, Math.min(1, +m[1])) : L ? Math.min(1, Math.floor((Date.now() - L.s) / 1000) / Math.max(1, Math.round(L.d / 1000))) : 0};
  nxLnPaint(k);
}
function nxLnPaint(k){
  const f = nxLnEl(k), L = NX_LN[k];
  if(!f) return;
  f._ln = L;
  f.style.transition = 'none';
  if(!L || L.p != null){ f.style.transform = 'scaleX(' + (L ? L.p : 0) + ')'; return; }
  f.style.transform = 'scaleX(0)';
  void f.offsetWidth;   // the empty line is applied before the fill starts
  f.style.transition = `transform ${L.d}ms steps(${Math.max(1, Math.round(L.d / 1000))}, end) ${-Math.min(L.d, Date.now() - L.s)}ms`;
  f.style.transform = 'scaleX(1)';
}
function nxLnSync(){ Object.keys(NX_VIEWS).forEach(k => { const f = nxLnEl(k); if(f && f._ln !== NX_LN[k]) nxLnPaint(k); }); }
function nxRotHold(on){
  NX_ROT_HOLD = !!on;
  if(on && NX_ROT_FADE){   // a fade under way stays on its view
    clearTimeout(NX_ROT_FADE); NX_ROT_FADE = 0;
    nxEl('nx-rail').querySelectorAll('.tx').forEach(e => e.classList.remove('tx'));
  }
  nxRotArm();
}
function nxClock(){
  const p = riyadhParts(), key = p.h + ':' + p.mi;
  if(key === nxClock.k) return;
  nxClock.k = key;
  nxSet('nx-ck', `<b>${nxT12(p.h, p.mi)}</b><i>${p.h < 12 ? 'ص' : 'م'}</i>`);
  if(NXS){ nxSet('nx-hj', nxFmt({weekday: 'long', day: 'numeric', month: 'long'}, HIJRI).replace('،', '')); nxSet('nx-gr', nxFmt({day: 'numeric', month: 'long', year: 'numeric'})); }
  nxSoon();   // the countdowns and the news' ages
}
function nxBoot(){
  const nx = document.createElement('div');
  document.documentElement.classList.add('nx', NXH ? 'nxh' : 'nxs');
  nx.id = 'nx';
  nx.innerHTML = NXH ? '<div class="nx-dl" id="nx-dl"></div><section class="nx-hero"><div class="nx-ck" id="nx-ck"></div><div class="nx-dk">'
      + '<div class="k" id="nx-kk"></div><p class="nx-st" id="nx-st"></p><div class="m" id="nx-mt"></div></div><div class="nx-mx" id="nx-mx" hidden></div></section>'
      + '<h2 class="nx-rh">اليوم<i></i></h2><div class="nx-rail" id="nx-rail"></div>'
      + '<h2 class="nx-rh" id="nx-ah">التطبيقات<i></i><span>كل التطبيقات ‹</span></h2><div class="nx-mk" id="nx-mk" hidden>الأسواق</div>'
    : '<div id="nx-pl"></div><div class="nx-cv"><div class="nx-dt"><b id="nx-hj"></b><span id="nx-gr"></span></div><div class="nx-ck" id="nx-ck"></div></div><ul class="nx-fx" id="nx-fx"></ul>';
  document.querySelector('.stage').appendChild(nx);
  if(NXS){   // the card top right; the VPN badge after the dates, with the concept's shield (and its check, ! or ✕)
    nx.className = 's'; nx.prepend(document.querySelector('.week')); nx.querySelector('.nx-dt').appendChild(nxEl('vpn'));
    nxEl('vpn').insertAdjacentHTML('afterbegin', '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>'
      + '<path class="ok" d="m8.8 12 2.2 2.2 4.4-4.4"/><path class="wa" d="M12 8v4.2m0 3.3h.01"/><path class="no" d="m9.6 9.6 4.8 4.8m0-4.8-4.8 4.8"/></svg>');
  }
  // «يُتلى الآن · <station>» (tickRadio), with a speaker in the concept's line icons: under the screensaver's clock; on
  // the home screen in the standfirst's meta line's place while it plays (a line of its own would raise the block into
  // the dateline; the meta's data is on the weather card), the meta back when it stops
  const qr = nxEl('qr');
  if(qr){
    if(NXS) nx.querySelector('.nx-cv').appendChild(qr);
    else { const mt = nxEl('nx-mt'), mr = document.createElement('div'); mr.className = 'nx-mr'; mt.replaceWith(mr); mr.append(mt, qr); }
    qr.querySelector('svg').innerHTML = '<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>'; }
  // what brings new data redraws the layer; the clock its minute
  ['tickPrayer', 'tickRamadan', 'loadWeather', 'loadNews', 'loadLocalNews', 'loadStandings', 'renderMatches', 'hadithDrawn', 'tapeRender']
    .forEach(n => { const o = window[n]; window[n] = function(){ const r = o.apply(this, arguments); Promise.resolve(r).then(nxSoon, nxSoon); return r; }; });
  const tc = tickClock, sb = showBackground;
  tickClock = () => { tc(); nxClock(); };
  // the online photo's place, top left of the screensaver («العُلا»); on the home screen its credit's place (nxCredit)
  showBackground = (u, b) => { sb(u, b); if(NXS) nxSet('nx-pl', b && b.on && b.p ? esc(b.p) : ''); else nxCredit(b); };
  nxLay();
  addEventListener('resize', nxLay);
  if(NXH && document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if(NX_PHOTO) nxCredit(NX_PHOTO); nxFocus(); });   // measured in its fonts
}
// #home=1 in «الجديد»: bootHome's loaders, the «اليوم» row and its bridge for the launcher
function nxHome(){
  const root = document.documentElement, cards = NX_TABS.concat('verse', 'hadith');   // every view's data, whatever is ticked
  root.classList.add('home');
  Object.entries(CONFIG.homeRoom).forEach(([k, v]) => { if(Number.isFinite(v) && v >= 0) root.style.setProperty(k, v + 'px'); });
  CONFIG.panel = 'none'; CONFIG.panels = [];   // the classic card is not drawn
  nxBoot(); nxTab();
  window.sauditvCurrentPanel = () => NX_K ? nxView(NX_K) : NX_SUBS[0];   // the view shown on the card focused
  // the detail window's list: the cards' views with data, the deen card's then the news card's
  window.sauditvDetailList = () => [...nxEl('nx-rail').children].flatMap(e => NX_VIEWS[e.dataset.k].filter(nxHas)).join(',');
  window.sauditvSetFocused = on => { NX_F = !!on; nxFocus(); nxRotArm(); };
  window.sauditvStep = d => {   // ◀ (+1) the next card to the left, ▶ (-1) back; no wrapping
    const cs = [...nxEl('nx-rail').children], i = cs.findIndex(e => e.dataset.k === NX_K);
    const c = cs[Math.max(0, Math.min(cs.length - 1, i + (Number(d) < 0 ? -1 : 1)))];
    if(c){ NX_K = c.dataset.k; nxFocus(); }
    nxRotArm();
  };
  // the detail window open: the cards' rotation held; back from it: the view last read, then the rotation on from it
  window.sauditvHold = on => { if(!on){ nxTab(); nxSoon(); } nxRotHold(on); };
  window.sauditvPoint = (x, y) => {   // the mouse over the row (the launcher's view): the card under it
    const c = document.elementFromPoint(x, y), e = c && c.closest('.nx-c');
    if(e && e.dataset.k !== NX_K){ NX_K = e.dataset.k; nxFocus(); nxRotArm(); }
  };
  nxRotArm();
  // the launcher's pills end here (px from the left): the dateline keeps clear of them
  window.sauditvPillsEnd = px => { nxEl('nx').style.setProperty('--pe', Math.max(40, px / (devicePixelRatio || 1) / NX_Z + 14) + 'px'); nxSoon(); };
  document.title = 'سعودي TV';
  applyBackground(true);
  loadPhotoIndex().then(() => applyBackground(true));
  setInterval(() => applyBackground(false), 60*1000);
  try{ buildPrayers(computePrayers()); }catch(e){}   // at once, offline; Aladhan's when it answers
  tickClock(); tickDates(); tickRamadan(); tickPrayer();
  tapeStart();
  firstLoad(loadPrayers, 'prayers'); firstLoad(loadWeather, 'weather'); firstLoad(loadMatches, 'matches');
  startPanelData(cards, true);
  homeQrRect();
  setInterval(tickClock, 1000);
  setInterval(() => { tickDates(); tickPrayer(); tickRamadan(); }, 15000);
  setInterval(renderMatches, 60000);
  setInterval(loadLive, 2*60000);
  setInterval(loadMatches, 30*60*1000);
  setInterval(loadPrayers, 6*3600*1000);
  setInterval(loadWeather, 30*60*1000);
  let lastDay = riyadhDayNumber();
  setInterval(() => {
    if(riyadhDayNumber() === lastDay) return;
    lastDay = riyadhDayNumber();
    loadPhotoIndex().then(() => applyBackground(true)); tickDates(); tickRamadan(); loadPrayers(); loadWeather();
  }, 60*1000);
}
// ---- end: «الجديد»

document.addEventListener('keydown', e=>{
  if(e.key === 'f' || e.key === 'F'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen().catch(()=>{});
  }
});

boot();
